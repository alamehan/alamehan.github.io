<div id="alamehan-tc-toast" role="status" aria-live="polite"></div>
<script id="alamehan-link-guard">
(function(){
  var p=String(location.pathname||'').replace(/\\/g,'/');
  var isLocalRepo = location.protocol==='file:' && p.indexOf('/release/')===-1;
  var v5Href = isLocalRepo ? '../../WORKSHOP.html' : '../../index.html';

  var blocked = ["/alamehan-v1/sheet","/alamehan-v1/epub","/alamehan-v1/road","/projects/nice-list-web","/projects/atoz-mind","/projects/deep-dive",".pdf"];
  var toastEl = document.getElementById('alamehan-tc-toast');
  var toastTimer = null;
  function showMsg(msg){
    if(!toastEl)return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function isBlockedHref(href){
    if(!href) return false;
    for(var i=0;i<blocked.length;i++){
      if(href.indexOf(blocked[i])!==-1) return true;
    }
    return false;
  }

  // Defensive wrap around window.open so legacy onclick="window.open(...)" never opens a 404 tab
  var origOpen = window.open;
  window.open = function(url){
    if(isBlockedHref(String(url||''))){
      showMsg('Archived link disabled offline · Open Portfolio V5 for the latest live version.');
      return null;
    }
    return origOpen.apply(window, arguments);
  };

  function scanAndMark(){
    // Rewrite any V5 home / Resume-V5 links (incl. React/SPA dynamically mounted anchors)
    document.querySelectorAll('a[href]').forEach(function(a){
      var raw = a.getAttribute('href') || '';
      if (raw === '../../index.html' || a.id === 'alamehan-tc-v5') {
        a.setAttribute('href', v5Href);
      }
      if(a.closest('#alamehan-tc-pill')) return;
      var href = a.getAttribute('href') || '';
      if(isBlockedHref(href)){
        a.classList.add('atc-disabled-link');
        a.setAttribute('aria-disabled','true');
        a.setAttribute('title','Archived snapshot · Unavailable offline (see Portfolio V5)');
      }
    });
    document.querySelectorAll('[onclick]').forEach(function(el){
      if(el.closest('#alamehan-tc-pill')) return;
      var oc = el.getAttribute('onclick') || '';
      if(isBlockedHref(oc)){
        el.classList.add('atc-disabled-link');
        el.setAttribute('aria-disabled','true');
        el.setAttribute('title','Archived snapshot · Unavailable offline (see Portfolio V5)');
      }
    });
    document.querySelectorAll('tr[data-href]').forEach(function(tr){
      var href = tr.getAttribute('data-href') || '';
      if(isBlockedHref(href)){
        tr.setAttribute('aria-disabled','true');
        tr.setAttribute('title','Archived snapshot · Open Portfolio V5 for the latest live tools');
      }
    });
  }

  document.addEventListener('click', function(ev){
    var ocEl = ev.target && ev.target.closest ? ev.target.closest('[onclick]') : null;
    if(ocEl && !ocEl.closest('#alamehan-tc-pill')){
      var oc = ocEl.getAttribute('onclick') || '';
      if(isBlockedHref(oc) || ocEl.getAttribute('aria-disabled')==='true'){
        ev.preventDefault();
        ev.stopPropagation();
        ev.stopImmediatePropagation();
        showMsg('Archived link disabled offline · Open Portfolio V5 for the latest live version.');
        return;
      }
    }
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if(a && !a.closest('#alamehan-tc-pill')){
      var href = a.getAttribute('href') || '';
      if(href === '../../index.html'){
        a.setAttribute('href', v5Href);
      }
      if(isBlockedHref(href) || a.getAttribute('aria-disabled')==='true'){
        ev.preventDefault();
        ev.stopPropagation();
        showMsg('Archived link disabled offline · Open Portfolio V5 for the latest live version.');
        return;
      }
    }
    var tr = ev.target && ev.target.closest ? ev.target.closest('tr[data-href]') : null;
    if(tr && !(ev.target && ev.target.closest && ev.target.closest('button'))){
      var dhref = tr.getAttribute('data-href') || '';
      if(isBlockedHref(dhref)){
        ev.preventDefault();
        ev.stopPropagation();
        showMsg('Archived tool snapshot omitted offline · Open Portfolio V5 for the latest live tools.');
      }
    }
  }, true);

  scanAndMark();
  setTimeout(scanAndMark, 450);
  setTimeout(scanAndMark, 1200);
  if(typeof MutationObserver!=='undefined'){
    new MutationObserver(scanAndMark).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none">
  <style>
    /* namespaced a2-/k2 — inline SVG styles are document-global.
       ambient: scanline + a comet riding the chart. hover: a runner circles the card,
       labels wake, the avatar ring spins once — all opacity-gated or transition-based. */
    .a2-ink{stroke:var(--ink,#171a21)}
    .a2-mut{stroke:var(--ink-faint,#99a0ad)}
    .a2-acc{stroke:var(--accent,#1747c8)}
    .a2-accf{fill:var(--accent,#1747c8)}
    .a2-lbl{font:700 10px ui-monospace,Menlo,monospace;fill:var(--accent,#1747c8);letter-spacing:.08em}
    .a2-grid line{stroke:var(--hairline,#e2e6ee);stroke-width:1}
    .a2-card{stroke-dasharray:760;stroke-dashoffset:760;animation:k2dr 1.3s .1s cubic-bezier(.4,0,.2,1) forwards}
    .a2-inner{opacity:0;animation:k2fi .6s .9s ease-out forwards}
    .a2-red{stroke-dasharray:260;stroke-dashoffset:260;animation:k2dr .8s 1.7s cubic-bezier(.4,0,.2,1) forwards}
    /* the measurements read out one by one — W, H, radius, then the CTA verdict */
    .a2-tg1{opacity:0;animation:k2fi8 .4s 2.2s ease-out forwards}
    .a2-tg2{opacity:0;animation:k2fi8 .4s 2.45s ease-out forwards}
    .a2-tg3{opacity:0;animation:k2fi8 .4s 2.7s ease-out forwards}
    .a2-tg4{opacity:0;animation:k2fi8 .4s 2.95s ease-out forwards}
    .a2-ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:k2ring 3.2s 2.6s ease-in-out infinite}
    .a2-scan{animation:k2scan 5.5s 2.8s cubic-bezier(.45,.05,.55,.95) infinite}
    /* ambient: a comet rides the data line, forever */
    .a2-comet{stroke-dasharray:16 220;animation:k2comet 3.4s 2.4s linear infinite}
    /* hover: a runner laps the card border; labels + redlines wake fully */
    .a2-runw{opacity:0;transition:opacity .35s ease-out}
    svg:hover .a2-runw{opacity:1}
    .a2-run{stroke-dasharray:46 698;animation:k2run 3s linear infinite}
    .a2-tag text{transition:opacity .3s ease-out}
    svg:hover .a2-tag text{opacity:1!important}
    .a2-avatar{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
    svg:hover .a2-avatar{transform:rotate(180deg)}
    @keyframes k2dr{to{stroke-dashoffset:0}}
    @keyframes k2fi{to{opacity:1}}
    @keyframes k2fi8{to{opacity:.8}}
    @keyframes k2ring{0%,100%{opacity:0;transform:scale(1)}45%{opacity:.9}60%{opacity:.9;transform:scale(1.12)}90%{opacity:0;transform:scale(1.16)}}
    @keyframes k2scan{0%,100%{transform:translateY(0)}50%{transform:translateY(170px)}}
    @keyframes k2comet{to{stroke-dashoffset:-236}}
    @keyframes k2run{to{stroke-dashoffset:-744}}
    @media(prefers-reduced-motion:reduce){
      .a2-card,.a2-red{animation:none;stroke-dashoffset:0}
      .a2-inner{animation:none;opacity:1}
      .a2-tg1,.a2-tg2,.a2-tg3,.a2-tg4{animation:none;opacity:.8}
      .a2-ring,.a2-scan,.a2-comet,.a2-run{animation:none}
      .a2-ring,.a2-runw,.a2-comet{opacity:0}
      .a2-avatar{transition:none}
      svg:hover .a2-avatar{transform:none}
    }
  </style>
  <!-- baseline grid — the drafting table -->
  <g class="a2-grid">
    <line x1="12" y1="60" x2="228" y2="60"/><line x1="12" y1="110" x2="228" y2="110"/>
    <line x1="12" y1="160" x2="228" y2="160"/><line x1="12" y1="210" x2="228" y2="210"/>
  </g>
  <!-- the scanline — the audit never stops reading -->
  <g class="a2-scan"><line x1="20" y1="52" x2="220" y2="52" class="a2-acc" stroke-width="1" opacity=".28"/></g>
  <!-- the specimen card -->
  <g class="a2-card">
    <rect x="36" y="46" width="168" height="204" rx="14" class="a2-ink" stroke-width="1.9"/>
    <g class="a2-avatar"><circle cx="62" cy="78" r="13" class="a2-mut" stroke-width="1.5"/><path d="M62 65 a13 13 0 0 1 13 13" class="a2-acc" stroke-width="1.6" stroke-linecap="round"/></g>
    <rect x="86" y="67" width="76" height="9" rx="4.5" class="a2-mut" stroke-width="1.4"/>
    <rect x="86" y="82" width="50" height="7" rx="3.5" class="a2-mut" stroke-width="1.2"/>
  </g>
  <!-- hover: the runner laps the border -->
  <g class="a2-runw"><rect x="36" y="46" width="168" height="204" rx="14" class="a2-acc a2-run" stroke-width="2"/></g>
  <g class="a2-inner" opacity="0">
    <rect x="50" y="106" width="140" height="54" rx="9" class="a2-mut" stroke-width="1.4"/>
    <path d="M50 146 l32 -20 l26 12 l38 -24 l24 14" class="a2-mut" stroke-width="1.4" stroke-linejoin="round" opacity=".55"/>
    <path d="M50 146 l32 -20 l26 12 l38 -24 l24 14" class="a2-acc a2-comet" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="50" y="174" width="92" height="8" rx="4" class="a2-mut" stroke-width="1.3"/>
    <rect x="50" y="189" width="120" height="8" rx="4" class="a2-mut" stroke-width="1.3"/>
    <rect x="50" y="214" width="66" height="22" rx="11" class="a2-acc" stroke-width="1.8"/>
    <rect x="60" y="222" width="46" height="6" rx="3" class="a2-accf" opacity=".55"/>
  </g>
  <!-- the focus ring — a11y is part of the anatomy -->
  <rect x="45" y="209" width="76" height="32" rx="15" class="a2-acc a2-ring" stroke-width="1.4"/>
  <!-- redlines — measured after it exists, never before -->
  <g class="a2-red a2-acc" stroke-width="1.1">
    <path d="M36 32 v-6 M204 32 v-6 M36 29 h168"/>
    <path d="M218 46 h6 M218 250 h6 M221 46 v204"/>
    <path d="M50 262 v6 M116 262 v6 M50 265 h66"/>
    <circle cx="62" cy="78" r="18"/>
    <path d="M75 91 L84 98"/>
  </g>
  <g class="a2-tag">
    <text x="120" y="24" text-anchor="middle" class="a2-lbl a2-tg1">W 168</text>
    <text x="226" y="148" text-anchor="middle" transform="rotate(90 226 148)" class="a2-lbl a2-tg2">H 204</text>
    <text x="87" y="101" class="a2-lbl a2-tg3">r13</text>
    <text x="83" y="285" text-anchor="middle" class="a2-lbl a2-tg4">CTA · MIN 44</text>
  </g>
</svg>

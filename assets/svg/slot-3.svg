<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 90" fill="none">
  <style>
    /* slot-3 · THE AUDIT RULER v2 — full-width divider after Work: every layout answers
       to one line. namespaced a3-/k3 — inline SVG styles are document-global.
       the band is FILL-ONLY: scaleX on a stroked rect smears its verticals and corners.
       one 16s phase-locked clock runs the audit: the viewport band grows through the
       test widths and holds (0-6% / 27-39% / 60-72%); each stop's label+glyph wake in
       phase and the glyph pops the moment the band arrives. two free-running layers keep
       it alive between audits: a glint rides the ruler (11s) and the ticks shimmer (9.5s).
       hover is additive: a scan beam sweeps, every stop lights at once, the verdict chip
       springs in — ALL PASS. loops are opacity/transform only. */
    .a3-mut{stroke:var(--ink-faint,#99a0ad)}
    .a3-acc{stroke:var(--accent,#2b4be0)}
    .a3-accf{fill:var(--accent,#2b4be0)}
    .a3-washf{fill:var(--accent,#2b4be0);opacity:.1}
    .a3-gly{stroke:var(--accent,#2b4be0)}
    .a3-lbl{font:600 10px ui-monospace,Menlo,monospace;fill:var(--ink-faint,#99a0ad);letter-spacing:.1em;text-anchor:middle}
    .a3-lblon{font:700 10px ui-monospace,Menlo,monospace;fill:var(--accent,#2b4be0);letter-spacing:.1em;text-anchor:middle}
    .a3-vlbl{font:700 9px ui-monospace,Menlo,monospace;fill:var(--canvas,#f4f6fa);letter-spacing:.1em;text-anchor:middle}
    .a3-cap{font:600 10px ui-monospace,Menlo,monospace;fill:var(--ink-muted,#5d6472);letter-spacing:.14em;transition:fill .3s ease-out}
    /* the 16s audit clock */
    .a3-band{transform-origin:60px 50px;animation:k3grow 16s cubic-bezier(.45,.05,.55,.95) infinite}
    .a3-caret{animation:k3slide 16s cubic-bezier(.45,.05,.55,.95) infinite}
    /* no positive delays: a delayed loop leaves its stop wrongly lit until the first cycle
       kicks in — instead each stop keys its lit window to the band's hold, from t=0 */
    .a3-s360{animation:k3lit 16s infinite}
    .a3-s768{animation:k3lit2 16s infinite}
    .a3-s1160{animation:k3lit3 16s infinite}
    .a3-g360{transform-box:fill-box;transform-origin:center;animation:k3pop1 16s cubic-bezier(.34,1.45,.5,1) infinite}
    .a3-g768{transform-box:fill-box;transform-origin:center;animation:k3pop2 16s cubic-bezier(.34,1.45,.5,1) infinite}
    .a3-g1160{transform-box:fill-box;transform-origin:center;animation:k3pop3 16s cubic-bezier(.34,1.45,.5,1) infinite}
    /* idle layer 2 — a glint rides the ruler between audits */
    .a3-glint{stroke-dasharray:46 994;animation:k3glint 11s linear infinite}
    /* idle layer 3 — the ticks shimmer */
    .a3-ticks{animation:k3shm 9.5s ease-in-out infinite}
    /* hover: audit everything at once */
    svg:hover .a3-s360,svg:hover .a3-s768,svg:hover .a3-s1160{animation:none;opacity:1}
    svg:hover .a3-cap{fill:var(--accent,#2b4be0)}
    .a3-beamw{opacity:0;transition:opacity .35s ease-out}
    svg:hover .a3-beamw{opacity:1}
    .a3-beam{animation:k3beam 2.6s linear infinite}
    /* hover payoff — the verdict springs in */
    .a3-payw{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .45s cubic-bezier(.34,1.45,.5,1) .55s}
    svg:hover .a3-payw{transform:scale(1)}
    @keyframes k3grow{0%,6%{transform:scaleX(1)}27%,39%{transform:scaleX(1.818)}60%,72%{transform:scaleX(3.636)}94%,100%{transform:scaleX(1)}}
    @keyframes k3slide{0%,6%{transform:translateX(0)}27%,39%{transform:translateX(180px)}60%,72%{transform:translateX(580px)}94%,100%{transform:translateX(0)}}
    @keyframes k3lit{0%,8%{opacity:1}18%,94%{opacity:.35}100%{opacity:1}}
    @keyframes k3lit2{0%,23%{opacity:.35}27%,37%{opacity:1}47%,100%{opacity:.35}}
    @keyframes k3lit3{0%,56%{opacity:.35}60%,70%{opacity:1}80%,100%{opacity:.35}}
    @keyframes k3pop1{0%{transform:scale(1.12)}6%{transform:scale(1)}93%{transform:scale(1)}97%,100%{transform:scale(1.12)}}
    @keyframes k3pop2{0%,25%{transform:scale(1)}29%{transform:scale(1.12)}35%,100%{transform:scale(1)}}
    @keyframes k3pop3{0%,58%{transform:scale(1)}62%{transform:scale(1.12)}68%,100%{transform:scale(1)}}
    @keyframes k3glint{to{stroke-dashoffset:-1040}}
    @keyframes k3shm{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes k3beam{0%{transform:translateX(0);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translateX(1040px);opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .a3-band,.a3-caret,.a3-s360,.a3-s768,.a3-s1160,.a3-g360,.a3-g768,.a3-g1160,.a3-glint,.a3-ticks,.a3-beam{animation:none}
      .a3-band{transform:scaleX(3.636)}
      .a3-caret{transform:translateX(580px)}
      .a3-s360,.a3-s768,.a3-s1160,.a3-ticks{opacity:1}
      .a3-glint,.a3-beamw{opacity:0}
      .a3-cap,.a3-payw{transition:none}
    }
  </style>
  <!-- the ruler — one line every layout must answer to -->
  <path d="M60 50 H1100" class="a3-mut" stroke-width="1.3"/>
  <!-- the glint — the ruler is alive even between audits -->
  <path d="M60 50 H1100" class="a3-acc a3-glint" stroke-width="1.3" opacity=".3"/>
  <g class="a3-mut a3-ticks" stroke-width="1.2">
    <path d="M60 50 v-8 M280 50 v-14 M460 50 v-14 M660 50 v-8 M860 50 v-14 M1100 50 v-8"/>
  </g>
  <!-- the viewport band — breathing through the audit widths -->
  <rect x="60" y="42" width="220" height="16" rx="2" class="a3-washf a3-band"/>
  <g class="a3-caret">
    <path d="M280 36 v22" class="a3-acc" stroke-width="2"/>
    <circle cx="280" cy="36" r="3" class="a3-accf"/>
  </g>
  <!-- hover: the full-sweep scan beam -->
  <g class="a3-beamw">
    <g class="a3-beam"><line x1="60" y1="34" x2="60" y2="66" class="a3-acc" stroke-width="1.4" opacity=".8"/></g>
  </g>
  <!-- the stops — each device class wakes when the band arrives; its glyph pops -->
  <text x="60" y="26" class="a3-lbl">0</text>
  <g class="a3-s360">
    <text x="280" y="26" class="a3-lblon">360 ✓</text>
    <g class="a3-g360"><g class="a3-gly" stroke-width="1.2" fill="none"><rect x="274" y="58" width="12" height="14" rx="3"/><path d="M277.5 68.5 h5"/></g></g>
  </g>
  <g class="a3-s768">
    <text x="460" y="26" class="a3-lblon">768 ✓</text>
    <g class="a3-g768"><g class="a3-gly" stroke-width="1.2" fill="none"><rect x="450" y="60" width="20" height="12" rx="3"/><path d="M456 68.5 h8"/></g></g>
  </g>
  <text x="660" y="26" class="a3-lbl">1024</text>
  <g class="a3-s1160">
    <text x="860" y="26" class="a3-lblon">1160 ✓</text>
    <g class="a3-g1160"><g class="a3-gly" stroke-width="1.2" fill="none"><rect x="846" y="61" width="28" height="11" rx="3"/><path d="M853 68.5 h14"/></g></g>
  </g>
  <text x="1100" y="26" class="a3-lbl">1440</text>
  <text x="60" y="82" class="a3-cap">EVERY WIDTH, MEASURED — THE PAGE THAT OVERFLOWS, FAILS THE BOARD</text>
  <!-- hover payoff — the board's verdict -->
  <g class="a3-payw">
    <rect x="1008" y="64" width="92" height="19" rx="9.5" class="a3-accf"/>
    <text x="1054" y="77" class="a3-vlbl">ALL PASS ✓</text>
  </g>
</svg>

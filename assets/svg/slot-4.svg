<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" fill="none">
  <style>
    /* slot-4 · THE BROADCAST STAGE — Stage section: talks, sharing, the playbill's acts.
       namespaced a4-/k4 — inline SVG styles are document-global.
       story: a speaker at the lectern, on air. knowledge leaves the mic as waves (5s
       phase-locked cycle); the audience columns light up as each wave reaches them, and
       the far edge RELAYS it onward — sparks past the last row: what is shared does not
       stop at the room. the speaker is a bust (head + shoulders) — the same glyph
       language as the audience, one crowd, one of them simply took the stage.
       idle desync: spotlight sways 9s · speaker breathes 7s · ON AIR pulses 5.5s · wave
       clock 5s. hover is additive: standing ovation (columns rise in stagger), full house
       lights, spotlight blooms — payoff: the medal springs above the lectern (2nd place
       is still a podium). loops are opacity/transform only; waves born and die invisible. */
    .a4-ink{stroke:var(--ink,#171a21)}
    .a4-mut{stroke:var(--ink-faint,#99a0ad)}
    .a4-acc{stroke:var(--accent,#2b4be0)}
    .a4-accf{fill:var(--accent,#2b4be0)}
    .a4-cvf{fill:var(--canvas,#f4f6fa)}
    .a4-lbl{font:600 8px ui-monospace,Menlo,monospace;fill:var(--ink-muted,#5d6472);letter-spacing:.12em}
    .a4-cap{font:600 10px ui-monospace,Menlo,monospace;fill:var(--ink-muted,#5d6472);letter-spacing:.14em;transition:fill .3s ease-out}
    svg:hover .a4-cap{fill:var(--accent,#2b4be0)}
    /* intro — the stage assembles: platform, speaker, lectern, mic — then the house */
    .a4-spot{opacity:0;animation:k4fi .9s .1s cubic-bezier(.22,1,.36,1) forwards}
    .a4-stg{stroke-dasharray:200;stroke-dashoffset:200;animation:k4dr .8s .2s cubic-bezier(.4,0,.2,1) forwards}
    .a4-head{stroke-dasharray:60;stroke-dashoffset:60;animation:k4dr .6s .4s ease-out forwards}
    .a4-sho{stroke-dasharray:50;stroke-dashoffset:50;animation:k4dr .5s .55s ease-out forwards}
    .a4-lec{stroke-dasharray:100;stroke-dashoffset:100;animation:k4dr .7s .7s cubic-bezier(.4,0,.2,1) forwards}
    .a4-mic{stroke-dasharray:20;stroke-dashoffset:20;animation:k4dr .4s 1s ease-out forwards}
    .a4-micc{opacity:0;animation:k4fi .35s 1.15s ease-out forwards}
    .a4-au1{opacity:0;animation:k4fi85 .5s 1.2s ease-out forwards}
    .a4-au2{opacity:0;animation:k4fi85 .5s 1.35s ease-out forwards}
    .a4-au3{opacity:0;animation:k4fi85 .5s 1.5s ease-out forwards}
    .a4-chip{opacity:0;animation:k4fi .5s 1.8s ease-out forwards}
    .a4-capw{opacity:0;animation:k4fi .5s 2s ease-out forwards}
    /* idle layer 1 — the spotlight sways */
    .a4-sway{transform-origin:74px 0;animation:k4sw 9s ease-in-out infinite}
    /* idle layer 2 — the speaker breathes behind the lectern */
    .a4-spk{transform-box:fill-box;transform-origin:center bottom;animation:k4bre 7s ease-in-out infinite}
    /* idle layer 3 — ON AIR pulses */
    .a4-dot{animation:k4air 5.5s ease-in-out infinite}
    /* the 5s broadcast clock — waves born and die invisible; columns light in phase */
    .a4-w1{transform-origin:78px 100px;opacity:0;animation:k4w1 5s linear infinite}
    .a4-w2{transform-origin:78px 100px;opacity:0;animation:k4w2 5s linear infinite}
    .a4-w3{transform-origin:78px 100px;opacity:0;animation:k4w3 5s linear infinite}
    .a4-c1{opacity:0;animation:k4c1 5s infinite}
    .a4-c2{opacity:0;animation:k4c2 5s infinite}
    .a4-c3{opacity:0;animation:k4c3 5s infinite}
    .a4-sp{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:k4sp 5s infinite}
    /* hover — additive: ovation, full house, bloom, medal */
    .a4-ov1{transition:transform .45s cubic-bezier(.34,1.45,.5,1) .05s}
    .a4-ov2{transition:transform .45s cubic-bezier(.34,1.45,.5,1) .15s}
    .a4-ov3{transition:transform .45s cubic-bezier(.34,1.45,.5,1) .25s}
    svg:hover .a4-ov1,svg:hover .a4-ov2,svg:hover .a4-ov3{transform:translateY(-4px)}
    svg:hover .a4-c1,svg:hover .a4-c2,svg:hover .a4-c3{animation:none;opacity:1}
    .a4-spot path{transition:opacity .4s ease-out}
    svg:hover .a4-spot path{opacity:.12}
    .a4-med{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.34,1.45,.5,1) .8s}
    svg:hover .a4-med{transform:scale(1)}
    @keyframes k4dr{to{stroke-dashoffset:0}}
    @keyframes k4fi{to{opacity:1}}
    @keyframes k4fi85{to{opacity:.85}}
    @keyframes k4sw{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    @keyframes k4bre{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
    @keyframes k4air{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes k4w1{0%{transform:scale(.5);opacity:0}6%{opacity:.85}30%,100%{transform:scale(4);opacity:0}}
    @keyframes k4w2{0%,10%{transform:scale(.5);opacity:0}16%{opacity:.85}40%,100%{transform:scale(4);opacity:0}}
    @keyframes k4w3{0%,20%{transform:scale(.5);opacity:0}26%{opacity:.85}50%,100%{transform:scale(4);opacity:0}}
    @keyframes k4c1{0%,24%{opacity:0}30%,44%{opacity:1}56%,100%{opacity:0}}
    @keyframes k4c2{0%,34%{opacity:0}40%,54%{opacity:1}66%,100%{opacity:0}}
    @keyframes k4c3{0%,44%{opacity:0}50%,64%{opacity:1}76%,100%{opacity:0}}
    @keyframes k4sp{0%,52%{transform:scale(0)}58%{transform:scale(1.2)}62%{transform:scale(1)}70%,100%{transform:scale(0)}}
    @media(prefers-reduced-motion:reduce){
      .a4-spot,.a4-chip,.a4-capw,.a4-micc{animation:none;opacity:1}
      .a4-stg,.a4-head,.a4-sho,.a4-lec,.a4-mic{animation:none;stroke-dashoffset:0}
      .a4-au1,.a4-au2,.a4-au3{animation:none;opacity:.85}
      .a4-sway,.a4-spk,.a4-dot,.a4-w1,.a4-w2,.a4-w3,.a4-sp{animation:none}
      .a4-c1,.a4-c2,.a4-c3{animation:none;opacity:1}
      .a4-w1,.a4-w2,.a4-w3,.a4-sp{opacity:0;transform:scale(0)}
      .a4-ov1,.a4-ov2,.a4-ov3,.a4-med,.a4-spot path,.a4-cap{transition:none}
      svg:hover .a4-ov1,svg:hover .a4-ov2,svg:hover .a4-ov3{transform:none}
    }
  </style>
  <!-- the spotlight — it never leaves the lectern, it only sways -->
  <g class="a4-spot"><g class="a4-sway"><path d="M60 0 L28 150 L120 150 L88 0 Z" class="a4-accf" opacity=".07"/></g></g>
  <!-- the stage -->
  <rect x="28" y="148" width="88" height="8" rx="2" class="a4-ink a4-stg" stroke-width="1.6"/>
  <!-- the speaker — same glyph language as the house: one of them took the stage -->
  <g class="a4-spk">
    <circle cx="74" cy="100" r="8" class="a4-ink a4-head" stroke-width="1.8"/>
    <path d="M62 122 a12 12 0 0 1 24 0" class="a4-ink a4-sho" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- the lectern + mic -->
  <path d="M56 148 L61 122 H87 L92 148" class="a4-ink a4-lec" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M87 122 l7 -12" class="a4-ink a4-mic" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="95.5" cy="107.5" r="2.6" class="a4-accf a4-micc"/>
  <!-- the broadcast — waves leave the mic, phase-locked -->
  <g class="a4-w1"><path d="M92 86 A20 20 0 0 1 92 114" class="a4-acc" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="a4-w2"><path d="M92 86 A20 20 0 0 1 92 114" class="a4-acc" stroke-width="1.6" stroke-linecap="round"/></g>
  <g class="a4-w3"><path d="M92 86 A20 20 0 0 1 92 114" class="a4-acc" stroke-width="1.6" stroke-linecap="round"/></g>
  <!-- the house — each column wakes as the wave arrives; hover: standing ovation -->
  <g class="a4-ov1">
    <g class="a4-au1 a4-mut" stroke-width="1.4">
      <circle cx="158" cy="100" r="5"/><path d="M150 115 a8 8 0 0 1 16 0"/>
      <circle cx="158" cy="128" r="5"/><path d="M150 143 a8 8 0 0 1 16 0"/>
      <circle cx="158" cy="156" r="5"/><path d="M150 171 a8 8 0 0 1 16 0"/>
    </g>
    <g class="a4-c1 a4-acc" stroke-width="1.5">
      <circle cx="158" cy="100" r="5"/><path d="M150 115 a8 8 0 0 1 16 0"/>
      <circle cx="158" cy="128" r="5"/><path d="M150 143 a8 8 0 0 1 16 0"/>
      <circle cx="158" cy="156" r="5"/><path d="M150 171 a8 8 0 0 1 16 0"/>
    </g>
  </g>
  <g class="a4-ov2">
    <g class="a4-au2 a4-mut" stroke-width="1.4">
      <circle cx="196" cy="100" r="5"/><path d="M188 115 a8 8 0 0 1 16 0"/>
      <circle cx="196" cy="128" r="5"/><path d="M188 143 a8 8 0 0 1 16 0"/>
      <circle cx="196" cy="156" r="5"/><path d="M188 171 a8 8 0 0 1 16 0"/>
    </g>
    <g class="a4-c2 a4-acc" stroke-width="1.5">
      <circle cx="196" cy="100" r="5"/><path d="M188 115 a8 8 0 0 1 16 0"/>
      <circle cx="196" cy="128" r="5"/><path d="M188 143 a8 8 0 0 1 16 0"/>
      <circle cx="196" cy="156" r="5"/><path d="M188 171 a8 8 0 0 1 16 0"/>
    </g>
  </g>
  <g class="a4-ov3">
    <g class="a4-au3 a4-mut" stroke-width="1.4">
      <circle cx="234" cy="100" r="5"/><path d="M226 115 a8 8 0 0 1 16 0"/>
      <circle cx="234" cy="128" r="5"/><path d="M226 143 a8 8 0 0 1 16 0"/>
      <circle cx="234" cy="156" r="5"/><path d="M226 171 a8 8 0 0 1 16 0"/>
    </g>
    <g class="a4-c3 a4-acc" stroke-width="1.5">
      <circle cx="234" cy="100" r="5"/><path d="M226 115 a8 8 0 0 1 16 0"/>
      <circle cx="234" cy="128" r="5"/><path d="M226 143 a8 8 0 0 1 16 0"/>
      <circle cx="234" cy="156" r="5"/><path d="M226 171 a8 8 0 0 1 16 0"/>
    </g>
  </g>
  <!-- the relay — what is shared leaves the room -->
  <path d="M258 92 l4 4 l-4 4 l-4 -4 Z" class="a4-accf a4-sp"/>
  <path d="M258 148 l4 4 l-4 4 l-4 -4 Z" class="a4-accf a4-sp" style="animation-delay:.3s"/>
  <!-- ON AIR -->
  <g class="a4-chip">
    <rect x="198" y="14" width="64" height="20" rx="10" class="a4-mut" stroke-width="1.3"/>
    <circle cx="210" cy="24" r="2.6" class="a4-accf a4-dot"/>
    <text x="218" y="27" class="a4-lbl">ON AIR</text>
  </g>
  <!-- hover payoff — 2nd place is still a podium -->
  <g class="a4-med">
    <path d="M104 66 l-4 13 l8 -5 Z M116 66 l4 13 l-8 -5 Z" class="a4-accf" opacity=".85"/>
    <circle cx="110" cy="60" r="11" class="a4-accf"/>
    <path d="M110 54.6 l1.6 3.3 3.6 .5 -2.6 2.5 .6 3.6 -3.2 -1.7 -3.2 1.7 .6 -3.6 -2.6 -2.5 3.6 -.5 Z" class="a4-cvf"/>
  </g>
  <g class="a4-capw"><text x="20" y="197" class="a4-cap">EVERY ACT, A TRANSFER</text></g>
</svg>

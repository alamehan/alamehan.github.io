<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" fill="none">
  <style>
    /* slot-9 · THE ONE ACCENT — general slot, message: restraint — monochrome plus one accent.
       namespaced a9-/k9 — inline SVG styles are document-global.
       center-safe 4:3 composition; theme via host CSS vars, fallbacks match Atlas.
       story — a 12s loop: a specimen board of five mono shapes sits breathing; one single
       accent drop makes its rounds (a trail ghosting behind it), and each shape it visits
       wakes with color for a beat, then returns to mono. one drop of color is the whole
       economy of the piece — restraint is the design.
       idle desync: drop loop 12s · shimmer 9.5s and 12.5s · board breath 7.5s · drift 14s.
       hover (additive): the accent ripples out from the center, every shape holds its
       color, and the asterisk seal — the brand's own one-accent — springs in as payoff.
       reduced-motion: mono board at rest with the seal shown — a complete still frame. */
    .a9-mut{stroke:var(--ink-muted,#5d6472)}
    .a9-fnt{stroke:var(--ink-faint,#99a0ad)}
    .a9-acc{stroke:var(--accent,#2b4be0)}
    .a9-accf{fill:var(--accent,#2b4be0)}
    .a9-hl{stroke:var(--hairline,#e2e6ee)}
    .a9-cap{font:600 9px ui-monospace,Menlo,monospace;fill:var(--ink-muted,#5d6472);letter-spacing:.2em}
    /* intro */
    .a9-in{opacity:0;animation:k9fi .6s ease-out forwards}
    .a9-g1{animation-delay:.15s}.a9-g2{animation-delay:.35s}.a9-g3{animation-delay:.6s}
    /* idle life */
    .a9-dk{animation:k9df 14s ease-in-out infinite}
    .a9-br{transform-origin:140px 106px;animation:k9br 7.5s ease-in-out infinite}
    .a9-s1{animation:k9sh1 9.5s ease-in-out infinite}
    .a9-s2{animation:k9sh2 12.5s ease-in-out infinite}
    /* the 12s round — the drop and the wakes (phase-locked) */
    .a9-dp{offset-path:path('M140 52 C105 55,85 70,89 89 C93 112,95 138,108 150 C128 164,152 164,172 150 C185 138,187 112,191 89 C195 70,175 55,140 52');animation:k9dp 12s linear infinite}
    .a9-tr{offset-path:path('M140 52 C105 55,85 70,89 89 C93 112,95 138,108 150 C128 164,152 164,172 150 C185 138,187 112,191 89 C195 70,175 55,140 52');animation:k9dp 12s -11.82s linear infinite}
    .a9-w1{opacity:0;animation:k9w1 12s linear infinite}
    .a9-w2{opacity:0;animation:k9w2 12s linear infinite}
    .a9-w3{opacity:0;animation:k9w3 12s linear infinite}
    .a9-w4{opacity:0;animation:k9w4 12s linear infinite}
    .a9-w5{opacity:0;animation:k9w5 12s linear infinite}
    /* hover — purely additive: the ripple, the hold, the seal */
    .a9-hv{opacity:0;transition:opacity .35s ease-out}
    .a9-h1{transition-delay:.12s}.a9-h2{transition-delay:.2s}.a9-h3{transition-delay:.28s}.a9-h4{transition-delay:.36s}.a9-h5{transition-delay:.44s}
    svg:hover .a9-hv{opacity:.85}
    .a9-r1{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.5);transition:opacity .4s ease-out .5s,transform .7s cubic-bezier(.22,1,.36,1) .5s}
    .a9-r2{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.4);transition:opacity .4s ease-out .62s,transform .8s cubic-bezier(.22,1,.36,1) .62s}
    svg:hover .a9-r1{opacity:.35;transform:scale(1)}
    svg:hover .a9-r2{opacity:.18;transform:scale(1)}
    .a9-seal{transform-box:fill-box;transform-origin:center;opacity:0;transform:scale(.4) rotate(-45deg);transition:opacity .3s ease-out .45s,transform .6s cubic-bezier(.34,1.45,.5,1) .45s}
    svg:hover .a9-seal{opacity:1;transform:scale(1) rotate(0deg)}
    .a9-capt{transition:fill .35s ease-out}
    svg:hover .a9-capt{fill:var(--accent,#2b4be0)}
    @keyframes k9fi{to{opacity:1}}
    @keyframes k9df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes k9br{0%,100%{transform:scale(1)}50%{transform:scale(1.006)}}
    @keyframes k9sh1{0%,100%{opacity:.6}50%{opacity:.9}}
    @keyframes k9sh2{0%,100%{opacity:.85}50%{opacity:.55}}
    @keyframes k9dp{0%{offset-distance:0%}100%{offset-distance:100%}}
    @keyframes k9w1{0%,2%{opacity:0}5%{opacity:.9}12%{opacity:0}100%{opacity:0}}
    @keyframes k9w2{0%,19%{opacity:0}23%{opacity:.9}30%{opacity:0}100%{opacity:0}}
    @keyframes k9w3{0%,38%{opacity:0}42%{opacity:.9}49%{opacity:0}100%{opacity:0}}
    @keyframes k9w4{0%,58%{opacity:0}62%{opacity:.9}69%{opacity:0}100%{opacity:0}}
    @keyframes k9w5{0%,78%{opacity:0}82%{opacity:.9}89%{opacity:0}100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){
      .a9-dk,.a9-br,.a9-s1,.a9-s2,.a9-dp,.a9-tr,.a9-w1,.a9-w2,.a9-w3,.a9-w4,.a9-w5{animation:none}
      .a9-in{animation:none;opacity:1}
      .a9-dp,.a9-tr,.a9-w1,.a9-w2,.a9-w3,.a9-w4,.a9-w5,.a9-hv,.a9-r1,.a9-r2{opacity:0}
      .a9-seal,.a9-capt{transition:none}
      .a9-seal{opacity:1;transform:none}
    }
  </style>
  <g class="a9-dk"><g class="a9-br">
    <!-- the specimen board — five shapes, all mono -->
    <g class="a9-s1" opacity=".6"><g class="a9-in a9-g1">
      <circle cx="140" cy="52" r="12" class="a9-mut" stroke-width="2"/>
      <path d="M108 138 l12 22 h-24 Z" class="a9-mut" stroke-width="2" stroke-linejoin="round"/>
      <path d="M181 99 A10 10 0 0 1 201 99" class="a9-mut" stroke-width="2" stroke-linecap="round"/>
    </g></g>
    <g class="a9-s2" opacity=".85"><g class="a9-in a9-g2">
      <rect x="77" y="77" width="24" height="24" rx="4" class="a9-fnt" stroke-width="2"/>
      <path d="M160 146 h26 M160 156 h20" class="a9-fnt" stroke-width="2" stroke-linecap="round"/>
    </g></g>
    <!-- the wakes — each shape holds the drop's color for a beat -->
    <circle cx="140" cy="52" r="12" class="a9-acc a9-w1" stroke-width="2.2"/>
    <rect x="77" y="77" width="24" height="24" rx="4" class="a9-acc a9-w2" stroke-width="2.2"/>
    <path d="M108 138 l12 22 h-24 Z" class="a9-acc a9-w3" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M160 146 h26 M160 156 h20" class="a9-acc a9-w4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M181 99 A10 10 0 0 1 201 99" class="a9-acc a9-w5" stroke-width="2.2" stroke-linecap="round"/>
    <!-- hover hold — the whole board keeps its color -->
    <circle cx="140" cy="52" r="12" class="a9-acc a9-hv a9-h1" stroke-width="2.2"/>
    <rect x="77" y="77" width="24" height="24" rx="4" class="a9-acc a9-hv a9-h2" stroke-width="2.2"/>
    <path d="M108 138 l12 22 h-24 Z" class="a9-acc a9-hv a9-h3" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M160 146 h26 M160 156 h20" class="a9-acc a9-hv a9-h4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M181 99 A10 10 0 0 1 201 99" class="a9-acc a9-hv a9-h5" stroke-width="2.2" stroke-linecap="round"/>
    <!-- the ripple and the seal — hover payoff at the quiet center -->
    <circle cx="140" cy="106" r="22" class="a9-acc a9-r1" stroke-width="1.3"/>
    <circle cx="140" cy="106" r="36" class="a9-acc a9-r2" stroke-width="1.1"/>
    <g class="a9-seal a9-acc" stroke-width="2.4" stroke-linecap="round">
      <path d="M140 94 V118 M128 106 H152 M131.5 97.5 L148.5 114.5 M148.5 97.5 L131.5 114.5"/>
    </g>
  </g></g>
  <!-- the drop — the one accent, always on its rounds -->
  <circle r="2" class="a9-accf a9-tr" opacity=".45"/>
  <circle r="3.5" class="a9-accf a9-dp"/>
  <text x="20" y="196" class="a9-cap a9-capt a9-in a9-g3">ONE ACCENT IS ENOUGH</text>
</svg>

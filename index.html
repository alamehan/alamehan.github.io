<style>
/* ═══ 1 · TOKENS — the living spec reads THESE (PRD v6 §2; v6.1 owner call: the
   warm cream was rejected in the wild — the diorama mats are FIXED cool paper by
   law and all 19 family accents are cool-tuned, so the CANVAS now equals the mat
   (#f4f6fa): dioramas sit seamless in light, framed prints in dark. Atlas keeps
   its accents — accent-math AA re-proven on these surfaces: 6.09/6.48 light,
   7.46/6.92 dark; coral 5.66/8.07; ink-on-lime 13.9) ═══ */
:root{
  --canvas:#f4f6fa; --surface:#fdfdfe; --hairline:#e2e6ee; --wash:#eceff5;
  --ink:#171a21; --ink-muted:#5d6472; --ink-faint:#99a0ad;
  --accent:#2b4be0; --accent-active:#2340c4; --on-accent:#ffffff;
  --coral:#b3341f; --lime:#c9f65b; --on-lime:#171a21;
  --accent-wash:#e2e6fa;
  --accent-wash:color-mix(in srgb, var(--accent) 9%, var(--surface));
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --ok-wash:#e9f4ed; --warn-wash:#faf0e2;
  --ok-wash:color-mix(in srgb, var(--ok) 10%, var(--surface));
  --warn-wash:color-mix(in srgb, var(--warn) 12%, var(--surface));
  --shadow-1:0 1px 2px rgb(23 26 33/.05), 0 2px 10px rgb(23 26 33/.05);
  --shadow-2:0 2px 4px rgb(23 26 33/.07), 0 14px 36px rgb(23 26 33/.11);
  --colw:1052px; --header-h:54px; --railw:172px; --gutter:24px; /* colw + 2×gutter = 1100px — the ONE container width, byte-equal with the tools dashboard's --maxw (owner call 2026-07-18: one estate, one gutter) */
  --font:Inter,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --display:"Arial Black","Arial Bold",Arial,"Helvetica Neue",sans-serif; /* the sample's own lesson: the confidence is scale + weight discipline, not a font file */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;   /* one italic accent word per display moment — the editorial signature */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:44px;--s8:60px;
}
html[data-theme="dark"]{
  --canvas:#10131a; --surface:#171b24; --hairline:#262b36; --wash:#1d222c;
  --ink:#e6e9f0; --ink-muted:#99a2b3; --ink-faint:#626a7a;
  --accent:#8f9dff; --accent-active:#a5b1ff; --on-accent:#10131a;
  --coral:#ff8a70; --lime:#c9f65b; --on-lime:#171a21;
  --shadow-1:0 1px 2px rgb(0 0 0/.15), 0 2px 10px rgb(0 0 0/.12);
  --shadow-2:0 2px 4px rgb(0 0 0/.2), 0 14px 36px rgb(0 0 0/.3);
}
/* ═══ 2 · BASE ═══ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 15px/1.65 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.no-scroll{overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
h1,h2,h3,h4{margin:0}
p{margin:0 0 var(--s4)}
code{font:400 13px/1.55 var(--mono);background:var(--wash);border-radius:6px;padding:1px 6px}
pre{background:var(--wash);border:1px solid var(--hairline);border-radius:10px;padding:14px 16px;overflow:auto;font:400 13px/1.55 var(--mono);margin:0 0 var(--s4)}
pre code{background:none;padding:0}
blockquote{margin:0 0 var(--s4);padding:2px 0 2px 14px;border-left:2px solid var(--accent);color:var(--ink-muted)}
hr{border:0;border-top:1px solid var(--hairline);margin:var(--s5) 0}
ul,ol{margin:0 0 var(--s4);padding-left:22px}
li{margin:2px 0}
li.task{list-style:none;margin-left:-22px;display:flex;gap:8px;align-items:baseline}
li.task input{accent-color:var(--accent);transform:translateY(2px)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 var(--s4)}
th,td{border:1px solid var(--hairline);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--wash);font-weight:600}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--ink);color:var(--canvas);padding:8px 16px;border-radius:999px;font-size:13px}
.skip:focus{left:8px}
.hidden{display:none!important}
.kbd{font:500 11px/1 var(--mono);border:1px solid var(--hairline);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:var(--surface);color:var(--ink-muted)}
.mono{font-family:var(--mono)}
/* ═══ 3 · TOPBAR ═══ */
.topbar{position:sticky;top:0;z-index:40;height:var(--header-h);background:color-mix(in srgb, var(--canvas) 84%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.topbar-in{max-width:calc(var(--colw) + var(--gutter)*2);margin:0 auto;height:100%;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .tile{width:28px;height:28px;font-size:15px;border-radius:9px}
.brand .handle{color:var(--ink-muted);font-weight:400}
.topbar-actions{display:flex;gap:6px;align-items:center}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:32px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:var(--ink-muted);font:500 13px var(--font);cursor:pointer;white-space:nowrap;transition:background .12s ease-out,color .12s ease-out}
/* ═══ ONE ESTATE, ONE SWITCH: the face switch. The portfolio and the tools
   dashboard are ONE site with two faces; this segmented control (same anatomy on both
   pages) is the doorway. Same-tab by design — switching faces is a tab-move, never a
   new window. Cross-document View Transitions below make the swap read as an in-page
   switch (supporting browsers morph, the rest just navigate — honest degradation). */
.faceswitch{display:inline-flex;align-items:center;gap:2px;padding:3px;margin-right:4px;border:1px solid var(--hairline);border-radius:999px;background:var(--surface)}
.fs-seg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 11px;border-radius:999px;font:600 12px var(--font);color:var(--ink-muted);white-space:nowrap;text-decoration:none;transition:background .12s ease-out,color .12s ease-out}
a.fs-seg:hover{background:var(--wash);color:var(--ink)}
.fs-seg.on{background:var(--ink);color:var(--canvas)}
.fs-seg .fs-em{font-size:12px}
@view-transition{navigation:auto}
.topbar{view-transition-name:tb}
.faceswitch{view-transition-name:fs}
::view-transition-group(tb),::view-transition-group(fs){animation-duration:.26s}
@media(prefers-reduced-motion:reduce){@view-transition{navigation:none}}
.iconbtn:hover{background:var(--wash);color:var(--ink)}
a.iconbtn:hover{text-decoration:none}
#btn-spec.on{background:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:transparent;font:500 14px var(--font);color:var(--ink);cursor:pointer;text-decoration:none;transition:background .12s ease-out,border-color .12s ease-out,box-shadow .12s ease-out,transform .12s ease-out}
.btn:hover{text-decoration:none}
.btn--primary{background:var(--accent);color:var(--on-accent)}
.btn--primary:hover{box-shadow:var(--shadow-1);transform:translateY(-1px)}
.btn--ink{background:var(--ink);color:var(--canvas)}
.btn--ink:hover{box-shadow:var(--shadow-1);transform:translateY(-1px)}
.btn--secondary{background:var(--surface);border-color:var(--hairline)}
.btn--secondary:hover{border-color:var(--ink-faint);box-shadow:var(--shadow-1)}
.btn--ghost{color:var(--ink-muted)}
.btn--ghost:hover{background:var(--wash);color:var(--ink)}
.btn--sm{height:30px;padding:0 13px;font-size:13px}
@media(pointer:coarse){.btn,.iconbtn{min-height:44px}}
@media(max-width:719px){
  .brand .handle{display:none}
  #tools-label,#fs-label,#spec-label{display:none}
  .fs-seg{padding:0 9px}
  #btn-palette .kbd{display:none}
  #btn-palette::before{content:"\2318K";font:500 13px var(--mono);color:var(--ink-muted)}
  .topbar-actions{gap:2px}
  .iconbtn{padding:0 8px}
  .topbar-in{padding:0 12px}
}
@media(max-width:399px){
  #lang-code{display:none}
  .topbar-actions{gap:0}
  .iconbtn{padding:0 6px;min-width:30px}
  .fs-seg{padding:0 7px}
  .topbar-in{padding:0 10px}
}
/* ═══ 4 · SHELL · RAIL · FOLIO ═══ */
.shell{max-width:calc(var(--colw) + var(--gutter)*2);margin:0 auto;padding:0 var(--gutter)}
@media(max-width:640px){:root{--gutter:16px}}
@media(min-width:640px){.shell{padding:0 24px}}
.rail{display:none}
@media(min-width:1660px){
  .rail{display:block;position:fixed;top:96px;left:max(14px,calc(50vw - var(--colw)/2 - var(--railw) - 34px));width:var(--railw);font:500 12px/1.5 var(--mono);z-index:10}
  .rail a{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:8px;color:var(--ink-muted);transition:background .12s ease-out,color .12s ease-out}
  .rail a:hover{background:var(--wash);color:var(--ink);text-decoration:none}
  .rail a.active{color:var(--accent)}
  .rail .rn{font-size:10px;color:var(--ink-faint)}
  .rail a.active .rn{color:var(--accent)}
}
/* the railbar is the chapter nav for EVERY screen below the ultra-wide rail
   (≥1660px): STICKY under the topbar, so jumping between chapters never requires
   scrolling home (owner call 2026-07-18 — the side rail must have a stand-in). */
.railbar{position:sticky;top:var(--header-h);z-index:30;display:flex;gap:4px;overflow-x:auto;padding:10px 0 8px;font:500 11px/1 var(--mono);scrollbar-width:none;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.railbar::-webkit-scrollbar{display:none}
.railbar a{flex:none;color:var(--ink-muted);border:1px solid var(--hairline);border-radius:999px;padding:6px 10px;background:var(--surface)}
.railbar a:hover{text-decoration:none;color:var(--ink)}
.railbar a.active{color:var(--accent);border-color:var(--accent)}
@media(min-width:1660px){.railbar{display:none}}
/* v6.5 — the reader's arc: read chapters wear a quiet mono tick on the rail +
   railbar; at 8/8 the footer's colophon line (.arc-note) names the palette word */
.rail a.read::after{content:"✓";font:700 9px/1 var(--mono);color:var(--ink-faint);margin-left:auto}
.rail a.active.read::after{color:var(--accent)}
.railbar a.read::after{content:" ✓";font:700 9px/1 var(--mono);color:var(--ink-faint)}
.railbar a.active.read::after{color:var(--accent)}
.arc-note em{font:italic 700 1.05em var(--serif);color:var(--accent)}
/* v6.6 — the curator's tour (PRD §13): a pure-CSS spotlight (fixed hole + a
   box-shadow wash) and a tooltip card; offered by a dismissible chip, never
   forced. The overlay is the interaction lock; Esc always skips. */
#tour{position:fixed;inset:0;z-index:70}
#tour.placing{visibility:hidden}/* hold the spotlight+card invisible until the FIRST placement lands — without this they flash unpositioned in a corner before jumping to station 1 (owner catch 2026-07-19) */
.tour-hole{position:fixed;box-shadow:0 0 0 9999px color-mix(in srgb,var(--ink) 52%,transparent);border-radius:16px;pointer-events:none;transition:top .25s ease-out,left .25s ease-out,width .25s ease-out,height .25s ease-out}
.tour-card{position:fixed;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--hairline);border-radius:14px;box-shadow:var(--shadow-2);padding:16px 18px}
.tour-card .tour-step{margin:0 0 6px;font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--coral)}
.tour-card h3{font:700 15.5px/1.35 var(--font);margin:0 0 6px}
.tour-card p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-muted)}
.tour-card .tour-nav{display:flex;gap:8px;margin-top:14px}
.tour-card .tour-nav [data-tour="next"]{margin-left:auto}
@media (prefers-reduced-motion: reduce){.tour-hole{transition:none}}
#tourchip{position:fixed;left:20px;bottom:218px;z-index:32;max-width:252px;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;box-shadow:var(--shadow-2);padding:14px}
#tourchip p{margin:0 0 10px;font-size:13px;line-height:1.55;color:var(--ink)}
#tourchip div{display:flex;gap:8px;flex-wrap:wrap}
/* v6.2 tidy: every chapter opens on its own hairline rule — one calm, repeating
   boundary instead of eight ad-hoc gaps (the "berantakan" cure, part one) */
.section{margin-top:var(--s8);padding-top:var(--s7);border-top:1px solid var(--hairline)}
/* v6 editorial chapter header: coral overline + mono label + STATEMENT headline +
   right-column standfirst + the NN/08 page marker (the v5 "folio rows, never
   posters" law is amended on the owner's call — confidence over whisper) */
.folio{display:flex;align-items:center;gap:12px;padding-bottom:8px;margin-bottom:10px}
.folio::before{content:"";width:26px;height:2px;background:var(--coral);flex:none}
.folio .fn{display:none}
.folio h2{font:700 12px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
.folio h2::before{content:attr(data-fn) " — ";color:var(--coral);letter-spacing:.14em}
.folio .fig{margin-left:auto;font:500 11px/1.4 var(--mono);color:var(--ink-muted);text-align:right;flex:none}
.folio .fmark{font:700 11px/1 var(--mono);color:var(--accent);flex:none;letter-spacing:.08em}
@media(max-width:699px){
  .folio{flex-wrap:wrap;row-gap:4px}
  .folio .fmark{margin-left:auto}
  .folio .fig{flex-basis:calc(100% - 38px);order:9;margin-left:38px;text-align:left}
}
.fol-head{display:grid;gap:8px 40px;align-items:end;margin:0 0 var(--s5)}
@media(min-width:860px){.fol-head{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}}
.fol-head .fh{font:900 clamp(26px,3.4vw,42px)/1.06 var(--display);letter-spacing:-.9px;color:var(--ink);margin:0;text-wrap:balance}
.fol-head .fh em{font:italic 700 .98em var(--serif);color:var(--accent);letter-spacing:0} /* owner call 2026-07-18: the accent word goes BOLD */
.standfirst{color:var(--ink-muted);font-size:14px;line-height:1.7;max-width:58ch;margin:0}
@media(min-width:860px){.fol-head .standfirst{justify-self:end;text-align:left;padding-bottom:5px}}
.standfirst--solo{margin:2px 0 var(--s5)}
.mdchip{opacity:0;font:500 11px/1 var(--mono);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:6px;padding:3px 7px;background:var(--surface);cursor:pointer;transition:opacity .12s ease-out,color .12s ease-out,border-color .12s ease-out}
.folio:hover .mdchip,.folio:focus-within .mdchip,.mdchip:focus-visible{opacity:1}
.mdchip:hover{color:var(--accent);border-color:var(--accent)}
html.spec .mdchip{opacity:1}
/* ═══ 5 · HERO (display moment #1 — statement type, serif-italic accent word) ═══ */
.hero{display:grid;gap:var(--s6);align-items:center;padding-top:var(--s7)}
@media(min-width:860px){.hero{grid-template-columns:7fr 5fr}}
.hero .kicker{display:inline-flex;gap:8px;align-items:center;font:700 10.5px/1 var(--mono);color:var(--ink);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--hairline);border-radius:999px;background:var(--surface);padding:8px 13px}
.hero .kicker::before{content:"";width:7px;height:7px;border-radius:999px;background:var(--ok);flex:none}
.hero h1{font:900 clamp(36px,5.6vw,64px)/1.02 var(--display);letter-spacing:-1.8px;margin:18px 0 16px;text-wrap:balance}
.hero h1 em{font:italic 700 .97em var(--serif);color:var(--accent);letter-spacing:0}
.hero .sub{font-size:16px;line-height:1.7;color:var(--ink-muted);max-width:56ch;margin:0}
.hero .sub strong{color:var(--ink)}
.hero .status{display:inline-flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-muted);margin:var(--s4) 0 var(--s5)}
.status-dot{width:8px;height:8px;border-radius:999px;background:var(--ok);flex:none;transform:translateY(1px)}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:var(--s5)}
.proof{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:16px;overflow:hidden;margin-top:var(--s7)}
@media(min-width:860px){.proof{grid-template-columns:repeat(4,1fr)}}
.proof .stat{background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:5px}
.stat-value{font:900 clamp(28px,2.6vw,34px)/1.02 var(--display);color:var(--ink);letter-spacing:-.6px}
.stat-label{font-size:12.5px;line-height:1.45;color:var(--ink-muted)}
/* ═══ 6 · WORK — equal-footprint case grid + the ledger ═══ */
.cases{display:grid;gap:12px}
@media(min-width:700px){.cases{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.cases{grid-template-columns:repeat(3,1fr)}}
/* v6 card anatomy: mono PROJECT/NN row · emoji tile + giant impact mark on the case's
   own swatch wash · impact caption · title · 2-line summary · tags + the plate invite.
   E-Systems stays the dark ANCHOR — distinguished by surface, never by footprint. */
.case{position:relative;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color .12s ease-out,box-shadow .12s ease-out,transform .12s ease-out}
.case:hover,.case:focus-visible{border-color:var(--ink-faint);box-shadow:var(--shadow-1);transform:translateY(-1px)}
.case--anchor{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.case--anchor .case-tag,.case--anchor .case-no{color:color-mix(in srgb,var(--canvas) 65%,transparent)}
.case-top{display:flex;align-items:baseline;gap:8px}
.case-no{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--ink-faint)}
.case-period{margin-left:auto;font:500 10.5px/1 var(--mono);color:var(--ink-faint)}
.case--anchor .case-period{color:color-mix(in srgb,var(--canvas) 55%,transparent)}
.case-band{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--sw,var(--accent)) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--sw,var(--accent)) 16%,var(--hairline));border-radius:12px;padding:11px 14px;min-height:68px}
.case-mark{font:900 clamp(23px,2vw,29px)/1 var(--display);letter-spacing:-.5px;color:color-mix(in srgb,var(--sw,var(--accent)) 72%,var(--ink));white-space:nowrap}
.case-impact{font:600 10px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.case--anchor .case-band{background:color-mix(in srgb,var(--sw,var(--accent)) 26%,var(--ink));border-color:color-mix(in srgb,var(--canvas) 16%,transparent)}
.case--anchor .case-mark{color:color-mix(in srgb,var(--sw,var(--accent)) 40%,var(--canvas))}
.case--anchor .case-impact{color:color-mix(in srgb,var(--canvas) 68%,transparent)}
.case .tile{width:38px;height:38px;border-radius:11px;background:var(--surface);box-shadow:var(--shadow-1);display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.case--anchor .tile{background:rgb(253 253 254/.14);box-shadow:none}

/* the AIDEA trophy card (re-forged 2026-07-18): a display moment, not a text strip —

.award{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-active));color:var(--on-accent);border-radius:14px;padding:18px 20px;cursor:pointer;transition:transform .12s ease-out,box-shadow .12s ease-out}

@media(min-width:1040px){.cases .award{grid-column:span 2}}
.award .aw-num{position:absolute;right:-8px;bottom:-26px;font:900 96px/1 var(--display);letter-spacing:-4px;color:color-mix(in srgb,var(--on-accent) 14%,transparent);pointer-events:none}
.award .aw-cup{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--on-accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--on-accent) 30%,transparent)}
.award .aw-tx{position:relative;min-width:0}
.award .aw-over{display:block;font:700 9.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--on-accent) 78%,transparent);margin-bottom:3px}
.award h3{font:800 17px/1.25 var(--font);margin:0;letter-spacing:-.2px}
.award h3 em{font:italic 700 .97em var(--serif);letter-spacing:0}
.award .aw-path{margin:5px 0 0;font:500 12px/1.5 var(--mono);color:color-mix(in srgb,var(--on-accent) 86%,transparent)}
.award .aw-go{display:inline-block;margin-top:8px;font:700 11px/1 var(--font);letter-spacing:.04em;border-bottom:1px solid color-mix(in srgb,var(--on-accent) 45%,transparent);padding-bottom:2px}
.award:hover .aw-go{border-bottom-color:var(--on-accent)}
/* the DISCLOSURE BAR (re-forged 2026-07-18 — owner: the quiet dashed strip hid an
   important door): a real surface bar — emoji seat, bold title, count pill, chevron —
   shared by the full ledger AND Roots & seeds (default folded, one visual language) */
.ledger{margin-top:var(--s5);border:1px solid var(--hairline);border-radius:14px;background:var(--surface);transition:border-color .12s ease-out}
.ledger:hover{border-color:var(--ink-faint)}

.ledger .lg-em{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--wash)}
.ledger .lg-n{flex:none;margin-left:auto;font:700 11px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border-radius:999px;padding:5px 9px}
.ledger .lg-chev{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--ink-muted);border:1px solid var(--hairline);transition:transform .15s ease-out}

.rows{display:grid;gap:6px}
@media(min-width:700px){.rows--2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;align-items:baseline;padding:9px 12px;background:var(--surface);border:1px solid var(--hairline);border-radius:10px;cursor:pointer;min-width:0;transition:border-color .12s ease-out}
.row:hover,.row:focus-visible{border-color:var(--ink-faint)}
.row .r-emoji{flex:none;font-size:14px}
.row h3{font:600 13.5px/1.4 var(--font);flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-tag{color:var(--ink-muted);font-size:12.5px;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-yr{margin-left:auto;flex:none;font:500 10.5px/1 var(--mono);color:var(--ink-faint)}
/* mobile (owner call 2026-07-19): a long record title TRUNCATES on its one line —
   never wraps into a second — so every ledger/roots row stays a clean single rule */
@media(max-width:479px){.row h3{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.row .r-tag{display:none}}
/* ═══ 7 · PRACTICE — ledger rows ═══ */
.pr-rows{display:grid;gap:8px}
.pr-row{display:flex;gap:14px;align-items:baseline;padding:14px 16px;border:1px solid var(--hairline);border-radius:12px;background:var(--surface)}
.pr-row .pr-no{font:900 17px/1.1 var(--display);color:var(--accent);flex:none;letter-spacing:-.3px}

.pr-h{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:var(--s5) 0 10px}
.fw-grid{display:grid;gap:10px}
@media(min-width:700px){.fw-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.fw-grid{grid-template-columns:repeat(3,1fr)}.fw-grid .fw:nth-child(4),.fw-grid .fw:nth-child(5){grid-column:span 1}}
.fw{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .12s ease-out,box-shadow .12s ease-out}
.fw:hover,.fw:focus-visible{border-color:var(--ink-faint);box-shadow:var(--shadow-1)}

/* ═══ 8 · STAGE — playbill ═══ */
.playbill{max-width:820px;margin:0 auto}
.stage-grid{display:grid;gap:var(--s6)}
@media(min-width:1040px){.stage-grid{grid-template-columns:1fr 320px;align-items:start}.stage-art{position:sticky;top:88px}}

.stage-art{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:var(--s5)}
/* ═══ 9 · FAMILY — explorer ═══ */
/* v6.2 tidy, part three: the family's pre-explorer stack calms down — the CTA is a
   quiet surface row (the dark band fought the anchor card + contact close), and the
   legend loses its box: two muted caption lines instead of three competing panels */
.fam-cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:14px 18px;margin-bottom:var(--s5)}
.fam-cta p{margin:0;font-size:13.5px;color:var(--ink-muted)}
.fam-core{font:500 12px/1.6 var(--mono);color:var(--ink-muted);margin:0 0 6px}
.fam-core b{color:var(--ink)}
/* the two-signal legend — one calm line explaining the chips/buttons on the cards below */
.fam-legend{font-size:12.5px;line-height:1.75;color:var(--ink-faint);margin:0 0 var(--s5);padding:0;border:0;background:none}
.fam-legend b{color:var(--ink);font-weight:600}
.fam-legend .fl-i{font-style:normal;margin-right:1px}
.fam-legend .fl-sep{color:var(--ink-faint);margin:0 6px}
/* the WALL — the family as a MENTION (owner call: the v5.1 explorer retired): one
   living tile per product — its motion icon on the fixed light mat, the deck's emoji
   plaque motif on the corner, the name under — and every tile opens its Leaf (the same
   Full-story peek the dashboard deep-links). The console itself (deck · orbit · grid ·
   table · search · Expedition · Gauntlet) lives ONE face-switch away in the topbar. */
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.wall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.w-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 10px 11px;border:1px solid var(--hairline);border-radius:12px;background:var(--surface);font:500 12px/1.35 var(--font);color:var(--ink);cursor:pointer;text-align:center;transition:border-color .12s ease-out,transform .12s ease-out,box-shadow .12s ease-out}
.w-tile:hover{border-color:var(--ink-faint);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.w-ic{display:block;width:100%;max-width:104px;background:#f4f6fa;border:1px solid var(--hairline);border-radius:10px;padding:6px}
.w-ic-em{display:grid;place-items:center;aspect-ratio:1/1;font-size:34px}
.w-tile .w-em{position:absolute;top:-9px;right:-7px;width:30px;height:30px;border-radius:9px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-1);display:grid;place-items:center;font-size:15px}
.w-n{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-no{font:500 9.5px/1 var(--mono);color:var(--ink-faint)}
.wall-hint{font:500 10.5px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);text-align:center;margin:12px 0 0}
/* the Full-story DIORAMA (migrated from the explorer): the wide scene mat with the
   emoji plaque docked on its frame, the museum plate (title + metaphor read from the
   artifact's own receipt), and the itch line leading the body */
.peek-scene{position:relative;margin:2px 0 14px}
.peek-scene .mo-mat{margin:0}
.peek-scene .mo-plaque{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-1);display:grid;place-items:center;font-size:22px;z-index:2}
.mo-plate{display:flex;gap:8px;align-items:baseline;margin:10px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink-muted);border-top:1px solid var(--hairline);padding-top:10px}
.mo-plate b{font:700 10px/1.6 var(--mono);letter-spacing:.1em;color:var(--accent);text-transform:uppercase;white-space:nowrap}
.mo-plate i{font-style:italic}
.peek-itch{display:flex;gap:8px;align-items:baseline;margin:0 0 12px;font-size:12.5px;font-style:italic;color:var(--ink-muted)}
.peek-itch b{font:700 10px/1.5 var(--mono);font-style:normal;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;white-space:nowrap}
/* live signals — the visitor-count chip (rendered ONLY when the release flag is present AND the third party answered) */
.pv{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0 12px;font:600 11.5px/1 var(--mono);color:var(--ink-muted);border:1px solid var(--hairline);border-radius:999px;padding:6px 11px;background:var(--surface);white-space:nowrap;vertical-align:middle}
.pv[hidden]{display:none!important}/* live-or-nothing: display:inline-flex would beat the UA [hidden] rule and leak an empty pill while the third party hasn't answered (owner catch on the deployed estate 2026-07-19) */
.pv b{color:var(--accent);font-weight:700}
.pv .pv-eye{opacity:.7}
.pv a{color:var(--ink-faint);text-decoration:none;border-left:1px solid var(--hairline);padding-left:8px}
.pv a:hover{color:var(--accent)}
.peek-meta .pv{margin:8px 0 0}
.pv-note{font-size:12px;color:var(--ink-faint)}
.pv-note a{color:var(--ink-muted)}
/* the living family — motion embeds from the SVGAnimator collection, planted between
   the MOTION markers by derive.mjs (source: 04-scaffold samples/alamehan). The mat is
   a FIXED light paper panel: the artifacts are forged on light paper, so in dark theme
   they read as framed prints, never as a theme bug. Emoji identity stays beside them. */
.mo-mat{display:block;background:#f4f6fa;border:1px solid var(--hairline);border-radius:12px;padding:10px;margin:0 0 14px}
.mo-mount{display:block}
.mo-mount section{margin:0 auto}
.mo-hint{font:500 10px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7c8496;text-align:center;margin:8px 0 0}
.peek-mo{float:right;width:132px;margin:2px 0 10px 14px}
.peek-mo .mo-mat{margin:0;padding:5px}
@media(max-width:520px){.peek-mo{width:106px}}
.roots{margin-top:var(--s6)}
/* ═══ 10 · JOURNEY — ruled rows ═══ */
.j-rows{border-top:1px solid var(--hairline)}
.j-row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--hairline)}
@media(min-width:700px){.j-row{grid-template-columns:150px 240px 1fr}}
.j-period{font:500 11px/1.8 var(--mono);color:var(--ink-faint)}
.j-head h3{font:600 14.5px/1.4 var(--font)}
.j-kind{font-size:11px;color:var(--ink-muted);background:var(--wash);border-radius:6px;padding:1px 7px}
.j-body{color:var(--ink-muted);font-size:13.5px;grid-column:2}
@media(min-width:700px){.j-body{grid-column:3}}
.j-body ul{margin:2px 0 0;padding-left:18px}
.j-body p{margin:0 0 6px}
/* ═══ 11 · VOICES ═══ */
.quotes{display:grid;gap:12px}
@media(min-width:860px){.quotes{grid-template-columns:1fr 1fr}}
.quote{margin:0;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.quote blockquote{margin:0;border-left:3px solid var(--accent);padding-left:14px;color:var(--ink);font:italic 400 15px/1.75 var(--serif)}
.quote blockquote p{margin:0 0 10px}
.quote blockquote p:last-child{margin-bottom:0}
.quote figcaption{display:flex;flex-direction:column;gap:2px;font-size:13px}
.quote figcaption strong{color:var(--ink)}
.q-role{color:var(--ink-muted)}
.q-src{color:var(--ink-faint);font-size:12px}
/* ═══ 12 · ABOUT ═══ */
.about-grid{display:grid;gap:var(--s6)}
@media(min-width:860px){.about-grid{grid-template-columns:1fr 300px}.about-side{align-self:start;position:sticky;top:88px}}
.about-side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:var(--s5)}
.skills{display:grid;gap:var(--s4);margin-top:var(--s5)}
@media(min-width:700px){.skills{grid-template-columns:1fr 1fr}}
.skills-group h4{font:600 12px/1.4 var(--mono);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;margin-top:var(--s5)}
@media(min-width:860px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats .stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.stats .stat-value{font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3);align-items:center}
/* v6.2 tidy, part two: chips go OUTLINE-quiet — dozens of filled gray pills were
   most of the page's visual noise; hairline outlines carry the same data silently */
.chip{font-size:12px;background:transparent;border:1px solid var(--hairline);border-radius:6px;padding:1px 8px;color:var(--ink-muted);white-space:nowrap}
.badge{font:500 11px/1 var(--font);border-radius:999px;padding:4px 10px;color:var(--ink)}
.badge--wip{background:var(--warn-wash)}
.badge--live{background:var(--ok-wash)}
.badge--locked{background:var(--wash);color:var(--ink-muted);border:1px solid var(--hairline)}
.dot-swatch{width:10px;height:10px;border-radius:999px;background:var(--swatch,var(--ink-faint));display:inline-block;flex:none}
.card-links{display:flex;gap:8px;margin-top:var(--s4);flex-wrap:wrap}
/* ═══ 13 · CONTACT (display moment #2 — the INK close returns: slot-5 was forged
   for this panel, "strokes with var(--canvas)" by its own receipt; the lime big
   stage drowned it (owner call 2026-07-18, v6.2 — lime is a micro-accent now) ═══ */
.contact-panel{display:grid;gap:var(--s5);align-items:center;background:var(--ink);color:var(--canvas);border-radius:20px;padding:clamp(26px,4vw,44px)}
@media(min-width:860px){.contact-panel{grid-template-columns:1fr 240px}}
.contact-panel h3{font:900 clamp(28px,3.8vw,46px)/1.06 var(--display);letter-spacing:-1px;margin-bottom:10px;text-wrap:balance}
.contact-panel h3 em{font:italic 700 .97em var(--serif);letter-spacing:0;color:inherit}
.contact-panel .sub{color:color-mix(in srgb,var(--canvas) 75%,transparent);margin-bottom:var(--s5);font-size:15px}
.contact-panel .btn--primary{background:var(--canvas);color:var(--ink)}
.contact-panel .btn--secondary{background:transparent;border-color:color-mix(in srgb,var(--canvas) 35%,transparent);color:var(--canvas)}
.socials{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--s5)}
.empty{border:1px dashed var(--hairline);border-radius:12px;padding:var(--s5);text-align:center;color:var(--ink-muted);font-size:14px}
.notice{font-size:13px;color:var(--ink-muted);background:var(--wash);border-radius:10px;padding:10px 14px}
footer{margin-top:var(--s8);border-top:1px solid var(--hairline)}
footer .shell{padding-top:var(--s5);padding-bottom:var(--s7);color:var(--ink-muted);font-size:13px}

.fail-card{max-width:560px;margin:15vh auto;background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:var(--s6);box-shadow:var(--shadow-1)}
.fail-card h2{font:700 20px/1.3 var(--font);margin-bottom:10px}
.fail-card p{color:var(--ink-muted);font-size:14px}
/* ═══ 14 · SLOTS ═══ */
.slot{width:100%;position:relative}
.slot svg{display:block;width:100%;height:100%}
.slot-1{aspect-ratio:4/3}.slot-2{aspect-ratio:4/5}.slot-3{aspect-ratio:1160/90}.slot-4{aspect-ratio:4/3}.slot-5{aspect-ratio:1/1;max-width:220px;margin:0 auto}
.slot-divider{margin-top:var(--s8)}

html.debug .slot-empty::after{content:attr(data-name);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--warn);font:500 12px var(--mono)}
/* ═══ 15 · PEEK · PALETTE · TOAST · TOP ═══ */
#peek{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgb(23 26 33/.32)}
#peek[hidden]{display:none}
.overlay-backdrop{position:absolute;inset:0;background:rgb(0 0 0/.25)}
.peek-panel{position:relative;width:500px;max-width:100%;height:100%;background:var(--surface);border-left:1px solid var(--hairline);border-radius:16px 0 0 16px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;animation:peekIn .24s cubic-bezier(.2,.8,.2,1)}
@keyframes peekIn{from{transform:translateX(24px);opacity:0}}
/* mobile sheet: 92dvh tracks the REAL visible viewport (iOS's 92vh includes the space
   behind the collapsing URL bar, which shoved the sheet's header clean off-screen —
   owner catch 2026-07-19); max-height:100% is the hard guarantee the header stays in */
@media(max-width:1023px){#peek{align-items:flex-end}.peek-panel{width:100%;height:92vh;height:92dvh;max-height:100%;border-left:0;border-top:1px solid var(--hairline);border-radius:16px 16px 0 0;animation:sheetIn .24s cubic-bezier(.2,.8,.2,1)}}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}}
.peek-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--hairline);flex:none}
.peek-head .tile{width:32px;height:32px;font-size:16px;border-radius:10px;background:var(--wash);display:inline-flex;align-items:center;justify-content:center}
.peek-head h2{font:600 15px/1.3 var(--font);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peek-tools{display:flex;gap:4px;align-items:center;flex:none}
.peek-meta{padding:12px 16px;border-bottom:1px solid var(--hairline);flex:none}
.peek-meta .chips{margin-top:0}
.peek-meta .card-links{margin-top:10px}
.peek-body{overflow:auto;padding:20px 24px;overscroll-behavior:contain}
.peek-src .src-cap{font:500 12px var(--mono);color:var(--ink-muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.peek-src pre{font-size:12.5px}

/* ═══ Leaf parser (leaf/1 — unchanged semantics from v4, G1–G12) ═══ */
function parseLeaf(txt,fid){
  var res={front:{},entries:[]};
  txt=String(txt||"").replace(/\r\n?/g,"\n").replace(/<!--[\s\S]*?-->/g,"");
  var lines=txt.split("\n"),i=0;
  function metaLine(line,tgt,ln){
    if(!line.trim())return true;
    var m=line.match(/^([A-Za-z0-9_.-]+):\s?(.*)$/);
    if(!m)return false;
    var k=m[1],v=m[2].trim();
    if(k!==k.toLowerCase()){warn(fid,ln,"key lowercased: "+k);k=k.toLowerCase()}
    if(tgt[k]===undefined)tgt[k]=v;
    else if(Array.isArray(tgt[k]))tgt[k].push(v);
    else tgt[k]=[tgt[k],v];
    return true;
  }
  if(lines[0]==="---"){
    var j=1;while(j<lines.length&&lines[j]!=="---")j++;
    if(j<lines.length){for(var k2=1;k2<j;k2++){if(!metaLine(lines[k2],res.front,k2+1))warn(fid,k2+1,"unparsable front-matter line")}i=j+1}
  }
  var cur=null,mode="meta",lang=null;
  for(;i<lines.length;i++){
    var line=lines[i];
    var h=line.match(/^##\s+(.+)$/);
    if(h){
      var slug=h[1].trim();
      if(!/^[a-z0-9-]+$/.test(slug)){warn(fid,i+1,"bad slug '"+slug+"' normalized");slug=slug.toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"")||("entry-"+res.entries.length)}
      for(var d=0;d<res.entries.length;d++){if(res.entries[d].slug===slug){warn(fid,i+1,"duplicate slug '"+slug+"' — last wins");res.entries.splice(d,1);break}}
      cur={slug:slug,meta:{},body:{}};res.entries.push(cur);mode="meta";lang=null;continue;
    }
    if(!cur)continue;
    var lm=line.match(/^@(en|id)\s*$/);
    if(lm){mode="body";lang=lm[1];if(cur.body[lang]===undefined)cur.body[lang]=[];continue}
    if(mode==="meta"){
      if(metaLine(line,cur.meta,i+1))continue;
      mode="body";lang="_";cur.body._=[line];continue;
    }
    cur.body[lang].push(line);
  }
  res.entries.forEach(function(e){
    Object.keys(e.body).forEach(function(k){e.body[k]=e.body[k].join("\n").trim()});
    if(e.body._!==undefined){
      if(!e.body.en&&!e.body.id){e.body.en=e.body._}
      else warn(fid,0,"stray text before @lang marker ignored in '"+e.slug+"'");
      delete e.body._;
    }
  });
  return res;
}
function parseLinks(meta,src){

    if(ix<1){warn(src||"link",0,"bad link value: "+s);return}
    var label=String(s).slice(0,ix).trim(),url=okUrl(String(s).slice(ix+1).trim());
    if(!url){warn(src||"link",0,"unsafe/bad url dropped: "+s);return}

  });

}

function inline(s){

  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(m,a,u){var v=okUrl(u);return v?'<img src="'+v+'" alt="'+a+'" loading="lazy">':a});

  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~]+)~~/g,"<s>$1</s>");

function mdBlocks(src){
  var lines=String(src||"").replace(/\r\n?/g,"\n").split("\n"),html="",i=0;
  function sl(t){return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
  function liHtml(it){
    var t=it.txt.match(/^\[([ xX])\]\s+(.*)$/);
    if(t)return '<li class="task"><input type="checkbox" disabled'+(t[1].toLowerCase()==="x"?" checked":"")+'><span>'+inline(t[2])+"</span></li>";
    return "<li>"+inline(it.txt)+"</li>";
  }
  function listBlock(){
    var items=[];
    while(i<lines.length){
      var m=lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(!m)break;
      items.push({ind:m[1].length>=2?1:0,ord:/^\d/.test(m[2]),txt:m[3]});
      i++;
    }
    var rootTag=items[0].ord?"ol":"ul",out="<"+rootTag+">",k=0;
    while(k<items.length){
      if(items[k].ind===0){
        var s2=liHtml(items[k]).replace(/<\/li>$/,"");k++;
        var nested=[];
        while(k<items.length&&items[k].ind===1){nested.push(items[k]);k++}
        if(nested.length){var nt=nested[0].ord?"ol":"ul";s2+="<"+nt+">"+nested.map(liHtml).join("")+"</"+nt+">"}
        out+=s2+"</li>";
      }else{out+=liHtml(items[k]);k++}
    }
    return out+"</"+rootTag+">";
  }
  while(i<lines.length){
    var line=lines[i];
    if(!line.trim()){i++;continue}
    var m=line.match(/^```(\S*)\s*$/);
    if(m){var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}i++;html+="<pre><code>"+esc(buf.join("\n"))+"</code></pre>";continue}
    m=line.match(/^(#{1,4})\s+(.*)$/);
    if(m){var lv=m[1].length<=3?3:4;html+="<h"+lv+' id="'+sl(m[2])+'">'+inline(m[2])+"</h"+lv+">";i++;continue}
    if(/^(-{3,}|\*{3,})\s*$/.test(line)){html+="<hr>";i++;continue}
    if(/^>\s?/.test(line)){var qb=[];while(i<lines.length&&/^>\s?/.test(lines[i])){qb.push(lines[i].replace(/^>\s?/,""));i++}html+="<blockquote>"+inline(qb.join(" "))+"</blockquote>";continue}
    if(/^\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      var rows=[];while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++}
      var cells=function(r){return r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(c){return inline(c.trim())})};
      var tb="<table><thead><tr>"+cells(rows[0]).map(function(c){return "<th>"+c+"</th>"}).join("")+"</tr></thead><tbody>";
      for(var r2=2;r2<rows.length;r2++)tb+="<tr>"+cells(rows[r2]).map(function(c){return "<td>"+c+"</td>"}).join("")+"</tr>";
      html+=tb+"</tbody></table>";continue}
    if(/^(\s*)([-*]|\d+\.)\s+/.test(line)){html+=listBlock();continue}
    var pb=[line];i++;
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|```|>\s?|\||\s*([-*]|\d+\.)\s|-{3,}\s*$)/.test(lines[i])){pb.push(lines[i]);i++}
    html+="<p>"+inline(pb.join(" "))+"</p>";
  }
  return html;
}

function cleanSvg(root){
  $$("script,foreignObject",root).forEach(function(n){n.remove()});
  [root].concat($$("*",root)).forEach(function(n){
    Array.prototype.slice.call(n.attributes||[]).forEach(function(a){
      var nm=a.name.toLowerCase();
      if(nm.indexOf("on")===0)n.removeAttribute(a.name);
      else if((nm==="href"||nm==="xlink:href")&&String(a.value).charAt(0)!=="#")n.removeAttribute(a.name);
    });
  });
}
function loadSlots(){
  if(!slotIO)slotIO=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in-view");slotIO.unobserve(en.target)}})},{threshold:.25});
  $$(".slot").forEach(function(el){
    if(el.dataset.loaded)return;
    var n=el.getAttribute("data-slot");
    fetch("assets/svg/slot-"+n+".svg").then(function(r){if(!r.ok)throw 0;return r.text()}).catch(function(){var t=embeddedText('script[type="text/svg-slot"][data-slot="'+n+'"]');if(t!==null)return t;throw 0}).then(function(txt){
      var doc=new DOMParser().parseFromString(txt,"image/svg+xml");
      var svg=doc.documentElement;
      if(String(svg.nodeName).toLowerCase()!=="svg"||!svg.getAttribute("viewBox"))throw 0;
      cleanSvg(svg);
      svg.removeAttribute("width");svg.removeAttribute("height");
      svg.setAttribute("focusable","false");svg.setAttribute("aria-hidden","true");
      el.appendChild(document.importNode(svg,true));
      el.dataset.loaded="1";
      slotIO.observe(el);
    }).catch(function(){
      el.classList.add("slot-empty");el.setAttribute("data-name","slot-"+n);
      if(!document.documentElement.classList.contains("debug")){
        var w=el.closest(".slot-divider")||el.closest(".hero-art")||el.closest(".stage-art")||el.closest(".panel")||el;
        w.classList.add("hidden");
      }
    });

## about
@en
I'm Raihan — sole product designer for PT Elabram Systems' hiring-solutions ecosystem, where I built the company's design system end-to-end and evolved it into a machine-readable engine for AI-assisted delivery. My practice moved through three phases:

1. **Raw UI** — screen-by-screen manual design: functional, but slow and inconsistency-prone.
2. **Design System** — tokens, components, and variants, all synced to shared foundations.
3. **AI Generates UI** — a machine-readable **JSON design system** driving both Figma generation and frontend code: *the design system becomes the engine, not just the reference.*

Away from the day job I build **single-file tools** — engines, plugins, and pages that fit in one HTML file with zero dependencies. That hobby grew into the **@alamehan product family**: one shared standard, one file and one accent per product, from a knowledge mapper to a project factory to a documentation press.

**Off the record:** my motto is **"Arete"** — excellence as a habit; INTJ, "The Architect": strategic, independent, systems-oriented.

> "I don't just build things that work. I bleed through endless iterations to forge absolute masterpieces."

## esystems
emoji: 🧭
name: E-Systems
tagline.en: Designing the operating layer of hiring — continuously, end to end.

@en
A multi-product hiring ecosystem where clarity has to survive dense workflows, approvals, permissions, edge cases, and constant operational change — designed solo since 2023.

### Challenge
Bring coherence to a broad internal platform while continuously shipping new modules, simplifying legacy flows, and keeping business, product, and engineering aligned.

### Approach
Map the real operational journey, prototype the high-risk interactions, centralize every design decision in one documentation sheet, establish reusable patterns, and iterate through stakeholder review and UAT.

### Outcome
Faster approvals with less friction, clearer recruiter focus, unified cross-product behavior, timely candidate feedback via automated surveys — and a design foundation that now supports AI-assisted delivery.

### Selected scope
- **Contract Approval** — 45 documented flows, bulk actions, correction history, a 25-step Contract History prototype presented to the team.
- Candidates, Jobs, CRM (16 flows), Agreement, Reports, Notification Center, Consent Management, Resume Builder (11 flows).
- AI features: assistant, smart writer, suggestions, compact views — plus platform-wide email templates and maintenance mode.
@id
Ekosistem hiring multi-produk tempat kejelasan harus selamat dari workflow padat, approval, permission, edge case, dan perubahan operasional konstan — didesain sendirian sejak 2023.

### Tantangan
Menghadirkan koherensi di platform internal yang luas sambil terus merilis modul baru, menyederhanakan flow lama, dan menjaga bisnis, produk, serta engineering tetap sejalan.

### Pendekatan
Petakan perjalanan operasional yang sebenarnya, prototipekan interaksi berisiko tinggi, pusatkan semua keputusan desain di satu lembar dokumentasi, bangun pola yang bisa dipakai ulang, lalu iterasi lewat review stakeholder dan UAT.

### Hasil
Approval lebih cepat dengan friksi lebih kecil, fokus recruiter lebih tajam, perilaku lintas produk menyatu, feedback kandidat tepat waktu lewat survei otomatis — dan fondasi desain yang kini menopang delivery berbantuan AI.

### Cakupan pilihan
- **Contract Approval** — 45 flow terdokumentasi, bulk action, riwayat koreksi, prototipe Contract History 25 langkah yang dipresentasikan ke tim.
- Candidates, Jobs, CRM (16 flow), Agreement, Reports, Notification Center, Consent Management, Resume Builder (11 flow).
- Fitur AI: assistant, smart writer, suggestions, compact view — plus template email seluruh platform dan maintenance mode.

@en
Most AI tools can make attractive UI. The harder problem is making every output precisely obey the same components, spacing, variants, icons, and interaction rules.

### Challenge
Move beyond a design library that humans reference manually and create a structured source of truth that machines can reliably interpret.

### Approach
Synchronize foundations and 70+ hand-crafted components (Atomic → Basic → Advanced → Panel tiers, slot-based variants), encode tokens and rules as JSON, document coding constraints in DESIGN.md, and build a Figma-plugin pipeline.

### Outcome
The design system becomes the engine — not just the reference: one machine-readable source informing both generated Figma UI and frontend code, now being implemented with the development team.

### Selected scope
- The New E-Systems design system, V1 → V2 → AI-ready JSON.
- Figma API & Agents workflow; a plugin that generates designs synced to the system.
- Component-architecture practices: instance-first edits, library separation, slot variants — a 100% synced system.
@id
Kebanyakan tool AI bisa bikin UI yang menarik. Masalah yang lebih sulit: membuat setiap keluaran patuh persis pada komponen, spacing, varian, ikon, dan aturan interaksi yang sama.

### Tantangan
Melampaui design library yang cuma dirujuk manual oleh manusia, menuju sumber kebenaran terstruktur yang bisa dibaca mesin dengan andal.

### Pendekatan
Sinkronkan fondasi dan 70+ komponen rakitan tangan (tier Atomic → Basic → Advanced → Panel, varian berbasis slot), enkode token dan aturan sebagai JSON, dokumentasikan batasan koding di DESIGN.md, dan bangun pipeline plugin Figma.

### Hasil
Design system menjadi mesinnya — bukan sekadar referensi: satu sumber machine-readable yang menggerakkan UI Figma hasil generate sekaligus kode frontend, kini diimplementasikan bareng tim development.

### Cakupan pilihan
- Design system The New E-Systems, V1 → V2 → JSON siap-AI.
- Alur kerja Figma API & Agents; plugin yang men-generate desain tersinkron ke sistem.
- Praktik arsitektur komponen: edit instance dulu, pemisahan library, varian slot — sistem 100% sinkron.

@en
Legal negotiation rarely lives in one place: context sits in briefs, risk in comments, client intent in chat screenshots, and revisions across document versions.

### Challenge
Turn a fragmented, expert-heavy process into a guided experience that stays strategically useful to Business Development and Legal teams.

### Approach
A guided, Notion-like workspace embedded in E-Systems: a 12-stage wizard from Business Context → Legal Draft → Review & Risk Scan → Client Feedback → Negotiated Revision → Signed → Closed; multi-channel feedback analysis; a strategic-revision slider (60:40 · 50:50 · 40:60); Git-like diff views; ready-to-send replies.

### Outcome
Shortlisted into the Top 5, pitched to Top Management, and awarded **2nd place** in Elabram's company-wide AIDEA 2026 competition (team of two, prize IDR 7,000,000). Later cited in the internal Sprint Review as a lesson in UX discipline: ~10 iterations until the flow became properly simple.

### Selected scope
- A full self-contained HTML demo with a 12-stage guided wizard and adaptive split panes.
- A complete PRD, a technical state machine, and bilingual final presentation decks.
@id
Negosiasi legal jarang hidup di satu tempat: konteks di brief, risiko di komentar, maksud klien di screenshot chat, dan revisi tersebar di banyak versi dokumen.

### Tantangan

@en
### The system
Developed **The New E-Systems** — a standardized, international design system for consistency, scalability, and usability — then refined it into **Design System V2** with updated guidelines, enhanced components, and improved visuals. At maturity: foundations (colors, styles, effects, animated GIF illustrations) and **over 70 hand-crafted components**, fully synced, documented in tiers — Atomic, Basic, Advanced, and Panel Content — plus prototype-purpose components and master data.

### Component-architecture practice
Avoid overly complex hierarchies · edit instances first, then *Push to Master* to prevent crash-inducing mass updates · keep the system in its own library file loaded into per-feature files · use Figma **Slots** for variants without break/detach — a 100% synced design system.

### The AI leap
Converted the design system into **JSON** — machine-readable and AI-ready (built with Figma Agents and Claude); began implementing it across the development team so built products stay perfectly consistent with design; and started a **Figma plugin** that auto-generates designs synced to the system from JSON input. One JSON, two outputs: Figma designs and frontend code.

### Redesign scope
Design System · Candidates · Resume Builder · Consent Management · Maintenance Mode · Data Import & Related · File Management · Asset Management · Report Module · Notification Center · Comment Feature · AI-Related Features · Other Pages (new login) · Jobs.
@id
### Sistemnya
Mengembangkan **The New E-Systems** — design system berstandar internasional demi konsistensi, skalabilitas, dan usability — lalu menyempurnakannya jadi **Design System V2** dengan panduan terbaru, komponen yang ditingkatkan, dan visual yang lebih baik. Pada bentuk matangnya: fondasi (warna, style, efek, ilustrasi GIF animasi) dan **70+ komponen rakitan tangan**, tersinkron penuh, terdokumentasi bertingkat — Atomic, Basic, Advanced, dan Panel Content — plus komponen keperluan prototype dan master data.

### Praktik arsitektur komponen
Hindari hierarki komponen yang terlalu rumit · edit instance dulu, lalu *Push to Master* agar tidak ada pembaruan massal yang bikin crash · simpan design system di file library sendiri yang dimuat ke file per-fitur · pakai **Slot** Figma untuk varian tanpa break/detach — design system 100% sinkron.

### Lompatan AI
Mengubah design system ke format **JSON** — machine-readable dan siap-AI (dibangun dengan Figma Agents dan Claude); mulai diimplementasikan ke tim development agar produk yang dibangun tetap konsisten sempurna dengan desain; dan mulai mengembangkan **plugin Figma** yang otomatis menghasilkan desain tersinkron dari input JSON. Satu JSON, dua keluaran: desain Figma dan kode frontend.

### Cakupan redesain
Design System · Candidates · Resume Builder · Consent Management · Maintenance Mode · Data Import & Related · File Management · Asset Management · Report Module · Notification Center · Comment Feature · Fitur ber-AI · Halaman lain (login baru) · Jobs.

### What it taught me
A design system is a product whose users are your teammates. Adoption is the metric; beauty is a side effect.

### Kenapa dua sistem
LiniStore/LiniSeller dan keluarga Kelola adalah produk berbeda dengan tempo berbeda — memaksakan satu sistem untuk keduanya hanya akan memperlambat semua orang. Jadi: dua sistem, satu grammar.

Skema warna, tipografi, style, set token, component library, dokumen pemakaian, dan aturan kontribusi — infrastruktur "membosankan" yang membuat ~900 halaman rilis konsisten di sebelas lini produk.

Design system itu produk yang penggunanya adalah rekan timmu sendiri. Adopsi adalah metriknya; keindahan cuma efek samping.

A family of tiny offline tools sharing one monochrome design language — plus the
*standard itself as a product*: design tokens, 12 machine-checked code rules, and an

→ register → build. Now evolved into **Family Standard v2** (Fustat, Lucide, UX gates
G1–G10, the four-tab family modal) — with v1 preserved untouched as the legacy layer.

| Promise | Reality |
|---|---|
| Zero dependencies | ✅ `node:` built-ins only, nothing at runtime |
| Runs from `file://` | ✅ today, and in ten years |
| One standard | ✅ every rule that can be machine-checked, is |

A standard is only real when it's a **script, not a wish** — and this very website
(v4) is built on lessons Monozap paid for.

### Gatelnya
Kebanyakan ide side-project mati di tahap setup: scaffolding, dependency, deploy.
Aku pengen tools yang hidup di **satu file HTML**, jalan cukup dengan double-click,
tapi tetap kerasa didesain.

### Yang aku bikin
Satu keluarga tools offline mungil dengan satu bahasa desain monokrom — plus
*standarnya itu sendiri sebagai produk*: design tokens, 12 aturan kode yang dicek
mesin, dan kontrak identitas, semuanya dijaga linter. Pipeline-nya: ide → dokumen →
scaffold → registrasi → build. Kini berevolusi jadi **Family Standard v2** (Fustat,
Lucide, gerbang UX G1–G10, modal keluarga empat tab) — dengan v1 diawetkan utuh

Zero dependency, jalan dari `file://`, dan setiap aturan yang bisa dicek mesin —

Standar itu baru nyata kalau bentuknya **script, bukan wacana** — dan website v4
ini berdiri di atas pelajaran yang dibayar Monozap.

## framework-prd
emoji: 🗺️
name: Framework PRD — "From Visual to Specification"
tagline.en: Five phases from screenshots to a complete, buildable product spec.
tagline.id: Lima fase dari screenshot ke spesifikasi produk lengkap yang siap dibangun.
year: 2025–2026
tag: framework
tag: prd
tag: ai
pin: true
swatch: #2563EB

@en
A five-phase framework for converting visual references (screenshots, UI recordings, existing apps) into complete, buildable product specifications with AI:

| Phase | Name | What happens |
|---|---|---|
| 0 | Preparation | Collect and organize the visual source material |
| 1 | Visual extraction | Systematically extract screens, components, and flows |
| 2 | Structural analysis | Reconstruct the information architecture, data model, and user flows |
| 3 | Specification writing | Produce the PRD — objectives, personas, module-by-module specs, acceptance criteria |
| 4 | Validation & handoff | Cross-check the spec against the visual source and prepare for execution |

### Proof of work — e-PRABU
Validated end-to-end by producing complete documentation for *e-PRABU* (Elektronik Perhitungan Rencana Anggaran Biaya untuk Istana) — an integrated budget-plan (RAB) lifecycle platform standardizing the workflow between **Staf** (budget-plan creators) and **Atasan** (approvers), with centralized master data (labor, material, and equipment unit prices) as the single source of truth for all budget calculations. Deliverables: a full PRD covering 8 modules, user flows, and a data blueprint, plus a complete AI-generated documentation suite — executive summary, product vision, personas, actionable success metrics, and a diagram collection including project-lifecycle state machines (Draft → Awaiting Approval → Active Project → Completed, with per-state modes like Editable, Read-Only, Execution, Archived) — produced with Gemini and Claude driven by the framework.
@id
Framework lima fase untuk mengubah referensi visual (screenshot, rekaman UI, aplikasi yang sudah ada) menjadi spesifikasi produk lengkap yang siap dibangun, bersama AI:

| Fase | Nama | Yang terjadi |
|---|---|---|
| 0 | Persiapan | Kumpulkan dan rapikan materi sumber visual |
| 1 | Ekstraksi visual | Ekstrak layar, komponen, dan flow secara sistematis |
| 2 | Analisis struktural | Rekonstruksi arsitektur informasi, model data, dan user flow |
| 3 | Penulisan spesifikasi | Susun PRD — tujuan, persona, spesifikasi per modul, kriteria penerimaan |
| 4 | Validasi & handoff | Silang-periksa spesifikasi terhadap sumber visual dan siapkan eksekusi |

### Bukti kerja — e-PRABU
Tervalidasi ujung-ke-ujung dengan menghasilkan dokumentasi lengkap *e-PRABU* (Elektronik Perhitungan Rencana Anggaran Biaya untuk Istana) — platform siklus hidup RAB terintegrasi yang membakukan alur kerja antara **Staf** (penyusun RAB) dan **Atasan** (penyetuju), dengan master data terpusat (harga satuan tenaga, material, dan peralatan) sebagai satu sumber kebenaran untuk semua perhitungan anggaran. Deliverable: PRD utuh 8 modul, user flow, dan blueprint data, plus satu suite dokumentasi hasil AI — ringkasan eksekutif, visi produk, persona, metrik sukses yang bisa dieksekusi, dan koleksi diagram termasuk state machine siklus proyek (Draft → Awaiting Approval → Active Project → Completed, dengan mode per-state seperti Editable, Read-Only, Execution, Archived) — dibuat dengan Gemini dan Claude yang dikemudikan framework ini.

## three-gate
emoji: 🚪
name: The Three-Gate Feature Evaluation
tagline.en: Every proposed feature runs three gates: value, clarity, effort.
tagline.id: Setiap usulan fitur melewati tiga gerbang: nilai, kejelasan, upaya.
year: 2025–2026
tag: framework
tag: product
swatch: #16A34A

@en
A decision framework that routes every proposed feature through three structured gates:

| Gate | Question | Outcomes |
|---|---|---|
| 1 · Business Value | Is the feature essential for ~80% of users? | If not → **Reject / Backlog** |
| 2 · UX Complexity | Is the interface flow clear? | High cognitive load → **Simplify / Hide**; intuitive flows advance |
| 3 · Dev Effort | Feasible within one sprint cycle? | High-risk → **Defer to V2**; safe & low-effort → **Build & Ship (MVP)** |

**Operating principle:** refine the PRD and prototype until the UX is easily understood by stakeholders first — *"if it's still complicated for stakeholders, imagine the user."* Always start from the MVP; simplify, iterate, simplify — it takes time, but saves far more later. Extend features only after users love the core.
@id
Framework keputusan yang mengalirkan setiap usulan fitur melewati tiga gerbang terstruktur:

| Gerbang | Pertanyaan | Hasil |
|---|---|---|
| 1 · Nilai Bisnis | Apakah fitur ini esensial bagi ~80% pengguna? | Jika tidak → **Tolak / Backlog** |
| 2 · Kompleksitas UX | Apakah alur antarmukanya jelas? | Beban kognitif tinggi → **Sederhanakan / Sembunyikan**; alur intuitif lanjut |
| 3 · Upaya Dev | Layak dalam satu siklus sprint? | Berisiko tinggi → **Tunda ke V2**; aman & ringan → **Bangun & Rilis (MVP)** |

**Prinsip kerjanya:** rapikan PRD dan prototype sampai UX-nya mudah dipahami stakeholder dulu — *"kalau untuk stakeholder saja masih rumit, bayangkan penggunanya."* Selalu mulai dari MVP; sederhanakan, iterasi, sederhanakan — memang butuh waktu, tapi menghemat jauh lebih banyak nanti. Perluas fitur hanya setelah pengguna mencintai intinya.

@en

## json-design-system
emoji: 🤖
name: The Machine-Readable Design System
tagline.en: One JSON, two outputs — Figma designs and frontend code from a single source of truth.

@en
The capstone method: convert the design system into **JSON** so it is machine-readable and AI-ready; implement it across the development team so the built product stays perfectly consistent with the design system; and develop a **Figma plugin** that auto-generates designs synced to the system from JSON input.

**One JSON — two outputs:** Figma designs and frontend code. One source of truth, two synced outputs, less manual translation between teams, faster production with more consistency. The hard part is precision — most AI design tools generate UI that looks good but isn't truly accurate to the system (wrong spacing, generic components, inconsistent icons, wrong variants). Structured JSON plus explicit DESIGN.md rules beat guesswork: *precision needs structure, not just prompts.* Achieving this reliably requires a frontier-grade AI model.
@id
Metode pamungkas: ubah design system ke **JSON** agar machine-readable dan siap-AI; implementasikan ke tim development agar produk yang dibangun tetap konsisten sempurna dengan design system; dan kembangkan **plugin Figma** yang otomatis menghasilkan desain tersinkron dari input JSON.

**Satu JSON — dua keluaran:** desain Figma dan kode frontend. Satu sumber kebenaran, dua keluaran tersinkron, lebih sedikit penerjemahan manual antar tim, produksi lebih cepat dan lebih konsisten. Bagian sulitnya adalah presisi — kebanyakan tool desain AI menghasilkan UI yang terlihat bagus tapi tidak benar-benar akurat terhadap sistem (spacing salah, komponen generik, ikon tidak konsisten, varian keliru). JSON terstruktur plus aturan DESIGN.md yang eksplisit mengalahkan tebak-tebakan: *presisi butuh struktur, bukan sekadar prompt.* Mencapainya secara andal butuh model AI kelas frontier.

## design-ops
emoji: 🧰
name: Design-Ops Principles & Practices
tagline.en: Distilled from a continuous cycle of sprint retrospectives.
tagline.id: Disuling dari siklus retrospektif sprint yang berkelanjutan.
year: 2023–now
tag: framework
tag: design-ops
swatch: #EA580C

@en
- **Documentation** — one master sheet for all design & prototype documentation: complete, per project, per feature, with links, notes, and timestamps, maintained continuously.
- **Figma performance & hygiene** — avoid overly complex component hierarchies; adjust instance components first, then push to master to prevent crash-inducing mass updates; keep the design system in its own library file loaded into feature files; use slot-based components for variants without break/detach.
- **Design-to-code alignment** — base designs on Tailwind and Tabler Icons so frontend can implement directly, and codify coding-phase rules in DESIGN.md.
- **AI-assisted ideation** — faster, clearer UX iteration using ASCII wireframes in chat-based AI; image generation with attached references and JSON-structured prompts; standardized prompt templates to reduce variability; continuous exploration of advanced AI features.
- **Freshness & research** — strong design systems need periodic refreshes (squircle, glassmorphism, progressive-blur explorations); involve frontend and stakeholders early; stay current through curated daily AI/design/engineering newsletters.
@id
- **Dokumentasi** — satu master sheet untuk seluruh dokumentasi desain & prototype: lengkap, per proyek, per fitur, dengan tautan, catatan, dan waktu, dirawat berkelanjutan.
- **Performa & higiene Figma** — hindari hierarki komponen yang terlalu rumit; ubah instance dulu, lalu push ke master agar tak ada pembaruan massal yang bikin crash; simpan design system di file library sendiri yang dimuat ke file fitur; pakai komponen berbasis slot untuk varian tanpa break/detach.
- **Keselarasan desain-ke-kode** — dasari desain pada Tailwind dan Tabler Icons agar frontend bisa langsung mengimplementasikan, dan bakukan aturan fase coding di DESIGN.md.
- **Ideasi berbantuan AI** — iterasi UX lebih cepat dan jernih memakai wireframe ASCII di AI berbasis chat; generasi gambar dengan referensi terlampir dan prompt terstruktur JSON; template prompt terstandar untuk menekan variabilitas; eksplorasi berkelanjutan fitur AI lanjutan.
- **Kesegaran & riset** — design system yang kuat butuh penyegaran berkala (eksplorasi squircle, glassmorphism, progressive blur); libatkan frontend dan stakeholder sejak awal; tetap terkini lewat kurasi harian newsletter AI/desain/engineering.

@en
### The arena
A company-wide AI innovation campaign open to all employees and departments (individuals or teams of up to 4, cross-department teamwork encouraged), designed to surface AI solutions that improve workplace processes, save time, boost efficiency, and reduce repetitive tasks. Total prize pool **IDR 30,000,000**, with 2nd place awarded **IDR 7,000,000** for a *"highly creative and feasible AI solution."* Stages: registration → initial review → shortlisted presentation → final pitching to Top Management → winner announcement.

### The team
Group 6: M. Raihan Rafiiful Allaam with Riyan Trisna Wibowo.

### The idea — DealCraft AI
A guided, Notion-like **legal-negotiation workspace embedded in E-Systems** walking Business Development and Legal through the full partnership workflow: **Business Context → Legal Draft → Internal Review & Risk Scan → Client Feedback → Negotiated Revision → Signed Contract → Deal Closed.**
- AI composes the initial business-context summary from proposals, briefs, commercial points, or meeting results, and enriches client context from permitted internal data.

- Scans drafts for gaps and risks: missing scope, differing payment terms, unclear deliverables, overly biased clauses, excessively loose terms.

- Generates revised versions along a **strategic-revision slider** (60:40 protective · 50:50 balanced · 40:60 accommodating) with tangible outputs: a new legal version, a side-by-side **Git-like diff view**, an executive impact summary, and ready-to-send client replies.

### Deliverables built
A full self-contained HTML demo prototype — a 12-stage guided wizard, adaptive split-pane layout, two-way editor/preview sync, a zero-disabled interactivity philosophy, collapsible side panels, a technical state machine, a premium visual design system, and reset-to-demo — specified in a complete PRD, plus final presentation decks in English and Indonesian.

### The run
Shortlisted into the **Top 5** → presented before internal judges and Top Management at the Final Presentation Session (21 May 2026) → announced and celebrated as **2nd Winner** at the company-wide event (4 June 2026). The DealCraft UX case was later cited in the internal Sprint Review as a lesson in UX discipline: after ~10 iterations, the flow became properly simple, understandable, and usable.

## data-compression
emoji: 🗜️
name: Sharing Session — "Design as Data Compression"
tagline.en: Humans run on ~1 GB of biological RAM. Design compresses the message to fit.
tagline.id: Manusia berjalan dengan ~1 GB RAM biologis. Desain memampatkan pesan agar muat.
year: 2025
tag: talk
tag: design
swatch: #0E7490

@en
A company-wide sharing session built around an original metaphor for design's business value:

- Machines and AI may run on 1 TB of RAM, but humans — our clients and users — are equipped with roughly **1 GB of "biological RAM"** for truly focused comprehension.
- Thick reports, wall-of-text emails, and cluttered dashboards are like a giant **600 MB tangled ball** of raw information hurled at the audience. A robot audience would catch it with ease; human audiences overload — exhausted and stressed just guessing at a document's intent before they can even begin thinking about the decision itself. This is **cognitive overload**.
- **The power of design for humans:** good design acts as a data-compression tool, transforming the 600 MB tangle into a tidy "cube" that consumes only 50 MB of the audience's RAM — they instantly understand, and their remaining mental capacity is free to execute the strategy.

> "Our job is not to force audiences to enlarge their brain capacity, but to compress our message — information, design, everything — so it fits in human RAM."
@id
Sesi berbagi se-perusahaan yang dibangun di atas metafora orisinal tentang nilai bisnis desain:

- Mesin dan AI boleh berjalan dengan 1 TB RAM, tapi manusia — klien dan pengguna kita — hanya dibekali sekitar **1 GB "RAM biologis"** untuk pemahaman yang benar-benar fokus.
- Laporan tebal, email tembok teks, dan dashboard berantakan itu seperti **gulungan kusut 600 MB** informasi mentah yang dilempar ke audiens. Audiens robot akan menangkapnya dengan mudah; audiens manusia kelebihan beban — lelah dan stres hanya untuk menebak maksud dokumen, sebelum sempat memikirkan keputusannya sendiri. Inilah **cognitive overload**.
- **Kekuatan desain untuk manusia:** desain yang baik bekerja sebagai alat kompresi data, mengubah kekusutan 600 MB menjadi "kubus" rapi yang hanya memakan 50 MB RAM audiens — mereka langsung paham, dan sisa kapasitas mentalnya bebas untuk mengeksekusi strategi.

> "Tugas kita bukan memaksa audiens memperbesar kapasitas otaknya, melainkan memampatkan pesan kita — informasi, desain, semuanya — agar muat di RAM manusia."

## sprint-review-brain
emoji: 🧠
name: Sprint Review — "How We Built the Brain"
tagline.en: The design system → AI pipeline story, told in five parts.
tagline.id: Kisah design system → pipeline AI, diceritakan dalam lima babak.
year: 2026

@en
An internal sprint-review presentation documenting both delivery progress and the AI-design-system initiative.

### Key progress highlights
Elabram website fully responsive on mobile & tablet across all pages · 4 new service pages shipped (AI Digital Employees, AI Vision Analytics, AI-Augmented IT Operations, Axdif) · Elnex homepage finalized · the AI Motion System built to automate motion assets · DESIGN.md coding-phase standards researched. Summary: *"Strong systems, clear standards, and AI-driven execution."*

### The five-part story
1. **How design work evolved** — Raw UI → Design System → AI Generates UI: "the goal is not just faster design, but faster, *consistent* design."
2. **The new workflow** — the design system becomes the input for AI: Design System → JSON Rulebook → AI + Figma plugin → Generated UI. "The design system becomes the engine, not just the reference."
3. **The hard part — precision** — most AI design tools generate UI that looks good but isn't accurate to the system. Structured JSON plus explicit DESIGN.md rules beat guesswork: "precision needs structure, not just prompts."
4. **One JSON, two outputs** — a single machine-readable design system powers both Figma design and frontend code (achieving this reliably requires a frontier-grade AI model).
5. **Why UX still matters** — AI builds faster, but UX decides whether people understand and actually use the product. "AI builds faster. UX makes it useful, understandable, and worth using." Paired with an engineering note: AI can generate code, but humans still own quality, review, and sustainability.

### How the brain was built
From playful Figma exploration to a repeatable AI workflow: mapping the Figma API → converting the design system into variables and tokens → component + content JSON with rules included → one knowledge base → a custom AI with a dedicated system prompt → generating HTML/UI straight into Figma via script. *"Faster, more consistent, minimal manual work — from playful exploration to a reusable system."*

### Sorotan progres utama
Website Elabram responsif penuh di mobile & tablet untuk semua halaman · 4 halaman layanan baru rilis (AI Digital Employees, AI Vision Analytics, AI-Augmented IT Operations, Axdif) · homepage Elnex final · AI Motion System dibangun untuk mengotomatiskan aset motion · standar coding-phase DESIGN.md diriset. Ringkasannya: *"Sistem kuat, standar jelas, eksekusi digerakkan AI."*

### Kisah lima babak
1. **Bagaimana kerja desain berevolusi** — Raw UI → Design System → AI Generates UI: "tujuannya bukan sekadar desain lebih cepat, tapi desain cepat yang *konsisten*."
2. **Alur kerja baru** — design system menjadi input untuk AI: Design System → JSON Rulebook → AI + plugin Figma → UI hasil generate. "Design system menjadi mesinnya, bukan sekadar referensi."
3. **Bagian sulitnya — presisi** — kebanyakan tool desain AI menghasilkan UI yang terlihat bagus tapi tidak akurat terhadap sistem. JSON terstruktur plus aturan DESIGN.md eksplisit mengalahkan tebak-tebakan: "presisi butuh struktur, bukan sekadar prompt."
4. **Satu JSON, dua keluaran** — satu design system machine-readable menggerakkan desain Figma sekaligus kode frontend (mencapainya secara andal butuh model AI kelas frontier).
5. **Kenapa UX tetap penting** — AI membangun lebih cepat, tapi UX yang menentukan apakah orang paham dan benar-benar memakai produknya. "AI membangun lebih cepat. UX yang membuatnya berguna, dipahami, dan layak dipakai." Ditemani catatan engineering: AI bisa menghasilkan kode, tapi kualitas, review, dan keberlanjutan tetap milik manusia.

### Cara otaknya dibangun
Dari eksplorasi Figma yang main-main ke alur kerja AI yang bisa diulang: memetakan Figma API → mengubah design system jadi variabel dan token → JSON komponen + konten lengkap dengan aturannya → satu knowledge base → AI kustom dengan system prompt khusus → menghasilkan HTML/UI langsung ke Figma lewat script. *"Lebih cepat, lebih konsisten, kerja manual minimal — dari eksplorasi iseng ke sistem yang bisa dipakai ulang."*

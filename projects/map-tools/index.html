    <script>
        // Tailwind CSS Configuration for Inter font and class-based dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        primary: {
                            DEFAULT: 'hsl(var(--primary))',
                            foreground: 'hsl(var(--primary-foreground))',
                        },
                        secondary: {
                            DEFAULT: 'hsl(var(--secondary))',
                            foreground: 'hsl(var(--secondary-foreground))',
                        },
                        destructive: {
                            DEFAULT: 'hsl(var(--destructive))',
                            foreground: 'hsl(var(--destructive-foreground))',
                        },
                        muted: {
                            DEFAULT: 'hsl(var(--muted))',
                            foreground: 'hsl(var(--muted-foreground))',
                        },
                        accent: {
                            DEFAULT: 'hsl(var(--accent))',
                            foreground: 'hsl(var(--accent-foreground))',
                        },
                        popover: {
                            DEFAULT: 'hsl(var(--popover))',
                            foreground: 'hsl(var(--popover-foreground))',
                        },
                        card: {
                            DEFAULT: 'hsl(var(--card))',
                            foreground: 'hsl(var(--card-foreground))',
                        },
                    },
                    borderRadius: {
                        lg: `var(--radius)`,
                        md: `calc(var(--radius) - 2px)`,
                        sm: "calc(var(--radius) - 4px)",
                    },
                    keyframes: {
                        spin: {
                            to: { transform: 'rotate(360deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0'},
                            '100%': { transform: 'translateY(0)', opacity: '1'},
                        }
                    },
                    animation: {
                        spin: 'spin 1s linear infinite',
                        fadeIn: 'fadeIn 0.5s ease-out',
                        slideUp: 'slideUp 0.5s ease-out forwards',
                    },
                    // Add prose styles for dark mode if using Tailwind Typography
                    typography: (theme) => ({
                        DEFAULT: {
                          css: {
                            color: theme('colors.foreground'),
                            a: {
                              color: theme('colors.primary.DEFAULT'),
                              '&:hover': {
                                color: theme('colors.primary.DEFAULT / 0.8'),
                              },
                            },
                          },
                        },
                        invert: { 
                          css: {
                            color: theme('colors.foreground'), 
                            a: {

                              '&:hover': {
                                color: theme('colors.primary.DEFAULT / 0.8'),
                              },
                            },
                          },
                        },
                    }),
                }
            }
        }

            --destructive: 0 62.8% 30.6%; /* Dark red */

            --border: 240 3.7% 15.9%; /* Dark gray for borders */
            --input: 240 3.7% 15.9%;
            --ring: 240 4.9% 83.9%;

        @keyframes animatedBodyBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;

            color: hsl(var(--foreground));
            background-color: hsl(var(--background)); /* Fallback background */
            transition: color 0.3s ease, background-color 0.3s ease;
            
            background-size: 300% 300%;
            animation: animatedBodyBackground 25s ease infinite;

            background-image: linear-gradient(120deg,

                                            hsl(200, 50%, 97%), 
                                            hsl(220, 40%, 98%), 
                                            hsl(200, 50%, 97%), 
                                            hsl(210, 40%, 98%));
        }

        html.dark body {
            background-image: linear-gradient(120deg, 
                                            hsl(220, 15%, 12%), 
                                            hsl(230, 12%, 15%), 
                                            hsl(240, 15%, 12%), 
                                            hsl(230, 12%, 15%), 
                                            hsl(220, 15%, 12%));
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: hsl(var(--background) / 0.5); }
        ::-webkit-scrollbar-thumb { background: hsl(var(--muted-foreground) / 0.5); border-radius: var(--radius); }

    </style>
</head>

             // 🟥 ADD NEW MASTER PROMPT FUNCTIONS HERE, MATCHING THE 'actionGuideKey' 🟥
        };

        // API Call Function
        const callGeminiAPI = async (promptText, apiKey, selectedModel = 'gemini-2.0-flash') => {
            // This function calls the Google Generative AI API.
            // It requires a valid API key and the constructed prompt.
            if (!apiKey) {
                return Promise.reject({ message: "API Key is missing. Please enter and validate your API Key." });
            }
            
            const payload = {
                contents: [{ role: "user", parts: [{ text: promptText }] }]
            };
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    let errorMessage = `API Error (${response.status}): ${errorData.error?.message || 'Unknown API error'}`;
                    if (response.status === 400 && errorData.error?.message?.toLowerCase().includes("api key not valid")) {
                        errorMessage = "API Key is invalid. Please check your key and try again.";
                    } else if (response.status === 403) {
                         errorMessage = "API Key lacks permissions for the selected model or service.";
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    return result.candidates[0].content.parts[0].text.trim();
                } else if (result.promptFeedback && result.promptFeedback.blockReason) {
                     throw new Error(`Prompt blocked by API due to: ${result.promptFeedback.blockReason}. Please revise your prompt.`);
                } else if (result.candidates && result.candidates.length > 0 && result.candidates[0].finishReason === "SAFETY") {
                    throw new Error("Prompt blocked by API for safety reasons. Please revise your prompt.");
                } else {
                    console.error("Unexpected API response structure:", result);
                    throw new Error('Unexpected API response structure. No content found.');
                }
            } catch (error) {
                console.error('Error calling Gemini API:', error);
                throw error; // Re-throw to be handled by the calling function
            }
        };
        
        // Floating Action Buttons Component
        function FloatingActionButtons({ toggleTheme, currentTheme, resetAll }) {
            const [showScrollTop, setShowScrollTop] = useState(false);

            // Effect to show/hide scroll-to-top button based on scroll position
            useEffect(() => {
                const checkScrollTop = () => {
                    if (!showScrollTop && window.pageYOffset > 200){
                        setShowScrollTop(true);
                    } else if (showScrollTop && window.pageYOffset <= 200){
                        setShowScrollTop(false);
                    }
                };
                window.addEventListener('scroll', checkScrollTop);
                return () => window.removeEventListener('scroll', checkScrollTop); // Cleanup listener
            }, [showScrollTop]);

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-center space-y-2">

                            </svg>

                    >

                    >
                        <span className="text-xl">🔁</span>
                    </button>
                </div>
            );
        }
        
        // Main Application Component (wrapped with forwardRef for parent access to its methods)
        const MainApp = React.forwardRef((props, ref) => {
            // State variables for the application
            const [userContent, setUserContent] = useState(''); // Main text input from user
            const [specificFocus, setSpecificFocus] = useState(''); // Optional specific focus input for certain tools
            const [apiKey, setApiKey] = useState(''); // User's Google API Key
            const [isApiKeyValid, setIsApiKeyValid] = useState(false); // Tracks if API key has been validated
            const [apiKeyStatusMessage, setApiKeyStatusMessage] = useState({ text: '', type: '' }); // Message for API key validation status
            const [selectedTool, setSelectedTool] = useState(null); // Currently selected MAP tool object
            const [output, setOutput] = useState(''); // Output from the AI
            const [isLoading, setIsLoading] = useState(false); // Loading state for API calls
            const [error, setError] = useState(''); // Error messages
            const [currentAiModel, setCurrentAiModel] = useState('gemini-2.0-flash'); // Selected AI model
            const [outputViewMode, setOutputViewMode] = useState('raw'); // View mode for output: 'raw' or 'preview'

            // Handler for API Key validation
            const handleApiKeyValidation = async () => {
                if (!apiKey) {
                    setApiKeyStatusMessage({ text: '🔑 Please enter your Google API Key.', type: 'error' });
                    setIsApiKeyValid(false);
                    return;
                }
                setApiKeyStatusMessage({ text: '⏳ Validating API Key...', type: 'neutral' });
                setIsLoading(true); // Use general loading indicator
                try {
                    // A simple GET request to a model endpoint can validate the key's existence and basic permissions
                    const validationUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash?key=${apiKey}`;
                    const response = await fetch(validationUrl);
                    if (response.ok) {
                        setApiKeyStatusMessage({ text: '✅ API Key Validated! Tools are ready to use.', type: 'success' });
                        setIsApiKeyValid(true);
                    } else {
                        const errorData = await response.json();
                        let specificError = errorData.error?.message || `HTTP error ${response.status}`;
                         if (response.status === 400 && specificError.toLowerCase().includes("api key not valid")) {
                            specificError = "API Key is not valid. Please check your key.";
                        } else if (response.status === 403) {
                            specificError = "API Key lacks permissions for this model/service.";
                        }
                        setApiKeyStatusMessage({ text: `❌ Invalid API Key: ${specificError} You can get one at aistudio.google.com/app/apikey`, type: 'error' });
                        setIsApiKeyValid(false);
                    }
                } catch (err) {
                    console.error('API Key validation error:', err);
                    setApiKeyStatusMessage({ text: '❌ Error validating API Key. Check network or console.', type: 'error' });
                    setIsApiKeyValid(false);
                } finally {
                    setIsLoading(false);
                }
            };
            
            // Handler for selecting a MAP tool
            const handleToolSelect = (tool) => {
                if (!tool.isActive) return; // Do nothing if tool is not active
                setSelectedTool(tool);
                setOutput(''); // Clear previous output
                setError(''); // Clear previous error
                setSpecificFocus(''); // Reset specific focus input
                setOutputViewMode('raw'); // Reset output view to raw when a new tool is selected
            };

            // Handler for submitting content to the AI for processing
            const handleSubmit = async () => {
                if (!selectedTool || !userContent) {
                    setError('Please select a tool and enter content.');
                    return;
                }
                if (!isApiKeyValid) {
                    setError('API Key is not valid or has not been validated. Please enter and validate your API Key.');
                    const apiKeyInput = document.getElementById('userApiKeyInput'); // Attempt to focus API key input
                    if (apiKeyInput) {
                        apiKeyInput.focus();
                    }
                    return;
                }

                setIsLoading(true);
                setError('');
                setOutput('');
                setOutputViewMode('raw'); // Default to raw view for new output

                const masterPromptGenerator = masterPrompts[selectedTool.actionGuideKey];
                if (!masterPromptGenerator) {
                    setError(`Master prompt for tool "${selectedTool.name}" not found.`);
                    setIsLoading(false);
                    return;
                }
                
                const promptText = masterPromptGenerator(userContent, specificFocus);

                try {
                    const result = await callGeminiAPI(promptText, apiKey, currentAiModel);
                    setOutput(result);
                } catch (err) {
                    // Error is already an Error object from callGeminiAPI
                    setError(err.message || 'An error occurred while calling the API.');
                } finally {
                    setIsLoading(false);
                }
            };

            // Internal function to reset relevant states, exposed via ref
            const handleResetAllInternal = () => {
                setUserContent('');
                setSpecificFocus('');
                setSelectedTool(null);
                setOutput('');
                setError('');
                setIsLoading(false);
                setOutputViewMode('raw');
                // Note: API key and its validation status are intentionally NOT reset here
                // to avoid forcing the user to re-enter and re-validate frequently.
            };

            // Expose handleResetAll to parent component (AppContainer) via ref
            React.useImperativeHandle(ref, () => ({
                handleResetAll: handleResetAllInternal
            }));
            
            // Handler for copying output to clipboard
            const handleCopyToClipboard = () => {
                if (!output) return;
                // Using document.execCommand as a fallback for navigator.clipboard.writeText
                // which might have issues in certain iframe contexts.
                const textArea = document.createElement("textarea");
                textArea.value = output; // Always copy the raw output
                textArea.style.position = "fixed"; 
                textArea.style.top = "-9999px"; // Move out of screen
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                let success = false;
                try {
                    success = document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback copy: Failed to copy', err);
                }
                document.body.removeChild(textArea);

                const copyBtn = document.getElementById('copyOutputButton');
                if (copyBtn) {
                    const originalButtonTextContainer = copyBtn.querySelector('span:last-child'); // Get the span containing the text
                    const originalText = originalButtonTextContainer ? originalButtonTextContainer.textContent : 'Copy'; // Default to 'Copy'
                    
                    if (success) {
                        copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-2 text-green-500"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>Copied!</span>`;
                    } else {
                         copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-2 text-red-500"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path></svg> <span>Failed</span>`;
                         setError('Failed to copy output. Please copy manually.');
                    }
                    // Restore button text after 2 seconds
                    setTimeout(() => {
                         copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" class="w-4 h-4 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m9.75 11.375c.621 0 1.125-.504 1.125-1.125V7.875c0-.621-.504-1.125-1.125-1.125H15m-1.125-3.375a3.375 3.375 0 00-3.375-3.375h-1.5a3.375 3.375 0 00-3.375 3.375V7.5"></path></svg> <span>${originalText === 'Copied!' || originalText === 'Failed' ? 'Copy' : originalText }</span>`; // Restore original or default text
                    }, 2000);
                }
            };

            // Memoized value for selected tool details to avoid re-computation on every render
            const selectedToolDetails = useMemo(() => {
                if (!selectedTool) return null;
                // Iterate through combined data (including Featured Tools) to find the selected tool
                for (const category of mapFrameworkDataWithFeatured) { 
                    // Match by both name and actionGuideKey for more precise identification,
                    // especially since a tool might appear in "Featured" and its original category.
                    const toolDetail = category.activities.find(act => act.name === selectedTool.name && act.actionGuideKey === selectedTool.actionGuideKey);
                    if (toolDetail) return toolDetail;
                }
                return null; // Should not happen if selectedTool is valid
            }, [selectedTool]);

            // Function to render AI output based on view mode (raw or preview)
            const renderOutput = () => {
                if (isLoading) return null; // Don't render output area while loading new output

                if (outputViewMode === 'preview' && output) {
                    // Use marked.js to parse Markdown string to HTML
                    // Ensure marked.js is loaded via CDN in the <head>
                    const htmlOutput = marked.parse(output); 
                    // Render HTML using dangerouslySetInnerHTML. 
                    // Tailwind's Typography plugin classes (`prose dark:prose-invert`) are used for styling.
                    return <div className="prose dark:prose-invert max-w-none p-4 border border-input rounded-md bg-muted/10 dark:bg-muted/20 whitespace-normal break-words min-h-[200px] max-h-[calc(100vh-450px)] overflow-auto" dangerouslySetInnerHTML={{ __html: htmlOutput }} />;
                } else { // 'raw' mode or no output
                    // Render raw output in a <pre> tag to preserve formatting
                    return (
                        <pre 
                            className="min-h-[200px] max-h-[calc(100vh-450px)] p-4 rounded-md border border-input bg-muted/10 dark:bg-muted/20 text-sm text-foreground whitespace-pre-wrap overflow-auto font-mono break-words"
                        >
                            {output || "AI output will appear here..."}
                        </pre>
                    );
                }
            };

            // JSX for the MainApp component
            return (
                 <div className="w-full max-w-5xl lg:max-w-6xl my-auto space-y-6 animate-fadeIn">
                    {/* Header Section */}
                    <div className="bg-card text-card-foreground rounded-lg border border-border shadow-lg p-6 sm:p-8 text-center">
                        <h1 className="text-3xl sm:text-4xl font-bold tracking-tight text-primary">🛠️ MAP Framework Tools Processor 🛠️</h1>
                        <p className="text-muted-foreground mt-2 text-base max-w-xl mx-auto">
                            Methodically process your content using various AI tools based on the MAP Framework.
                        </p>
                    </div>

                    {/* API Key and Model Selection Card */}
                     <div className="bg-card text-card-foreground rounded-lg border border-border shadow-lg p-6 sm:p-8">
                        <h2 className="text-xl font-semibold mb-4 text-primary text-center">AI Settings</h2>
                        <div className="space-y-4">
                            {/* AI Model Selection Radio Buttons */}
                            <div id="modelSelection" className="flex flex-wrap justify-center items-center gap-3 mb-3">
                                <span className="text-sm font-medium text-foreground self-center mr-2">🤖 AI Model:</span>
                                <div>
                                    <input 
                                        type="radio" 
                                        name="aiModel" 
                                        id="geminiFlash" 
                                        value="gemini-2.0-flash" 
                                        className="sr-only peer" 
                                        checked={currentAiModel === 'gemini-2.0-flash'}
                                        onChange={(e) => setCurrentAiModel(e.target.value)}
                                    />
                                    <label htmlFor="geminiFlash" className="h-9 px-3 inline-flex items-center justify-center rounded-md text-xs border border-input bg-transparent transition-all hover:bg-accent hover:text-accent-foreground peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:border-primary cursor-pointer">Gemini 2.0 Flash</label>
                                </div>
                                <div>
                                    <input 
                                        type="radio" 
                                        name="aiModel" 
                                        id="gemini15Pro" 
                                        value="gemini-1.5-pro-latest" 
                                        className="sr-only peer"
                                        checked={currentAiModel === 'gemini-1.5-pro-latest'}
                                        onChange={(e) => setCurrentAiModel(e.target.value)}
                                    />
                                    <label htmlFor="gemini15Pro" className="h-9 px-3 inline-flex items-center justify-center rounded-md text-xs border border-input bg-transparent transition-all hover:bg-accent hover:text-accent-foreground peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:border-primary cursor-pointer">Gemini 1.5 Pro</label>
                                </div>
                            </div>

                            {/* API Key Input and Validation Button */}
                            <div className="flex flex-col sm:flex-row items-stretch gap-2 max-w-md mx-auto">
                                <label htmlFor="userApiKeyInput" className="sr-only">Google API Key</label>
                                <input 
                                    type="password" 
                                    id="userApiKeyInput" 
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    className="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50" 
                                    placeholder="🔑 Enter your Google API Key..."
                                />
                                <button 
                                    id="validateApiKeyButton" 
                                    onClick={handleApiKeyValidation}
                                    disabled={isLoading && apiKeyStatusMessage.text.includes("Validating")} // Disable while validating
                                    className="h-10 px-4 py-2 inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-green-600 text-primary-foreground hover:bg-green-600/90 dark:bg-green-500 dark:hover:bg-green-500/90 flex-shrink-0 !text-xs"
                                >
                                    {(isLoading && apiKeyStatusMessage.text.includes("Validating")) ? (
                                        <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                    ) : "Validate"}
                                </button>
                            </div>
                            {/* API Key Status Message */}
                            {apiKeyStatusMessage.text && (
                                <div 
                                    id="apiKeyStatusMessage" 
                                    className={`p-3 rounded-md border text-sm my-2 text-center max-w-md mx-auto animate-fadeIn
                                        ${apiKeyStatusMessage.type === 'success' ? 'border-green-500/50 text-green-700 dark:text-green-400 bg-green-500/10 dark:bg-green-500/20' : ''}
                                        ${apiKeyStatusMessage.type === 'error' ? 'border-red-500/50 text-red-700 dark:text-red-400 bg-red-500/10 dark:bg-red-500/20' : ''}
                                        ${apiKeyStatusMessage.type === 'neutral' ? 'border-border text-muted-foreground bg-muted/50' : ''}
                                    `}
                                >
                                    {apiKeyStatusMessage.text}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Main Content Area: Tool Selection and Input/Output */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* Tool Selection Column */}
                        <div className="md:col-span-1 bg-card text-card-foreground rounded-lg border border-border shadow-lg p-6 space-y-4 max-h-[calc(100vh-250px)] overflow-y-auto">
                            <h2 className="text-xl font-semibold text-primary mb-3 text-center sticky top-0 bg-card/80 backdrop-blur-sm py-2 -mt-6 pt-6 z-10">Select MAP Tool</h2>
                            {/* Iterate over mapFrameworkDataWithFeatured which includes "Featured Tools" first */}
                            {mapFrameworkDataWithFeatured.map(category => (
                                <div key={category.name} className="mb-4">
                                    <h3 className="text-lg font-medium text-foreground mb-2">{category.emoji} {category.name}</h3>
                                    <div className="space-y-2">
                                        {category.activities.map((tool, index) => ( 
                                            <button
                                                key={`${tool.name}-${category.name}-${index}`} // Unique key for each button instance
                                                onClick={() => handleToolSelect(tool)}
                                                // Disable button if tool is not active OR if general loading is active AND this tool is the one being processed
                                                disabled={!tool.isActive || (isLoading && selectedTool?.name === tool.name && selectedTool?.actionGuideKey === tool.actionGuideKey)}
                                                title={!tool.isActive ? "This tool is not active yet" : tool.name}
                                                className={`w-full text-left h-auto px-3 py-2 inline-flex items-center justify-start rounded-md text-sm border border-input bg-background hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 transition-all duration-150 ease-in-out
                                                    ${selectedTool?.name === tool.name && selectedTool?.actionGuideKey === tool.actionGuideKey ? 'tool-button-active shadow-md' : ''}
                                                    ${!tool.isActive ? 'opacity-60 cursor-not-allowed filter grayscale-[30%]' : 'cursor-pointer'}
                                                `}
                                            >
                                                <span className="mr-2 text-lg">{tool.emoji}</span>
                                                <span className="flex-grow">{tool.name}</span>
                                                {!tool.isActive && <span className="ml-auto text-xs text-muted-foreground/70">(Disabled)</span>}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Input and Output Column */}
                        <div className="md:col-span-2 bg-card text-card-foreground rounded-lg border border-border shadow-lg p-6 space-y-6">
                            {/* Main Content Input Area */}
                            <div>
                                <label htmlFor="userContentInput" className="block text-sm font-medium mb-2 text-foreground">📝 Enter Your Content:</label>
                                <textarea 
                                    id="userContentInput"
                                    value={userContent}
                                    onChange={(e) => setUserContent(e.target.value)}
                                    className="flex min-h-[150px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                                    rows="6"
                                    placeholder="Type or paste the content you want to process here..."
                                >
                                </textarea>
                            </div>

                            {/* Specific Focus Input Area (conditional) */}
                            {selectedToolDetails && selectedToolDetails.isActive && selectedToolDetails.specificFocusLabel && (
                                <div className="animate-slideUp">
                                    <label htmlFor="specificFocusInput" className="block text-sm font-medium mb-2 text-foreground">🎯 {selectedToolDetails.specificFocusLabel}:</label>
                                    <textarea 
                                        id="specificFocusInput"
                                        value={specificFocus}
                                        onChange={(e) => setSpecificFocus(e.target.value)}
                                        className="flex min-h-[80px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                                        rows="3"
                                        placeholder={`Enter specific criteria or focus for the "${selectedToolDetails.name}" tool... (Optional)`}
                                    >
                                    </textarea>
                                </div>
                            )}
                            
                            {/* Submit Button */}
                            <div className="text-center">
                                <button 
                                    onClick={handleSubmit}
                                    disabled={!selectedTool || isLoading || !isApiKeyValid || !userContent}
                                    className="h-11 px-6 py-2 inline-flex items-center justify-center rounded-md text-base font-semibold ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 w-full sm:w-auto disabled:opacity-60 disabled:cursor-not-allowed"
                                >
                                    {isLoading && selectedTool ? (
                                        <React.Fragment>
                                            <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-primary-foreground" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            <span>Processing...</span>
                                        </React.Fragment>
                                    ) : (
                                        selectedTool ? `Process with ${selectedTool.emoji} ${selectedTool.name}` : "Select a Tool to Process"
                                    )}
                                </button>
                            </div>

                            {/* Error Message Display */}
                            {error && <div className="text-destructive text-sm text-center p-3 border border-destructive/50 rounded-md bg-destructive/10 animate-fadeIn">{error}</div>}
                            
                            {/* Output Display Area (conditional) */}
                            {output && !isLoading && (
                                <div className="pt-4 animate-slideUp">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-semibold text-lg text-foreground">✅ Processing Result:</h3>
                                        {/* Output View Mode Tabs and Copy Button */}
                                        <div className="flex items-center space-x-2">
                                            <div className="flex space-x-1 border border-border rounded-md p-0.5 bg-muted/20 dark:bg-muted/30">
                                                <button 
                                                    onClick={() => setOutputViewMode('raw')}
                                                    title="View Raw Output"
                                                    className={`px-2.5 py-1 rounded text-xs transition-colors ${outputViewMode === 'raw' ? 'bg-primary text-primary-foreground shadow-sm' : 'hover:bg-accent'}`}
                                                >
                                                    Raw
                                                </button>
                                                <button 
                                                    onClick={() => setOutputViewMode('preview')}
                                                    title="Preview Markdown"
                                                    className={`px-2.5 py-1 rounded text-xs transition-colors ${outputViewMode === 'preview' ? 'bg-primary text-primary-foreground shadow-sm' : 'hover:bg-accent'}`}
                                                >
                                                    Preview
                                                </button>
                                            </div>
                                            <button 
                                                id="copyOutputButton"
                                                onClick={handleCopyToClipboard}
                                                title="Copy Result" 
                                                className="h-9 px-3 py-1.5 inline-flex items-center justify-center rounded-md text-xs font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-secondary text-secondary-foreground hover:bg-secondary/80 border border-input"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4 mr-2">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m9.75 11.375c.621 0 1.125-.504 1.125-1.125V7.875c0-.621-.504-1.125-1.125-1.125H15m-1.125-3.375a3.375 3.375 0 00-3.375-3.375h-1.5a3.375 3.375 0 00-3.375 3.375V7.5" />
                                                </svg>
                                                <span>Copy</span>
                                            </button>
                                        </div>
                                    </div>
                                    {/* Render output based on view mode */}
                                    {renderOutput()}
                                </div>
                            )}
                            {/* Loading Indicator for AI Processing */}
                             {isLoading && selectedTool && (
                                <div className="flex flex-col items-center justify-center py-10 text-muted-foreground animate-fadeIn">
                                    <svg className="animate-spin h-8 w-8 text-primary mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span>Processing with {selectedTool.emoji} {selectedTool.name}... Please wait.</span>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    {/* Footer Section */}
                    <div className="w-full bg-card text-card-foreground rounded-lg border border-border shadow-lg mt-6">
                        <footer className="text-center text-xs text-muted-foreground py-6 px-6 sm:px-8">
                            <p className="mb-2">This tool uses AI to process content. Please review all outputs for accuracy and alignment with your intent.</p>
                            <hr className="my-4 border-border"/>
                            <p>&copy; <span id="currentYear">{new Date().getFullYear()}</span> MAP Framework Processor. Inspired by various sources.</p>
                        </footer>
                    </div>
                </div>
            );
        });

        // Container Component for the main app and Floating Action Buttons
        function AppContainer() {
            // State for managing the current theme (light/dark)
            const [theme, setTheme] = useState(localStorage.getItem('mapFrameworkTheme') || 'light');
            
            // Function to toggle theme
            const toggleTheme = () => {
                setTheme(prevTheme => {
                    const newTheme = prevTheme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('mapFrameworkTheme', newTheme); // Save theme preference
                    document.documentElement.className = newTheme; // Apply theme class to HTML element
                    return newTheme;
                });
            };
            
            // Effect to apply the theme when the component mounts or theme state changes
            useEffect(() => {
                document.documentElement.className = theme;
            }, [theme]);

            // Ref to access MainApp's methods (like handleResetAll)
            const appRef = React.useRef();

            return (
                <React.Fragment>
                    {/* Render the MainApp component and pass the ref and current theme */}
                    <MainApp ref={appRef} currentThemeExternal={theme} />
                    {/* Render FloatingActionButtons and pass necessary props */}
                    <FloatingActionButtons 
                        toggleTheme={toggleTheme} 
                        currentTheme={theme} 
                        resetAll={() => appRef.current && appRef.current.handleResetAll()} // Call MainApp's reset function
                    />
                </React.Fragment>
            );
        }
        
        // Render the AppContainer to the DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppContainer />);
    </script>
</body>
</html>

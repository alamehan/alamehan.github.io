    <script>
        // Tailwind CSS Configuration for Inter font and class-based dark mode
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        background: 'hsl(var(--background))', // Main page background
                        foreground: 'hsl(var(--foreground))',
                        card: { // Card specific background
                            DEFAULT: 'hsl(var(--card-background))',
                            foreground: 'hsl(var(--card-foreground))',
                        },
                        primary: {
                            DEFAULT: 'hsl(var(--primary))',
                            foreground: 'hsl(var(--primary-foreground))',
                        },
                        secondary: {
                            DEFAULT: 'hsl(var(--secondary))',
                            foreground: 'hsl(var(--secondary-foreground))',
                        },
                        destructive: {
                            DEFAULT: 'hsl(var(--destructive))',
                            foreground: 'hsl(var(--destructive-foreground))',
                        },
                        muted: {
                            DEFAULT: 'hsl(var(--muted))',
                            foreground: 'hsl(var(--muted-foreground))',
                        },
                        accent: {
                            DEFAULT: 'hsl(var(--accent))',
                            foreground: 'hsl(var(--accent-foreground))',
                        },
                        popover: { // Popover might use card background or its own
                            DEFAULT: 'hsl(var(--popover-background))',
                            foreground: 'hsl(var(--popover-foreground))',
                        },
                    },
                    borderRadius: {
                        lg: `var(--radius)`,
                        md: `calc(var(--radius) - 2px)`,
                        sm: "calc(var(--radius) - 4px)",
                    },
                    keyframes: {
                        spin: {
                            to: { transform: 'rotate(360deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0'},
                            '100%': { transform: 'translateY(0)', opacity: '1'},
                        }
                    },
                    animation: {
                        spin: 'spin 1s linear infinite',
                        fadeIn: 'fadeIn 0.5s ease-out',
                        slideUp: 'slideUp 0.5s ease-out forwards',
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                          css: {
                            color: 'hsl(var(--foreground))', // Use CSS variable for text color
                            a: { color: 'hsl(var(--primary))', '&:hover': { color: 'hsl(var(--primary) / 0.8)' } },
                            strong: { color: 'hsl(var(--foreground))' },
                            h1: { color: 'hsl(var(--foreground))' },
                            h2: { color: 'hsl(var(--foreground))' },
                            h3: { color: 'hsl(var(--foreground))' },
                            h4: { color: 'hsl(var(--foreground))' },

                        },

    <style>
        /* CSS Variables for theming */
        :root {
            --background: 210 40% 96%; /* Light Blueish White Page Background */

            --primary: 240 5.9% 10%;

            --accent-foreground: 240 5.9% 10%;
            --destructive: 0 84.2% 60.2%; 
            --destructive-foreground: 0 0% 98%;
            --border: 240 5.9% 90%; 
            --input: 240 5.9% 90%;
            --ring: 240 5.9% 10%;
            --radius: 0.5rem;
        }

        .dark {
            --background: 220 15% 10%; /* Dark Blue Page Background */
            --foreground: 0 0% 98%; 
            --card-background: 240 10% 3.9%; /* Card Background (Dark) */
            --card-foreground: 0 0% 98%;
            --popover-background: 240 10% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 0 0% 98%; 
            --primary-foreground: 240 5.9% 10%; 
            --secondary: 240 3.7% 15.9%; 
            --secondary-foreground: 0 0% 98%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%; 
            --accent: 240 3.7% 15.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%; 
            --destructive-foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%; 
            --input: 240 3.7% 15.9%;
            --ring: 240 4.9% 83.9%;
        }

        @keyframes animatedBodyBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            color: hsl(var(--foreground));
            background-color: hsl(var(--background)); /* Fallback page background */
            transition: color 0.3s ease, background-color 0.3s ease;
            
            background-size: 300% 300%;
            animation: animatedBodyBackground 25s ease infinite;

            /* Light Mode Gradient - Light Blue Tones */
            background-image: linear-gradient(120deg, 
                                            hsl(200, 60%, 92%), /* Lighter Sky Blue */
                                            hsl(210, 65%, 94%), /* Pale Cornflower Blue */
                                            hsl(220, 60%, 92%), /* Lighter Periwinkle */
                                            hsl(210, 65%, 94%), 
                                            hsl(200, 60%, 92%));
        }

        html.dark body {
            /* Dark Mode Gradient - Dark Blue/Gray Tones */
            background-image: linear-gradient(120deg, 
                                            hsl(220, 20%, 12%), /* Dark Slate Blue */
                                            hsl(230, 18%, 15%), /* Darker Indigo */
                                            hsl(240, 20%, 12%), /* Dark Violet Blue */
                                            hsl(230, 18%, 15%), 
                                            hsl(220, 20%, 12%));
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: hsl(var(--card-background) / 0.5); } /* Adjusted to card background for contrast */
        ::-webkit-scrollbar-thumb { background: hsl(var(--muted-foreground) / 0.5); border-radius: var(--radius); }
        ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground) / 0.7); }
        button:disabled, input[type="radio"]:disabled + label { cursor: not-allowed !important; opacity: 0.6 !important; filter: grayscale(50%); }
        .tool-button-active { background-color: hsl(var(--primary)) !important; color: hsl(var(--primary-foreground)) !important; border-color: hsl(var(--primary)) !important; font-weight: 600; }
        .tool-button-active:hover { background-color: hsl(var(--primary) / 0.9) !important; }
        
        /* Ensure cards use their specific background color */
        .app-card {
            background-color: hsl(var(--card-background));
            color: hsl(var(--card-foreground));
            /* Softer shadow */
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07); 
        }
        .dark .app-card {
             box-shadow: 0 4px 6px -1px rgb(255 255 255 / 0.03), 0 2px 4px -2px rgb(255 255 255 / 0.03);
        }

    </style>
</head>

        // 🟥🟥🟥 SECTION 2: MASTER PROMPTS FOR AI TOOLS 🟥🟥🟥
        // TO ACTIVATE A NEW TOOL (after completing STEP 1 in 'baseMapFrameworkData'):
        // 1. Add a new entry (function) to this 'masterPrompts' object.
        // 2. The key for this new function MUST EXACTLY MATCH the 'actionGuideKey' you defined for the tool in STEP 1.

        // 4. The function MUST return a string that will be the complete prompt sent to the AI.
        // 5. CRITICAL: Design this prompt based on the corresponding "Action Guide" for that tool in the MAP Framework PDF.

        //

        /*

        */

        const masterPrompts = {
            // --- Category 1: Comprehension & Interpretation ---
            understand: (userContent, specificFocus) => `Objective: To achieve a comprehensive understanding of the provided content by applying the principles of a Universal Content Understanding Checklist. This involves identifying its core subject, main ideas, supporting details, purpose, audience, underlying assumptions, and key implications, as well as exploring its context and structure to grasp its fundamental meaning and concepts. The process will also consider any specific focus points or criteria provided by the user.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Understanding: "${specificFocus || 'None provided. Focus on a general comprehensive understanding.'}"
Output: A structured report detailing the comprehensive understanding of the User Content. This report will typically include: A concise summary of the content's core subject, main purpose, and overall message. An outline or list of the key ideas, arguments, themes, or findings presented. Identification and explanation of crucial supporting details, evidence, or examples. An analysis of the content's structure and organization. An assessment of the intended audience and the author's/source's perspective or tone. Clarification of key terminology. Discussion of relevant context. Identification of underlying assumptions. Exploration of potential implications. A list of insights gained. Specific findings related to any focus points provided.`,

            explore: (userContent, specificFocus) => `Objective: To conduct a thorough exploration of the provided content by applying the principles of a Universal Content Exploration Checklist. This involves actively investigating its specific details, subtle nuances, underlying ideas, implicit assumptions, internal and external connections, and potential implications, going beyond surface-level understanding to uncover deeper layers of meaning. The exploration will specifically address any specific focus points or criteria provided by the user.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Exploration: "${specificFocus || 'None provided. Conduct a general exploration for deeper meaning and nuances.'}"
Output: A detailed exploration report presenting the findings derived from investigating the User Content. This report will typically include: Identification and explanation of significant details and specific data points. Analysis of nuances in language, tone, style, or argument. Articulation of the underlying ideas, concepts, theories, or assumptions. Discussion of connections found within the content and potentially to external knowledge. Examination of potential implications or alternative interpretations. A set of clarifying or probing questions raised. Insights gained regarding subtleties and deeper layers. Specific findings related to any focus points.`,

            analyze: (userContent, specificFocus) => `Objective: To systematically analyze the provided content by applying the principles of a Universal Content Analysis Checklist. This involves decomposing the content into its constituent parts (such as arguments, themes, evidence, data points, structural elements) and meticulously examining the relationships between these parts to understand how they interact and contribute to the overall meaning, structure, purpose, or effect. The analysis will incorporate any specific focus points or criteria provided by the user.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Analysis: "${specificFocus || 'None provided. Perform a general analysis of components and their relationships.'}"
Output: A structured analysis report detailing the findings from dissecting the User Content. This report will typically include: Identification and description of the key components. Detailed examination of the significant relationships observed between these components. An explanation of how these components and their interrelationships contribute to the content's overall message, argument, or purpose. Insights derived from understanding the internal structure and dynamics. Specific findings related to any focus points.`,
            
            deconstruct: (userContent, specificFocus) => `Objective: To systematically deconstruct the provided content by applying the principles of a Universal Content Deconstruction Checklist. This involves disassembling its structure, arguments, narrative, or other elements into their core components and examining the techniques, logic, and methods used to assemble them, paying close attention to any specific focus points.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Deconstruction: "${specificFocus || 'Focus on identifying primary structural framework, fundamental building blocks, connective elements, and construction techniques.'}"
Output: A detailed deconstruction report outlining the architecture of the User Content. This should include: Identification of the primary structural framework or argumentative pattern. A breakdown into fundamental building blocks. Analysis of connective elements and transition techniques. Examination of specific construction techniques employed (rhetorical, logical, stylistic). An explanation of the assembly logic. Insights into how the construction contributes to meaning or impact. Identification of underlying assumptions revealed. Specific findings related to any focus points provided.`,

            interpret: (userContent, specificFocus) => `Objective: To interpret the provided content by applying the principles of a Universal Content Interpretation Checklist. This involves moving beyond surface-level comprehension to explain the content's deeper meaning, its significance within relevant contexts, and its potential implications or consequences. The interpretation will consider the interplay of text, context, assumptions, and potential effects, incorporating any specific focus points.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Interpretation: "${specificFocus || 'Focus on explaining deeper meaning, significance, and potential implications based on text and general context.'}"
Output: A structured interpretation report that explains the meaning, significance, and implications of the User Content. This will typically include: A brief summary of the content's literal message. Explanation of deeper or layered meanings (symbolism, subtext, tone, rhetoric). Assessment of the content's significance. Discussion of potential implications. Analysis of how context shapes interpretation. Identification of underlying assumptions/values. Consideration of ambiguities or multiple valid interpretations. Specific findings related to any focus points.`,

            contextualize: (userContent, specificFocus) => `Objective: To systematically contextualize the content by applying the principles of a Universal Content Contextualization Checklist. This involves explaining the relevant broader background (e.g., historical, cultural, social, authorial, disciplinary) and surrounding circumstances to enhance understanding, clarify meaning, reveal influences, and situate the content appropriately.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Contextualization: "${specificFocus || 'Provide general historical and cultural context relevant to the content.'}"
Output: A report detailing the relevant context for the User Content. This will include: Clear explanations of pertinent historical, cultural, social, political, economic, authorial/biographical, intellectual/disciplinary, technical, or geographical background factors. Clarification of terms, events, ideas, or references within the content that are context-dependent. Information that helps illuminate influences, significance, reception, or potential interpretations.`,

            identify_patterns: (userContent, specificFocus) => `Objective: To systematically identify, analyze, and describe recurring patterns within the provided content by applying the principles of a Universal Content Pattern Identification Checklist. This involves recognizing repeated elements such as themes, motifs, structural arrangements, linguistic features, data trends, argumentative strategies, or behavioral sequences, and understanding their frequency, distribution, and potential significance.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Pattern Identification: "${specificFocus || 'Identify recurring themes, structural arrangements, and linguistic features.'}"
Output: A structured report detailing the patterns identified. This will include: A clear description of each distinct pattern. Examples illustrating each pattern. Analysis of frequency and distribution. Characterization of the pattern's nature. Discussion of potential significance or function of the patterns. Specific findings related to any focus points.`,

            extract_insights: (userContent, specificFocus) => `Objective: To systematically extract and articulate significant insights, key takeaways, and core understandings derived from the provided content by applying the principles of a Universal Content Insight Extraction Checklist. This involves analyzing and synthesizing information to reveal deeper meaning, relevance, actionable conclusions, or crucial learnings.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Insight Extraction: "${specificFocus || 'Extract key takeaways and core understandings that offer significant meaning or relevance.'}"
Output: A concise report or list presenting the key insights extracted. This will feature: Clearly articulated takeaways capturing significant understandings or conclusions. Distilled core messages or essential learnings. Potentially, explanations of reasoning or evidence supporting each insight. Insights specifically addressing any focus points.`,

            discern_deeper_meaning: (userContent, specificFocus) => `Objective: To discern and articulate the deeper, subtle, implicit, and potentially profound meanings within the provided content by applying the principles of a Universal Content Deeper Meaning Checklist. This involves moving beyond literal comprehension to uncover subtext, symbolism, underlying assumptions, philosophical implications, and nuanced interpretations.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Discerning Deeper Meaning: "${specificFocus || 'Explore subtext, symbolism, and underlying philosophical or cultural assumptions.'}"
Output: A detailed report presenting the discerned deeper meanings. This will include: A foundational summary of literal meaning. Identification and explanation of subtle nuances. Analysis of implicit messages or subtext. Interpretation of symbolism or figurative devices. Exploration of underlying philosophical, ethical, cultural, or psychological assumptions and implications. Discussion of how context contributes. Articulation of profound insights. Specific findings related to any focus points.`,

            gain_wisdom: (userContent, specificFocus) => `Objective: To systematically derive profound, long-term understanding and applicable truths (wisdom) from the content by applying the principles of a Universal Content Wisdom Acquisition Checklist. This involves deep reflection, synthesis with broader knowledge, identification of universal themes, and understanding of underlying principles.
Input:
User Content: "${userContent}"
Specific Focus Points or Criteria for Gaining Wisdom: "${specificFocus || 'Identify universal themes, underlying principles, and potential life lessons or guiding principles.'}"
Output: A structured report detailing the wisdom gained. This will include: Identification of profound insights. Articulation of universal themes or timeless truths. Explanation of underlying principles revealed. Discussion of long-term significance or enduring value. Formulation of applicable truths or guiding principles. Reflections on how these insights might apply to broader human experience. Specific wisdom related to any focus points.`,

            formulate_critical_questions: (userContent, specificFocus) => `Objective: To systematically develop and articulate a set of critical and probing questions about the provided content. The aim is to formulate queries that challenge assumptions, explore implications, examine evidence and reasoning, consider alternative perspectives, and stimulate deeper understanding or further investigation.

Output: A structured list of critical and probing questions related to the User Content. Questions will be designed to: Uncover underlying assumptions. Scrutinize validity of evidence/reasoning. Explore potential implications. Consider alternative viewpoints. Clarify ambiguities. Investigate purpose/context/bias. Suggest avenues for further research. Questions may be categorized.`,

            // --- Category 2: Extraction & Elaboration ---
            extract_key_information: (userContent, specificFocus) => `Objective: To systematically identify and extract the most essential information, core facts, critical data points, main arguments, and key concepts from the provided User Content.

            expand: (userContent, specificFocus) => `Objective: To systematically expand the User Content by increasing its scope with related topics, broadening its breadth with more perspectives/details, or augmenting its volume with additional relevant information.

            catalog: (userContent, specificFocus) => `Objective: To guide the systematic listing, description, and organization of items within User Content (or the content itself if a collection) to create a catalog for easy identification and retrieval.

Output: A structured catalog (textual representation like a list or table). Includes: Catalog entries with specified metadata for each item, organized according to specified structure.`,

            index_content: (userContent, specificFocus) => `Objective: To guide the systematic creation of a comprehensive index (keyword and/or topic lists with locators) for User Content to facilitate efficient searching and retrieval.

            document_metadata: (userContent, specificFocus) => `Objective: To guide the systematic recording of descriptive, administrative, structural, and technical information (metadata) about User Content to enhance discoverability, manageability, and preservation.

Output: A structured set of metadata. Could be a separate record (XML, JSON, table concept) or description of embedded metadata. Organized by schema.`,

            backup: (userContent, specificFocus) => `Objective: To guide the systematic planning and conceptual execution of creating copies (backups) of User Content to prevent data loss and ensure recoverability.

Output: A comprehensive backup plan. Includes: Scope, schedule, retention, types, media/location recommendations, procedures for execution/verification/recovery testing (conceptual), security guidelines, log template. (AI cannot perform backup).`,

            version_control: (userContent, specificFocus) => `Objective: To guide the systematic planning and conceptual application of version control principles to User Content to track changes, facilitate collaboration, and ensure recoverability of previous states.

            log_history: (userContent, specificFocus) => `Objective: To guide the systematic planning and conceptual implementation of logging changes made to, or access events related to, User Content to create an auditable record.

            archive: (userContent, specificFocus) => `Objective: To guide the systematic planning and conceptual implementation of archiving User Content for long-term preservation, accessibility, and usability.

            preserve: (userContent, specificFocus) => `Objective: To guide the systematic planning and conceptual implementation of strategies to protect User Content from loss, decay, technological obsolescence, and other risks, ensuring long-term integrity, authenticity, accessibility, and usability.

            curate: (userContent, specificFocus) => `Objective: To guide the systematic selection, organization, contextualization, and ongoing maintenance of User Content (or items derived from it) to create a meaningful, valuable, and coherent collection for a specific purpose and target audience.

Output: A curated collection (conceptual) or detailed plan. Includes: Selected items, clear organizational structure, annotations/commentary/context, introduction/narrative framing the collection, conceptual maintenance plan.`,
        };

        // API Call Function (No changes needed here from previous version)
        const callGeminiAPI = async (promptText, apiKey, selectedModel = 'gemini-2.0-flash') => {
            if (!apiKey) {
                return Promise.reject({ message: "API Key is missing. Please enter and validate your API Key." });
            }
            const payload = { contents: [{ role: "user", parts: [{ text: promptText }] }] };
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    let errorMessage = `API Error (${response.status}): ${errorData.error?.message || 'Unknown API error'}`;
                    if (response.status === 400 && errorData.error?.message?.toLowerCase().includes("api key not valid")) {
                        errorMessage = "API Key is invalid. Please check your key and try again.";
                    } else if (response.status === 403) {
                         errorMessage = "API Key lacks permissions for the selected model or service.";
                    }
                    throw new Error(errorMessage);
                }
                const result = await response.json();
                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    return result.candidates[0].content.parts[0].text.trim();
                } else if (result.promptFeedback && result.promptFeedback.blockReason) {
                     throw new Error(`Prompt blocked by API due to: ${result.promptFeedback.blockReason}. Please revise your prompt.`);
                } else if (result.candidates && result.candidates.length > 0 && result.candidates[0].finishReason === "SAFETY") {
                    throw new Error("Prompt blocked by API for safety reasons. Please revise your prompt.");
                } else {
                    console.error("Unexpected API response structure:", result);
                    throw new Error('Unexpected API response structure. No content found.');
                }
            } catch (error) {
                console.error('Error calling Gemini API:', error);
                throw error;
            }
        };
        
        // Floating Action Buttons Component (No changes needed here)
        function FloatingActionButtons({ toggleTheme, currentTheme, resetAll }) {
            const [showScrollTop, setShowScrollTop] = useState(false);
            useEffect(() => {
                const checkScrollTop = () => {
                    if (!showScrollTop && window.pageYOffset > 200){ setShowScrollTop(true); } 
                    else if (showScrollTop && window.pageYOffset <= 200){ setShowScrollTop(false); }
                };
                window.addEventListener('scroll', checkScrollTop);
                return () => window.removeEventListener('scroll', checkScrollTop);
            }, [showScrollTop]);
            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            return (
                <div className="fixed bottom-6 right-6 z-50 flex flex-col items-center space-y-2">
                    {showScrollTop && (
                         <button onClick={scrollToTop} title="Scroll to Top" className="h-10 w-10 inline-flex items-center justify-center rounded-md border border-input bg-card text-card-foreground shadow-md transition-opacity hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 animate-fadeIn">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" /></svg>
                        </button>
                    )}
                    <button onClick={toggleTheme} title="Toggle Theme" className="h-10 w-10 inline-flex items-center justify-center rounded-md border border-input bg-card text-card-foreground shadow-md transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                        <span className="text-xl">{currentTheme === 'light' ? '☀️' : '🌙'}</span>
                    </button>
                    <button onClick={resetAll} title="Reset All Inputs" className="h-10 w-10 inline-flex items-center justify-center rounded-md border border-input bg-card text-card-foreground shadow-md transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
                        <span className="text-xl">🔁</span>
                    </button>
                </div>
            );
        }
        
        // Main Application Component
        const MainApp = React.forwardRef((props, ref) => {
            const [userContent, setUserContent] = useState('');
            const [specificFocus, setSpecificFocus] = useState('');
            const [apiKey, setApiKey] = useState('');
            const [isApiKeyValid, setIsApiKeyValid] = useState(false);

                    setApiKeyStatusMessage({ text: '🔑 Please enter your Google API Key.', type: 'error' });
                    setIsApiKeyValid(false); return;
                }
                setApiKeyStatusMessage({ text: '⏳ Validating API Key...', type: 'neutral' });
                setIsLoading(true);
                try {
                    const validationUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash?key=${apiKey}`;
                    const response = await fetch(validationUrl);
                    if (response.ok) {
                        setApiKeyStatusMessage({ text: '✅ API Key Validated! Tools are ready to use.', type: 'success' });
                        setIsApiKeyValid(true);
                    } else {
                        const errorData = await response.json();
                        let specificError = errorData.error?.message || `HTTP error ${response.status}`;
                         if (response.status === 400 && specificError.toLowerCase().includes("api key not valid")) {
                            specificError = "API Key is not valid. Please check your key.";
                        } else if (response.status === 403) {
                            specificError = "API Key lacks permissions for this model/service.";
                        }
                        setApiKeyStatusMessage({ text: `❌ Invalid API Key: ${specificError} You can get one at aistudio.google.com/app/apikey`, type: 'error' });
                        setIsApiKeyValid(false);
                    }
                } catch (err) {
                    setApiKeyStatusMessage({ text: '❌ Error validating API Key. Check network or console.', type: 'error' });
                    setIsApiKeyValid(false);
                } finally { setIsLoading(false); }
            };
            
            const handleToolSelect = (tool) => {
                if (!tool.isActive) return;
                setSelectedTool(tool);
                setOutput(''); setError(''); setSpecificFocus(''); setOutputViewMode('raw'); 
            };

                if (!selectedTool || !userContent) { setError('Please select a tool and enter content.'); return; }
                if (!isApiKeyValid) {

                    if (apiKeyInput) apiKeyInput.focus();
                    return;
                }
                setIsLoading(true); setError(''); setOutput(''); setOutputViewMode('raw');

                    setError(`Master prompt for tool "${selectedTool.name}" not found.`);
                    setIsLoading(false); return;
                }
                const promptText = masterPromptGenerator(userContent, specificFocus);
                try {
                    const result = await callGeminiAPI(promptText, apiKey, currentAiModel);
                    setOutput(result);
                } catch (err) { setError(err.message || 'An error occurred while calling the API.'); } 
                finally { setIsLoading(false); }
            };

            const handleResetAllInternal = () => {
                setUserContent(''); setSpecificFocus(''); setSelectedTool(null);
                setOutput(''); setError(''); setIsLoading(false); setOutputViewMode('raw');
            };

            React.useImperativeHandle(ref, () => ({ handleResetAll: handleResetAllInternal }));
            
            const handleCopyToClipboard = () => {
                if (!output) return;
                const textArea = document.createElement("textarea");
                textArea.value = output; 
                textArea.style.position = "fixed"; textArea.style.top = "-9999px"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus(); textArea.select();
                let success = false;
                try { success = document.execCommand('copy'); } 
                catch (err) { console.error('Fallback copy: Failed to copy', err); }
                document.body.removeChild(textArea);

                const copyBtn = document.getElementById('copyOutputButton');
                if (copyBtn) {
                    const originalButtonTextContainer = copyBtn.querySelector('span:last-child');
                    const originalText = originalButtonTextContainer ? originalButtonTextContainer.textContent : 'Copy';
                    if (success) {

                    } else {
                         copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 mr-2 text-red-500"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path></svg> <span>Failed</span>`;
                         setError('Failed to copy output. Please copy manually.');
                    }
                    setTimeout(() => {
                         copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" class="w-4 h-4 mr-2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m9.75 11.375c.621 0 1.125-.504 1.125-1.125V7.875c0-.621-.504-1.125-1.125-1.125H15m-1.125-3.375a3.375 3.375 0 00-3.375-3.375h-1.5a3.375 3.375 0 00-3.375 3.375V7.5"></path></svg> <span>${originalText === 'Copied!' || originalText === 'Failed' ? 'Copy' : originalText }</span>`;
                    }, 2000);
                }

                return null;

                if (isLoading) return null;

                                    <label htmlFor="gemini15Pro" className="h-9 px-3 inline-flex items-center justify-center rounded-md text-xs border border-input bg-transparent transition-all hover:bg-accent hover:text-accent-foreground peer-checked:bg-primary peer-checked:text-primary-foreground peer-checked:border-primary cursor-pointer">Gemini 1.5 Pro</label>

                                <textarea id="userContentInput" value={userContent} onChange={(e) => setUserContent(e.target.value)} className="flex min-h-[150px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" rows="6" placeholder="Type or paste the content you want to process here..."></textarea>
                            </div>

                            {selectedToolDetails && selectedToolDetails.isActive && selectedToolDetails.specificFocusLabel && (
                                <div className="animate-slideUp">
                                    <label htmlFor="specificFocusInput" className="block text-sm font-medium mb-2 text-foreground">🎯 {selectedToolDetails.specificFocusLabel}:</label>
                                    <textarea id="specificFocusInput" value={specificFocus} onChange={(e) => setSpecificFocus(e.target.value)} className="flex min-h-[80px] w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" rows="3" placeholder={`Enter specific criteria or focus for the "${selectedToolDetails.name}" tool... (Optional)`}></textarea>
                                </div>
                            )}
                            
                            <div className="text-center">
                                <button onClick={handleSubmit} disabled={!selectedTool || isLoading || !isApiKeyValid || !userContent} className="h-11 px-6 py-2 inline-flex items-center justify-center rounded-md text-base font-semibold ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 w-full sm:w-auto disabled:opacity-60 disabled:cursor-not-allowed">
                                    {isLoading && selectedTool ? (<React.Fragment><svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-primary-foreground" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Processing...</span></React.Fragment>) : (selectedTool ? `Process with ${selectedTool.emoji} ${selectedTool.name}` : "Select a Tool to Process")}
                                </button>
                            </div>

                            {error && <div className="text-destructive text-sm text-center p-3 border border-destructive/50 rounded-md bg-destructive/10 animate-fadeIn">{error}</div>}
                            
                            {output && !isLoading && (
                                <div className="pt-4 animate-slideUp">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-semibold text-lg text-foreground">✅ Processing Result:</h3>
                                        <div className="flex items-center space-x-2">
                                            <div className="flex space-x-1 border border-border rounded-md p-0.5 bg-muted/20 dark:bg-muted/30">
                                                <button onClick={() => setOutputViewMode('raw')} title="View Raw Output" className={`px-2.5 py-1 rounded text-xs transition-colors ${outputViewMode === 'raw' ? 'bg-primary text-primary-foreground shadow-sm' : 'hover:bg-accent'}`}>Raw</button>
                                                <button onClick={() => setOutputViewMode('preview')} title="Preview Markdown" className={`px-2.5 py-1 rounded text-xs transition-colors ${outputViewMode === 'preview' ? 'bg-primary text-primary-foreground shadow-sm' : 'hover:bg-accent'}`}>Preview</button>
                                            </div>
                                            <button id="copyOutputButton" onClick={handleCopyToClipboard} title="Copy Result" className="h-9 px-3 py-1.5 inline-flex items-center justify-center rounded-md text-xs font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-secondary text-secondary-foreground hover:bg-secondary/80 border border-input">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4 mr-2"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m9.75 11.375c.621 0 1.125-.504 1.125-1.125V7.875c0-.621-.504-1.125-1.125-1.125H15m-1.125-3.375a3.375 3.375 0 00-3.375-3.375h-1.5a3.375 3.375 0 00-3.375 3.375V7.5" /></svg>
                                                <span>Copy</span>
                                            </button>
                                        </div>
                                    </div>
                                    {renderOutput()}
                                </div>
                            )}
                             {isLoading && selectedTool && (
                                <div className="flex flex-col items-center justify-center py-10 text-muted-foreground animate-fadeIn">
                                    <svg className="animate-spin h-8 w-8 text-primary mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                    <span>Processing with {selectedTool.emoji} {selectedTool.name}... Please wait.</span>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <div className="app-card mt-6">
                        <footer className="text-center text-xs text-muted-foreground py-6 px-6 sm:px-8">
                            <p className="mb-2">This tool uses AI to process content. Please review all outputs for accuracy and alignment with your intent.</p>
                            <hr className="my-4 border-border"/>
                            <p>&copy; <span id="currentYear">{new Date().getFullYear()}</span> MAP Framework Processor. Inspired by various sources.</p>
                        </footer>
                    </div>
                </div>
            );
        });

        function AppContainer() {
            const [theme, setTheme] = useState(localStorage.getItem('mapFrameworkTheme') || 'light');
            const toggleTheme = () => {
                setTheme(prevTheme => {
                    const newTheme = prevTheme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('mapFrameworkTheme', newTheme);
                    document.documentElement.className = newTheme;
                    return newTheme;
                });
            };
            useEffect(() => { document.documentElement.className = theme; }, [theme]);
            const appRef = React.useRef();

            return (
                <React.Fragment>
                    <MainApp ref={appRef} currentThemeExternal={theme} />
                    <FloatingActionButtons 
                        toggleTheme={toggleTheme} 
                        currentTheme={theme} 
                        resetAll={() => appRef.current && appRef.current.handleResetAll()} 
                    />
                </React.Fragment>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppContainer />);
    </script>
</body>
</html>

<style>/* SDK base. Only --mds-*, --tf-space-*, and --tf-identity* variables (ARCHITECTURE.md §5). */
:root {
  /* Aliases of the design-system spacing scale (tokens.json → spacing). */
  --tf-space-2: 2px;
  --tf-space-4: 4px;
  --tf-space-6: 6px;
  --tf-space-8: 8px;
  --tf-space-10: 10px;
  --tf-space-12: 12px;
  --tf-space-14: 14px;
  --tf-space-16: 16px;
  --tf-space-20: 20px;
  --tf-space-24: 24px;
  --tf-space-32: 32px;
  --tf-space-40: 40px;
  --tf-space-48: 48px;
  --tf-space-64: 64px;
  --tf-space-80: 80px;
  --tf-space-96: 96px;
  /* Height of .mds-topbar. */
  --tf-topbar-h: 52px;
}

/* Scrollbars: thin, in the line color, on a clear track (PRODUCT.md §4.10). The design system has no recipe. */
:root { scrollbar-color: var(--mds-line-strong) transparent; }
* { scrollbar-width: thin; }

/* Automatic typography tidy rules across every tool and dossier page. */
h1, h2, h3, h4, h5 { text-wrap: balance; }
p, li, dd, figcaption { text-wrap: pretty; }
table { font-variant-numeric: tabular-nums; }

/* A rounded surface never scrolls itself; its body scrolls, inset from the corners (PRODUCT.md §4.10). The
   small padding keeps focus rings inside the scrolling body visible. */
.tf-scroll-body {
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  margin: -4px -8px;
  padding: 4px 8px;
}

.tf-skip {
  position: absolute;
  left: var(--tf-space-8);
  top: -48px;
  z-index: 90;
  padding: var(--tf-space-8) var(--tf-space-12);
  border-radius: var(--mds-r-md);
  background: var(--mds-surface);
  box-shadow: var(--mds-shadow-float);
}
.tf-skip:focus {
  top: var(--tf-space-8);
  outline: none;
  box-shadow: var(--mds-focus-ring);
}

.tf-link {
  color: var(--mds-primary-text);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-weight: 600;
}
.tf-link:focus-visible {
  outline: none;
  border-radius: var(--mds-r-xs);
  box-shadow: var(--mds-focus-ring);
}

.tf-block {
  display: block;
}

.tf-tone-info { color: var(--mds-info); }
.tf-tone-success { color: var(--mds-success); }
.tf-tone-warning { color: var(--mds-warning); }
.tf-tone-danger { color: var(--mds-danger); }

/* Identity tile: the one place the identity color fills a surface (D-06). */
.tf-tile {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: var(--mds-r-sm);
  display: inline-grid;
  place-items: center;
  background: var(--tf-identity);
  color: var(--mds-on-primary);
  box-shadow: var(--mds-shadow-raised);
}
.tf-tile-large {
  width: 44px;
  height: 44px;
  border-radius: var(--mds-r-lg);
}
.tf-tile-logo {
  flex: none;
  border-radius: var(--mds-r-sm);
  object-fit: contain;
}

@keyframes tf-fade-in {
  from { opacity: 0; }
}
@keyframes tf-rise-in {
  from { opacity: 0; transform: translateY(4px); }
}
@keyframes tf-dialog-in {
  from { opacity: 0; transform: translate(-50%, -48%) scale(0.98); }
}
@keyframes tf-drawer-in {
  from { opacity: 0; transform: translateX(24px); }
}

@media print {
  .tf-topbar, .tf-toasts, .tf-skip, .tf-banner { display: none !important; }
  body { background: none; }
}

/* The frame: top bar, rooms, notices, Info, Library, and the AI handoff. */
.tf-app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.tf-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--tf-topbar-h);
  gap: var(--tf-space-12);
}
.tf-identity { display: flex; align-items: center; gap: var(--tf-space-8); min-width: 0; }
.tf-tool-name {
  font-size: 14px;
  line-height: 20px;
  font-weight: 700;
  min-width: 0;
}
.tf-rooms { align-self: stretch; display: flex; margin-left: var(--tf-space-12); min-width: 0; }
.tf-rooms .mds-tabs { border-bottom: 0; align-items: stretch; }
.tf-rooms .mds-tab { height: var(--tf-topbar-h); }
.tf-topbar-end { margin-left: auto; display: flex; align-items: center; gap: var(--tf-space-8); flex: none; }

.tf-roombar { padding: var(--tf-space-6) var(--tf-space-12); background: var(--mds-surface); border-bottom: 1px solid var(--mds-line); }

.tf-banner { padding: var(--tf-space-12) var(--tf-space-16) 0; }

.tf-main { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; }
.tf-main:focus { outline: none; }

.tf-toasts {
  position: fixed;
  right: var(--tf-space-16);
  bottom: var(--tf-space-16);
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--tf-space-8);
  pointer-events: none;
}
.tf-toast { pointer-events: auto; animation: tf-rise-in var(--mds-dur-base) var(--mds-ease-out); max-width: min(420px, calc(100vw - 32px)); }
.tf-toast .action { background: transparent; }
/* The toast is always a dark surface; its icons use the light tones from the design-system toast recipe. */
.tf-toast-success { color: var(--mds-success); flex: none; }
.tf-toast-danger { color: var(--mds-danger); flex: none; }
@media (max-width: 767px) {
  .tf-toasts { left: var(--tf-space-16); align-items: stretch; }
  .tf-toast { max-width: none; }
}

.tf-working { display: flex; flex-direction: column; align-items: flex-start; gap: var(--tf-space-8); padding: var(--tf-space-16) 0; }
.tf-working .tf-progress { align-self: stretch; max-width: 360px; }
.tf-error-icon { background: var(--mds-danger-soft); color: var(--mds-danger); }

/* Info */
.tf-info-section { display: flex; flex-direction: column; gap: var(--tf-space-12); }
.tf-info-lead { font-size: 15px; line-height: 22px; color: var(--mds-ink); }
.tf-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--mds-ink-2); }
.tf-about-head { display: flex; align-items: center; gap: var(--tf-space-12); }
.tf-about-name { font-size: 17px; line-height: 24px; font-weight: 700; }
.tf-shortcuts dt { display: flex; align-items: center; }

/* Library */
.tf-library-section { display: flex; flex-direction: column; gap: var(--tf-space-10); }
/* Section labels sit below the drawer title and above item titles; a line between sections shows the structure. */
.tf-library-section + .tf-library-section { border-top: 1px solid var(--mds-line); padding-top: var(--tf-space-20); }
.tf-library-section > .mds-between > .mds-family-title { margin: 0; }
.tf-rename-row { flex-direction: column; align-items: stretch; gap: var(--tf-space-8); padding: var(--tf-space-8); }

/* AI handoff */
.tf-handoff { display: flex; flex-direction: column; gap: var(--tf-space-16); }
.tf-handoff-steps { margin: 0; list-style: none; }
.tf-handoff-steps .mds-step-copy b { white-space: normal; }
.tf-handoff-step { display: flex; flex-direction: column; gap: var(--tf-space-12); }
.tf-includes { margin: 0; padding-left: 18px; color: var(--mds-ink-2); display: flex; flex-direction: column; gap: 2px; }
.tf-roombar { display: flex; align-items: center; justify-content: space-between; gap: var(--tf-space-8); }
.tf-roombar-labels { display: flex; align-items: center; gap: var(--tf-space-6); }

/* Component additions the design system leaves to the product: positioning, scrims, and wiring. */

/* Floating surfaces (menus, popovers, tooltips) above dialogs. */
.tf-float {
  z-index: 70;
  animation: tf-rise-in var(--mds-dur-fast) var(--mds-ease-out);
}
.mds-menu.tf-float { max-height: min(420px, calc(100dvh - 32px)); display: flex; flex-direction: column; overflow: hidden; }
.tf-menu-body { margin: -2px; padding: 2px; }
.tf-menu-label { flex: 1; min-width: 0; }
.tf-menu-divider { margin: 4px 2px; }
.mds-menu-item { color: var(--mds-ink); cursor: pointer; outline: none; }
.mds-menu-item[data-highlighted] { background: var(--mds-well); }
.mds-menu-item[data-disabled] { color: var(--mds-ink-disabled); cursor: default; }
.mds-menu-item.tf-danger { color: var(--mds-danger); }

/* Scrim derived from the overlay material: the page shows through, dimmed and softened. */
.tf-scrim {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--mds-paper) 72%, transparent);
  backdrop-filter: blur(2px);
  animation: tf-fade-in var(--mds-dur-base) var(--mds-ease-out);
}

.tf-dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: 51;
  width: calc(100vw - 32px);
  max-height: calc(100dvh - 32px);
  overflow: hidden;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  gap: var(--tf-space-12);
  animation: tf-dialog-in var(--mds-dur-base) var(--mds-ease-out);
}
.tf-dialog:focus { outline: none; }
.tf-dialog-wide { max-width: 720px; }
.tf-dialog-stage {
  max-width: min(1160px, calc(100vw - 32px));
  height: min(820px, calc(100dvh - 32px));
}
.tf-dialog-fullscreen {
  max-width: calc(100vw - 24px);
  width: calc(100vw - 24px);
  max-height: calc(100dvh - 24px);
  height: calc(100dvh - 24px);
}
.tf-dialog-stage > .tf-dialog-body,
.tf-dialog-fullscreen > .tf-dialog-body {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.tf-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: var(--tf-space-12); flex-wrap: wrap; }
.tf-dialog-head-actions { display: flex; align-items: center; gap: var(--tf-space-8); flex-wrap: wrap; }
.tf-dialog-title { font-size: 21px; line-height: 28px; text-wrap: balance; }
.tf-dialog-text { color: var(--mds-ink-2); text-wrap: pretty; }
/* Only the body scrolls; with tabs, only the tab panel, so the title, tabs, and actions stay in place. */
.tf-dialog-body:has(> .tf-tabs-block) { overflow: hidden; display: flex; flex-direction: column; margin: 0; padding: 0; }
.tf-dialog-body > .tf-tabs-block { min-height: 0; display: flex; flex-direction: column; }
.tf-dialog-body > .tf-tabs-block > .tf-tab-panel { min-height: 0; overflow: auto; overscroll-behavior: contain; margin: 0 -8px; padding: var(--tf-space-16) 8px 4px; }
.tf-dialog-actions { display: flex; justify-content: flex-end; gap: var(--tf-space-8); flex-wrap: wrap; }

.tf-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 51;
  width: min(400px, 100vw);
  display: flex;
  flex-direction: column;
  gap: var(--tf-space-12);
  overflow: hidden;
  animation: tf-drawer-in var(--mds-dur-base) var(--mds-ease-out);
}
.tf-drawer:focus { outline: none; }
.tf-drawer-title { font-size: 15px; line-height: 20px; }
.tf-drawer-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--tf-space-24); padding: 2px; }
.tf-drawer-foot { display: flex; justify-content: flex-end; gap: var(--tf-space-8); }
@media (max-width: 767px) {
  .tf-drawer { width: 100vw; border-radius: 0; }
}

/* Selection treatment for tool choices, never the primary-action treatment. */
.mds-icon-btn.tf-selected { background: var(--mds-primary-soft); color: var(--mds-primary-text); }
a.mds-icon-btn { color: var(--mds-ink-2); }

.mds-tabs .mds-tab { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.tf-tab-icon { flex: none; }
.tf-tab-panel { padding-top: var(--tf-space-16); }
.tf-tab-panel:focus-visible { outline: none; border-radius: var(--mds-r-sm); box-shadow: var(--mds-focus-ring); }

.tf-row-button {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0;
  background: transparent;
  text-align: left;
  border-radius: var(--mds-r-sm);
}
.tf-row-button:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-row-button:hover b { color: var(--mds-primary-text); }
.mds-list-row.tf-current { background: var(--mds-primary-soft); border-radius: var(--mds-r-sm); }
.mds-list-row .main b { display: block; }
.mds-list.tf-flush > .mds-list-row { padding-left: 0; padding-right: 0; }

/* Cut text (PRODUCT.md §4.10): one line cut at the end, two lines clamped, or one line cut in the middle. */
.tf-trunc { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tf-trunc-2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; min-width: 0; overflow: hidden; overflow-wrap: anywhere; }
.tf-trunc-middle { display: flex; min-width: 0; white-space: nowrap; }
.tf-trunc-head { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tf-trunc-tail { flex: none; }
.mds-tooltip.tf-tooltip-text { display: block; max-width: min(320px, calc(100vw - 32px)); overflow-wrap: anywhere; }

.tf-search { width: 100%; }
.tf-search .mds-input::-webkit-search-cancel-button { display: none; }
.tf-search .mds-input { padding-right: 36px; }
.tf-search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: var(--mds-r-sm);
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--mds-ink-3);
}
.tf-search-clear:hover { background: var(--mds-well-hover); color: var(--mds-ink); }
.tf-search-clear:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }

.tf-mono-input { font-family: var(--mds-font-mono); font-size: 12px; line-height: 18px; }

.tf-inline-message { display: flex; align-items: flex-start; gap: 5px; margin: 0; }
.tf-inline-message > svg { flex: none; margin-top: 2px; }

.tf-alert > svg { flex: none; margin-top: 1px; }
.tf-alert-body { flex: 1; min-width: 0; }
.tf-alert-actions { margin-top: var(--tf-space-8); }
.tf-alert-dismiss {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: var(--mds-r-xs);
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--mds-ink-3);
}
.tf-alert-dismiss:hover { background: var(--mds-well-hover); color: var(--mds-ink); }
.tf-inline-confirm { align-items: center; flex-wrap: wrap; }
.tf-problems { margin: 4px 0 0; padding-left: 18px; }
.tf-problems li + li { margin-top: 2px; }

.tf-progress { display: flex; flex-direction: column; gap: 6px; }

.tf-code { position: relative; }
.tf-code code { font: inherit; }
/* The dark block keeps its corners; the code inside it scrolls. */
.tf-code .mds-code { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; }
.tf-code-scroll { display: block; max-height: 340px; overflow: auto; overscroll-behavior: contain; }
.tf-code-scroll:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-code-copy { position: absolute; top: 4px; right: 4px; }
.tf-code-copy .mds-icon-btn { color: var(--mds-on-dark); }
.tf-code-copy .mds-icon-btn:hover { background: color-mix(in srgb, var(--mds-on-dark) 14%, transparent); color: var(--mds-on-dark); }

.tf-filedrop { display: flex; flex-direction: column; gap: 6px; }
.tf-filedrop-body { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mds-upload.tf-drop-over { border-color: var(--mds-primary-line); background: var(--mds-primary-soft); }

.tf-disclosure-body { padding: 4px 2px 8px; }
.tf-disclosure-heading { margin: 0; font: inherit; }
.tf-disclosure-section .mds-family-title { margin: 0; }
.tf-disclosure-section > .tf-disclosure-body { padding: 0 0 4px; }
.tf-empty-actions { justify-content: center; }
.mds-empty h3, .tf-outcome-title { text-wrap: balance; }
.mds-help, .mds-error, .mds-alert, .mds-empty p { text-wrap: pretty; }

.mds-desc-list .tf-desc-row { display: contents; }

/* Markdown: document rhythm from design-system type sizes. */
.tf-markdown { display: flex; flex-direction: column; gap: 10px; color: var(--mds-ink-2); }
.tf-markdown h2, .tf-markdown h3, .tf-markdown h4, .tf-markdown h5 { color: var(--mds-ink); margin-top: 6px; }
.tf-markdown h2 { font-size: 17px; line-height: 24px; font-weight: 700; }
.tf-markdown h3 { font-size: 15px; line-height: 20px; font-weight: 700; }
.tf-markdown h4, .tf-markdown h5 { font-size: 13px; line-height: 18px; font-weight: 700; }
.tf-markdown ul, .tf-markdown ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.tf-markdown li > ul, .tf-markdown li > ol { margin-top: 4px; }
.tf-markdown code { font-family: var(--mds-font-mono); font-size: 11.5px; padding: 1px 4px; border-radius: var(--mds-r-xs); background: var(--mds-well); color: var(--mds-ink); }
.tf-markdown pre code { padding: 0; background: none; color: inherit; }
.tf-markdown blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--mds-line-strong); }
.tf-markdown hr { border: 0; height: 1px; background: var(--mds-line); width: 100%; }
.tf-markdown strong { color: var(--mds-ink); }
.tf-md-link { color: var(--mds-primary-text); font-weight: 600; }
.tf-markdown .mds-table { min-width: 0; }
.tf-markdown .mds-table th, .tf-markdown .mds-table td { vertical-align: top; font-variant-numeric: tabular-nums; }
.tf-markdown .mds-table th { white-space: nowrap; text-wrap: balance; }
.tf-markdown .mds-table td { white-space: normal; text-wrap: pretty; }
.mds-table td.tf-td-nowrap, .mds-table th.tf-td-nowrap { white-space: nowrap; text-wrap: nowrap; }

/* Groups and segmented controls are as wide as their content, also inside column layouts. */
.tf-fit { width: max-content; max-width: 100%; }
.tf-library-section > .mds-btn { align-self: flex-start; }
.tf-button-link { text-decoration: none; }
.mds-seg.tf-fit { flex-wrap: wrap; }
.mds-seg.tf-fit button { flex: none; }
.mds-seg:not(.mds-seg-icon-only) button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

/* Tree: one flat list of rows in the page flow, so depth is an indent instead of nested containers. */
.tf-tree { position: relative; gap: 0; }
.tf-tree-item { position: relative; padding-left: calc(var(--tf-depth, 0) * 18px); }
/* Keyboard moves and jumps land below the sticky top bar and a context line (PRODUCT.md §4.10). */
.tf-tree-row { scroll-margin: calc(var(--tf-topbar-h) + 48px) 0 24px; }
.tf-tree-row { align-items: flex-start; height: auto; padding-top: 6px; padding-bottom: 6px; gap: 6px; cursor: pointer; outline: none; }
.tf-tree-row:focus-visible { box-shadow: var(--mds-focus-ring); }
.tf-tree-chevron { width: 18px; height: 20px; flex: none; display: grid; place-items: center; color: var(--mds-ink-3); border-radius: var(--mds-r-xs); }
.tf-tree-chevron:hover { background: var(--mds-well-hover); color: var(--mds-ink); }
.tf-tree-content { flex: 1; min-width: 0; }
.tf-tree-item.tf-dimmed .tf-tree-content { opacity: 0.42; }
/* Branch structure, not indentation alone (design-system/06-QUALITY-GATE.md): a guide line under each ancestor's
   chevron, as in .mds-tree-children, and a tick into the row. Rows are 18px per level; chevrons sit 8px in. */
.tf-tree-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--tf-depth, 0) * 18px);
  background: repeating-linear-gradient(to right, transparent 0 16.5px, var(--mds-line-strong) 16.5px 17.5px, transparent 17.5px 18px);
  pointer-events: none;
}
.tf-tree-item:not([data-root])::after {
  content: "";
  position: absolute;
  left: calc((var(--tf-depth, 0) - 1) * 18px + 17px);
  top: 16px;
  width: 9px;
  border-top: 1px solid var(--mds-line-strong);
  pointer-events: none;
}

/* Command palette: the design-system command menu, centered as a dialog. */
.tf-palette {
  position: fixed;
  left: 50%;
  top: 12vh;
  z-index: 51;
  width: min(560px, calc(100vw - 32px));
  max-width: none;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: tf-rise-in var(--mds-dur-fast) var(--mds-ease-out);
}
.tf-palette:focus { outline: none; }
.tf-palette-list { max-height: min(420px, 60dvh); }
.tf-palette-empty { padding: 10px 8px; }
.mds-command-item { cursor: pointer; color: var(--mds-ink); }
.mds-command-item.tf-active { background: var(--mds-well); }

/* Toolbar: the bar keeps its corners; its controls scroll sideways inside it when they do not fit. */
.mds-toolbar.tf-toolbar { overflow: hidden; }
.tf-toolbar-track { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow-x: auto; overscroll-behavior-inline: contain; margin: -2px; padding: 2px; }

/* Listbox: the options scroll inside the floating surface. */
.mds-listbox.tf-listbox { overflow: visible; max-height: none; }
.tf-listbox-body { max-height: 208px; overflow: auto; overscroll-behavior: contain; margin: -2px; padding: 2px; }
/* The floating listbox (ListPopup): Radix positions its wrapper, so the design-system listbox sits in flow inside it,
   as wide as its field and never taller than the room left on screen. */
.mds-listbox.tf-list-popup { position: relative; top: auto; left: auto; right: auto; width: var(--radix-popper-anchor-width); min-width: 180px; }
.tf-list-popup .tf-listbox-body { max-height: min(208px, calc(var(--radix-popper-available-height, 220px) - 12px)); }

/* Forms and inputs, batch 1 (SDK 0.6.0) */
.mds-tag-remove:focus-visible, .mds-rating button:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-rating-star { width: 32px; height: 32px; display: grid; place-items: center; color: var(--mds-line-strong); }
.tf-rating-star.on { color: var(--mds-warning); }
.tf-rating-star.on .mini-icon { fill: currentColor; }
.tf-fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.tf-fieldset > legend { padding: 0; margin-bottom: var(--tf-space-10); }
.tf-error-summary:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-error-summary a { text-decoration: underline; text-underline-offset: 2px; }
.tf-image-well { min-height: 140px; }
.tf-image-well.tf-image-filled { padding: var(--tf-space-8); }
.tf-image-preview { display: block; max-width: 100%; max-height: 220px; border-radius: var(--mds-r-md); object-fit: contain; }

/* Selection, batch 2 (SDK 0.6.0) */
.tf-radio-group > legend { margin-bottom: var(--tf-space-6); }
.tf-radio-options { gap: var(--tf-space-4); }
.mds-checkrow.tf-disabled, .tf-range.tf-disabled { opacity: 0.48; }
.tf-slider { touch-action: none; cursor: pointer; }
.tf-slider-inline { display: flex; align-items: center; gap: var(--tf-space-10); width: 100%; min-width: 0; }
.tf-slider-inline > .tf-slider { flex: 1; min-width: 0; }
.tf-slider-inline > .value { font: 500 11.5px/1 var(--mds-font-mono); color: var(--mds-ink-2); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.tf-slider-inline.disabled { opacity: 0.48; }
.tf-knob { cursor: grab; }
.tf-knob:focus-visible { outline: none; box-shadow: var(--mds-shadow-knob), var(--mds-focus-ring); }
.mds-property-row.disabled .tf-slider, .tf-slider-inline.disabled .tf-slider, .tf-range.tf-disabled .tf-slider { cursor: default; }
.tf-stepper-row { display: flex; align-items: center; gap: var(--tf-space-10); flex-wrap: wrap; }
.mds-num-stepper button { color: var(--mds-ink); }
.mds-num-stepper button:disabled { color: var(--mds-ink-disabled); background: transparent; cursor: default; }
.mds-num-stepper button:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
@media (pointer: coarse) {
  .tf-knob::before { content: ""; position: absolute; inset: -11px; }
  .mds-num-stepper { grid-template-columns: 44px 42px 44px; }
  .mds-num-stepper button { height: 44px; }
}

/* Navigation and actions, batch 3 (SDK 0.6.0) */
.mds-split-main:focus-visible, .mds-split-caret:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--mds-on-primary); }
.mds-fab:focus-visible { outline: none; box-shadow: var(--mds-shadow-primary), var(--mds-focus-ring); }
.mds-nav-item { width: 100%; min-width: 0; text-align: left; }
/* A rail is as wide as its icons, whatever column it sits in. */
.tf-nav-rail { width: max-content; }
.tf-nav-rail .mds-icon-btn[data-tf-current] { background: var(--mds-primary-soft); color: var(--mds-primary-text); box-shadow: none; }
.mds-bottom-nav button:focus-visible, .mds-pagebtn:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.mds-bottom-nav .tf-bottom-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0; }
.tf-breadcrumb { min-width: 0; }
.tf-crumb-item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.tf-crumb { display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 220px; }
.tf-crumb-link { padding: 0; background: transparent; color: var(--mds-ink-3); border-radius: var(--mds-r-xs); }
.tf-crumb-link:hover { color: var(--mds-primary-text); text-decoration: underline; }
.tf-crumb-link:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-crumb-sep { flex: none; color: var(--mds-ink-disabled); }
.mds-pagebtn:disabled { color: var(--mds-ink-disabled); background: transparent; box-shadow: none; cursor: default; }
.tf-page-gap { width: 24px; display: grid; place-items: center; color: var(--mds-ink-3); }
.tf-journey { margin: 0; padding-left: 0; list-style: none; }
.tf-journey .mds-step-copy b { white-space: normal; }
.mds-anchor-nav a:hover { color: var(--mds-ink); }
.mds-anchor-nav a:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
/* Column view: side-by-side columns on one still surface; the track scrolls sideways inside it. */
.tf-column-view { border-radius: var(--mds-r-xl); background: var(--mds-surface); box-shadow: var(--mds-shadow-panel); overflow: hidden; }
.tf-column-track { display: flex; min-height: 220px; max-height: 360px; overflow-x: auto; overscroll-behavior-inline: contain; }
.tf-column { flex: 0 0 200px; min-width: 0; padding: var(--tf-space-6); border-right: 1px solid var(--mds-line); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; }
.tf-column-detail { flex: 1 0 220px; padding: var(--tf-space-14); background: var(--mds-surface-subtle); border-right: 0; }
.tf-column-row { width: 100%; min-height: var(--mds-row-h); padding: 0 8px; display: flex; align-items: center; gap: 6px; border-radius: var(--mds-r-sm); background: transparent; color: var(--mds-ink-2); font-size: 12.5px; text-align: left; }
.tf-column-row > .tf-trunc { flex: 1; }
.tf-column-row:hover { background: var(--mds-well); color: var(--mds-ink); }
.tf-column-row.current { background: var(--mds-primary-soft); color: var(--mds-primary-text); }
.tf-column-row:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-column-chevron { flex: none; color: var(--mds-ink-3); }

/* Data display, batch 4 (SDK 0.6.0) */
.tf-card { display: flex; flex-direction: column; gap: var(--tf-space-6); min-width: 0; }
.tf-card-title { font-size: 12.5px; min-width: 0; }
.tf-card-footer { margin-top: var(--tf-space-6); }
/* Table: the surface keeps its corners; a wide or tall table scrolls inside it. */
/* The scroll track sits inside the surface's padding, so its scrollbar never reaches the rounded corners. */
.mds-table-wrap.tf-table { overflow: hidden; padding: 6px 4px; }
.tf-table-scroll { overflow: auto; overscroll-behavior-inline: contain; overscroll-behavior-y: auto; }
.tf-table-scroll:focus-visible { outline: 2px solid var(--mds-primary-line); outline-offset: -2px; }
.tf-sticky-head thead th { position: sticky; top: 0; z-index: 1; background: var(--mds-surface); }
.mds-table .tf-cell { max-width: 280px; }
.mds-table .tf-end { text-align: right; font-variant-numeric: tabular-nums; }
.tf-sort { display: inline-flex; align-items: center; gap: 4px; padding: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; border-radius: var(--mds-r-xs); }
.tf-sort:hover, .tf-sort-active { color: var(--mds-ink); }
.tf-sort:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.mds-table .tf-select-cell { width: 36px; padding-right: 0; }
.mds-table .tf-row-chosen td { background: var(--mds-primary-soft); }
.mds-table td.tf-table-empty { padding: 24px 12px; text-align: center; color: var(--mds-ink-3); white-space: normal; }
.tf-timeline { margin: 0; list-style: none; }
.mds-timeline-item { position: relative; }
.tf-avatar { flex: none; overflow: hidden; }
.tf-avatar img { width: 100%; height: 100%; object-fit: cover; }
.tf-avatar-sm { width: 28px; height: 28px; font-size: 11px; }
.tf-status-neutral::before { background: var(--mds-ink-3); }
.tf-activity { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--tf-space-6); }
.tf-activity-legend { justify-content: center; }
.tf-chart-single i:nth-child(2n) { background: var(--mds-primary); }
.mds-legend-row i.primary { background: var(--mds-primary); }
.tf-calendar { width: max-content; max-width: 100%; display: flex; flex-direction: column; gap: var(--tf-space-8); }
.tf-calendar-row { grid-column: 1 / -1; display: grid; grid-template-columns: inherit; gap: inherit; }
.mds-calendar .day:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.mds-calendar .day.tf-today:not(.on) { box-shadow: inset 0 0 0 1px var(--mds-line-strong); }
.mds-calendar .day:disabled { color: var(--mds-ink-disabled); background: transparent; cursor: default; }
@media (pointer: coarse) {
  .tf-calendar .mds-calendar { grid-template-columns: repeat(7, 40px); }
  .tf-calendar .mds-calendar .day { width: 40px; height: 40px; }
}

/* Feedback and overlays, batch 5 (SDK 0.6.0) */
.tf-bottom-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 51;
  width: min(640px, 100%);
  max-height: min(85dvh, 640px);
  margin-inline: auto;
  padding: var(--tf-space-8) var(--tf-space-16) var(--tf-space-16);
  border-radius: var(--mds-r-2xl) var(--mds-r-2xl) 0 0;
  display: flex;
  flex-direction: column;
  gap: var(--tf-space-12);
  overflow: hidden;
  animation: tf-sheet-in var(--mds-dur-base) var(--mds-ease-out);
}
.tf-bottom-sheet:focus { outline: none; }
.tf-sheet-handle { width: 36px; height: 4px; margin: 0 auto; border-radius: var(--mds-r-pill); background: var(--mds-line-strong); }
.tf-sheet-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--tf-space-12); }
@keyframes tf-sheet-in { from { opacity: 0; transform: translateY(24px); } }
.tf-hover-card { max-width: 280px; display: flex; flex-direction: column; gap: var(--tf-space-6); }
.tf-lightbox { max-width: min(960px, calc(100vw - 32px)); }
.tf-lightbox-scrim { background: color-mix(in srgb, var(--tw-slate-950) 72%, transparent); }
.tf-lightbox-figure { margin: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: var(--tf-space-8); }
.tf-lightbox-figure img { max-width: 100%; max-height: min(70dvh, 640px); border-radius: var(--mds-r-md); object-fit: contain; }
.tf-tour { display: flex; flex-direction: column; gap: var(--tf-space-6); }
.tf-tour:focus { outline: none; }
.tf-tour[data-side="bottom"]::after { top: -6px; bottom: auto; box-shadow: -2px -2px 3px color-mix(in srgb, var(--tw-slate-950) 8%, transparent); }
.tf-tour-actions { justify-content: flex-end; margin-top: var(--tf-space-4); }
.tf-bell { position: relative; }
/* Primary text on the soft primary fill: the design system's tested pair, unlike white text on blue-500. */
.tf-bell-count {
  position: absolute;
  top: 1px;
  right: 1px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--mds-r-pill);
  background: var(--mds-primary-soft);
  color: var(--mds-primary-text);
  box-shadow: 0 0 0 2px var(--mds-surface);
  font: 700 10px/16px var(--mds-font-mono);
  text-align: center;
}
.tf-notifications { width: min(360px, calc(100vw - 24px)); max-height: min(480px, var(--radix-popover-content-available-height, 480px)); padding: var(--tf-space-10); display: flex; flex-direction: column; gap: var(--tf-space-8); overflow: hidden; }
.tf-notifications-body { flex: 1 1 auto; }
.tf-notification-actions { gap: var(--tf-space-4); margin-top: var(--tf-space-4); }
.tf-skeleton { display: flex; flex-direction: column; gap: var(--tf-space-8); }
.tf-outcome { display: flex; flex-direction: column; align-items: center; gap: var(--tf-space-4); }
.tf-outcome-title { font-size: 15px; line-height: 22px; }
.mds-outcome-icon.tf-outcome-danger { background: var(--mds-danger-soft); color: var(--mds-danger); }
.mds-outcome-icon.tf-outcome-info { background: var(--mds-info-soft); color: var(--mds-info); }

/* Compounds, batch 6 (SDK 0.6.0) */
.tf-picker-trigger { cursor: pointer; }
.mds-date-popover.tf-float { width: max-content; max-width: calc(100vw - 24px); }
.mds-date-popover .tf-calendar { margin-inline: auto; }
.tf-color-popover { padding: var(--tf-space-8); border-radius: var(--mds-r-xl); background: var(--mds-surface); box-shadow: var(--mds-shadow-float); }
.tf-color-trigger { padding-left: var(--tf-space-8); }
.tf-color-chip { width: 20px; height: 20px; flex: none; margin-right: var(--tf-space-8); border-radius: var(--mds-r-xs); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tw-slate-950) 12%, transparent); }
.mds-shade-grid button:focus-visible { outline: 2px solid var(--mds-ink); outline-offset: 2px; }
.mds-shade-grid button .tf-check-dark { color: var(--tw-slate-900); }
.tf-column-settings { width: min(300px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: var(--tf-space-8); }
.tf-column-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.tf-column-item { min-height: var(--mds-row-h); display: flex; align-items: center; justify-content: space-between; gap: var(--tf-space-8); }
.tf-column-order { flex: none; gap: 2px; }
.tf-rte-bar { align-items: center; flex-wrap: wrap; }
.tf-rte-group { display: inline-flex; align-items: center; gap: 3px; }
.tf-rte-mode { margin-left: auto; }
/* The text grows with its content, so the rounded editor never holds a scrollbar; the page scrolls instead. */
.tf-rte-input { display: block; width: 100%; min-height: 160px; border: 0; outline: 0; resize: none; field-sizing: content; background: transparent; color: var(--mds-ink); font: inherit; line-height: 20px; }
.tf-rte:focus-within { box-shadow: var(--mds-shadow-panel), var(--mds-focus-ring); }
.tf-rte-preview { min-height: 160px; }
/* The design system's day hover outranks its chosen day, which then loses its fill and its white number; the chosen
   and range days keep their look under the pointer. */
.mds-calendar .day.on:hover { background: var(--mds-primary); color: var(--mds-on-primary); }
.mds-calendar .day.range:hover { background: var(--mds-primary-soft); color: var(--mds-primary-text); }
.tf-column-item .mds-checkrow { align-items: center; min-height: 0; }
.tf-column-settings > .mds-btn { align-self: flex-start; }
/* Picker icons sit where the select chevron does, but a calendar or palette never turns when the picker opens. */
.tf-picker-icon { position: absolute; right: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); pointer-events: none; color: var(--mds-ink-3); }

/* CodeEditor: rounded well surface with an inner scroll body, synchronized line numbers, and line markers (SDK 0.8.0). */
.tf-code-editor-wrap { display: flex; flex-direction: column; gap: var(--tf-space-6); }
.tf-code-editor {
  border-radius: var(--mds-r-md);
  background: var(--mds-well);
  box-shadow: var(--mds-shadow-well);
  overflow: hidden;
  padding: 2px;
}
.tf-code-editor:focus-within { box-shadow: var(--mds-shadow-well), 0 0 0 2px var(--mds-primary-line); }
.tf-code-editor.tf-invalid { box-shadow: var(--mds-shadow-well), 0 0 0 2px var(--mds-danger); }
.tf-code-editor.tf-disabled { opacity: 0.48; }
.tf-code-editor-scroll { max-height: 320px; overflow-y: auto; overscroll-behavior: contain; }
.tf-code-editor-stage { position: relative; font-family: var(--mds-font-mono); font-size: 12px; line-height: 19px; }
.tf-code-editor-backdrop { padding: 8px 0; pointer-events: none; user-select: none; }
.tf-code-line { display: flex; align-items: flex-start; min-height: 19px; padding-right: 10px; }
.tf-code-line-warning { background: var(--mds-warning-soft); box-shadow: inset 3px 0 0 var(--mds-warning); }
.tf-code-line-danger { background: var(--mds-danger-soft); box-shadow: inset 3px 0 0 var(--mds-danger); }
.tf-code-gutter {
  flex: 0 0 40px;
  padding: 0 8px 0 6px;
  text-align: right;
  color: var(--mds-ink-2);
  font-variant-numeric: tabular-nums;
  border-right: 1px solid var(--mds-line);
  margin-right: 8px;
}
.tf-code-mirror { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; visibility: hidden; }
.tf-code-editor-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 8px 10px 8px 48px;
  border: 0;
  outline: none;
  resize: none;
  overflow: hidden;
  background: transparent;
  color: var(--mds-ink);
  caret-color: var(--mds-ink);
  font-family: var(--mds-font-mono);
  font-size: 12px;
  line-height: 19px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.tf-code-editor-input::placeholder { color: var(--mds-ink-3); }
.tf-code-markers { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.tf-code-marker-btn {
  display: inline-flex;
  align-items: flex-start;
  gap: 6px;
  padding: 2px 6px;
  border-radius: var(--mds-r-xs);
  background: var(--mds-warning-soft);
  color: var(--mds-ink);
  font-size: 11.5px;
  line-height: 16px;
  text-align: left;
  cursor: pointer;
}
.tf-code-marker-btn.tf-danger { background: var(--mds-danger-soft); }
.tf-code-marker-btn:hover { box-shadow: inset 0 0 0 1px var(--mds-line-strong); }
.tf-code-marker-btn:focus-visible { outline: none; box-shadow: var(--mds-focus-ring); }
.tf-code-marker-btn > svg { flex: none; margin-top: 2px; color: var(--mds-warning); }
.tf-code-marker-btn.tf-danger > svg { color: var(--mds-danger); }

/* Room patterns (ARCHITECTURE.md §3.2). Each region is a design-system panel on the paper background; the page
   is the one scroll region, and side regions stay in view. */
.tf-pattern { display: grid; gap: var(--tf-space-16); align-items: start; }
.tf-region { min-width: 0; display: flex; flex-direction: column; }
.tf-region-head { margin-bottom: var(--tf-space-12); }
/* When a head is too narrow for its title and actions, the actions move to a second line, so the title is never
   squeezed (PRODUCT.md §4.10: secondary parts give way first). */
.mds-panel-head { flex-wrap: wrap; row-gap: var(--tf-space-6); }
.tf-region-actions { justify-content: flex-end; }
.tf-region-body { min-width: 0; display: flex; flex-direction: column; gap: var(--tf-space-12); }
/* A sticky region keeps its corners and head; only its body scrolls (PRODUCT.md §4.10). */
.tf-sticky {
  position: sticky;
  top: calc(var(--tf-topbar-h) + var(--tf-space-16));
  max-height: calc(100dvh - var(--tf-topbar-h) - var(--tf-space-32));
  overflow: hidden;
}
.tf-sticky > .tf-region-body { flex: 1 1 auto; }
.tf-sticky > .tf-region-body > * { flex-shrink: 0; }

.tf-form-result { grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); }
.tf-workbench { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); }
.tf-explorer { grid-template-columns: 272px minmax(0, 1fr) 340px; }
.tf-explorer.tf-no-inspector { grid-template-columns: 272px minmax(0, 1fr); }
.tf-explorer.tf-no-rail { grid-template-columns: minmax(0, 1fr) 340px; }
.tf-explorer.tf-no-rail.tf-no-inspector { grid-template-columns: minmax(0, 1fr); }
.tf-collection { display: flex; flex-direction: column; gap: var(--tf-space-12); align-items: stretch; }
.tf-collection-bar,
.tf-studio-bar { display: flex; align-items: center; gap: var(--tf-space-8); flex-wrap: wrap; padding: var(--tf-space-8) var(--mds-panel-pad); }
.tf-collection-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--tf-space-16); align-items: start; }
.tf-collection-body.tf-no-detail { grid-template-columns: minmax(0, 1fr); }
.tf-collection-bar .tf-search { flex: 1; min-width: 180px; max-width: 360px; }

.tf-studio { display: flex; flex-direction: column; gap: var(--tf-space-12); align-items: stretch; }
.tf-studio-body { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--tf-space-16); align-items: start; }
.tf-studio-body.tf-no-panel { grid-template-columns: minmax(0, 1fr); }
.tf-studio-body > .tf-sticky { max-height: calc(100dvh - var(--tf-topbar-h) - 116px); }
.tf-stage-region { height: calc(100dvh - var(--tf-topbar-h) - 116px); min-height: 460px; max-height: calc(100dvh - var(--tf-topbar-h) - 116px); }
.tf-studio:not(:has(> .tf-studio-bar)) .tf-stage-region { height: calc(100dvh - var(--tf-topbar-h) - 36px); max-height: calc(100dvh - var(--tf-topbar-h) - 36px); }
.tf-stage-region > .tf-region-body { flex: 1 1 auto; min-height: 0; }
.tf-stage-region > .tf-region-body > * { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.tf-stage-frame { position: relative; min-height: 440px; border-radius: var(--mds-r-lg); background: var(--mds-well); box-shadow: var(--mds-shadow-well); overflow: hidden; display: flex; flex-direction: column; }
.tf-stage-frame::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--mds-line-strong) 1px, transparent 1px); background-size: 18px 18px; opacity: 0.45; pointer-events: none; }
.tf-stage-canvas { position: relative; z-index: 1; flex: 1 1 auto; min-height: 360px; display: flex; flex-direction: column; }
.tf-stage-overlays { position: absolute; inset: var(--tf-space-12); pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; gap: var(--tf-space-8); z-index: 2; }
.tf-stage-overlays > * { pointer-events: auto; }
.tf-stage-bottom { position: relative; z-index: 3; padding: var(--tf-space-8) var(--tf-space-12); border-top: 1px solid var(--mds-line); background: color-mix(in srgb, var(--mds-surface) 92%, transparent); display: flex; flex-direction: column; gap: var(--tf-space-8); }

@media (max-width: 1199px) {
  .tf-explorer { grid-template-columns: 240px minmax(0, 1fr) 300px; }
  .tf-explorer.tf-no-inspector { grid-template-columns: 240px minmax(0, 1fr); }
  .tf-explorer.tf-no-rail { grid-template-columns: minmax(0, 1fr) 300px; }
  .tf-explorer.tf-no-rail.tf-no-inspector { grid-template-columns: minmax(0, 1fr); }
  .tf-studio-body { grid-template-columns: 300px minmax(0, 1fr); }
}
@media (max-width: 767px) {
  .tf-pattern { gap: var(--tf-space-12); }
  .tf-form-result,
  .tf-workbench,
  .tf-explorer,
  .tf-explorer.tf-no-inspector,
  .tf-collection-body,
  .tf-studio-body { grid-template-columns: minmax(0, 1fr); }
  .tf-sticky { position: static; max-height: none; overflow: visible; }
  .tf-sticky > .tf-region-body { overflow: visible; margin: 0; padding: 0; }
  .tf-collection-bar .tf-search { max-width: none; }
  .tf-stage-region { height: calc(100dvh - var(--tf-topbar-h) - 148px); min-height: 380px; max-height: none; }
  .tf-stage-frame { min-height: 320px; }
  .tf-stage-canvas { min-height: 260px; }
}


.tf-doc-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--mds-paper);
  color: var(--mds-ink);
}
.tf-doc-main {
  width: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding: var(--tf-space-24);
  flex: 1;
}
.tf-doc-panel {
  padding: var(--tf-space-24) var(--tf-space-32);
}
.tf-doc-panel > .tf-markdown {
  gap: 14px;
}
.tf-doc-panel > .tf-markdown > h2:first-child {
  font: 800 22px/28px var(--mds-font-display);
  letter-spacing: -0.025em;
  margin-top: 0;
  padding-bottom: var(--tf-space-12);
  border-bottom: 1px solid var(--mds-line);
}
.tf-doc-panel > .tf-markdown > h3 {
  font-size: 16px;
  line-height: 22px;
  margin-top: var(--tf-space-12);
}
.tf-doc-panel > .tf-markdown > h4 {
  font-size: 13.5px;
  line-height: 19px;
  margin-top: var(--tf-space-6);
}
.tf-doc-code-link {
  text-decoration: none;
}
.tf-doc-code-link code {
  color: var(--mds-primary-text);
  font-weight: 600;
  transition: background var(--mds-dur-fast);
}
.tf-doc-code-link:hover code {
  background: var(--mds-primary-soft);
}
.tf-doc-code .mds-code {
  white-space: pre;
  overflow-wrap: normal;
}
.tf-doc-code .tf-code-scroll {
  overflow-x: auto;
}
.tf-doc-diagram-card {
  margin: var(--tf-space-8) 0 var(--tf-space-12);
  border-radius: var(--mds-r-xl);
  background: var(--mds-surface);
  box-shadow: var(--mds-shadow-raised);
  overflow: hidden;
}
.tf-doc-diagram-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--tf-space-8);
  padding: var(--tf-space-8) var(--tf-space-12);
  background: var(--mds-surface);
  border-bottom: 1px solid var(--mds-line);
}
.tf-doc-diagram-kind {
  font: 700 11px/16px var(--mds-font-mono);
  text-transform: uppercase;
  letter-spacing: 0.045em;
  color: var(--mds-ink-3);
}
.tf-doc-diagram {
  position: relative;
  padding: var(--tf-space-20);
  background: var(--mds-well);
  background-image: radial-gradient(var(--mds-line-strong) 1px, transparent 1px);
  background-size: 18px 18px;
  overflow-x: auto;
  cursor: zoom-in;
}
.tf-doc-diagram svg {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
}
.tf-doc-canvas-modal {
  max-width: none;
  width: calc(100vw - 24px);
  height: calc(100dvh - 24px);
  max-height: calc(100dvh - 24px);
  padding: 0;
  gap: 0;
  border-radius: var(--mds-r-2xl);
  overflow: hidden;
}
.tf-doc-canvas-modal[hidden],
.tf-scrim[hidden] {
  display: none !important;
}
.tf-doc-modal-bar {
  min-height: 52px;
  padding: var(--tf-space-8) var(--tf-space-16);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--tf-space-12);
  flex-wrap: wrap;
  background: var(--mds-surface);
  border-bottom: 1px solid var(--mds-line);
  z-index: 2;
}
.tf-doc-modal-title-group {
  display: flex;
  align-items: baseline;
  gap: var(--tf-space-10);
  min-width: 0;
  flex-wrap: wrap;
}
.tf-doc-modal-title {
  font-size: 15px;
  line-height: 20px;
  font-weight: 700;
}
.tf-doc-modal-actions {
  display: flex;
  align-items: center;
  gap: var(--tf-space-8);
  margin-left: auto;
}
.tf-doc-canvas-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  padding: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.tf-doc-canvas-stage.tf-dragging {
  cursor: grabbing;
}
.tf-doc-canvas-viewport {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
  transform-origin: 0 0;
  will-change: transform;
}
.tf-doc-canvas-viewport svg {
  display: block;
  max-width: none;
}
@media (max-width: 767px) {
  .tf-doc-shell .tf-topbar {
    height: auto;
    min-height: var(--tf-topbar-h);
    flex-wrap: wrap;
    padding-top: 8px;
    padding-bottom: 0;
    row-gap: 4px;
  }
  .tf-doc-shell .tf-rooms {
    order: 3;
    flex: 1 0 100%;
    margin-left: 0;
    border-top: 1px solid var(--mds-line);
  }
  .tf-doc-shell .tf-rooms .mds-tab {
    height: 38px;
  }
  .tf-doc-shell [data-tf-theme],
  .tf-doc-open-name {
    display: none;
  }
  .tf-doc-main {
    padding: var(--tf-space-12);
  }
  .tf-doc-panel {
    padding: var(--tf-space-16);
  }
  .tf-doc-modal-hint {
    display: none;
  }
}
</style>
</head>

 hidden></div><div class=\"mds-dialog tf-dialog tf-doc-canvas-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tf-doc-modal-title\" tabindex=\"-1\" data-tf-diagram-modal=\"\" hidden><div class=\"tf-doc-modal-bar\"><div class=\"tf-doc-modal-title-group\"><h2 id=\"tf-doc-modal-title\" class=\"tf-doc-modal-title\">Diagram</h2><span class=\"mds-meta tf-doc-modal-hint\">Drag to pan · Scroll or pinch to zoom · Double-click to fit</span></div><div class=\"tf-doc-modal-actions\"><div class=\"mds-zoom\" role=\"group\" aria-label=\"Zoom controls\"><button type=\"button\" class=\"mds-icon-btn mds-icon-btn-sm\" data-tf-zoom-out=\"\" aria-label=\"Zoom out\" title=\"Zoom out (−)\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/></svg></button><span data-tf-zoom-label=\"\">100%</span><button type=\"button\" class=\"mds-icon-btn mds-icon-btn-sm\" data-tf-zoom-in=\"\" aria-label=\"Zoom in\" title=\"Zoom in (+)\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"M12 5v14\"/></svg></button><button type=\"button\" class=\"mds-icon-btn mds-icon-btn-sm\" data-tf-zoom-fit=\"\" aria-label=\"Fit to screen\" title=\"Fit to screen (0)\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"/><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"/><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"/><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"/></svg></button></div><button type=\"button\" class=\"mds-btn mds-btn-secondary mds-b   // Theme preference synced with Tools Factory ('tf:prefs').
  const readPrefs = () => {
    try {
      const raw = localStorage.getItem('tf:prefs');
      return raw ? JSON.parse(raw) : {};
    } catch {
      return {};
    }
  };
  const applyTheme = (pref) => {
    const resolved = pref === 'dark' || pref === 'light'
      ? pref
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.querySelectorAll('[data-tf-theme-opt]').forEach((btn) => {
      const active = btn.getAttribute('data-tf-theme-opt') === pref;
      btn.classList.toggle('on', active);
      btn.setAttribute('aria-checked', active ? 'true' : 'false');
    });
  };
  let currentThemePref = (() => {
    const p = readPrefs().theme;
    return p === 'light' || p === 'dark' || p === 'system' ? p : 'system';
  })();
  applyTheme(currentThemePref);
  document.querySelectorAll('[data-tf-theme-opt]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const next = btn.getAttribute('data-tf-theme-opt') || 'system';
      currentThemePref = next;
      applyTheme(next);
      try {
        const prefs = readPrefs();
        prefs.theme = next;
        localStorage.setItem('tf:prefs', JSON.stringify(prefs));
      } catch {}
    });
  });

  // Fullscreen pan/zoom diagram modal controller.
  const modal = document.querySelector('[data-tf-diagram-modal]');
  const scrim = document.querySelector('[data-tf-diagram-scrim]');
  const stage = document.querySelector('[data-tf-canvas-stage]');
  const viewport = document.querySelector('[data-tf-canvas-viewport]');
  const titleEl = document.getElementById('tf-doc-modal-title');
  const zoomLabel = document.querySelector('[data-tf-zoom-label]');
  let cam = { x: 0, y: 0, k: 1 };
  let naturalSize = { w: 600, h: 300 };
  let opener = null;
  const MIN_ZOOM = 0.1;
  const MAX_ZOOM = 4;

  const syncTransform = () => {
    if (viewport) {
      viewport.style.transform = 'translate(' + cam.x.toFixed(1) + 'px, ' + cam.y.toFixed(1) + 'px) scale(' + cam.k.toFixed(4) + ')';
    }
    if (zoomLabel) {
      zoomLabel.textContent = Math.round(cam.k * 100) + '%';
    }
  };

  const fitDiagram = () => {
    if (!stage) return;
    const sw = Math.max(240, stage.clientWidth - 64);
    const sh = Math.max(180, stage.clientHeight - 64);
    const k = Math.min(2, Math.max(MIN_ZOOM, Math.min(sw / naturalSize.w, sh / naturalSize.h)));
    cam = {
      k,
      x: (stage.clientWidth - naturalSize.w * k) / 2,
      y: (stage.clientHeight - naturalSize.h * k) / 2,
    };
    syncTransform();
  };

  const zoomAt = (factor, anchorX, anchorY) => {
    const nextK = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, cam.k * factor));
    const ratio = nextK / cam.k;
    cam = {
      k: nextK,
      x: anchorX - (anchorX - cam.x) * ratio,
      y: anchorY - (anchorY - cam.y) * ratio,
    };
    syncTransform();
  };

  const openDiagram = (id, title, triggerEl) => {
    if (!modal || !scrim || !viewport || !stage) return;
    const holder = document.querySelector('[data-tf-diagram-svg="' + id + '"] svg');
    if (!holder) return;
    opener = triggerEl || document.activeElement;
    // Namespace SVG ids on clone so markers and clipPaths never collide with the inline SVG underneath.
    const clonedMarkup = holder.outerHTML
      .replace(/\bid="([^"]+)"/g, 'id="tf-modal-$1"')
      .replace(/url\(#([^)]+)\)/g, 'url(#tf-modal-$1)');
    viewport.innerHTML = clonedMarkup;
    const clonedSvg = viewport.querySelector('svg');
    const w = Number(clonedSvg && clonedSvg.getAttribute('width')) || 640;
    const h = Number(clonedSvg && clonedSvg.getAttribute('height')) || 320;
    naturalSize = { w, h };
    if (titleEl) titleEl.textContent = title || 'Diagram';
    scrim.hidden = false;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    fitDiagram();
    modal.focus();
  };

  const closeDiagram = () => {
    if (!modal || !scrim || modal.hidden) return;
    modal.hidden = true;
    scrim.hidden = true;
    document.body.style.overflow = '';
    if (viewport) viewport.innerHTML = '';
    if (opener && typeof opener.focus === 'function') opener.focus();
    opener = null;
  };

  document.querySelectorAll('[data-tf-diagram-open]').forEach((btn) => {
    btn.addEventListener('click', () => {
      openDiagram(btn.getAttribute('data-tf-diagram-open'), btn.getAttribute('data-tf-diagram-title'), btn);
    });
  });
  document.querySelectorAll('[data-tf-diagram-svg]').forEach((box) => {
    box.addEventListener('click', () => {
      const id = box.getAttribute('data-tf-diagram-svg');
      const btn = document.querySelector('[data-tf-diagram-open="' + id + '"]');
      openDiagram(id, btn ? btn.getAttribute('data-tf-diagram-title') : 'Diagram', btn);
    });
  });

  if (scrim) scrim.addEventListener('click', closeDiagram);
  const closeBtn = document.querySelector('[data-tf-diagram-close]');
  if (closeBtn) closeBtn.addEventListener('click', closeDiagram);
  const zoomInBtn = document.querySelector('[data-tf-zoom-in]');
  if (zoomInBtn) zoomInBtn.addEventListener('click', () => stage && zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2));
  const zoomOutBtn = document.querySelector('[data-tf-zoom-out]');
  if (zoomOutBtn) zoomOutBtn.addEventListener('click', () => stage && zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2));
  const zoomFitBtn = document.querySelector('[data-tf-zoom-fit]');
  if (zoomFitBtn) zoomFitBtn.addEventListener('click', fitDiagram);

  if (stage) {
    const pointers = new Map();
    let lastPinchDist = 0;

    stage.addEventListener('pointerdown', (e) => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      stage.setPointerCapture(e.pointerId);
      stage.classList.add('tf-dragging');
      if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      }
    });

    stage.addEventListener('pointermove', (e) => {
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        cam.x += e.clientX - prev.x;
        cam.y += e.clientY - prev.y;
        syncTransform();
      } else if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        if (lastPinchDist > 8 && dist > 8) {
          const rect = stage.getBoundingClientRect();
          const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
          const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
          zoomAt(dist / lastPinchDist, midX, midY);
        }
        lastPinchDist = dist;
      }
    });

    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) lastPinchDist = 0;
      if (pointers.size === 0) stage.classList.remove('tf-dragging');
    };
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = stage.getBoundingClientRect();
      const rawDelta = e.deltaMode === 1 ? e.deltaY * 18 : e.deltaY;
      const factor = Math.exp(-rawDelta * (e.ctrlKey || e.metaKey ? 0.008 : 0.002));
      zoomAt(factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    let lastGestureScale = 1;
    stage.addEventListener('gesturestart', (e) => {
      e.preventDefault();
      lastGestureScale = 1;
    }, { passive: false });
    stage.addEventListener('gesturechange', (e) => {
      e.preventDefault();
      const scale = typeof e.scale === 'number' && e.scale > 0 ? e.scale : 1;
      const factor = scale / (lastGestureScale || 1);
      lastGestureScale = scale;
      const rect = stage.getBoundingClientRect();
      const px = (typeof e.clientX === 'number' ? e.clientX : rect.left + rect.width / 2) - rect.left;
      const py = (typeof e.clientY === 'number' ? e.clientY : rect.top + rect.height / 2) - rect.top;
      zoomAt(factor, px, py);
    }, { passive: false });
    stage.addEventListener('gestureend', (e) => {
      e.preventDefault();
    }, { passive: false });

    stage.addEventListener('dblclick', fitDiagram);
  }

  window.addEventListener('keydown', (e) => {
    if (!modal || modal.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeDiagram();
    } else if ((e.key === '+' || e.key === '=') && stage) {
      e.preventDefault();
      zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2);
    } else if (e.key === '-' && stage) {
      e.preventDefault();
      zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2);
    } else if (e.key === '0') {
      e.preventDefault();
      fitDiagram();
    }
  });

  document.documentElement.setAttribute('data-tf-ready', 'true');
})();</script>
</body>
</html>

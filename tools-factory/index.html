## 1.2.1 · Crisp surface toolbar and uniform 36 px stage filter

- **White \`.mds-panel\` catalog toolbar:** separated the page header (**Your tools** + **Workshop | Public view**) from a dedicated \`--mds-surface\` filter bar containing **Search tools**, **Ready | All stages**, and **Cards | Table**.
- **Uniform 36 px control height:** replaced the multi-line in-progress switch with a compact **Ready | All stages** segmented filter so every control in the toolbar aligns on a single horizontal axis without height mismatch or awkward wrapping.

## 1.2.0 · Public catalog mode and live tool search

- **Public catalog mode vs Workshop mode:** when built into \`release/<YYYY-MM-DD>/index.html\` (or deployed publicly), the Console renders as a clean, full-width public tool catalog — hiding internal repo-owner panels (*Have an idea?*, *How Tools Factory works*, *Show tools in progress*, and internal stage badges) and showing public-tailored Info guidance.
- **Workshop preview switcher:** inside the repository (\`tools/console/dist/console.html\`), a **Workshop | Public view** toggle lets the owner preview the public storefront in place.
- **Tool search:** live \`SearchField\` filters tools by name, description, or ID across both Cards and Table views.

## 1.1.0 · Card view and Table view switcher

- **Cards & Table view switcher:** switch **Your tools** between the visual **Cards** grid and a compact, sortable **Table** view (\`Tool\`, \`Summary\`, \`Stage\`, \`Version\`, and \`Open\` / \`Docs\` actions).

## 1.0.0 · Ready

- **Docs on every card:** open any tool's PRD, Flows (with rendered diagrams), and Tech spec directly from its card.

## 0.1.1 · Status as text

- A tool that is not built yet says so as text on its card, instead of a disabled button.

## 0.1.0 · First version

- A card for every tool with its stage, version, and Open.

---

You are helping me shape an idea for a small offline tool. A builder will later turn it into a single-file web app that runs in a browser with no internet, no account, and no server. The tool may use an AI only by letting me copy a prompt and paste the reply back.

Interview me first. Ask **one question at a time**, at most eight questions in total, and stop early when you have enough. Cover:
1. The recurring job, and how often I do it.
2. What I use today, and what is painful about it.
3. A real example: what I start with, and what I want at the end.
4. The must-haves, and what can wait.
5. What the tool should keep between uses, if anything.
6. Whether an AI should help with part of the job, and which part.
7. Who else might use it.
8. Anything it must never do.

Then reply with **only** this brief, in one code block, in the language I used:

\`\`\`text
TOOL IDEA BRIEF
Name idea:
Problem (who, how often, cost today):
Example input:
Example result:
Must-haves:
Can wait:
Keeps between uses:
AI help (which step, what goes in, what comes back):
Users:
Never:
Open questions:

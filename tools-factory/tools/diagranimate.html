tive camera framing\n\n- **60 fps 1080p WebM video recording (`canvasRenderer.ts`, `StudioRoom.tsx`):** fixed empty WebM recordings by rendering every live `1920×1080` animation frame (including camera zoom/pan, edge draw-ins, pulses, custom `--tw-*` colors, Figtree typography, and inter-state holds) synchronously onto the offscreen capture canvas so `diagranimate.webm` downloads reliably on completion or Stop.\n- **Silky 60 fps playback & tactile micro-spring (`timeline.ts`, `DiagramStage.tsx`, `diagranimate.css`):** synced timeline camera bounds with the live stage viewport, eliminated CSS transition/drop-shadow re-rasterization jank during zoom, switched camera motion to an asymmetric quintic S-curve with arc-length waypoint splines, and added a subtle damped micro-spring entrance (`0.90 → 1.03 → 1.0`) on newly revealed nodes and edge chips.\n- **Proportional geometry & exact port clipping across all 13 shapes (`layout.ts`, `DiagramStage.tsx`):** redesigned `diamond` as a balanced horizontal rhombus with softly rounded corners instead of an oversized square, refined `circle`, `stadium`, `cylinder` optical text centering, and slant padding, and upgraded `clipToShapeBorder` to clip edge ports to the exact polygon, capsule, and ellipse borders of all 13 shapes.\n- **Adaptive neighborhood & subgraph framing (`timeline.ts`):** removed excessive `150 px` settle shrink, highlighted the active delta zone during wide overview shots, interleaved full-bounds `subgraph` framing right before each group's nodes, added an automatic readable neighborhood medium shot on large diagrams (`fitZoom < 0.75`), and tuned step zoom (`~1.0x–1.2x`) plus an active minimap beacon for clear spatial orientation.\n\n## 1.0.4 · Stage zoom shortcuts and Indonesian copy polish\n\n- **Stage zoom shortcuts (`+`, `−`, `0`):** pressing `+` / `=`, `−`, or `0` while idle zooms in, zooms out, or resets fit on the Studio stage, and Info → Shortcuts now lists both stage stepping (`Space`, `Left`, `Right`) and zoom (`+`, `-`, `0`) keycaps.\n- **Indonesian copy polish:** refined progressive-state phrasing (`tahap progresif`, `peluncuran canary`) across sample and prompt workflow descriptions.\n\n## 1.0.3 · Calm, ambient beacon and flow pulses\n\n- **Calmer breathing tempo:** slowed the tour beacon, sonar ripple, and flow-pulse halo to a relaxed ~3-second breathing cycle (`ease-in-out`) with staggered, length-scaled edge travel (`4.4s–7.2s`) and smooth port fade-in/out so nothing flashes or snaps.\n- **Softer, focus-friendly opacity:** lowered beacon ring tint (`3%–6%`), hairline border (`14%–26%`), translucent center pointer (`32%–46%`), and edge flow particles (`36%–48%` core, `8%–14%` halo) so labels, arrowheads, and diagram nodes remain sharp and effortless to read in every beacon color.\n\n## 1.0.2 · Minimalist scrubber pill and pulsing visual effects\n\n- **Minimalist scrubber pill:** slimmed the floating timeline scrubber into a single-line `36px` capsule (`Slider` `hideLabel`), removing the wrapped two-line label while keeping full keyboard and screen-reader accessibility.\n- **Pulsing beacon and visual effects:** the tour beacon now breathes (`r` `34px ↔ 56px` outer ring, `6.5px ↔ 9.5px` inner dot, plus an expanding sonar ripple), and turning **Visual effects** ON renders glowing traveling edge pulses, node arrival rings, and idle flow pulses along edges.\n\n## 1.0.1 · Canvas pinch-to-zoom and viewport-fitted stage\n\n- **Canvas-only pinch-to-zoom:** trackpad pinch-to-zoom (`Ctrl`/trackpad wheel and WebKit gesture events) and two-finger touch pinch now zoom the diagram smoothly around the pointer without zooming or scrolling the browser page.\n- **Viewport-fitted stage height:** closing or opening the States panel keeps the stage height fitted to your screen (`100dvh`) with no vertical page scroll.\n- **Stage interactions:** double-clicking a node centers on it at 140% zoom, double-clicking the canvas background resets fit, and dragging across the minimap pans the camera live.\n\n## 1.0.0 · Ready\n\n- Diagranimate is ready: the owner tried it and accepted it. Author progressive Mermaid flowcharts state by state, play guided camera walkthroughs with live scrubbing, generate or split diagrams with your AI chat, keep projects in the Library, and export 3× PNGs, Markdown sources, or 1080p WebM video offline.\n\n## 0.6.0 · Built\n\n- **The Prototype label is gone:** the parser, deterministic Sugiyama layout, Reel timeline compiler, and AI prompt validation are complete and tested across 15 logic tests and the end-to-end playback/scrub/stop scenario test (`tests/flows.spec.ts`).\n- **Two comprehensive golden samples:** *E-commerce checkout & fulfillment* (7 → 25 nodes across 4 progressive states) and *Zero-downtime cloud deployment* (7 → 22 nodes covering all 13 node shapes and all 9 edge types).\n- **Library items are checked when opened** (`readSavedProject`): a damaged item with no valid flowchart state is refused with an explanation while keeping the Library open and the active project untouched.\n\n## 0.2.0 · Prototype\n\n- Studio with state cards, code editor with line numbers and skipped-line markers, transport, speed and view options, and export (PNG, WebM video in Chromium, and source).\n- Interactive SVG stage with 13 node shapes, 9 edge types, groups, camera tour, beacon, minimap, search, inspect, and layout controls.\n- AI prompts room with three progressive-flowchart workflows and reply checking.\n\n## 0.1.0 · Dossier\n\n- Product requirements, flows, and technical specification.\n- Five four-state sample diagrams.\n".replace(/^# .*\n/,``)})}),(0,C.jsx)(Bp,{label:V(`about.licenses`),meta:String(n.length),children:n.length===0?(0,C.jsx)(`p`,{className:`mds-help`,children:V(`about.noLicenses`)}):n.map(e=>(0,C.jsx)(Bp,{label:`${e.name} ${e.version}`,meta:e.license,children:(0,C.jsx)(th,{code:e.text})},e.name))})]})}function Th({api:e,open:t,onOpenChange:n,tab:r,onTab:i}){let a=[`overview`,`how`,`privacy`,`shortcuts`,`

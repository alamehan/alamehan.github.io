yout measures); at the release values nothing changes, pixel for pixel. Every room is checked to still fit with the largest style.\n\n## 1.2.0 · Tactile Depth design release (`D-36`), identity color `fuchsia` & identity icon slot (`D-37`)\n\n- **Tactile Depth design release (`design-system/`, `@tf/sdk` `0.9.0`, `D-36`):** the tool takes the new Mehan release through its tokens: no outline around any component, edges made of a tone step, a top highlight, and stacked shadows; text, icon, and state colors that pass WCAG AA in both themes; a dark theme that gets darker with depth and lighter with elevation; and a control edge of at least 3:1 under `prefers-contrast: more`.\n- **Identity color `fuchsia` (`tool.json`, `docs/PRD.md` §3):** dealt by the smart color rule so that no two tools share a hue (it was `violet`, shared with SuperStudio). Node highlights and the default tour beacon follow `--tf-identity`, which is now a mark that passes 3:1 in both themes.\n- **Identity icon slot (`D-37`):** the top bar (32 px), Info → About (72 px), the favicon, and the Console show the tool's identity icon once it is forged and saved as `icon.md`; until then the Lucide `clapperboard` stands on the 2.5D fallback tile.\n\n## 1.1.4 · Shared `@tf/sdk/diagram` parser & layout engine\n\n- **Promoted single-flowchart AST & Sugiyama layout engine (`src/logic/parser.ts`, `src/logic/layout.ts`, `@tf/sdk` `0.8.15`):** promoted the pure single-state Mermaid `flowchart` parser and deterministic 13-shape layout engine into `@tf/sdk/diagram` so `@tf/build` Dossier HTML pages, the Console Factory Handbook, and Diagranimate share one canonical engine without foundation-to-tool cross-imports, while keeping multi-state document splitting, serialization, and Library validation (`splitStates`, `serializeStates`, `parseDocument`, `readSavedProject`) inside Diagranimate.\n\n## 1.1.3 · Adaptive portrait `Auto` direction, compact mobile stage overlays & sticky transport (`D-35`)\n\n- **Adaptive portrait `Auto` direction (`context.tsx`):** when `view.direction === 'auto'` on narrow portrait viewports (`< 768 px`), horizontal `LR`/`RL` flowcharts automatically adapt to vertical `TB`/`BT` flow so initial camera fit frames diagrams at readable `~60%–75%` zoom instead of a tiny `25%` horizontal ribbon, while still honoring explicit `LR`/`RL` overrides.\n- **Single-row mobile transport & collapsible stage search (`StudioRoom.tsx`, `DiagramStage.tsx`, `diagranimate.css`, `@tf/sdk` `0.8.14`):** combined the mobile `States` drawer toggle and state counter into `States (1/4)`, collapsed the mobile stage search input behind a compact `Search` icon button so the top stats pill and `[Search] [Auto]` share one row on narrow screens, and made `.tf-studio-bar` sticky below `--tf-sticky-top`.\n\n## 1.1.2 · Unified SDK panel chrome & `Mod+\\` shortcut across Studio and AI prompts (`D-33`)\n\n- **Unified panel chrome (`StudioRoom.tsx`, `PromptsRoom.tsx`, `@tf/sdk` `0.8.13`):** aligned the `Studio` `States` toggle with `D-33` accessibility/neutral-chrome markers (`data-tf-panel-toggle=\"left\"`, `Mod+\\`), and enabled collapsible left form panel + `Mod+\\` in `AI prompts` (`FormResult`).\n\n## 1.1.1 · Empty-first initial boot, viewport-locked Studio, and multi-block BYOAI resilience\n\n- **Empty-first initial boot (`context.tsx`, `StudioRoom.tsx`):** opens in a clean Empty State (`State 1` empty flowchart + `Try a sample` button) instead of pre-populating `checkout-flow` on fresh boot (`D-31`).\n- **Multi-block & fenced Mermaid resilience (`PromptsRoom.tsx`, `prompts.ts`, `parser.ts`):** `AI prompts` now accepts multi-block AI replies (combining separate ```` ```mermaid ```` state blocks automatically) and strips stray code-fence lines inside pasted states without throwing `E_TYPE_UNSUPPORTED`.\n\n## 1.1.0 · 60 fps WebM video recorder, silky spring motion, proportional shapes, and adaptive camera framing\n\n- **60 fps 1080p WebM video recording (`canvasRenderer.ts`, `StudioRoom.tsx`):** fixed empty WebM recordings by rendering every live `1920×1080` animation frame (including camera zoom/pan, edge draw-ins, pulses, custom `--tw-*` colors, Figtree typography, and inter-state holds) synchronously onto the offscreen capture canvas so `diagranimate.webm` downloads reliably on completion or Stop.\n- **Silky 60 fps playback & tactile micro-spring (`timeline.ts`, `DiagramStage.tsx`, `diagranimate.css`):** synced timeline camera bounds with the live stage viewport, eliminated CSS transition/drop-shadow re-rasterization jank during zoom, switched camera motion to an asymmetric quintic S-curve with arc-length waypoint splines, and added a subtle damped micro-spring entrance (`0.90 → 1.03 → 1.0`) on newly revealed nodes and edge chips.\n- **Proportional geometry & exact port clipping across all 13 shapes (`layout.ts`, `DiagramStage.tsx`):** redesigned `diamond` as a balanced horizontal rhombus with softly rounded corners instead of an oversized square, refined `circle`, `stadium`, `cylinder` optical text centering, and slant padding, and upgraded `clipToShapeBorder` to clip edge ports to the exact polygon, capsule, and ellipse borders of all 13 shapes.\n- **Adaptive neighborhood & subgraph framing (`timeline.ts`):** removed excessive `150 px` settle shrink, highlighted the active delta zone during wide overview shots, interleaved full-bounds `subgraph` framing right before each group's nodes, added an automatic readable neighborhood medium shot on large diagrams (`fitZoom < 0.75`), and tuned step zoom (`~1.0x–1.2x`) plus an active minimap beacon for clear spatial orientation.\n- **Self-contained autonomous replication dossier (`D-29`):** expanded `docs/TECH-SPEC.md` into a 100% self-contained replication blueprint embedding exact shape sizing and polygon/capsule/ellipse ray-clipping equations (`layout.ts`), timeline easing and camera framing formulas (`timeline.ts`), verbatim AI prompt templates (`prompts.ts`), and both 4-state golden progressive samples (`checkout-flow.md` and `cloud-deploy.md`), locked against source drift by an automated unit test.\n\n## 1.0.4 · Stage zoom shortcuts and Indonesian copy polish\n\n- **Stage zoom shortcuts (`+`, `−`, `0`):** pressing `+` / `=`, `−`, or `0` while idle zooms in, zooms out, or resets fit on the Studio stage, and Info → Shortcuts now lists both stage stepping (`Space`, `Left`, `Right`) and zoom (`+`, `-`, `0`) keycaps.\n- **Indonesian copy polish:** refined progressive-state phrasing (`tahap progresif`, `peluncuran canary`) across sample and prompt workflow descriptions.\n\n## 1.0.3 · Calm, ambient beacon and flow pulses\n\n- **Calmer breathing tempo:** slowed the tour beacon, sonar ripple, and flow-pulse halo to a relaxed ~3-second breathing cycle (`ease-in-out`) with staggered, length-scaled edge travel (`4.4s–7.2s`) and smooth port fade-in/out so nothing flashes or snaps.\n- **Softer, focus-friendly opacity:** lowered beacon ring tint (`3%–6%`), hairline border (`14%–26%`), translucent center pointer (`32%–46%`), and edge flow particles (`36%–48%` core, `8%–14%` halo) so labels, arrowheads, and diagram nodes remain sharp and effortless to read in every beacon color.\n\n## 1.0.2 · Minimalist scrubber pill and pulsing visual effects\n\n- **Minimalist scrubber pill:** slimmed the floating timeline scrubber into a single-line `36px` capsule (`Slider` `hideLabel`), removing the wrapped two-line label while keeping full keyboard and screen-reader accessibility.\n- **Pulsing beacon and visual effects:** the tour beacon now breathes (`r` `34px ↔ 56px` outer ring, `6.5px ↔ 9.5px` inner dot, plus an expanding sonar ripple), and turning **Visual effects** ON renders glowing traveling edge pulses, node arrival rings, and idle flow pulses along edges.\n\n## 1.0.1 · Canvas pinch-to-zoom and viewport-fitted stage\n\n- **Canvas-only pinch-to-zoom:** trackpad pinch-to-zoom (`Ctrl`/trackpad wheel and WebKit gesture events) and two-finger touch pinch now zoom the diagram smoothly around the pointer without zooming or scrolling the browser page.\n- **Viewport-fitted stage height:** closing or opening the States panel keeps the stage height fitted to your screen (`100dvh`) with no vertical page scroll.\n- **Stage interactions:** double-clicking a node centers on it at 140% zoom, double-clicking the canvas background resets fit, and dragging across the minimap pans the camera live.\n\n## 1.0.0 · Ready\n\n- Diagranimate is ready: the owner tried it and accepted it. Author progressive Mermaid flowcharts state by state, play guided camera walkthroughs with live scrubbing, generate or split diagrams with your AI chat, keep projects in the Library, and export 3× PNGs, Markdown sources, or 1080p WebM video offline.\n\n## 0.6.0 · Built\n\n- **The Prototype label is gone:** the parser, deterministic Sugiyama layout, Reel timeline compiler, and AI prompt validation are complete and tested across 15 logic tests and the end-to-end playback/scrub/stop scenario test (`tests/flows.spec.ts`).\n- **Two comprehensive golden samples:** *E-commerce checkout & fulfillment* (7 → 25 nodes across 4 progressive states) and *Zero-downtime cloud deployment* (7 → 22 nodes covering all 13 node shapes and all 9 edge types).\n- **Library items are checked when opened** (`readSavedProject`): a damaged item with no valid flowchart state is refused with an explanation while keeping the Library open and the active project untouched.\n\n## 0.2.0 · Prototype\n\n- Studio with state cards, code editor with line numbers and skipped-line markers, transport, speed and view options, and export (PNG, WebM video in Chromium, and source).\n- Interactive SVG stage with 13 node shapes, 9 edge types, groups, camera tour, beacon, minimap, search, inspect, and layout controls.\n- AI prompts room with three progressive-flowchart workflows and reply checking.\n\n## 0.1.0 · Dossier\n\n- Product requirements, flows, and technical specification.\n- Five four-state sample diagrams.\n".replace(/^# .*\n/,``)}  straight), layout direction, spacing, focus dimming, beacon color, and effects in View and the layout bar.`,6:`Export any state as a 3x PNG image, record the animated tour as a 1080p WebM video, or save projects to the Library.`},reference:"### Progressive State Document Structure\n\n| Syntax | Meaning |\n|---|---|\n| `---` | Separates progressive states in one file (or wraps `title:` frontmatter) |\n| `# Title` or `title: ...` | Names the state on its opening line |\n| `flowchart TD` / `LR` / `BT` / `RL` | Declares flowchart direction (`graph` is also accepted) |\n| `subgraph id [Title] ... end` | Visual group box around related nodes (nestable) |\n| `classDef role fill:...,stroke:...` | Defines a reusable style class (`class A role` or `A:::role`) |\n| `style id ...` / `linkStyle N ...` | Applies inline styles to a specific node or edge |\n\n### All 13 Supported Node Shapes\n\n| Syntax | Shape | Syntax | Shape |\n|---|---|---|---|\n| `id[Label]` | Rectangle | `id{Label}` | Diamond (decision rhombus) |\n| `id(Label)` | Rounded rectangle | `id((Label))` | Circle |\n| `id([Label])` | Stadium (pill) | `id>Label]` | Flag (asymmetric) |\n| `id[(Label)]` | Cylinder (database) | `id[/Label/]` | Parallelogram (`+18 px` skew) |\n| `id{{Label}}` | Hexagon | `id[\\Label\\]` | Inverse parallelogram (`-18 px` skew) |\n| `id[[Label]]` | Subroutine | `id[/Label\\]` / `id[\\Label/]` | Trapezoid / Inverse trapezoid |\n\n### All 9 Supported Edge Types\n\n| Syntax | Look | Syntax | Look |\n|---|---|---|---|\n| `-->` | Solid arrow | `===` | Thick line |\n| `---` | Solid line | `--o` | Circle endpoint |\n| `-.->` | Dashed arrow | `--x` | Cross endpoint |\n| `-.-` | Dashed line | `<-->` | Bidirectional arrow |\n| `==>` | Thick arrow (`3 px`) | `A -->|text| B` / `A & B --> C` | Edge labels & multi-target links |"},capabilities:{storage:`Saved projects in the Library, the open workspace, and prompt drafts in this browser.`,files:`Importing .md or .txt state files and downloading .md, .pn

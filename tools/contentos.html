r skip it and attach it in your AI.",cs_file:"Load .txt / .md",cs_file_bad:"That file didn't read as text — paste the content instead. Nothing was changed.",cs_skip:"Skip — attach the content in the AI instead",cs_longform:"Longform — input or result won't fit one message",cs_longform_help:"An escape hatch, not a habit (PRD §7.5): most jobs fit one paste. Turn it on only when the input truly exceeds one message or a result arrives truncated.",cs_words:"words",cs_chars:"characters",cs_langhint:"detected language",cs_err_content:"Paste content here — or flip Skip to attach it in your AI instead.",cs_recipes_l:"2 · Recipes — one tap, a complete pipeline",cs_recipe_loaded:"Recipe loaded — the pipeline stays editable. ✓",cs_pipe_l:"3 · Pipeline — 1–4 stages",cs_pipe_empty:"No stages yet — tap a recipe above, or add a process.",cs_add:"Add a process",cs_add_l:"Process to add",cs_dup:"That process is already in the pipeline — duplicates aren't allowed.",cs_full:"The pipeline is capped at 4 stages — quality over ceremony.",cs_added:"Stage added ✓",cs_removed:"Stage removed ✓",cs_up:"Move stage up",cs_down:"Move stage down",cs_remove:"Remove stage",cs_drag:"Drag to reorder",cs_lens_l:"4 · Lens — applies to every stage",lens_aud:"Audience",lens_tone:"Tone",lens_lang:"Language",lens_depth:"Depth",lens_notes:"Notes",lens_aud_ph:"General",lens_tone_ph:"Clear & neutral",lens_lang_ph:"Match the input",lens_notes_ph:"constraints, persona, focus…",depth_brief:"Brief",depth_standard:"Standard",depth_deep:"Deep",cs_preview_l:"Live job preview",cs_preview_hint:"Exactly what you'll hand to the AI — updates on every change.",cs_generate:"Generate",cs_copy:"Copy",cs_dl:"Download",cs_share:"Copy share link",cs_copied:"Job copied. Hand it to any capable AI and say 'execute'.",cs_shared:"Share link copied — it carries the setup (pipeline + lens), never the content. ✓",cs_generated:"Job compiled fresh ✓",dl_done:"Downloaded ✓",lb_h:"Library — 8 families · 44 processes",lb_p:"A curated MECE registry replaces two prompt libraries: every process ships its promise, method, output contract, and guardrail. Search also finds the old MAP/OPE terms it absorbed.",lb_compass:"Not sure which process? Start from the question you're asking.",lb_search_ph:"Search — name, promise, or an old term like “condense” or “:sop”…",lb_search_l:"Search processes",lb_noresults:"No process matches that search — clear it, or try an absorbed term like “condense”.",lb_clear:"Clear search",lb_add:"Add to pipeline",lb_inpipe:"In the pipeline ✓",lb_method:"Method",lb_guardrail:"Guardrail",lb_contract:"Output",lb_absorbs:"Absorbs",lb_recipes_l:"Recipes — one-click pipelines (tap to load into the Console)",q_understand:"What does this mean?",q_extract:"What's in here that I need?",q_structure:"How should this be organized?",q_distill:"How do I say this shorter/clearer?",q_refine:"How do I make this better (and safer)?",q_evaluate:"How good/true is this — and what should I choose?",q_transform:"What else can this become?",q_visualize:"How do I show this?",sh_h:"Shelf — results that outlive the chat",sh_p:"Paste an AI's result here and it becomes something you keep: stages split into cards, markdown renders cleanly, every run is stored on this device with its sig.",sh_paste_l:"Paste result",sh_paste_ph:"Paste the whole reply — ContentOS finds the cos-result: 1 block by itself.",sh_save:"Parse & keep",sh_err_empty:"Nothing to parse yet — paste the AI's reply first.",sh_empty:"No runs yet — paste an AI's result above and it becomes something you keep.",sh_raw_notice:"No cos-result header found — saved as a raw run.",sh_saved:"Run saved to the Shelf ✓",sh_evicted:"The Shelf keeps 50 runs — the oldest was evicted to make room.",sh_parts:"{n} parts concatenated (same sig) before parsing ✓",sh_parts_bad:"The [PART] signatures don't match each other — saved as a raw run.",sh_parts_missing:"{got} of {n} parts pasted — paste the missing parts (same sig) to complete this run.",sh_parts_merged:"Contin .notice.ok{background:color-mix(in srgb,var(--ok) 8%,#fff);border:1px solid color-mix(in srgb,var(--ok) 30%,#fff);color:var(--ok)}
.empty{padding:var(--s-6);text-align:center;color:var(--ink-muted)}
.empty .big{font-size:26px;display:block;margin-bottom:6px}

/* table — registry-verbatim */
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.08)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:var(--s-2)}
.tbl th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--hairline)}
.tbl td{padding:8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.compact th,.tbl.compact td{padding:6px 8px}

/* modal §8 + toast — registry-verbatim */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline)}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.idcard dt{color:var(--ink-faint)}.idcard dd{margin:0}
.toasts{position:fixed;bottom:var(--s-5);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--elev-2);animation:fadein var(--t-med)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--danger) 6%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px}

/* diagram tab (about-modal/3) + fullscreen viewer — registry-verbatim */
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ ContentOS-specific (custom composites — tokens only, PRD §13.2) ═══ */
/* registry Button block's small size (components.md §Button — verbatim) */
.btn.sm{padding:6px 10px;font-size:12px}
/* Library: Compass intent chips (chip anatomy + aria-pressed, LangToggle pattern) */
.compass{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s-3)}
.compass .chip{cursor:pointer;font-weight:500}
.compass .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}

/* Library: family sections + process cards (panel + badge anatomy) */
.famhead{display:flex;align-items:baseline;gap:10px;margin:var(--s-6) 0 var(--s-3);scroll-margin-top:calc(var(--header-h) + var(--s-3))}
.famhead h2{font-size:18px;font-weight:600;margin:0}
.famhead .q{font-size:12.5px;color:var(--ink-muted)}
.procs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s-3)}
.proc{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:6px}
.proc .pid{font:600 11px/1 var(--mono);letter-spacing:.03em;color:var(--accent)}
.proc h3{margin:0;font-size:14.5px}
.proc .promise{font-size:12.5px;color:var(--ink-muted);margin:0}
.proc .meta{font-size:11.5px;color:var(--ink-faint);margin:0}
.proc .meta b{color:var(--ink-muted);font-weight:600}
.proc .row{display:flex;gap:8px;margin-top:auto;align-items:center;padding-top:6px}
.proc.inpipe{border-color:color-mix(in srgb,var(--accent) 40%,#fff);background:var(--accent-wash)}

/* Recipes (composed chips — tap = load) */
.recipes{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s-3)}
.recipe{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 12px;font-size:12.5px;cursor:pointer;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.recipe:hover{border-color:var(--accent);box-shadow:var(--elev-1)}
.recipe .arrowline{font:450 10.5px/1 var(--mono);color:var(--ink-faint)}

/* Console layout: config column + sticky live preview (PRD §4.2) */
.console{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-4);align-items:start}
.console .col{min-width:0}
.preview{position:sticky;top:calc(var(--header-h) + var(--s-4))}
.preview pre.code{max-height:56vh}
.preview.flash{animation:jobflash 200ms ease-out}
/* personality moment 2 (PRD §13.3): 200ms accent shimmer when a job is freshly compiled */
@keyframes jobflash{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-faint);margin-top:6px}
.counts b{color:var(--ink-muted);font-weight:600}
.togglebox{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 11px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);cursor:pointer;user-select:none}
.togglebox input{width:auto;accent-color:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-3)}

/* Console: pipeline stage cards (1–4, drag/keyboard reorder) */
.pipe{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.stage{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
/* personality moment 1 (PRD §13.3): a stage card drops onto the pipeline, 150ms settle */
.stage.dropped{animation:stagedrop 150ms cubic-bezier(.2,.8,.4,1)}
@keyframes stagedrop{from{opacity:.4;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stage.dragover{border-color:var(--accent);box-shadow:0 -2px 0 0 var(--accent)}
.stage .grip{cursor:grab;color:var(--ink-faint);flex:none;padding-top:2px}
.stage .n{font:700 11px/1 var(--mono);color:var(--accent);flex:none;padding-top:4px}
.stage .body{flex:1;min-width:0}
.stage .pid{font:600 12px/1.4 var(--mono);color:var(--ink)}
.stage .promise{font-size:11.5px;color:var(--ink-muted)}
.stage .ops{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.stage .ops select,.stage .ops input{width:auto;max-width:220px;font-size:12.5px;padding:5px 9px}
.stage .ops select{padding-right:30px}
.stage .acts{display:flex;gap:2px;flex:none}

/* Shelf: run cards + rendered stage cards + markdown subset (PRD §11) */
.runs{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.run{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;text-align:left;width:100%}
.run:hover{border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.run.sel{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.run .name{font-weight:600;font-size:13.5px}
.run .sig{font:450 11px/1 var(--mono);color:var(--ink-faint)}
.run .sp{flex:1}
.stagecard{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);margin-top:var(--s-3)}
.stagecard .sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:var(--s-2)}
.stagecard .sh .lbl{font:600 12px/1 var(--mono);color:var(--accent)}
.stagecard .sh .sp{flex:1}
.md{font-size:13.5px;overflow-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:var(--s-4) 0 var(--s-2)}
.md h1{font-size:17px}.md h2{font-size:15.5px}.md h3{font-size:14px}.md h4{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-muted)}
.md p{margin:var(--s-2) 0}
.md ul,.md ol{margin:var(--s-2) 0;padding-left:22px}
.md li{margin:2px 0}
.md blockquote{margin:var(--s-2) 0;border-left:3px solid var(--hairline);padding:2px 0 2px 12px;color:var(--ink-muted)}
.md code{font:450 12px/1.5 var(--mono);background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:1px 5px}
.md pre{background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-3);overflow:auto;margin:var(--s-2) 0}
.md pre code{background:none;border:0;padding:0}
.md table{width:100%;border-collapse:collapse;font-size:12.5px;margin:var(--s-2) 0}
.md th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--hairline)}
.md td{padding:6px 8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.md tr:last-child td{border-bottom:0}

/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
  .console{grid-template-columns:1fr}
  .preview{position:static}
}</style>
</head>
<body>
<div id="root"></div>
<script data-goatcounter="https://alamehan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>

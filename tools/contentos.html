  <style rel="stylesheet" crossorigin>/* ═══ packages/ui/tokens.css — design-system-standard@2.0.0 §2–§4 as CSS variables ═══
   THE shared design layer. Apps override exactly TWO variables in their theme.css:
     --accent  and  --accent-active   (their registered pair from 06-ledger/project-roster.md)
   Everything else here is identical family-wide. Never fork; never add a second accent. */
:root{
  /* §2 color — neutrals (Tailwind `neutral`, true gray) */
  --canvas:#fafafa; --surface:#ffffff; --hairline:#e5e5e5; --wash:#f5f5f5;
  --ink:#171717; --ink-muted:#737373; --ink-faint:#a3a3a3;
  /* §2 the ONE accent — placeholder pair;each app overrides in theme.css */
  --accent:#0d9488; --accent-active:#0f766e; --on-accent:#ffffff;
  --accent-wash:color-mix(in srgb, var(--accent) 8%, #ffffff);
  /* §2 semantics — state only, never brand */
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  /* §3 type scale (Fustat everywhere) */
  --font:"Fustat",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-display:700 28px/1.2 var(--font); --t-h1:700 22px/1.25 var(--font);
  --t-h2:600 18px/1.3 var(--font);      --t-h3:600 15px/1.4 var(--font);
  --t-body:400 14px/1.55 var(--font);   --t-small:400 12.5px/1.5 var(--font);
  --t-caption:500 11.5px/1.4 var(--font); --t-mono:450 12.5px/1.5 var(--mono);
  /* §4 shape · space · elevation · motion */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --elev-1:0 1px 2px rgba(23,23,23,.06); --elev-2:0 8px 30px rgba(23,23,23,.12);
  --header-h:56px; --maxw:1100px;
  --t-fast:120ms cubic-bezier(.2,.8,.4,1); --t-med:200ms cubic-bezier(.2,.8,.4,1);
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
/* ═══ @alamehan/ui/custom/surfaces.css — the three family surfaces, styled ═══
   COPIED VERBATIM from the living exemplar apps/zapseed/zapseed.html (family law:
   copy, never re-derive). Any change here must first change the exemplar + parity gate.
   Covers: .site-header/.brand/nav.rooms/.hright/.langsw/.icon-btn/.site-footer (§7),
   .overlay/.modal/.mh/.mtabs/.mpane/.authorcard (§8 about-modal/3), .chip, .dgfs viewer. */
/* ═══ shell: navbar §7 · footer ═══ */
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tile{width:28px;height:28px;background:var(--wash);border-radius:var(--r-md);display:grid;place-items:center;font-size:16px;flex:none}
.brand b{font-size:15px;font-weight:700}
.brand .ver{font-size:11.5px;font-weight:500;color:var(--ink-faint)}
nav.rooms{display:flex;gap:2px;margin:0 auto;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
nav.rooms a{font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;position:relative}
nav.rooms a:hover{color:var(--ink);background:var(--wash)}
nav.rooms a[aria-current]{color:var(--accent);font-weight:600}
nav.rooms a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent)}

nav.rooms a .stepdone{color:var(--ok);font-weight:700;margin-left:2px}
.hright{display:flex;align-items:center;gap:var(--s-3);flex:none}
.langsw{display:flex;border:1px solid var(--hairline);border-radius:var(--r-pill);overflow:hidden}
.langsw button{border:0;background:var(--surface);font:600 11.5px/1 var(--font);letter-spacing:.04em;padding:7px 10px;cursor:pointer;color:var(--ink-muted)}

.proc{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:6px}
.proc .pid{font:600 11px/1 var(--mono);letter-spacing:.03em;color:var(--accent)}
.proc h3{margin:0;font-size:14.5px}
.proc .promise{font-size:12.5px;color:var(--ink-muted);margin:0}
.proc .meta{font-size:11.5px;color:var(--ink-faint);margin:0}
.proc .meta b{color:var(--ink-muted);font-weight:600}
.proc .row{display:flex;gap:8px;margin-top:auto;align-items:center;padding-top:6px}
.proc.inpipe{border-color:color-mix(in srgb,var(--accent) 40%,#fff);background:var(--accent-wash)}

/* Recipes (composed chips — tap = load) */
.recipes{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s-3)}
.recipe{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 12px;font-size:12.5px;cursor:pointer;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.recipe:hover{border-color:var(--accent);box-shadow:var(--elev-1)}
.recipe .arrowline{font:450 10.5px/1 var(--mono);color:var(--ink-faint)}

/* Console layout: config column + sticky live preview (PRD §4.2) */
.console{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-4);align-items:start}
.console .col{min-width:0}
.preview{position:sticky;top:calc(var(--header-h) + var(--s-4))}
.preview pre.code{max-height:56vh}
.preview.flash{animation:jobflash 200ms ease-out}
/* personality moment 2 (PRD §13.3): 200ms accent shimmer when a job is freshly compiled */
@keyframes jobflash{from{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-faint);margin-top:6px}
.counts b{color:var(--ink-muted);font-weight:600}
.togglebox{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 11px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);cursor:pointer;user-select:none}
.togglebox input{width:auto;accent-color:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:var(--s-3);margin-top:var(--s-3)}

/* Console: pipeline stage cards (1–4, drag/keyboard reorder) */
.pipe{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.stage{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
/* personality moment 1 (PRD §13.3): a stage card drops onto the pipeline, 150ms settle */
.stage.dropped{animation:stagedrop 150ms cubic-bezier(.2,.8,.4,1)}
@keyframes stagedrop{from{opacity:.4;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stage.dragover{border-color:var(--accent);box-shadow:0 -2px 0 0 var(--accent)}
.stage .grip{cursor:grab;color:var(--ink-faint);flex:none;padding-top:2px}
.stage .n{font:700 11px/1 var(--mono);color:var(--accent);flex:none;padding-top:4px}
.stage .body{flex:1;min-width:0}
.stage .pid{font:600 12px/1.4 var(--mono);color:var(--ink)}
.stage .promise{font-size:11.5px;color:var(--ink-muted)}
.stage .ops{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.stage .ops select,.stage .ops input{width:auto;max-width:220px;font-size:12.5px;padding:5px 9px}
.stage .ops select{padding-right:30px}
.stage .acts{display:flex;gap:2px;flex:none}

/* Shelf: run cards + rendered stage cards + markdown subset (PRD §11) */
.runs{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.run{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;text-align:left;width:100%}
.run:hover{border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.run.sel{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.run .name{font-weight:600;font-size:13.5px}
.run .sig{font:450 11px/1 var(--mono);color:var(--ink-faint)}
.run .sp{flex:1}
/* your own saved recipes — marked as yours, deletable in place. The mark matters:
   the 12 built-ins are curation, these are your work, and a shelf that cannot tell
   them apart is the same sin as a studio booting with someone else's example. */
.recipe.mine{border-color:color-mix(in srgb,var(--accent) 32%,var(--hairline));background:var(--accent-wash)}
.recipe .tag{font:700 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);border-radius:var(--r-pill);padding:3px 5px;flex:none}
.recipe .del{margin-left:2px;width:16px;height:16px;border-radius:999px;display:inline-grid;place-items:center;
  font:700 12px/1 var(--font);color:var(--ink-faint);flex:none;cursor:pointer}
.recipe .del:hover{background:var(--danger);color:#fff}
.recipe .del:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.saverec{display:flex;gap:8px;align-items:center;margin-top:var(--s-3);flex-wrap:wrap}
.saverec input{flex:1;min-width:200px}
@media(max-width:640px){.saverec input{min-width:100%}}

/* the Library's per-card fold — the promise stays, the rest is one click down */
.procmore{margin:6px 0 0}
.procmore>summary{list-style:none;cursor:pointer;font:600 11.5px/1 var(--mono);color:var(--accent);
  padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.procmore>summary::-webkit-details-marker{display:none}
.procmore>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform var(--t-fast)}
.procmore[open]>summary::before{transform:rotate(45deg)}
.procmore>summary:hover{color:var(--accent-active)}
.procmore .meta:first-of-type{margin-top:6px}

/* ═══ PROGRESSIVE DISCLOSURE (PRD §23) — native <details>, nothing hidden ═══
   The rule borrowed from SuperTour's disclosure pass: every summary SAYS WHAT IS
   INSIDE, and a fold whose content exists opens itself — so the advanced half is
   quieted, never concealed. Native <details> keeps keyboard, screen-reader and
   Ctrl-F behaviour for free, which no hand-rolled accordion does. */
details.fold{padding:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:var(--s-4) var(--s-5);font-size:14px;font-weight:600;color:var(--ink);border-radius:var(--r-lg)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:8px;height:8px;flex:none;border-right:1.5px solid var(--ink-faint);
  border-bottom:1.5px solid var(--ink-faint);transform:rotate(-45deg);margin-left:2px;transition:transform var(--t-fast)}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>summary:hover{background:var(--wash)}
details.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
details.fold>summary .lenssum{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-weight:450;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
details.fold>summary .badge{margin-left:auto}
details.fold .foldbody{padding:0 var(--s-5) var(--s-5)}
@media(max-width:640px){details.fold>summary .lenssum{display:none}}

/* the preview's honest empty state — it names what is missing instead of
   rendering a complete job the user never made */
.pvempty{border:1px dashed var(--hairline);border-radius:var(--r-md);padding:var(--s-5);text-align:center;background:var(--wash)}
.pvempty p{margin:0 0 8px;font-size:13px;color:var(--ink-muted)}
.pvempty .need{font-size:12.5px;color:var(--ink-faint)}
.pvempty .need b{color:var(--ink-muted)}
#pv-example{gap:8px;align-items:center}
#pv-example span{flex:1}

/* ═══ THE ROUTE (PRD §23) — four beats and one sentence, in every room ═══
   Quiet by construction: a hairline rail, no fill, no shadow. It must read as
   orientation, never as a control panel competing with the work below it. */
.route{display:flex;flex-wrap:wrap;align-items:center;gap:8px var(--s-4);margin:0 0 var(--s-4)}
.route .beats{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.route .beats li{display:flex;align-items:center}
.route .beats li+li::before{content:"";width:14px;height:1px;background:var(--hairline);flex:none}
.route .beats button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;cursor:pointer;
  font:500 12px/1 var(--font);color:var(--ink-faint);padding:6px 8px;border-radius:var(--r-pill)}
.route .beats button:hover{color:var(--ink);background:var(--wash)}
.route .beats .dot{width:14px;height:14px;border-radius:999px;border:1px solid var(--hairline);
  display:grid;place-items:center;font-size:9px;line-height:1;flex:none}
.route .beats li.done button{color:var(--ink-muted)}
.route .beats li.done .dot{border-color:var(--ok);color:var(--ok)}
.route .beats li.here button{color:var(--accent);font-weight:700}
.route .beats li.here .dot{border-color:var(--accent);background:var(--accent-wash)}
.route .say{margin:0;font-size:12.5px;color:var(--ink-muted);line-height:1.5;flex:1;min-width:220px}
@media(max-width:640px){.route .say{flex-basis:100%}}

/* ═══ THE INSPECTOR (PRD §22) — the verdict on a returned result ═══
   Colour carries meaning and nothing else: GREEN only where a gate actually
   passed, AMBER where something is short, RED where the result does not hold
   up, and INK for a gate that could not be checked — because a thing unchecked
   must never wear the colour of a thing that passed.
   Class names are app-scoped on purpose: `.gates` belongs to a PROMOTED registry
   component, and borrowing it here failed the Gavel's anatomy check outright. */
.inspect{border:1px solid var(--hairline);border-left:3px solid var(--ink-faint);border-radius:var(--r-lg);
  background:var(--surface);padding:var(--s-4);margin-top:var(--s-3)}
.inspect.clean{border-left-color:var(--ok)}
.inspect.gaps{border-left-color:var(--warn)}
.inspect.broken{border-left-color:var(--danger)}
.inspect .ih{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:var(--s-3)}
.inspect .ih .lbl{font:600 12px/1 var(--mono);color:var(--accent)}
.inspect .ih .sp{flex:1}
.inspect .tally{font-size:12px;color:var(--ink-muted)}
.inspect .iglist{display:flex;flex-direction:column;gap:6px}
.inspect .igate{display:grid;grid-template-columns:16px 130px 1fr;gap:9px;align-items:baseline;font-size:12.5px}
.inspect .igate .mk{font:700 12px/1.4 var(--mono);text-align:center;color:var(--ink-faint)}
.inspect .igate.pass .mk{color:var(--ok)}
.inspect .igate.warn .mk{color:var(--warn)}
.inspect .igate.fail .mk{color:var(--danger)}
.inspect .igate .gn{font-weight:600;color:var(--ink)}
.inspect .igate .gd{color:var(--ink-muted);line-height:1.5}
/* per-stage contract coverage — the fraction is the point: computed, not claimed */
.inspect .cov{margin-top:var(--s-3);border-top:1px solid var(--hairline);padding-top:var(--s-3);
  display:flex;flex-direction:column;gap:8px}
.inspect .covrow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:12px}
.inspect .covrow .cn{color:var(--accent);font-size:11.5px}
.inspect .covrow .cf{color:var(--ink);font-weight:700;font-size:11.5px}
.inspect .covrow .prose{color:var(--ink-faint);font-style:italic}
.inspect .parts{display:flex;gap:5px;flex-wrap:wrap}
.inspect .part{font-size:11px;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--hairline);white-space:nowrap}
.inspect .part.on{color:var(--ink-muted);background:var(--wash)}
.inspect .part.off{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,#fff);
  background:color-mix(in srgb,var(--danger) 6%,#fff);text-decoration:line-through}
/* the repair round — a diagnosis nobody can act on is half a product */
.inspect .repair{margin-top:var(--s-3);border-top:1px solid var(--hairline);padding-top:var(--s-3);
  display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap}
.inspect .repair b{font-size:13px}
.inspect .repair p{margin:3px 0 0;font-size:12.5px;color:var(--ink-muted);max-width:52ch;line-height:1.55}
.inspect .repair .btnrow{margin-left:auto;margin-top:0}
@media(max-width:640px){
  .inspect .igate{grid-template-columns:16px 1fr;row-gap:2px}
  .inspect .igate .gd{grid-column:2}
  .inspect .repair .btnrow{margin-left:0;width:100%}
}
.stagecard{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);margin-top:var(--s-3)}
.stagecard .sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:var(--s-2)}
.stagecard .sh .lbl{font:600 12px/1 var(--mono);color:var(--accent)}
.stagecard .sh .sp{flex:1}
.md{font-size:13.5px;overflow-wrap:break-word}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:var(--s-4) 0 var(--s-2)}
.md h1{font-size:17px}.md h2{font-size:15.5px}.md h3{font-size:14px}.md h4{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-muted)}
.md p{margin:var(--s-2) 0}
.md ul,.md ol{margin:var(--s-2) 0;padding-left:22px}
.md li{margin:2px 0}
.md blockquote{margin:var(--s-2) 0;border-left:3px solid var(--hairline);padding:2px 0 2px 12px;color:var(--ink-muted)}
.md code{font:450 12px/1.5 var(--mono);background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:1px 5px}
.md pre{background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-3);overflow:auto;margin:var(--s-2) 0}
.md pre code{background:none;border:0;padding:0}
.md table{width:100%;border-collapse:collapse;font-size:12.5px;margin:var(--s-2) 0}
.md th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--hairline)}
.md td{padding:6px 8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.md tr:last-child td{border-bottom:0}

/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
  .console{grid-template-columns:1fr}
  .preview{position:static}
}</style>
</head>

<div id="root"></div>
<script>/*alamehan-boot-guard: a blank page tells nobody anything (2026-07-25).
Records the first error, then judges by OUTCOME: if #root never fills, say so and offer the
one cure a person can act on — wiping THIS app's own saved data. Runs before the module so it
also catches a throw during module evaluation, which is where the real crash lives.*/
(function(){var E=null;addEventListener("error",function(e){E=E||(e&&(e.error&&e.error.stack||e.message))},true);
addEventListener("unhandledrejection",function(e){E=E||(e&&e.reason&&(e.reason.stack||e.reason.message))});
function show(){var r=document.getElementById("root");if(!r||r.children.length)return;
var esc=function(s){return String(s==null?"(no message captured)":s).replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})};
r.innerHTML='<div style="max-width:36rem;margin:11vh auto;padding:0 1.5rem;font:400 15px/1.65 system-ui,-apple-system,sans-serif;color:#171717">'
+'<p style="font:700 12px/1 ui-monospace,monospace;color:#dc2626;letter-spacing:.08em;margin:0 0 1rem">THIS APP DID NOT START</p>'
+'<h1 style="font:800 24px/1.3 system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 .9rem">It stopped before it could draw anything.</h1>'
+'<p style="margin:0 0 1.2rem;color:#525252">Usually a value saved by an older version of this app. Clearing this app&#39;s own saved data fixes it and touches nothing else.</p>'
+'<p style="margin:0 0 1.5rem"><button id="bgw" style="background:#171717;color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 15px system-ui,sans-serif;cursor:pointer">Clear this app&#39;s saved data and reload</button></p>'
+'<p style="margin:0 0 .5rem;font-size:13px;color:#737373">The exact error &mdash; copy this if you report it:</p>'
+'<pre style="margin:0;font:450 12.5px/1.55 ui-monospace,monospace;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;padding:12px;white-space:pre-wrap">'+esc(E)+'</pre></div>';
var btn=document.getElementById("bgw");if(btn)btn.onclick=function(){try{var m=[],i;for(i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("contentos_")===0)m.push(k)}for(i=0;i<m.length;i++)localStorage.removeItem(m[i])}catch(e){}location.reload()}}
addEventListener("load",function(){setTimeout(show,400)});setTimeout(show,2500);})();</script>

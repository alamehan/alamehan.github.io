   which is a place nobody looks for shared rules: product #21 was assembled by copying the
   baseline down to that marker and was therefore born without it, shipping a 58px
   brand→nav overprint at 375px — the same defect this rule was originally written for
   ("all 14 apps did, 29–73px"). A rule every app needs must live where an app cannot be
   made without it. Apps keep their own copy; app.css still wins the cascade, and the
   copies are identical, so this is additive for every existing product. */

     so it is the region that should absorb the squeeze. The name caps at 38vw so a long
     brand can never crowd the nav out entirely. */

   duplication rule is a historical property of the shell CSS, not an ambition. app.css still
   loads last, so a product can restyle a row without touching this file. */
/* the toolbar + facets: they exist only when the content earns them, so they are styled to
   sit quietly above the list rather than to announce themselves */
.sl-bar{display:flex;gap:var(--s-3);align-items:center;padding:var(--s-3) var(--s-5) 0;flex-wrap:wrap}

/* ═══ S5 · the banner: the sentence that names the state, and the way out riding on it ═══
   It used to borrow `.notice.warn` — a primitive built for validation errors — and the borrow
   showed in three places at once: `align-items:flex-start` floated the button up off the text
   baseline, no bottom margin left the room's first heading flush against it, and the button
   sat wherever the sentence happened to end rather than at the edge a reader's eye returns to.
   It is its own surface now, and it reserves its own space: a bar that lands above a room has
   to own the gap under itself, because asking 21 rooms to remember a margin gets 21 answers. */
.samplebar{
  display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  margin:0 0 var(--s-5);padding:11px var(--s-4);
  border-radius:var(--r-md);font-size:12.5px;
  background:color-mix(in srgb,var(--warn) 9%,#fff);
  border:1px solid color-mix(in srgb,var(--warn) 35%,#fff);
  color:#8a5a06;
}
.samplebar .sb-mark{width:15px;height:15px;flex:none;opacity:.8}
/* the sentence takes the room, which is what puts the button at the right edge — no float,
   no auto margin, just the one flexible child a single-row bar is allowed */
.samplebar .sb-txt{flex:1 1 200px;min-width:0;font-weight:500}

   the family was rendering a full-size button inside an 11px bar and calling it small */
.samplebar .btn{flex:none;padding:7px 13px;font-size:12.5px}
@media (max-width:560px){
  /* wrapped, the button is no longer at an edge — so it takes the whole line rather than
     sitting half-way across it, and the tap target grows instead of shrinking */
  .samplebar{align-items:flex-start}
  .samplebar .btn{width:100%;justify-content:center}
}

.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,#fff);background:color-mix(in srgb,var(--ok) 9%,#fff)}
.chip.warn{color:#8a5a06;border-color:color-mix(in srgb,var(--warn) 35%,#fff);background:color-mix(in srgb,var(--warn) 10%,#fff)}
.chip.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,#fff);background:color-mix(in srgb,var(--danger) 7%,#fff)}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,#fff);background:var(--accent-wash)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:var(--s-3)}
.tbl th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--hairline)}
.tbl td{padding:8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel{background:var(--accent-wash)}
.tbl .mono{font-size:11.5px}
q.q{quotes:"“" "”";color:var(--ink);font-style:italic}
mark{background:color-mix(in srgb,var(--accent) 22%,#fff);border-radius:3px;padding:0 2px}

/* docket */
.dropzone{border:1.5px dashed var(--hairline);border-radius:var(--r-lg);padding:var(--s-3);margin-top:var(--s-3)}
.samplebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:var(--s-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.count{font-size:11.5px;color:var(--ink-faint)}

/* ledger split view */
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s-4)}
.srcbox{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-4);max-height:56vh;overflow:auto;white-space:pre-wrap;font-size:13.5px;line-height:1.7}

/* verdict */
.matrix{display:grid;grid-template-columns:220px 1fr;gap:var(--s-5);align-items:start}
.band{display:flex;align-items:center;gap:12px;margin:var(--s-2) 0 var(--s-4)}
.band .medal{font-size:30px}
.band b{font-size:22px;letter-spacing:-.4px}
.band .of{color:var(--ink-faint);font-weight:600}
.axis{margin-bottom:var(--s-3)}
.axis .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.axis .track{height:8px;border-radius:var(--r-pill);background:var(--wash);overflow:hidden}
.axis .fill{height:100%;background:var(--accent);border-radius:var(--r-pill)}
.axis details{margin-top:4px;font-size:12px;color:var(--ink-muted)}
.axis summary{cursor:pointer;color:var(--ink-faint);font-size:11.5px}
.radarbox svg{width:100%;height:auto;display:block}
.qlist{margin-top:var(--s-3)}

/* spike deck cards */
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s-3);margin-top:var(--s-3)}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--elev-1)}
.card .q{font-size:13.5px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}

/* prism lamps */
.lamps{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s-3);margin-top:var(--s-3)}
.hlamp{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px;text-align:center}
.hlamp .big{font-size:20px;display:block}
.hlamp b{font-size:13px}
.hlamp .ev{font-size:11.5px;color:var(--ink-muted);margin-top:4px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s-3);margin-top:var(--s-3)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}

/* shelf */
.shelf-item{display:flex;gap:10px;align-items:center;border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 12px;margin-top:8px;font-size:13px}
.shelf-item .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* modal about-modal/3 + toast + diagram viewer */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 11px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.idcard dt{color:var(--ink-faint)}.idcard dd{margin:0}
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.08)}
.toasts{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--elev-2);animation:fadein var(--t-med)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--danger) 6%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px;flex-wrap:wrap}
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3);flex-wrap:wrap}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block;width:100%;height:100%;max-width:none}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}

/* self-test board */
.st-panel{position:fixed;top:70px;right:16px;width:340px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t .ms{margin-left:auto;color:var(--ink-faint);font:450 11px/1.6 var(--mono)}
.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

@media (max-width:820px){
  .split,.matrix,.grid2{grid-template-columns:1fr}
  .lamps{grid-template-columns:repeat(2,1fr)}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  .lamp{display:none}
  main{padding:var(--s-5) var(--s-3) var(--s-7)}
}</style>

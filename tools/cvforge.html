s:["Sole product designer for the hiring-solutions ecosystem — 13 platforms & products end-to-end (E-Systems, The New E-Systems, E-Staff, E-Hire web & mobile, E-Jobs web & mobile, Resource Portal, Axdif, Payroll Report Dashboard, Elabram.com, Elnex, MCCI), plus brand & campaign design — spanning research, user flows, wireframes, hi-fi mockups, interactive prototypes, and design-to-development handoff.","E-Systems foundations: contract-module flow matched to the real business process; job & applicant recommendation; Data Export/Import simplified and extended with Data Merge; the CRM menu (16 documented flows), Improve Jobs (12), Interview Schedule (17); a boolean-search advanced filter with guided filter-first browsing (iterated V1–V5); an Agreement module reframed around five pillars (overview, flow visualization, flexible navigation, activity log, collaboration) — presented to Business Development & Legal and approved; plus cross-platform refinements from the Document Builder to candidate cards and Jobs-page toasts.","Contract Approval with e-materai, evolved through UAT cycles into 45 documented flows — KAM/HOD approvals, online & offline signing, bulk approve/reject/sign, auto-sign, scheduled and post-hire survey emails (3 & 30 days), a responsive candidate-signature stage, and the end-to-end Contract Correction workflow: a fully transparent revision history, culminating in a 25-step Contract History prototype.","Candidate module: Resume Builder (11 flows incl. custom templates, a template library, and Send CV to Client), Consent Management with clear statuses (8 flows + consent-restriction modals), Candidate History, Get Contact across 3 data cases, an AI Profile Summary (iterated twice, archived for newer AI features), a meticulously iterated comment experience (25 features in 3 flow groups), and soft-linked profiles syncing E-Systems with E-Hire.","Platform-wide systems: a module-based Notification Center revamp, a unified email-template set, admin-configurable Maintenance Mode, six report modules redesigned, a responsive login page with seasonal event banners, File & Asset Management (incl. a white-label AMS demo flow), Master Data/HRIS user management (6 flows), and Invoice Review (7 approver flows).","AI-powered features across Candidates and Jobs: suggestions, quick actions, top picks, customizable prompts; the AI Assistant and Smart Writer re-engineered to Google-Docs-style interactions; detailed Error Modals; and Compact View + Keep-In-View pipelines — sharper recruiter focus, accelerated candidate profiling.","Ongoing: a Recruitment Intelligence Master Data Dictionary synced to the design system, bulk assign-to-recruiter, a 4-type advanced-filter UX with insight views, new table-UI concepts, the Pre-boarding prototype, and N-level module diagrams for Contract & Pre-Boarding.",'The design system, V1 → V2 → AI-ready: 70+ hand-crafted components fully synced to foundations (tiers: Atomic → Basic → Advanced → Panel Content, plus prototype-purpose components, master data, and animated GIF illustrations), slot-based variants without break/detach for a 100% synced system, converted to machine-readable JSON powering both Figma generation and frontend code, with a Figma plugin in development — "the design system becomes the engine, not just the reference."',"E-Staff, the client portal: a minimalist comment feature, a dedicated interview-schedule prototype, Employee History synced from E-Systems for one cross-product experience, and Forgot Password.","E-Hire, redesigned end-to-end: a new design system and functional prototype with built-in product tours; a researched green brand (20 reference apps distilled), a QR-motif logo and a robot mascot; feature design from applicant comparison to bulk interviews; and a WhatsApp Bot apply/follow-up channel launched with the core app. E-Hire Mobile brought QR-based hiring (squircle, glassmorphism, progressive blur) that accelerated retail hiring.","E-Jobs: the AI chatbot experience — profile completion, application tracking, applying, and recommendations in conversation (10 flows) plus Job Recommendation (8 flows) on web; the mobile app redesigned to a clean, minimalist, mobile-first UX with 20+ toasts to PO spec.","Resource Portal (9 flows — contracts, assets, payslips on mobile web) with its companion Resource module in E-Systems; and the Payroll Report Dashboard for compensation tracking.","Corporate web: Axdif landing pages V1 → V2 and beyond (HRIS, AI, pricing, blog, mega menu — responsive throughout, built with Marketing); Elabram.com recreated fully responsive with 4 new AI service pages, complete company pages, and UX fixes down to the cookie banner; the Elnex homepage with SVG service animations and an AI Motion System; and the MCCI custom-platform design replacing a restrictive third-party stack.","Brand & campaign: the E-Systems features banner and seasonal login banners (Chinese New Year, Isra Mi'raj, Idul Fitri, Nyepi, Waisak, Kenaikan Yesus Kristus, Idul Adha) that improved event awareness.","Design ops & collaboration: one master documentation sheet holding 200+ flows across 30+ modules (dramatically faster asset retrieval), DESIGN.md coding-phase standards, weekly design updates, PO & sprint rituals, structured stakeholder walkthroughs, and the internal AI Sharing Sessions — initiated and led for the development team.","Recorded impact: faster approvals with less friction, timely automated candidate feedback, a navigable notification center, consistent cross-system data, sharper recruiter focus through AI adoption, and one cohesive experience across the ecosystem."]},{slug:"codify",fields:{title:"UI/UX Designer — Full Time, Remote",org:"PT Kreasi Kode Digital (Codify), a SURGE subsidiary",period:"Dec 2021 — Apr 2023",location:"Malang"},bullets:["11 product lines, 600+ designed pages across a social-commerce and super-app ecosystem — research, design, and prototyping.","LiniStore, a fully-responsive social-commerce platform with group buying (200+ pages), and LiniSeller, its seller-side storefront builder (100+ pages), end to end.","The Kelola Super App family: Gudang e-commerce fulfillment (120+ pages), Gudang Staff (70+), Paket package delivery (50+), Iklan media-bidding (70+), the Bayar payment-gateway widget, and the Gudang Portal report module.","Promotional landing pages for Kelola Super App and Kelola Gudang; built and maintained two design systems (LiniStore & Kelola Super App).","Led the Kelola Super App rebranding — the master logo plus logos for every Kelola service, with digital assets and brand guidelines for each."]}]},{kind:"experience",slug:"freelance",meta:{title:"Freelance & Clients"},links:[],bullets:[],entries:[{slug:"linden",fields:{title:"Product Designer — AI onboarding chat experience",org:"Linden AI (international, remote)",period:"Jul — Aug 2025"},bullets:['The brief: a calm, single-screen AI onboarding chat — empathetic conversation, smart free-text parsing, lightweight photo uploads, and a signature side deck of profile cards sliding in as real-time progress ("Apple-meets-Notion-meets-AI").',"Quoted $250 for the full concept, scoped to $120 for two states — then delivered a complete interactive prototype including a 3D character, beyond the agreed scope.","The client chose a different product direction but praised the quality, paid in full, and offered a $500/month retainer for continued collaboration."]},{slug:"ichec",fields:{title:"Web Designer & Developer — ICHEC 2022–2024",org:"Indonesia Chemical Engineering Challenge · Institut Teknologi Bandung",period:"Aug 2021 — Oct 2023"},bullets:["Crafted fully-responsive interfaces for three annual event websites, then built and managed all three end to end."]},{slug:"aisc",fields:{title:"Web Designer & Developer — AISC 2023",org:"AIChE Indonesia Student Conference · Universitas Pertamina",period:"Mar — Jun 2023"},bullets:["Designed, built, and managed the fully-responsive conference website for seamless access to event details."]}]},{kind:"awards",slug:"awards",meta:{},links:[],bullets:[],entries:[{slug:"aidea",fields:{title:"🥈 2nd Winner — AIDEA 2026 (company-wide AI innovation competition)",org:"PT Elabram Systems",period:"May — Jun 2026"},bullets:[`"AIdea to Action" — Elabram's company-wide AI innovation campaign (IDR 30,000,000 prize pool); entered as Group 6 with Riyan Trisna Wibowo and took 2nd place (IDR 7,000,000) for a "highly creative and feasible AI solution."`,"The idea: DealCraft AI — a guided, Notion-like legal-negotiation workspace embedded in E-Systems, walking Business Development and Legal through Business Context → Legal Draft → Risk Scan → Client Feedback → Negotiated Revision → Signed Contract → Deal Closed.","AI composes business context, drafts or ingests legal documents, scans for gaps and risky clauses, analyzes multi-channel client feedback (text, email, WhatsApp screenshots, document markups), and generates revisions along a strategic slider (protective · balanced · accommodating) — with a Git-like diff view, executive impact summaries, and ready-to-send replies.","Deliverables: a full self-contained HTML demo (12-stage guided wizard, adaptive split panes, two-way editor/preview sync, zero-disabled interactivity, a technical state machine) specified in a complete PRD, plus final decks in English and Indonesian.","Shortlisted Top 5 → final pitch to Top Management → 2nd Winner, announced company-wide; later cited in the internal Sprint Review as a lesson in UX discipline — after ~10 iterations the flow became properly simple."]}]},{kind:"projects",slug:"sharing",meta:{title:"Knowledge Sharing"},links:[],bullets:[],entries:[{slug:"data-compression",fields:{title:'Sharing session — "Design as Data Compression"',org:"PT Elabram Systems, company-wide"},bullets:["An original metaphor for design's business value: machines run on terabytes, humans on ~1 GB of biological RAM — thick reports are a 600 MB tangled ball that overloads any human audience; good design compresses it into a tidy 50 MB cube, freeing the audience's capacity for the decision itself.",'Core thesis: "Our job is not to force audiences to enlarge their brain capacity, but to compress our message so it fits in human RAM."']},{slug:"cinematic-architect",fields:{title:'AI Showcase — "The Cinematic Architect"',org:"PT Elabram Systems"},bullets:["A 27-page showcase of six original workflow systems, each documented with problem, solution, and reported impact: Diagranimate (cinematic diagram animation, ~4 h → ~2 min, roadmap approval ~3 weeks → ~4 days), Phantom Flow (living prototypes from PRDs with a ghost-user cursor, ~20 h → ~30 min), AutoFigma (no-code Figma automation with a smart-wait sensor, 5×), UX Makeover (an interactive AI dojo with hell-UI simulations, ~16 h → ~5 min), Atlas Engine (research structuring with an anti-hallucination veto, ~15×), and Opus Engine (captivation-first bilingual documentation, up to ~52 writing hours saved per project).",'Closing message: "Stop Working Harder. Start Building Smarter."']},{slug:"built-the-brain",fields:{title:'Sprint review — "How We Built the Brain"',org:"PT Elabram Systems"},bullets:["The design-system → AI pipeline story in five parts: how design work evolved (Raw UI → Design System → AI Generates UI), the new workflow (Design System → JSON rulebook → AI + Figma plugin → generated UI), why precision needs structure — not just prompts, one JSON with two synced outputs (Figma design and frontend code), and why UX still decides whether people actually use what AI builds.","How the brain was built: mapping the Figma API → tokens & variables → component + content JSON with rules → one knowledge base → a custom AI with a dedicated system prompt → generating UI straight into Figma via script."]},{slug:"ai-adoption",fields:{title:"Driving team-wide AI adoption",org:"PT Elabram Systems"},bullets:["Colleagues' recognition of the AI-driven workflow efficiency directly inspired the internal AI Sharing Sessions — training initiated and led for the development team; a regular contributor to AI workshops and structured prototype walkthroughs (incl. a 25-step contract-history presentation)."]}]},{kind:"projects",slug:"frameworks",meta:{title:"Frameworks & Methods"},links:[],bullets:[],entries:[{slug:"visual-to-spec",fields:{title:'Framework PRD — "From Visual to Specification"'},bullets:["A five-phase framework (preparation → visual extraction → structural analysis → specification writing → validation & handoff) converting visual references into complete, buildable PRDs with AI.","Validated end-to-end on e-PRABU, an integrated budget-plan lifecycle platform: a full 8-module PRD with personas, success metrics, project-lifecycle state machines, and a complete AI-generated documentation suite."]},{slug:"three-gate",fields:{title:"The Three-Gate Feature Evaluation Framework"},bullets:[`Routes every proposed feature through Business Value (essential for ~80% of users?) → UX Complexity (is the flow clear?) → Dev Effort (feasible in one sprint?); start from the MVP and simplify relentlessly — "if it's still complicated for stakeholders, imagine the user."`]},{slug:"n-level-diagrams",fields:{title:"Progressive Disclosure Diagramming (N-level diagrams)"},bullets:["Explains complex systems layer by layer — the happy path first, edge cases next, deep dives last; built in Mermaid with a dedicated stakeholder Figma file, applied in production to the E-Systems Contract & Pre-Boarding modules."]},{slug:"json-design-system",fields:{title:"The Machine-Readable Design System (JSON + Figma plugin)"},bullets:["The capstone method: convert the design system to JSON so it is machine-readable and AI-ready; one JSON, two outputs — Figma designs and frontend code — implemented across the development team for pixel-consistent delivery."]},{slug:"design-ops",fields:{title:"Design-ops principles & practices"},bullets:["Distilled from continuous sprint retrospectives: one master documentation sheet; Figma performance hygiene (slot-based variants, instance-first edits pushed to master, the design system in its own library file); Tailwind + Tabler Icons as design-to-code foundations; ASCII-wireframe ideation and JSON-structured AI prompting; periodic freshness research (squircle, glassmorphism, progressive blur) with frontend and stakeholders involved early."]}]},{kind:"projects",slug:"portfolio",meta:{title:"Product Ecosystem"},links:[],bullets:[],entries:[{slug:"alamehan",fields:{title:`The @alamehan product family — ${O8} products · ${K4} executable PRDs`,org:"Personal product ecosystem",period:"2026 — now",link:{label:"Live",url:"https://alamehan.github.io/"}},bullets:["One shared engineering standard — the Alamehan Project Standard: every product ships as a single self-contained HTML file, zero build steps, zero dependencies — designed, specified, and shipped through a self-built factory (a PRD console with 14 deterministic checks, machine-enforced design parity, a one-command release board).","The ecosystem forms a design-to-delivery chain — BizVenture → SpecPilot → ProtoPilot → UXMakeover: from venture idea to specification to self-demonstrating prototype to audited UX — bound by a universal family PRD template.","Every product carries a deliberate identity (emoji, Indonesian codename, accent color, one-line tagline) with documented lineage — the family formally consolidates and supersedes more than a dozen earlier frameworks and tools."]}]},{kind:"education",slug:"education",meta:{},links:[],bullets:[],entries:[{slug:"telkom",fields:{title:"Bachelor of Informatics / Computer Science — GPA 3.61",org:"Telkom University",period:"Aug 2016 — Feb 2021",location:"Bandung"},bullets:["Internship at PT Kong Teknologi Asia, Jakarta — UI/UX.","Final project: classification of orchid species using convolutional neural networks."]},{slug:"sman-cibadak",fields:{title:"Science",org:"SMAN 1 Cibadak, Sukabumi",period:"2013 — 2016"},bullets:["President of the Student Council (OSIS) · Head of the IT Club."]}]},{kind:"certifications",slug:"certs",meta:{},links:[],bullets:[],entries:[{slug:"microsoft-ux",fields:{title:"Microsoft UX Design",org:"Coursera",period:"Sep 2024 — now"},bullets:[]},{slug:"google-ux",fields:{title:"Google UX Design",org:"Coursera",period:"Dec 2023 — now"},bullets:[]},{slug:"uiux-mastery",fields:{title:"UI UX Mastery",org:"Habiskerja",period:"Mar 2023"},bullets:[]},{slug:"ux-designer",fields:{title:"UX Designer",org:"Skillacademy by Ruangguru",period:"Mar 2020"},bullets:[]}]},{kind:"skills",slug:"skills",meta:{title:"Skills & Tools"},links:[],bullets:[],entries:[{slug:"design",fields:{title:"Design"},bullets:["User interface & user experience design · web & mobile app design · design systems · wireframing · prototyping · user flows · responsive design · usability testing · interaction & visual design · design thinking"]},{slug:"ai-stack",fields:{title:"AI-augmented design stack"},bullets:["Claude · Gemini · ChatGPT · Notion AI · NotebookLM — JSON-structured prompting and ASCII-wireframe ideation; Figma API & Figma Agents · machine-readable JSON design systems · custom Figma plugin development · slot-based component architecture · no-code design automation"]},{slug:"motion-prototyping",fields:{title:"Diagramming, motion & prototyping"},bullets:["Mermaid progressive N-level diagrams · cinematic diagram animation · SVG animation systems · AI motion systems · 60 FPS video handoffs · single-file HTML self-demonstrating prototypes with ghost-cursor virtual users · state-machine-driven demos"]},{slug:"tools-code",fields:{title:"Tools & code"},bullets:["Figma · Sketch · Adobe XD · Photoshop · Illustrator · Zeplin · Jira · Trello · Notion · Miro · Slack — HTML · CSS · JavaScript · Tailwind · Bootstrap · WordPress — DESIGN.md coding-phase guidelines"]}]},{kind:"custom",slug:"testimonials",meta:{title:"Testimonials"},links:[],bullets:[],entries:[{slug:"ruston",fields:{title:"Ruston Efendi — Frontend Developer, PT Elabram Systems",org:"LinkedIn recommendation",hide:"pdf"},bullets:['"His ability to translate complex ideas into clean, user-friendly interfaces is impressive… every layout, interaction, and visual element is crafted with care and purpose. Any company would benefit greatly from having someone like him on board."',"Also commended the seamless design-to-development handoff and clear technical communication — implementations perfectly matched design specifications."]},{slug:"attar",fields:{title:"Attar Kusuma — Android Developer, PT Elabram Systems",hide:"pdf"},bullets:[`"One of the people I admire most — for his tidiness, his crazy willingness to share knowledge about AI, and his potential, because he's always eager to learn. Let me know if you ever open an AI class — I'd join right away."`]},{slug:"james",fields:{title:"James Go — Product Owner, PT Elabram Systems",hide:"pdf"},bullets:['"Exceptionally communicative, adaptable, and fast-paced — he consistently delivers high-quality, professional, and polished designs that align with our product goals."']},{slug:"alexius",fields:{title:"Alexius Martin — ITS Manager, PT Elabram Systems",hide:"pdf"},bullets:['"Highly structured, clear, and engaging presentations… a deeply user-centric approach ensuring every design solution effectively addresses real user pain points."']}]},{kind:"custom",slug:"insights",meta:{title:"Insights"},links:[],bullets:[`Motto: "Arete" — striving to fulfill one's fullest potential in every role · INTJ, "The Architect" — strategic, independent, systems-oriented.`,"Character strength: Appreciation of Beauty & Excellence — valuing quality, craft, and skilled performance in every domain; stays current through UI/UX communities, design-system references, and daily AI/design/engineering newsletters.",`"I don't just build things that work. I bleed through endless iterations to forge absolute masterpieces."`],entries:[]}],faces:{pdf:{face:"pdf",meta:{page:"A4",density:"cozy",budget:"5",order:"contact, summary, work, freelan ## Frameworks & Methods

### Framework PRD — "From Visual to Specification"

- A five-phase framework (preparation → visual extraction → structural analysis → specification writing → validation & handoff) converting visual references into complete, buildable PRDs with AI.
- Validated end-to-end on e-PRABU, an integrated budget-plan lifecycle platform: a full 8-module PRD with personas, success metrics, project-lifecycle state machines, and a complete AI-generated documentation suite.

### The Three-Gate Feature Evaluation Framework

- Routes every proposed feature through Business Value (essential for ~80% of users?) → UX Complexity (is the flow clear?) → Dev Effort (feasible in one sprint?); start from the MVP and simplify relentlessly — "if it's still complicated for stakeholders, imagine the user."

### Progressive Disclosure Diagramming (N-level diagrams)

- Explains complex systems layer by layer — the happy path first, edge cases next, deep dives last; built in Mermaid with a dedicated stakeholder Figma file, applied in production to the E-Systems Contract & Pre-Boarding modules.

### The Machine-Readable Design System (JSON + Figma plugin)

- The capstone method: convert the design system to JSON so it is machine-readable and AI-ready; one JSON, two outputs — Figma designs and frontend code — implemented across the development team for pixel-consistent delivery.

### Design-ops principles & practices

- Distilled from continuous sprint retrospectives: one master documentation sheet; Figma performance hygiene (slot-based variants, instance-first edits pushed to master, the design system in its own library file); Tailwind + Tabler Icons as design-to-code foundations; ASCII-wireframe ideation and JSON-structured AI prompting; periodic freshness research (squircle, glassmorphism, progressive blur) with frontend and stakeholders involved early.

.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block;width:100%;height:100%;max-width:none}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ CVForge-specific (custom composites — tokens only, CVFORGE_PRD.md §12) ═══
   Everything below composes registry primitives (.panel/.fields/.field/.btnrow/
   .badge/.notice/.icon-btn) — custom ONLY where no primitive fits: the paginated
   page boxes (Platen), the measured Gauge meter, the entry sub-card, draft cards. */
.deskgrid{display:grid;gap:var(--s-4);grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1024px){.deskgrid{grid-template-columns:210px minmax(0,1fr)}}
.deskwrap{display:grid;gap:var(--s-4);grid-template-columns:minmax(0,1fr)}
.deskwrap .panel+.panel{margin-top:0}
/* the section rail — jump + active highlight (PRD §4.2); chip bar under the navbar on mobile */
.rail{position:sticky;top:calc(var(--header-h) + 12px);display:flex;flex-direction:column;gap:2px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-2);max-height:calc(100vh - 90px);overflow:auto}
.rail .rh{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);padding:6px 8px}
.rail a{font-size:12.5px;color:var(--ink-muted);text-decoration:none;padding:6px 8px;border-radius:var(--r-sm);display:flex;gap:6px;align-items:center;white-space:nowrap;min-width:0}
.rail a .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis} /* long names truncate; the count survives; title= carries the full text */
.rail a:hover{background:var(--wash);color:var(--ink)}
.rail a.on{color:var(--accent);background:var(--accent-wash);font-weight:600}
.rail a .n{margin-left:auto;font:500 10.5px/1 var(--mono);color:var(--ink-faint)}
@media (max-width:1023px){
  .rail{flex-direction:row;top:calc(var(--header-h) + 8px);z-index:6;max-height:none;overflow-x:auto;padding:6px 8px;scrollbar-width:none;box-shadow:var(--elev-1)}
  .rail::-webkit-scrollbar{display:none}
  .rail .rh{display:none}
  .rail a{flex:none;min-width:auto}
  .rail a .n{margin-left:4px}
}
.panel[id^="sec-"]{scroll-margin-top:calc(var(--header-h) + 64px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
/* entries fold to a one-line summary — the wall of fields becomes an outline */
.esum{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.esum b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esum .meta{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.esum .icon-btn.fold{width:26px;height:26px;flex:none}
.esum .icon-btn.fold svg{transform:rotate(90deg);transition:transform var(--t-fast)}
.esum .icon-btn.fold[aria-expanded="false"] svg{transform:rotate(0deg)}
.entry .ebody{margin-top:var(--s-3);border-top:1px dashed var(--hairline);padding-top:var(--s-3)}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:var(--s-2)}
.sechead h2{margin:0;flex:1;min-width:120px}
.seckard{min-width:0}
.seckard.dragover,.entry.dragover{outline:2px dashed var(--accent);outline-offset:2px}
.entry{border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-3) var(--s-4);margin-top:var(--s-3);background:var(--canvas)}
.erow{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:var(--s-3);flex-wrap:wrap}
.hidechip{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1 var(--mono);color:var(--warn);border:1px dashed currentColor;border-radius:var(--r-pill);padding:3px 8px;margin-right:auto}
/* the shared-block .panel+.panel stack margin must not fire inside a grid cell */
.grid2>.panel+.panel{margin-top:0}
/* the seed banner + Desk refusal + undo bar breathe before the editor grid */
#seed-banner,#desk-rf-panel,#undo-bar{margin-bottom:var(--s-4)}
#dk-swap-confirm{margin:0 0 var(--s-3)}
.btnrow.deskops{margin:0 0 var(--s-3);justify-content:flex-end}
/* the add-section picker — the TYPE sets the form; the heading names the section */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s-3)}
.pick{text-align:left;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--canvas);padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color var(--t-fast),background var(--t-fast)}
.pick:hover{border-color:var(--accent);background:var(--accent-wash)}
.pick b{display:block;font-size:13px}
.pick span{display:block;font-size:11.5px;color:var(--ink-muted);margin-top:2px}
/* Vault preset cards */
.presetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s-3)}
.preset{display:flex;gap:12px;align-items:center;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--canvas);padding:12px 14px}
.preset .big{font-size:22px}
.preset .ptext{flex:1;min-width:0}
.preset .ptext b{font-size:13.5px}
.preset .ptext p{margin:2px 0 0;font-size:12px;color:var(--ink-muted)}
/* the rendered MD preview — a small closed grammar (buildMD is the only producer) */
.mdoc{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-5) var(--s-5);max-height:70vh;overflow:auto;font-size:13.5px;line-height:1.65}
.mdoc h1{font-size:20px;margin:0 0 6px}
.mdoc h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-bottom:1.5px solid var(--accent);padding-bottom:3px;margin:18px 0 8px}
.mdoc h3{font-size:13.5px;margin:12px 0 2px}
.mdoc p{margin:4px 0}
.mdoc p.em{font-style:italic;color:var(--ink-muted);font-size:12.5px;margin:0 0 4px}
.mdoc ul{margin:4px 0 8px;padding-left:18px}
.mdoc li{margin:2px 0}
.mdoc a{color:var(--accent)}
/* Press — controls rail left, living preview right (the Desk anatomy, mirrored) */
.pressgrid{display:grid;gap:var(--s-4);grid-template-columns:minmax(0,1fr);align-items:start}
.pressmain{min-width:0}
.presside .mtabs{margin-bottom:var(--s-3);justify-content:center}
.presside .mtabs button{white-space:nowrap}
/* two-column only from 1280, rail 220px — the shell is --maxw:1100 (content 1052), and the
   TRUE-SIZE A4 pagebox (796px incl borders) must fit beside the rail without clipping;
   true size is law (preview geometry == print geometry) — 1052−220−16 = 816 ≥ 796 */
@media (min-width:1280px){
  .pressgrid{grid-template-columns:220px minmax(0,1fr)}
  .presside{position:sticky;top:calc(var(--header-h) + 12px);max-height:calc(100vh - 90px);overflow:auto}
  .presside .presscfg{grid-template-columns:1fr}
}
/* Press — the Gauge meter (measured, never estimated) */
.meter{position:sticky;top:calc(var(--header-h) + 8px);z-index:5;display:flex;align-items:center;gap:var(--s-3);border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:10px 14px;margin-bottom:var(--s-4);box-shadow:var(--elev-1);flex-wrap:wrap}
.meter .bar{flex:1;min-width:120px;height:10px;border:1px solid var(--hairline);border-radius:var(--r-pill);overflow:hidden;background:var(--canvas)}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width var(--t-med)}
.meter.over .bar i{background:var(--warn)}
.meter b{font:700 13px/1 var(--mono);white-space:nowrap}
.meter.over b{color:var(--warn)}
.presscfg{grid-template-columns:repeat(3,minmax(120px,1fr))}
/* the paginated preview — each .pagebox IS one printed page (preview geometry == print geometry) */
.pages{margin-top:var(--s-4);overflow-x:auto;padding-bottom:4px}
.pagebox{background:#fff;color:#111;border:1px solid var(--hairline);box-shadow:var(--elev-2);overflow:hidden;position:relative;margin:0 auto 18px}
.pagebox .pgno{position:absolute;right:10px;bottom:6px;font:500 9px/1 var(--mono);color:#999}
.cvdoc{font-size:12.2px;line-height:var(--cv-lh,1.5);color:#141414}
.cvdoc h1{font-size:21px;margin:0 0 2px}
.cvdoc .hl{font-size:12.5px;color:#333;margin:0 0 2px;font-weight:600}
.cvdoc .contact{font-size:10.5px;color:#444;margin:0 0 10px}
.cvdoc h2{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid #3730a3;color:#3730a3;padding-bottom:2px;margin:12px 0 6px}
.cvdoc .ent{margin:8px 0 0}
.cvdoc ul.cont{margin-top:0} /* bullet chunks read as ONE list across block (and page) seams */
.cvdoc .ent .l1{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:12.4px}
.cvdoc .ent .l1 .per{font-weight:500;color:#444;white-space:nowrap;font-size:11px}
.cvdoc .ent .l2{font-size:11.3px;color:#333}
.cvdoc ul{margin:3px 0 0;padding-left:16px}
.cvdoc li{margin:1.5px 0}
.mdout{font:450 12.5px/1.6 var(--mono);white-space:pre-wrap;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--canvas);padding:var(--s-4);max-height:60vh;overflow:auto;margin-top:var(--s-3)}
/* Vault draft cards — the family .rk card pattern, CVForge fields */
.vaultgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s-4)}
.draft{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--elev-1)}
.draft h3{margin:0;font-size:14.5px}
.draft .sig{font:450 11px/1 var(--mono);color:var(--ink-faint)}
.draft .badge{align-self:flex-start}
.draft .row{display:flex;gap:8px;margin-top:auto;align-items:center;flex-wrap:wrap}
/* Gauge refusal list inside the registry .notice.err */
.refuse ul{margin:6px 0 0;padding-left:18px}
.refuse li{font:450 12px/1.7 var(--mono)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;flex-wrap:wrap}
/* print: each pre-measured pagebox becomes one sheet — the meter IS the printer layout.
   visible-region pattern: only #printhost prints; everything else goes invisible. */
@media print{
  @page{size:auto;margin:0}
  body{background:#fff}
  body *{visibility:hidden}
  #printhost,#printhost *{visibility:visible}
  #printhost{position:absolute;left:0;top:0;width:100%}
  /* collapse the hidden chrome's LAYOUT height — visibility:hidden still occupies space,
     which used to append blank tail sheets (document height = chrome + preview > pageboxes).
     #root is unpositioned, so the absolute #printhost escapes this clip untouched. */
  #root{height:0;overflow:hidden}
  #printhost .pages{display:block;margin:0;padding:0;overflow:visible} /* any leftover slack spills a blank tail sheet */
  #printhost .pagebox{border:none;box-shadow:none;margin:0;page-break-after:always;break-after:page}
  #printhost .pagebox:last-child{page-break-after:auto;break-after:auto}
  #printhost .pgno{display:none}
}
@media (max-width:760px){
  .presscfg{grid-template-columns:1fr}
}
/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
}</style>
</head>

<div id="root"></div>
<script>/*alamehan-boot-guard: a blank page tells nobody anything (2026-07-25).
Records the first error, then judges by OUTCOME: if #root never fills, say so and offer the
one cure a person can act on — wiping THIS app's own saved data. Runs before the module so it
also catches a throw during module evaluation, which is where the real crash lives.*/
(function(){var E=null;addEventListener("error",function(e){E=E||(e&&(e.error&&e.error.stack||e.message))},true);
addEventListener("unhandledrejection",function(e){E=E||(e&&e.reason&&(e.reason.stack||e.reason.message))});
function show(){var r=document.getElementById("root");if(!r||r.children.length)return;
var esc=function(s){return String(s==null?"(no message captured)":s).replace(/[<>&]/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})};
r.innerHTML='<div style="max-width:36rem;margin:11vh auto;padding:0 1.5rem;font:400 15px/1.65 system-ui,-apple-system,sans-serif;color:#171717">'
+'<p style="font:700 12px/1 ui-monospace,monospace;color:#dc2626;letter-spacing:.08em;margin:0 0 1rem">THIS APP DID NOT START</p>'
+'<h1 style="font:800 24px/1.3 system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 .9rem">It stopped before it could draw anything.</h1>'
+'<p style="margin:0 0 1.2rem;color:#525252">Usually a value saved by an older version of this app. Clearing this app&#39;s own saved data fixes it and touches nothing else.</p>'
+'<p style="margin:0 0 1.5rem"><button id="bgw" style="background:#171717;color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 15px system-ui,sans-serif;cursor:pointer">Clear this app&#39;s saved data and reload</button></p>'
+'<p style="margin:0 0 .5rem;font-size:13px;color:#737373">The exact error &mdash; copy this if you report it:</p>'
+'<pre style="margin:0;font:450 12.5px/1.55 ui-monospace,monospace;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;padding:12px;white-space:pre-wrap">'+esc(E)+'</pre></div>';
var btn=document.getElementById("bgw");if(btn)btn.onclick=function(){try{var m=[],i;for(i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("cvforge_")===0)m.push(k)}for(i=0;i<m.length;i++)localStorage.removeItem(m[i])}catch(e){}location.reload()}}
addEventListener("load",function(){setTimeout(show,400)});setTimeout(show,2500);})();</script>

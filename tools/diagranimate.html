  <style rel="stylesheet" crossorigin>/* ═══ packages/ui/tokens.css — design-system-standard@2.0.0 §2–§4 as CSS variables ═══
   THE shared design layer. Apps override exactly TWO variables in their theme.css:
     --accent  and  --accent-active   (their registered pair from 06-ledger/project-roster.md)
   Everything else here is identical family-wide. Never fork; never add a second accent. */
:root{
  /* §2 color — neutrals (Tailwind `neutral`, true gray) */
  --canvas:#fafafa; --surface:#ffffff; --hairline:#e5e5e5; --wash:#f5f5f5;
  --ink:#171717; --ink-muted:#737373; --ink-faint:#a3a3a3;
  /* §2 the ONE accent — placeholder pair;each app overrides in theme.css */
  --accent:#0d9488; --accent-active:#0f766e; --on-accent:#ffffff;
  --accent-wash:color-mix(in srgb, var(--accent) 8%, #ffffff);
  /* §2 semantics — state only, never brand */
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  /* §3 type scale (Fustat everywhere) */
  --font:"Fustat",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-display:700 28px/1.2 var(--font); --t-h1:700 22px/1.25 var(--font);
  --t-h2:600 18px/1.3 var(--font);      --t-h3:600 15px/1.4 var(--font);
  --t-body:400 14px/1.55 var(--font);   --t-small:400 12.5px/1.5 var(--font);
  --t-caption:500 11.5px/1.4 var(--font); --t-mono:450 12.5px/1.5 var(--mono);
  /* §4 shape · space · elevation · motion */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --elev-1:0 1px 2px rgba(23,23,23,.06); --elev-2:0 8px 30px rgba(23,23,23,.12);
  --header-h:56px; --maxw:1100px;
  --t-fast:120ms cubic-bezier(.2,.8,.4,1); --t-med:200ms cubic-bezier(.2,.8,.4,1);
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
/* ═══ @alamehan/ui/custom/surfaces.css — the three family surfaces, styled ═══
   COPIED VERBATIM from the living exemplar apps/zapseed/zapseed.html (family law:
   copy, never re-derive). Any change here must first change the exemplar + parity gate.
   Covers: .site-header/.brand/nav.rooms/.hright/.langsw/.icon-btn/.site-footer (§7),
   .overlay/.modal/.mh/.mtabs/.mpane/.authorcard (§8 about-modal/3), .chip, .dgfs viewer. */
/* ═══ shell: navbar §7 · footer ═══ */
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tile{width:28px;height:28px;background:var(--wash);border-radius:var(--r-md);display:grid;place-items:center;font-size:16px;flex:none}
.brand b{font-size:15px;font-weight:700}
.brand .ver{font-size:11.5px;font-weight:500;color:var(--ink-faint)}
nav.rooms{display:flex;gap:2px;margin:0 auto;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
nav.rooms a{font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;position:relative}
nav.rooms a:hover{color:var(--ink);background:var(--wash)}
nav.rooms a[aria-current]{color:var(--accent);font-weight:600}
nav.rooms a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent)}

nav.rooms a .stepdone{color:var(--ok);font-weight:700;margin-left:2px}

/* §11 — the navbar's responsive law, PROMOTED INTO THE SHARED SURFACE 2026-07-26.
   It had lived only in each app's own app.css, below that file's "<app>-specific" marker,
   which is a place nobody looks for shared rules: product #21 was assembled by copying the
   baseline down to that marker and was therefore born without it, shipping a 58px
   brand→nav overprint at 375px — the same defect this rule was originally written for
   ("all 14 apps did, 29–73px"). A rule every app needs must live where an app cannot be
   made without it. Apps keep their own copy; app.css still wins the cascade, and the
   copies are identical, so this is additive for every existing product. */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* identity holds its width, navigation yields — nav.rooms already has its own scroll,
     so it is the region that should absorb the squeeze. The name caps at 38vw so a long
     brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
}
.hright{display:flex;align-items:center;gap:var(--s-3);flex:none}
.langsw{display:flex;border:1px solid var(--hairline);border-radius:var(--r-pill);overflow:hidden}
.langsw button{border:0;background:var(--surface);font:600 11.5px/1 var(--font);letter-spacing:.04em;padding:7px 10px;cursor:pointer;color:var(--ink-muted)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.icon-btn{width:32px;height:32px;border:1px solid var(--hairline);background:var(--surface);border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--ink-muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.site-footer{border-top:1px solid var(--hairline);background:var(--surface);margin-top:var(--s-7)}
.site-footer .in{max-width:var(--maxw);margin:0 auto;padding:var(--s-4) var(--s-5);font-size:12.5px;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
/* ── must_fix standardization: icon scale (§1b) · sticky footer (§7) ── */
/* any sprite-backed <svg> (direct child <use>) not sized by a more specific rule
   renders at icon scale, never the 300×150 SVG replaced-element default */
svg:has(>use){width:16px;height:16px;flex:none;vertical-align:-3px}
/* shell fills ≥viewport → footer rests at the bottom on short pages, flows below on long ones */
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#root>main{flex:1 0 auto;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 10px;font-size:12.5px}
.chip .x{cursor:pointer;color:var(--ink-faint);border:0;background:none;font-size:13px;padding:0;line-height:1}
.chip .x:hover{color:var(--danger)}
/* modal §8 + toast */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}

/* ═══ samples/1 — the family's worked-example list (01-standards/18-samples-standard.md) ══
   Lives ONLY here, not duplicated into 21 app.css files: it is a new shared surface, and the
   duplication rule is a historical property of the shell CSS, not an ambition. app.css still
   loads last, so a product can restyle a row without touching this file. */
/* the toolbar + facets: they exist only when the content earns them, so they are styled to
   sit quietly above the list rather than to announce themselves */
.sl-bar{display:flex;gap:var(--s-3);align-items:center;padding:var(--s-3) var(--s-5) 0;flex-wrap:wrap}
.sl-search{position:relative;flex:1 1 220px;min-width:0}
.sl-search input{width:100%;padding-right:34px}
.sl-search .sl-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;background:none;color:var(--ink-faint);cursor:pointer;border-radius:var(--r-sm);font-size:13px;line-height:1}
.sl-search .sl-x:hover{color:var(--ink);background:var(--wash)}
.sl-tags{display:flex;flex-wrap:wrap;gap:6px;padding:var(--s-3) var(--s-5) 0}
.sl-tags .chip{cursor:pointer;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-muted)}
.sl-tags .chip:hover{color:var(--ink);border-color:var(--ink-faint)}
.sl-tags .chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sl-count{margin:0 0 var(--s-2);font:450 12px/1.4 var(--font);color:var(--ink-faint);min-height:1em}

/* ═══ S5 · the banner: the sentence that names the state, and the way out riding on it ═══
   It used to borrow `.notice.warn` — a primitive built for validation errors — and the borrow
   showed in three places at once: `align-items:flex-start` floated the button up off the text
   baseline, no bottom margin left the room's first heading flush against it, and the button
   sat wherever the sentence happened to end rather than at the edge a reader's eye returns to.
   It is its own surface now, and it reserves its own space: a bar that lands above a room has
   to own the gap under itself, because asking 21 rooms to remember a margin gets 21 answers. */
.samplebar{
  display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  margin:0 0 var(--s-5);padding:11px var(--s-4);
  border-radius:var(--r-md);font-size:12.5px;
  background:color-mix(in srgb,var(--warn) 9%,#fff);
  border:1px solid color-mix(in srgb,var(--warn) 35%,#fff);
  color:#8a5a06;
}

.dgfs.open{display:flex}

.dgfs .cnv svg{display:block;width:100%;height:100%;max-width:none}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}/* ═══ Diagranimate app CSS — DIAGRANIMATE_PRD.md §15 · design-system-standard@2.0.0 ═══
   Shared blocks (tokens · shell · forms · buttons · badges · notice · table · modal ·

/* ═══ [A] TOKENS — design-system-standard@2.0.0 §2–§4, accent = Diagranimate violet-600 ═══ */
:root{

  --ink:#171717; --ink-muted:#737373; --ink-faint:#a3a3a3;
  --accent:#7c3aed; --accent-active:#6d28d9; --on-accent:#ffffff;
  --accent-wash:color-mix(in srgb, var(--accent) 8%, #ffffff);
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --elev-1:0 1px 2px rgba(23,23,23,.06);
  --elev-2:0 8px 30px rgba(23,23,23,.12);
  --header-h:56px; --maxw:1100px;
  --t-fast:120ms cubic-bezier(.2,.8,.4,1); --t-med:200ms cubic-bezier(.2,.8,.4,1);

}

/* ═══ shell: navbar §7 · footer — registry-verbatim ═══ */

.transport .sp{flex:1}
.transport .icon-btn[aria-pressed="true"]{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--accent)}
.transport .icon-btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.transport .btn:disabled{opacity:.5;cursor:not-allowed}
.speedwrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.speedwrap input[type=range]{width:90px;accent-color:var(--accent);cursor:pointer}
/* the ▶ "press me" whisper — once per session on a fresh demo (PRD §15.5.3) */
@keyframes dgm-breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.breathe{animation:dgm-breathe 1s ease-in-out 3}

/* beacon color popover */
.bpop{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-2);padding:var(--s-3);z-index:50;display:flex;flex-direction:column;gap:8px;width:210px}
.bpop .swrow{display:flex;gap:6px;flex-wrap:wrap}
.bpop button.swatch{width:22px;height:22px;cursor:pointer;padding:0}
.bpop button.swatch[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.popwrap{position:relative}

/* studio split: panel + stage (PRD §4.2) */
.dgm-main{display:flex;align-items:stretch;min-height:0;height:calc(100vh - var(--header-h) - 53px)}
.dgm-panel{width:380px;flex:none;border-right:1px solid var(--hairline);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.dgm-panel.closed{display:none}
.dgm-panel .phead{display:flex;gap:8px;align-items:center;padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--hairline)}
.dgm-panel .pbody{flex:1;overflow:auto;padding:var(--s-3) var(--s-4)}
.dgm-panel .pfoot{display:flex;gap:8px;align-items:center;padding:var(--s-3) var(--s-4);border-top:1px solid var(--hairline)}

/* state cards — accordion (PRD §12.1) */
.scard{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);margin-bottom:var(--s-2);overflow:visible}
.scard.active{border-left:3px solid var(--accent)}
.scard .shead{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
.scard .shead .caret{color:var(--ink-faint);transition:transform var(--t-fast)}
.scard.open .shead .caret{transform:rotate(90deg)}
.scard .shead .badges{display:flex;gap:4px;margin-left:auto;align-items:center}
.scard .sbody{display:none;padding:0 10px 10px}
.scard.open .sbody{display:block}
.scard textarea{min-height:120px}
.scard .smenu{position:relative}
.scard .sdrop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-2);z-index:50;display:flex;flex-direction:column;min-width:150px;padding:4px}
.scard .sdrop button{border:0;background:none;text-align:left;font:500 13px/1.4 var(--font);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink);display:flex;gap:8px;align-items:center}
.scard .sdrop button:hover{background:var(--wash)}
.scard .sdrop button:disabled{color:var(--ink-faint);cursor:not-allowed}
.scard .sdrop button.del{color:var(--danger)}

/* the stage (PRD §4.2) */
.dgm-stage{flex:1;position:relative;overflow:hidden;background:var(--canvas);min-width:0}
.dgm-stage svg#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.dgm-stage svg#scene.panning{cursor:grabbing}
.dgm-stage.playing svg#scene{cursor:default}

/* overlays carry data-overlay; the eye toggle fades them together (PRD §11) */
[data-overlay]{transition:opacity var(--t-fast)}
.ui-hidden [data-overlay]{opacity:0;pointer-events:none}

/* stats badge (PRD §11.1) */
.stats{position:absolute;top:var(--s-3);left:var(--s-3);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);box-shadow:var(--elev-1);padding:6px 12px;font:500 12px/1.4 var(--font);color:var(--ink-muted);display:flex;gap:10px;align-items:center;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden}
.stats b{color:var(--ink);font-weight:600}
.stats .plus{color:var(--ok);font-weight:600}
.stats .min{color:var(--danger);font-weight:600}
.stats .stt{font-weight:700;letter-spacing:.04em;font-size:11px;text-transform:uppercase;color:var(--ink-faint)}
.stats button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-faint);display:grid;place-items:center}
.stats.collapsed .full{display:none}

/* zoom cluster (PRD §11.2) — hover/focus-reveal */
.zoomcl{position:absolute;top:var(--s-3);right:var(--s-3);display:flex;flex-direction:column;gap:6px;opacity:.25;transition:opacity var(--t-fast)}
.zoomcl:hover,.zoomcl:focus-within{opacity:1}
.zoomcl .popwrap .bpop{right:calc(100% + 6px);top:0}

/* search bar (PRD §11.4) */
.searchbar{position:absolute;top:var(--s-3);left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-2);padding:6px 8px;z-index:30}
.searchbar.open{display:flex}
.searchbar input{width:180px;border:0;padding:5px 6px;font-size:13px}
.searchbar input:focus{outline:none;border:0}
.searchbar .cnt{font:500 11.5px/1 var(--mono);color:var(--ink-faint);min-width:36px;text-align:center}

/* minimap (PRD §11.3) */
.minimap{position:absolute;right:var(--s-3);bottom:56px;width:160px;height:120px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-1);opacity:.8;transition:opacity var(--t-fast);overflow:hidden;pointer-events:auto}
.minimap:hover{opacity:1}
.minimap svg{display:block;width:100%;height:100%}

/* bottom toolbar — floating pill (PRD §11.5) */
.dgm-toolbar{position:absolute;left:50%;bottom:var(--s-3);transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);box-shadow:var(--elev-1);padding:6px 12px;z-index:20;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
.dgm-toolbar label{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.dgm-toolbar select{width:auto;padding:5px 30px 5px 8px;font-size:12.5px;border-radius:var(--r-sm)}
.dgm-toolbar input[type=range]{width:80px;accent-color:var(--accent);cursor:pointer}
.dgm-toolbar:has(select:disabled){opacity:.55}

/* scrubber — the Reel made visible (PRD §10.2) */
.scrubwrap{position:absolute;left:0;right:0;bottom:0;display:none;z-index:25;padding:0}
.scrubwrap.on{display:block}
.scrubwrap input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;margin:0;background:transparent;cursor:pointer}
.scrubwrap input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--accent) 0 var(--scrub,0%),var(--hairline) var(--scrub,0%) 100%)}
.scrubwrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:-4.5px;box-shadow:var(--elev-1)}
.scrubwrap input[type=range]::-moz-range-track{height:3px;background:var(--hairline)}
.scrubwrap input[type=range]::-moz-range-progress{height:3px;background:var(--accent)}
.scrubwrap input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--accent)}

/* REC chip (PRD §13.2) — chrome, never in the video */
.recchip{position:absolute;top:var(--s-3);left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:6px 14px;font:600 12px/1 var(--mono);z-index:35;box-shadow:var(--elev-2)}
.recchip .dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
@keyframes dgm-blink{50%{opacity:.25}}
.recchip .dot{animation:dgm-blink 1.2s step-end infinite}

/* first-run hint (PRD §2.2) */
.hintline{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 14px;font-size:12.5px;color:var(--ink-muted);box-shadow:var(--elev-1);z-index:15;white-space:nowrap}

/* stage teaching empty state (PRD §12.3) */
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;z-index:10}
.stage-empty .card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-1);padding:var(--s-5) var(--s-6);text-align:center;max-width:340px}

/* export modal internals */
.exgrid{display:flex;gap:var(--s-3);flex-wrap:wrap;margin-top:var(--s-3)}
.exopt{flex:1;min-width:140px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);cursor:pointer;text-align:left;font:inherit}
.exopt:hover{border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.exopt[aria-pressed="true"]{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.exopt b{display:block;font-size:13.5px;margin-bottom:2px}
.exopt span{font-size:12px;color:var(--ink-muted)}

/* samples room */
.smpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s-4);margin-top:var(--s-4)}
.smp{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--elev-1)}
.smp h3{margin:0;font-size:14.5px}
.smp p{margin:0;font-size:12.5px;color:var(--ink-muted);flex:1}
.smp .row{display:flex;gap:8px;align-items:center;margin-top:auto}
.smp .badges{display:flex;flex-wrap:wrap;gap:4px}

/* prompts room (the AI Prompt Arsenal, PRD §14) */
.parsenal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s-4);margin-top:var(--s-4)}
.parsenal .pcard{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column}
.parsenal .pcard h3{margin:0 0 6px;font-size:14.5px}
.parsenal .pcard p{margin:0 0 var(--s-3);font-size:12.5px;color:var(--ink-muted)}
.parsenal .pcard pre.code{flex:1;max-height:220px;font-size:11px}

/* confetti — the one sanctioned celebration (PRD §15.5.2) */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
}
/* responsive — Diagranimate stage (§11 gate 375×667: panel stacks, stage keeps the width) */
@media (max-width:820px){
  main.wide{padding:0}
  .dgm-main{flex-direction:column;height:auto}
  .dgm-panel{width:100%;border-right:0;border-bottom:1px solid var(--hairline);max-height:40vh}
  /* flex:none — with flex-basis:0 the explicit height would be ignored and the stage collapses */
  .dgm-stage{flex:none;height:52vh}
  .transport{padding:var(--s-2) var(--s-3)}
  .minimap{display:none}
  .stats{max-width:calc(100% - 24px);font-size:11px}
}</style>

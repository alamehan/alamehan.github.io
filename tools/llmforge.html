use — dense, fast, keyboard-first — not on whether it technically has a board.",prompt:{version:1,checksum:"",text:["Build ONE self-contained HTML file: an issue tracker for a small software team.","","REQUIREMENTS",'- Seed it with 20 to 40 realistic issues. Mark each: data-issue="<id>" (unique).',"  Realistic means real-sounding titles, mixed states, assignees, labels, priorities, dates.","- TWO views over the same data, both real: a Board (drag between columns) and a List","  (sortable, dense, scannable). Switching views never loses state.","- Full CRUD: create, read, update, delete an issue. Every change persists (localStorage,","  try/catch wrapped) and survives reload.","- A command palette on Cmd/Ctrl+K that does real work: jump to an issue, change status,","  assign, create, filter. Not a decorative search box.","- Filtering and search that stack sensibly. An empty state that is honest and useful.","- Density is the point: this should look like a tool for people who live in it all day,","  not a marketing page for a tool. A real design system: one scale, one palette, one radius.","- Keyboard-first: navigate and act without touching the mouse.","",$n].join(`
`)},minimums:[{id:"issues",label:"20–40 seeded issues",check:"auto",token:"data-issue",op:"between",value:20,max:40},{id:"views",label:"Board + List, both real",check:"manual"},{id:"palette",label:"⌘K palette that does real work",check:"manual"},{id:"crud",label:"Full CRUD, persisted",check:"manual"}],rubric:{weights:{a1:15,a2:15,a3:15,a4:20,a5:15,a6:10,a7:10},anchors:{a1:{1:"A to-do list wearing an issue tracker's clothes.",3:"Competent and complete; nothing about it is memorable.",5:"One feature makes you want to use it for real work tomorrow."},a2:{1:"CRUD breaks, drag drops issues into the void, or state desyncs between views.",3:"Works; small desyncs or an edge case that loses an edit.",5:"Every operation is correct in both views, persists, and never loses a keystroke."},a3:{1:"Fewer than 20 issues, one view, or no palette.",3:"All present; the palette is thin or the board is decorative.",5:"All minimums genuinely met — the board drags, the list sorts, the palette acts."},a4:{1:"Bootstrap defaults.",3:"Clean, consistent, a little generic.",5:"Immaculate and dense. It could ship. Nothing is accidental."},a5:{1:"Mouse only.",3:"Palette works; some shortcuts.",5:"A power user never touches the mouse: j/k, shortcuts, palette, focus discipline."},a6:{1:"Everything in one function; state mutated ad hoc.",3:"Views separated; a state object exists.",5:"One state, one render path, a clear data layer — a stranger could add a Sprint field."},a7:{1:"Blows up if storage is blocked; unusable on a phone.",3:"Storage guarded; mobile is cramped but works.",5:"Storage try/catch wrapped, honest empty and error states, genuinely usable at 390px."}}},gates:["g1","g2","g3","g4","g5","g6","g7","g8"]},Jm=[Wp,Ip,Fp,$p,Pp],Ee=["a1","a2","a3","a4","a5","a6","a7"],Dm={a1:100,a2:84,a3:68,a4:54,a5:40,a6:28,a7:16},il=[{id:"c1",name:"Claude",where:"claude.ai"},{id:"c2",name:"ChatGPT",where:"chatgpt.com"},{id:"c3",name:"Gemini",where:"gemini.google.com"},{id:"c4",name:"Mimo",where:"mimo.ai"},{ /* diagram tab (about-modal/3) + fullscreen viewer — registry-verbatim */
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block;width:100%;height:100%;max-width:none}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ promoted composites — registry-verbatim (packages/ui/components.md) ═══ */
.dials{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:flex-end;margin-top:var(--s-4)}
.dials .field{min-width:150px;flex:1}
.togglebox{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 11px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);cursor:pointer;user-select:none}
.togglebox input{width:auto;accent-color:var(--accent)}
/* .gates — the lint/gate board (promoted at product #15). A row always carries its reason. */
.gates{border:1px solid var(--hairline);border-radius:var(--r-md);margin-top:var(--s-3);overflow:hidden}
.gates .row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--hairline);font-size:13px}
.gates .row:last-child{border-bottom:0}
.gates .row .st{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.gates .row.pass .st{background:color-mix(in srgb,var(--ok) 12%,#fff);color:var(--ok)}
.gates .row.warn .st{background:color-mix(in srgb,var(--warn) 14%,#fff);color:var(--warn)}
.gates .row.fail .st{background:color-mix(in srgb,var(--danger) 10%,#fff);color:var(--danger)}
.gates .row .g{font:600 11.5px/1.4 var(--mono);color:var(--ink);flex:none;min-width:26px}
.gates .row .why{color:var(--ink-muted);font-size:12.5px}
.gate-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:var(--s-3)}

/* ═══ LLMForge composites — tokens only, namespaced (§II.1) ═══ */

/* Trials · the trial cards */
.trials{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s-4);margin-top:var(--s-4)}
.trial{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--elev-1);text-align:left;cursor:pointer;font:inherit;color:inherit}
.trial:hover{border-color:var(--accent);box-shadow:var(--elev-2)}
.trial.open{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.trial h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.trial .tid{font:600 10.5px/1 var(--mono);color:var(--ink-faint)}
.trial .tests{font-size:12.5px;color:var(--ink-muted);margin:0}
.trial .mins{display:flex;flex-wrap:wrap;gap:4px}
.trial .foot{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.sum{font:450 11px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);border-radius:var(--r-pill);padding:3px 8px}

/* Trials · the weight bar — turns prose weighting into visible math (D3, fixes F3) */
.weights{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;border:1px solid var(--hairline);margin-top:6px}
.weights span{display:block;height:100%;border-right:1px solid var(--surface)}
.weights span:last-child{border-right:0}
.wlegend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11px;color:var(--ink-muted)}
.wlegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* Arena · the sandbox — the ONLY dark chrome in the app (§3: reserved for the render frame) */
.sandbox{border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;margin-top:var(--s-3);background:var(--wash)}
.sandbox .bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--ink);color:#fff;font-size:12px;flex-wrap:wrap}
.sandbox .bar .sp{flex:1}
.sandbox .bar .vp{display:flex;gap:2px;border:1px solid rgba(255,255,255,.2);border-radius:var(--r-pill);overflow:hidden}
.sandbox .bar .vp button{border:0;background:none;color:rgba(255,255,255,.7);font:600 11px/1 var(--mono);padding:6px 9px;cursor:pointer}
.sandbox .bar .vp button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sandbox .bar .kill{border:1px solid color-mix(in srgb,var(--danger) 60%,#fff);background:none;color:color-mix(in srgb,var(--danger) 60%,#fff);border-radius:var(--r-sm);font:600 11px/1 var(--font);padding:6px 9px;cursor:pointer}
.sandbox .bar .kill:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.sandbox .stage{display:grid;place-items:start center;padding:var(--s-3);overflow:auto;max-height:60vh;background:repeating-conic-gradient(var(--wash) 0% 25%,var(--surface) 0% 50%) 50%/16px 16px}
.sandbox iframe{border:1px solid var(--hairline);background:#fff;height:52vh;display:block;transition:width var(--t-med)}
.sandbox .killed{padding:var(--s-6);text-align:center;color:var(--ink-muted);font-size:13px}

/* Arena · run cards */
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s-3);margin-top:var(--s-3)}
.run{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);display:flex;flex-direction:column;gap:6px}
.run.dq{border-left:3px solid var(--danger)}
.run.valid{border-left:3px solid var(--ok)}
.run h4{margin:0;font-size:13.5px}
.run .sig{font:450 10.5px/1 var(--mono);color:var(--ink-faint)}
.run .row{display:flex;gap:6px;align-items:center;margin-top:auto;flex-wrap:wrap}

/* Judging · the anchored scorecard */
.axis{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-4);margin-top:var(--s-3)}
.axis.done{border-color:color-mix(in srgb,var(--accent) 40%,#fff)}
.axis h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.axis .w{font:600 10.5px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border-radius:var(--r-pill);padding:3px 7px}
.axis .ask{font-size:12.5px;color:var(--ink-muted);margin:0 0 var(--s-3)}
.anchors{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-2);margin-bottom:var(--s-3)}
.anchor{border:1px solid var(--hairline);border-radius:var(--r-sm);padding:8px 10px;font-size:11.5px;color:var(--ink-muted);background:var(--wash)}
.anchor b{display:block;color:var(--ink);font:600 11px/1 var(--mono);margin-bottom:3px}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{width:40px;height:36px;border:1px solid var(--hairline);background:var(--surface);border-radius:var(--r-md);font:700 14px/1 var(--font);color:var(--ink-muted);cursor:pointer}
.scale button:hover{border-color:var(--ink-faint)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale button:disabled{opacity:.55;cursor:not-allowed}
.evneed{border-color:color-mix(in srgb,var(--warn) 50%,#fff)}
/* the manual-minimum row: a three-state decision (Present / Missing / undecided), because a
   two-state checkbox cannot express "missing" and would make G10's cap unreachable */
.minrow{display:flex;gap:var(--s-3);align-items:center;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:9px 11px;margin-top:8px;font-size:13px;flex-wrap:wrap}
.minrow .sp{flex:1}
.minrow .scale button{width:auto;height:30px;padding:0 10px;font:600 11.5px/1 var(--font)}

/* Judging · the live weighted total */
.total{position:sticky;top:calc(var(--header-h) + 8px);z-index:20;border:1px solid var(--accent);border-radius:var(--r-lg);background:var(--accent-wash);padding:var(--s-4);display:flex;gap:var(--s-4);align-items:center;flex-wrap:wrap}
.total .n{font:800 30px/1 var(--font);color:var(--accent)}
.total .of{font-size:12.5px;color:var(--ink-muted)}
.total .sp{flex:1}
.mask{font:600 12px/1 var(--mono);background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:5px 10px}

/* Podium · leaderboard + medals */
.board{overflow-x:auto}
.board .tbl{min-width:640px}
.board .tbl td.n{font:600 12.5px/1 var(--mono)}
.rank{font:800 14px/1 var(--font);color:var(--ink-faint)}
.rank.g{color:#b45309}.rank.s{color:#71717a}.rank.b{color:#92400e}
.medals{display:flex;gap:4px}
.pv{font:450 10.5px/1 var(--mono);color:var(--ink-faint)}
.quota{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-muted);margin-top:var(--s-3)}
.track{height:8px;border-radius:var(--r-pill);background:var(--wash);overflow:hidden;flex:1;max-width:240px}
.track .fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width var(--t-med)}
.track .fill.warn{background:var(--warn)}
.track .fill.bad{background:var(--danger)}

/* responsive §11 — registry-verbatim + the LLMForge grids that must stack */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11.1: identity holds, navigation yields — without this the brand overprints the rooms */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
  .anchors{grid-template-columns:1fr}
  /* the sandbox stage scrolls its own axis — the artifact's width must never
     become the APP's horizontal scroll (AC13) */
  .sandbox .stage{overflow-x:auto}
}</style>
</head>
<body>
<div id="root"></div>
<script data-goatcounter="https://alamehan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>

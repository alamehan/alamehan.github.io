.meta{font:450 11.5px/1.6 ui-monospace,Consolas,monospace;color:var(--ink-faint)}
.crumb{font-size:12px;color:var(--ink-muted);margin:6px 0 0}
details{margin:2px 0;padding-left:14px;border-left:1px solid var(--hairline)}
summary{cursor:pointer;padding:3px 0;font-weight:500}
.kids{padding-left:6px}
.leaf{padding:2px 0 2px 20px}
.note{margin:2px 0 4px 20px;padding:5px 10px;border-left:3px solid var(--hairline);background:var(--wash);font-size:12.5px;color:var(--ink-muted);border-radius:0 6px 6px 0}
.mk,.lnk,.badge{display:inline-block;font-size:10.5px;font-weight:600;border:1px solid var(--hairline);background:var(--wash);color:var(--ink-muted);border-radius:999px;padding:0 6px;vertical-align:1px}
.mk-core{background:#eef2ff;border-color:#c7d2fe;color:var(--ink)}
.mk-q{color:var(--warn);border-color:var(--warn)}
.mk-bang{color:var(--danger);border-color:var(--danger)}
.mk-gap{color:var(--warn);border-color:var(--warn)}
.mk-fix{color:var(--danger);background:#fef2f2;border-color:#fecaca}
.lnk{color:var(--accent)}
.legend{margin-top:24px;padding-top:12px;border-top:1px solid var(--hairline);font-size:11.5px;color:var(--ink-muted)}
.foot{margin-top:8px;font-size:11px;color:var(--ink-faint)}
@media print{details{border-left-color:#bbb}}

.badge.accent{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--accent)}

/* buttons — registry-verbatim */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 13.5px/1 var(--font);border-radius:var(--r-md);padding:10px 16px;cursor:pointer;border:1px solid transparent;transition:background var(--t-fast),box-shadow var(--t-fast)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-active)}
.btn.primary:disabled{background:var(--hairline);color:var(--ink-faint);cursor:not-allowed}
.btn.secondary{background:var(--surface);border-color:var(--hairline);color:var(--ink)}
.btn.secondary:hover{border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.btn.ghost{background:none;color:var(--ink-muted);border:0;padding:8px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--wash)}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 40%,#fff);color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 6%,#fff)}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center;margin-top:var(--s-4)}
.btn svg,.icon-btn svg{width:15px;height:15px;flex:none}
/* ── must_fix standardization: icon scale (§1b) · sticky footer (§7) ── */
svg:has(>use){width:16px;height:16px;flex:none;vertical-align:-3px}
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#root>main{flex:1 0 auto;width:100%}

/* code · notices · empty — registry-verbatim */
pre.code{background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-4);overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;margin:var(--s-3) 0 0}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:10px 12px;font-size:12.5px;margin-top:var(--s-3)}
.notice.warn{background:color-mix(in srgb,var(--warn) 9%,#fff);border:1px solid color-mix(in srgb,var(--warn) 35%,#fff);color:#8a5a06}
.notice.err{background:color-mix(in srgb,var(--danger) 7%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);color:var(--danger)}
.notice.ok{background:color-mix(in srgb,var(--ok) 8%,#fff);border:1px solid color-mix(in srgb,var(--ok) 30%,#fff);color:var(--ok)}
.empty{padding:var(--s-6);text-align:center;color:var(--ink-muted)}
.empty .big{font-size:26px;display:block;margin-bottom:6px}

/* table — registry-verbatim */
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.08)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:var(--s-2)}
.tbl th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--hairline)}
.tbl td{padding:8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.compact th,.tbl.compact td{padding:6px 8px}

/* modal §8 + toast — registry-verbatim */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline)}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.idcard dt{color:var(--ink-faint)}.idcard dd{margin:0}
.toasts{position:fixed;bottom:var(--s-5);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--elev-2);animation:fadein var(--t-med)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--danger) 6%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px}

/* diagram tab (about-modal/3) + fullscreen viewer — registry-verbatim */
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ OmniGraph-specific (custom composites — tokens only, PRD §13.2) ═══ */
/* product tokens (§13.1 additions) */
:root{--rail:var(--hairline);--dim:.25}

/* Forge: one column, two-pane ≥1024px (controls left, live preview right) */
.og-forge{display:grid;grid-template-columns:1fr;gap:var(--s-4);max-width:760px;margin:0 auto}
@media (min-width:1024px){.og-forge{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.og-forge .preview{min-width:0}
.og-forge .preview pre.code{max-height:70vh;font-size:11.5px}
.bigfield input{font-size:16px;padding:12px 14px}
details.acc{border:1px solid var(--hairline);border-radius:var(--r-md);overflow:visible;margin-top:var(--s-2);background:var(--surface)}
details.acc>summary{cursor:pointer;padding:10px 12px;font-size:13.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"›";transition:transform var(--t-fast);color:var(--ink-faint)}
details.acc[open]>summary::before{transform:rotate(90deg)}
details.acc>div{padding:0 12px 12px}
details.acc>summary .cur{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-weight:400}
.estline{font-size:12.5px;color:var(--ink-faint);margin-top:var(--s-3)}
.nextcard{border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-wash);border-radius:var(--r-md);padding:10px 14px;font-size:13px;margin-top:var(--s-3)}

/* validation card (paste modal + inline) */
.vcard{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);margin-top:var(--s-3);font-size:12.5px}
.vcard .row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.vcard details{margin-top:6px}
.vcard details summary{cursor:pointer;color:var(--ink-muted);font-size:12px}
.vcard pre{margin:6px 0 0;font-size:11px;max-height:120px;overflow:auto;background:var(--wash);border-radius:var(--r-sm);padding:6px}

/* Atlas toolbar + stats bar (sticky) */
.og-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--s-3)}
.og-toolbar .sp{flex:1}
.seg{display:flex;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden}
.seg button{border:0;background:var(--surface);font:600 12px/1 var(--font);padding:8px 10px;cursor:pointer;color:var(--ink-muted)}
.seg button+button{border-left:1px solid var(--hairline)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.og-stats{position:sticky;top:var(--header-h);z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--canvas);padding:6px 0;font-size:12.5px}
.og-stats button.badge{cursor:pointer;font:inherit;font-size:11.5px}
.og-stats button.badge[aria-pressed="true"]{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--accent)}

/* map header card + lineage breadcrumb */
.og-head{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);margin-bottom:var(--s-3)}
.og-head h2{margin:0 0 2px;font-size:18px}
.og-head .meta{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);display:flex;flex-wrap:wrap;gap:4px 12px}
.crumb{font-size:12px;color:var(--ink-muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb .sep{color:var(--ink-faint)}
.crumb b{color:var(--accent)}

/* the tree (§10.2) — semantic ul/li with hairline guide rails */
.tree{margin-top:var(--s-2)}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--rail)}
.tree>ul{padding-left:0;border-left:0}
.tree li{margin:1px 0}
.tree li.hidden{display:none}
.trow{display:flex;align-items:flex-start;gap:6px;padding:3px 6px;border-radius:var(--r-sm);position:relative}
.trow .rest{display:contents}
.tree li.closed>ul.kids{display:none}
.trow:hover{background:var(--wash)}
.trow .tw{width:20px;height:20px;flex:none;border:0;background:none;cursor:pointer;color:var(--ink-faint);display:grid;place-items:center;font-size:11px;border-radius:var(--r-sm);padding:0;margin-top:1px}
.trow .tw:hover{color:var(--ink);background:var(--hairline)}
.trow .tw.leafdot{cursor:default;font-size:8px}
.trow .tw.leafdot:hover{background:none;color:var(--ink-faint)}
.trow .txt{min-width:0;overflow-wrap:anywhere}
.tree li.d1>.trow .txt{font-weight:600;font-size:14.5px}
.tree li.d2>.trow .txt{font-weight:500}
.trow .txt code{font-family:var(--mono);font-size:12px;background:var(--wash);border:1px solid var(--hairline);border-radius:3px;padding:0 3px}
.trow .tools{display:flex;gap:4px;align-items:center;flex:none;margin-left:auto;opacity:0;transition:opacity var(--t-fast)}
.trow:hover .tools,.trow:focus-within .tools{opacity:1}
.trow .tools .icon-btn{width:24px;height:24px;border:0;background:none;box-shadow:none}
.tnote{display:none;margin:2px 0 4px 26px;padding:6px 10px;border-left:3px solid var(--hairline);background:var(--wash);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:12.5px;color:var(--ink-muted)}
li.noteopen>.tnote{display:block}
.trow .ntoggle{border:0;background:none;cursor:pointer;color:var(--ink-faint);font-size:12px;padding:0 4px;border-radius:var(--r-sm);flex:none}
.trow .ntoggle:hover{color:var(--ink);background:var(--hairline)}
li.noteopen>.trow .ntoggle{color:var(--accent)}
/* marker chips (§6.2) — semantic tokens, never brand */
.mk{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.02em;border-radius:var(--r-pill);padding:1px 7px;border:1px solid var(--hairline);background:var(--wash);color:var(--ink-muted);vertical-align:2px;margin-left:5px;white-space:nowrap}
.mk-core{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--ink)}
.mk-q{background:color-mix(in srgb,var(--warn) 10%,#fff);border-color:color-mix(in srgb,var(--warn) 35%,#fff);color:var(--warn)}
.mk-bang{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.mk-t{color:var(--ink-muted)}
.mk-src{cursor:help}
.mk-eco{color:var(--ink-faint)}
.mk-gap{background:var(--surface);border-color:var(--warn);color:var(--warn)}
.mk-fix{background:color-mix(in srgb,var(--danger) 8%,#fff);border-color:color-mix(in srgb,var(--danger) 30%,#fff);color:var(--danger)}
.lnk{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;border-radius:var(--r-pill);padding:1px 7px;border:1px solid var(--hairline);background:var(--surface);color:var(--accent);margin-left:5px;cursor:pointer;font-weight:500;vertical-align:2px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.lnk.dead{color:var(--ink-faint);cursor:default}
/* lens states: search > focus > filter — one dimming system (--dim) */
li.dim>.trow{opacity:var(--dim);filter:grayscale(1)}
li.hit>.trow{outline:2px solid var(--warn);outline-offset:-2px;border-radius:var(--r-sm)}
li.hitfocus>.trow{background:color-mix(in srgb,var(--warn) 12%,#fff)}
@keyframes ogflash{0%{background:var(--accent-wash)}100%{background:transparent}}
li.flash>.trow{animation:ogflash .6s ease-out}
/* the bloom (§13.3) — one-time stagger on load */
.tree.bloom li{animation:fadein var(--t-med) both}
.tree.bloom li.d2{animation-delay:.12s}
.tree.bloom li.d3,.tree.bloom li.d4,.tree.bloom li.d5,.tree.bloom li.d6{animation-delay:.24s}
/* node ⋯ menu */
.nmenu{position:absolute;right:4px;top:calc(100% + 2px);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-2);z-index:50;display:flex;flex-direction:column;min-width:200px;padding:4px}
.nmenu button{border:0;background:none;text-align:left;font:500 13px/1.4 var(--font);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink);display:flex;gap:8px;align-items:center}
.nmenu button:hover{background:var(--wash)}
.nmenu .grouphead{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);padding:6px 10px 2px}
/* focus-mode breadcrumb bar */
.focusbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-wash);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px;margin-bottom:var(--s-2)}
.focusbar button{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;padding:2px 4px;border-radius:var(--r-sm)}
.focusbar button:hover{background:#fff}
/* search bar (Ctrl+F, §10.4) */
.searchbar{position:sticky;top:calc(var(--header-h) + 34px);z-index:25;display:none;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--elev-2);padding:6px 8px;margin-bottom:var(--s-2)}
.searchbar.open{display:flex}
.searchbar input{border:0;padding:5px 6px;font-size:13px}
.searchbar input:focus{outline:none;border:0}
.searchbar .cnt{font:500 11.5px/1 var(--mono);color:var(--ink-faint);min-width:40px;text-align:center}
/* legend */
.og-legend{margin-top:var(--s-4)}
.og-legend .rowl{display:flex;gap:8px;align-items:baseline;padding:2px 0;font-size:12.5px;color:var(--ink-muted)}

/* Shelf (§10.6): facet rail + card grid */
.og-shelf{display:grid;grid-template-columns:200px 1fr;gap:var(--s-4);align-items:start}
.facets{display:flex;flex-direction:column;gap:2px}
.facets button{border:0;background:none;text-align:left;font:500 13px/1.4 var(--font);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-muted);display:flex;gap:8px;align-items:center}
.facets button:hover{background:var(--wash);color:var(--ink)}
.facets button[aria-pressed="true"]{background:var(--accent-wash);color:var(--accent);font-weight:600}
.facets button .n{margin-left:auto;font-size:11px;color:var(--ink-faint)}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s-4)}
.shcard{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:6px;box-shadow:var(--elev-1)}
.shcard h3{margin:0;font-size:14.5px}
.shcard .lin{font-size:11px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shcard .st{font:450 11px/1 var(--mono);color:var(--ink-muted)}
.shcard .row{display:flex;gap:6px;margin-top:auto;align-items:center;flex-wrap:wrap}
.shelf-foot{margin-top:var(--s-4)}

/* print (§12.4): chrome hides, the tree prints fully expanded */
@media print{
  .site-header,.site-footer,.og-toolbar,.og-stats,.searchbar,.focusbar,.toasts,.trow .tools,.trow .tw,.nmenu{display:none!important}
  main{max-width:none;padding:0}
  .tree li.hidden{display:list-item!important}
  .tnote{display:block!important}
  .tree ul{border-left-color:#bbb}
}

/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
}
/* responsive — OmniGraph */
@media (max-width:820px){
  .og-shelf{grid-template-columns:1fr}
  .facets{flex-direction:row;flex-wrap:wrap}
  .trow .tools{opacity:1}
}</style>
</head>

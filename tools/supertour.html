ile — or I'm just exploring",fk_here_p:"You'll work here. Your app runs inside this page, and so does everything else.",fk_pick:"That's mine",fk_switch:"Wrong route? Switch",fk_switch_q:"Switching clears the route you're on. Your guides stay.",hw_h:"How it works",hw_p:"Two lanes, never crossing. Pick yours above — here is each one, end to end.",hw_t_web:"🛰️ Live on the web",hw_t_here:"💻 HTML file or demo",hw_t_map:"🗺️ The whole map",hw_web_s:["Drag the button|One drag onto your bookmarks bar. You do this once, ever.","Click it on your site|Open your real page and click the bookmark. A panel opens there.","Record|Start, walk your flow, Stop. Every click became a step.","Write the words|Rename each step. Say what the visitor should do.","Rehearse|Walk your own tour once, cleanly. That run is the gate.","Publish|⚡ Install it into your pages, or copy the snippet and paste it once."],hw_end_web:"Reload your site: the tour greets your first visitor by itself.",hw_here_s:["Pick the app|The bundled demo, or drop in your own HTML file.","Record|Fullscreen. Start, click your flow, Stop.","Write the words|Rename each step, and set when the tour offers itself.","Test|Run it and click every spotlight. Zero skips opens the gate.","Publish|⚡ Install, copy the snippet, or download the Replay Theater."],hw_end_here:"Paste it into your app once. Everyone who arrives after that is guided.",hw_map_p:"Every room, both lanes, and the three things a press can produce.",hw_map_zoom:"Open it big — zoom, fit and pan",hw_lost:"Lost later? “Switch lane” in any room brings you back to this question, and your guides stay.",ln_h:"One button, and you're done here.",ln_p:"Drag it once. From then on, every tour you make happens inside your own site — record, write, test, publish. You never come back to this screen.",ln_open_h:"Already have a pack file?",ln_open_p:"Open it here to rewrite its words and publish it. Testing still happens where the app lives.",ln_open_btn:"Open a pack file",dk_note:"This tour was recorded in your live app. Here you can rewrite its words and publish it — testing happens where the app lives.",rc_h:"Record the flow.",rc_p:"Pick the app, then just use it. Every meaningful click becomes a step.",sg_h:"Which app are we guiding?",sg_p:"Put an app on the stage and the recorder in the next room can see it. If your app is live on the web instead, you don't stage anything here — you carry the recorder to it.",door_playground:"Demo app",door_replica:"My own HTML",door_pack:"Pack file",sg_pg_note:"The bundled demo — a small CMS that ships inside the studio, so you can learn the whole flow without touching your own app.",sg_pg_use:"Put the demo on the stage",sg_pg_staged:"The demo app is on the stage ✓",sg_sample_h:"Rather read one than record one?",sg_sample_p:"Load the example tour — six finished steps on the demo app (“Create & publish an article”). It is an example, not your work: it arrives unwatched, and you can delete it in the Script at any time.",sg_sample_btn:"Load the example tour",sg_sample_in:"The example tour is loaded ✓",sg_sample_done:"Example tour loaded ✓ — it still has to survive a Watch run like anything else.",sg_quick_h:"New here? One minute, end to end.",sg_quick_p:"Take the demo app, record a two-click flow, and press a real runtime. Nothing you do here touches your own app.",sg_quick_btn:"Use the demo & start recording",sg_where_h:"Where does your app live?",sg_where_web:"Out on the web, at a URL",sg_where_web_p:"Then nothing is staged here — the Scout travels to your app instead: record, rehearse and press the finished snippet right inside your site. The studio stays optional, for deep editing.",sg_where_here:"Right here — the demo, your own HTML, or a pack file",sg_where_here_p:"Stage it below and every room works on it directly.",sg_live_btn:"Take me to the live-app recorder",sg_over_h:"Start over",sg_over_note:"clear your guides · or wipe this device clean",sg_over_clear_h:"Clear my work, keep this app on the stage",sg_over_clear_p:"Deletes every guide, step, watch mark and press flag — the app you staged and your language stay. Export the pack first if you might want it back.",sg_over_clear:"Clear my guides",sg_over_clear_q:"Delete every guide and start recording fresh?",sg_over_clear_done:"Cleared ✓ — the stage is set, nothing recorded.",sg_over_all_h:"Reset everything on this device",sg_over_all_p:"The full reset: guides, staged app, language, watch marks, and Zappy's own runtime flags — everything SuperTour ever saved in this browser. There is no undo.",sg_over_all:"Reset everything",sg_pack_h:"Bring back a recording",sg_pack_p:"The Scout downloads a pack file after you review your steps out there. Drop it here and the guides land in the studio, ready for the Script.",sg_rep_l:"Your app's HTML",sg_rep_ph:"Paste (or drop) the full HTML of a single-file app here…",sg_rep_upload:"Upload .html file",sg_rep_stage:"Stage this HTML",sg_rep_staged:"Replica staged ✓ — walk to the Trace to record.",sg_rep_note:"Honest limit: the Replica renders single-HTML apps faithfully. An SPA that fetches external resources at boot will not fully boot in the sandboxed frame — that's what the Scout door is for.",sg_rep_err:"That doesn't look like an HTML document — the Replica needs markup with a <body>.",sg_bm_h:"① One click — drag this to your bookmarks bar",sg_bm_p:"Drag it there ONE time. From then on, open any page of your app and click it: the whole pocket studio appears — record, fix the words, set the trigger and your brand colour, rehearse, and press the finished snippet right there. No console, no install, no coming back here.",sg_bm_drag:"🧭 SuperTour Scout",sg_bm_hint:"Drag it to the bookmarks bar — clicking it here does nothing.",sg_bm_note:"Honest limit: a site with a strict Content-Security-Policy can refuse bookmarklets, and a browser could trim a bookmark this long — either way the panel that appears will show the recorder only, and the console door below carries the identical bench.",tr_pocket_h:"If the bookmarklet can't get in — the console door",tr_pocket_p:"Identical Scout, identical press bench — pasted into DevTools instead. Use it when your site's Content-Security-Policy refuses javascript: bookmarklets, or if your browser trimmed the bookmark (the panel will say so: it shows the recorder only). Copy, open your app, F12 → Console, paste, Enter.",tr_pocket_allow:"Chrome may first ask you to type “allow pasting” — that is Chrome guarding people who paste strangers' code. This block comes from your own studio.",sg_sc_copy:"Copy Scout snippet",sg_sc_copied:"Scout snippet copied — paste it into your app's console ✓",sg_imp_h:"The pack file",sg_imp_l:"Import a pack",sg_imp_ph:"Paste a supertour-pack: 1 file (or drop the .md here)…",sg_imp_up:"Upload the .pack.md file",sg_imp_btn:"Import pack",sg_imp_ok:"Pack imported ✓ — {n} guide(s). Every guide needs a fresh Watch run.",sg_imp_ok_proof:"Pack imported ✓ — {n} guide(s), rehearsed where the app lives. The Watch gate came with them.",so_close:"Close",sg_exp_btn:"Export current pack",cm_h:"Compass — refused, nothing was touched",refuse_line:"Line {n}: {reason}",preview_h:"On stage now",tr_h:"Record the flow.",tr_p:"There is ONE recorder, and it works in two places — pick where your app lives. Either way, every meaningful click becomes a step with a healing selector chain and a context chip; typing is recorded as a focus step, never as your keystrokes.",tr_mode_here:"Here, in the studio",tr_mode_there:"Out there, in my live app",tr_here_p:"Records the app standing on the Stage, inside the studio's frame. Best for the demo and for single-file apps you can paste or upload.",tr_there_p:"Records inside your real, running site — and now presses there too: the Scout carries the whole trip (record → words → trigger → rehearse → press). Nothing is staged in the studio for this route.",tr_there_back:"Rather write the words in the studio?",tr_there_back_p:"You never have to — the Scout finishes the job out there. But the studio is the better bench for long copy, several guides at once, or the BYOAI copy-brief. If you want it: in your app press Stop → review → Download pack, then drop that file below.",tr_there_btn:"Import that pack on the Stage",tr_guide_l:"Name this tour",tr_guide_ph:"e.g. Create & publish an article",tr_guide_default:"Guide {n}",tr_start:"Start recording",tr_stop:"Stop recording",tr_rec:"REC",tr_pause:"Pause",tr_resume:"Resume",tr_paused_tag:"PAUSED",tr_paused:"Paused — clicks in the frame are ignored until you resume.",tr_fs_note:"Recording takes the whole screen so you can focus on the flow — Stop brings you back to the step rail.",tr_recording:"Recording — every meaningful click becomes a step.",tr_empty:"No recording running yet — name the tour above (or keep the default), press Start, and the app takes the whole screen so you can just use it.",tr_noop:"Nothing recordable there — click a button, link, or field.",tr_navout:"That link leaves the page, and the studio's frame can't follow it. Tabs and in-page routes work; for a flow that spans real page loads, record in your live app instead.",tr_steps:"Captured steps",tr_reset:"Discard & re-record",tr_reset_q:"Discard this guide's recorded steps?",tr_yes:"Discard",tr_no:"Keep",tr_stopped:"Recording stopped — {n} step(s) captured. Polish them at the Script.",tr_act_click:"click",tr_act_focus:"focus",sc_h:"Script the guide.",sc_p:"Rewrite each step like a human, set the trigger, flag the steps that change data. Rewriting words is free — only a change to the STEPS themselves (order, removal, what a step acts on) re-opens that guide's Watch gate.",sc_none:"No guides yet — record one at the Trace, or bring a pack back there.",sc_guides:"Guides",sc_meta:"Guide settings",sc_name:"Guide name",sc_trigger:"Trigger scenario",trg_new_user:"New User — first visit",trg_new_release:"New Release",trg_how_to:"How-To (listed in the ? widget)",trg_return_user:"Return User",sc_version:"Release version",sc_days:"Return threshold (days)",sc_err_name:"The guide needs a name.",sc_err_version:"New Release needs a version string.",sc_err_days:"Threshold must be a positive number of days.",sc_chrome:"Runtime chrome labels (default EN — yours to rewrite)",sc_chrome_note:"Next · Back · Close · Done — the four words the tour's own buttons say",sc_brief_note:"optional · any AI rewrites your step copy, you keep the last word",sc_hint_add:"+ add a hint",sc_hint_drop:"remove hint",sc_adv:"More for this step",sc_adv_note:"hint · data-changing flag",ch_next:"Next",ch_back:"Back",ch_close:"Close",ch_done:"Done",sc_steps:"Steps",sc_lbl:"Instruction",sc_hint:"Hint (optional)",sc_mut:"changes data — never auto-replayed",sc_del:"Delete step",sc_restore:"Restore step",sc_deleted:"Step deleted.",sc_restored:"Step restored ✓",sc_up:"Move up",sc_down:"Move down",sc_guide_del:"Delete guide",sc_guide_del_q:"Delete this whole guide?",sc_guide_deleted:"Guide deleted ✓",sc_raw_h:"These are still the recorder's words",sc_raw_p:"Every label above was taken from the element you clicked, which is rarely how you would say it to a stranger. Rewrite what needs rewriting — or, if they already read well, approve them and move on.",sc_raw_btn:"The words are good — approve them",sc_raw_done:"Approved ✓ — the pack is scripted.",sc_brief_h:"Copy-brief — polish the words (BYOAI)",sc_brief_p:"Copy one self-contained brief into any AI chat. It asks for the WORDS back and nothing else — your tour's structure never leaves this studio, so a reply cannot break it. What comes back lands as a draft you compare and adopt, or throw away.",sc_brief_copy:"Copy the brief",sc_brief_copied:"Brief copied — paste it into any AI ✓",sc_reply_l:"Paste the reply",sc_reply_ph:"Paste the whole reply — SuperTour finds the JSON block by itself, fence or no fence.",sc_reply_btn:"Check the reply",sc_draft_h:"Draft landed — your pack is untouched",sc_draft_sum:"guides ±{g} · structure changes {s} · labels rewritten {l}",sc_adopt:"Adopt as the pack",sc_discard:"Discard draft",sc_adopted:"Adopted ✓ — every guide needs a fresh Watch run.",brief_landed:"Landed as a draft — your pack is untouched.",zp_h:"Zappy — the face that does the guiding",zp_p:"How the runtime looks and what it calls itself. All of it travels inside the pack, so the tour you press wears YOUR colors in YOUR app — not the studio's.",zp_name:"What the guide is called",zp_name_note:"used in the greeting and the screen-reader label",zp_persona:"Expression set",zp_persona_note:"Zappy reacts — a different face for greeting, moving, pointing, waiting on you, losing a step, and finishing.",zp_accent:"Accent color",zp_accent_note:"spotlight ring, buttons, the minimized dot — set it to your brand",zp_home:"Home corner",zp_home_br:"bottom right",zp_home_bl:"bottom left",zp_home_tr:"top right",zp_home_tl:"top left",zp_size:"Size",zp_size_s:"small",zp_size_m:"medium",zp_size_l:"large",zp_fx:"Liveliness",zp_fx_full:"full — reacts, bounces, celebrates",zp_fx_calm:"calm — expressions change, nothing bounces",zp_fx_off:"still — no motion at all",zp_fx_note:"A visitor who asks for reduced motion always gets “still”, whatever you pick here.",zp_preview:"Live preview",zp_preview_note:"click a mood to see it — this is the real avatar, at the real size",zp_custom_h:"Write your own faces",zp_custom_note:"eight moods · any text or emoji you like",zp_custom_p:"Anything short works: kaomoji, emoji, two letters. Idle takes a comma-separated list and Zappy cycles through it.",zp_idle_note:"comma-separated — cycled while nothing is happening",zp_reset:"Back to the defaults",zp_reset_done:"Zappy is back to the default look ✓",mood_idle:"Idle",mood_greet:"Greeting",mood_walk:"On the move",mood_point:"Pointing",mood_wait:"Your turn",mood_oops:"Lost a step",mood_cheer:"Finished",mood_sleep:"Minimized",per_spark:"Spark",per_emo:"Emoji",per_robo:"Robo",per_dots:"Minimal",per_custom:"Custom",so_btn:"Start over",so_h:"Start over — how far back?",tr_imp_h:"Drop the pack here",tr_imp_p:"The Scout downloaded a file. Drop it here and your guides land in the studio: no walking back to the Stage, no hunting for a door.",tr_reh_note:"Either way, Rehearse first: you walk your own tour once in the real page. That clean run is what unlocks the press out there — and, if you do bring a pack back, what makes this studio's Watch gate green on arrival. Forgot to? Nothing is lost: the Scout also takes a pack file you already downloaded and rehearses that.",wt_h:"Watch it like a user.",wt_p:"The real runtime runs the tour inside the frame — spotlight, guided clicks, everything. The Press stays locked until every guide survives one full run with zero skips.",wt_pick:"Guide",wt_run:"Run the tour",wt_rerun:"Run again",wt_watched:"Watched ✓ — press-ready",wt_unwatched:"not watched yet",wt_log:"Run log",wt_step:"step {n}/{t}",wt_skip:"step {n} skipped — element not found",wt_complete:"Full run complete ✓ — the gate is open for this guide.",wt_complete_skips:"Run finished with {n} skipped step(s) — fix the steps, then run again. The gate stays closed.",wt_closed:"Run closed early — the gate stays closed.",wt_empty:"No guides to watch yet — record at the Trace first.",watch_gate:"Press unlocks after one full Watch run of every guide.",wt_stage_l:"On the stage",wt_away_h:"The app this tour belongs to isn't in the studio",wt_away_p:"“{app}” lives out on the web, where you recorded it — the studio never keeps a copy of your site. So there is nothing here to run the tour against, and running it against the demo would only prove that a different app is different. Two honest ways to open this gate:",wt_away_a_h:"① Finish it where the app lives — and don't come back",wt_away_a_p:"You do NOT have to record it again, and you do NOT have to return to this room. Export the pack below, open your app, click the Scout bookmarklet, choose “Rehearse a pack I have”, and walk the tour once. The same panel then PRESSES the finished snippet for you — copy it, paste it above your closing body tag, and the tour is live. This room only exists for apps the studio can hold; yours isn't one, and that is not a problem to solve.",wt_away_export:"Export this pack (the file the Scout needs)",wt_away_b_h:"② Bring a copy here",wt_away_b_p:"If your app is a single HTML file you can save (Ctrl+S) or paste, stage it and the Watch runs right here, like the demo.",wt_go_there:"Take me to the Scout",wt_go_stage:"Stage a copy of my app",wt_proof_there:"Rehearsed in your live app ✓ — the proof travelled in the pack",wt_diff_h:"The pack and the stage are two different apps",wt_diff_p:"This pack was recorded in “{pack}”, but “{staged}” is what's on the stage. If they really are the same app under a different title, run it — a run with zero skips is the only proof either way.",wt_diff_run:"They are the same app — run it anyway",tg_h:"This studio is built for a desktop browser",tg_p:"You can look around here, and nothing will break — but authoring a tour on a touch screen fights you. Here is the honest split:",tg_yes_s:["Reading, browsing, and reviewing a pack you already made","Importing a pack the Scout recorded elsewhere","Pressing the runtime and the Replay Theater"],tg_no_s:["Recording comfortably — the app under authorship is squeezed into a phone-width frame","The one-click Scout bookmarklet, which needs a bookmarks bar","Precise step editing across two columns"],tg_runtime:"The guides you press are a different story: the Zappy runtime is built for real users on real devices, phones included. It is only the FACTORY that wants a bigger screen.",tg_ok:"Got it — let me look around",tr_touch:"Touch device: recording works, but your app is being recorded at phone width. Author on a desktop when you can.",nx_label:"Next",nx_here:"You're here",nx_go:"Go",rt_label:"Your route",nx_launch:"Drag the button to your bookmarks bar, then click it on your site.",nx_words:"Write each step the way a stranger needs to hear it.",nx_test:"Run “{g}” once, clicking each highlight. Zero misses unlocks Publish.",nx_publish:"Copy the snippet and paste it into your site.",nx_stage:"Pick the app you want to guide — the bundled demo is one click away.",nx_record:"Record your first flow: name it, press Start, then simply use the app.",nx_record_live:"Take the console snippet to your app and record there — the Scout can rehearse and press on the spot, so the studio is optional from here.",nx_steps:"“{g}” has no steps yet — record it here, or delete the guide in the Script.",nx_script:"Write each step the way a stranger needs to hear it, then set the trigger.",nx_watch:"Watch one full run of “{g}” — a run with zero skips is what unlocks the Press.",nx_rehearse:"“{g}” was recorded in your live app, so this room has nothing to run it against — and it doesn't need to: take the pack back with the Scout, rehearse, and press it there. The Watch tells you how.",nx_press:"Every gate is green — press the runtime snippet and the Replay Theater.",nx_done:"Pressed and ready. Edit anything later and the Watch gate re-opens on purpose.",pr_h:"Press the guide.",pr_p:"The gate board must be all green; then two artifacts mint — the Zappy runtime snippet and the Replay Theater.",gt_pack:"pack valid, at least one guide",gt_stage:"every guide scripted",gt_steps:"every guide has steps",gt_watch:"every guide watched (full run, zero skips)",gt_round:"round-trip byte-identical",gt_budget:"runtime raw code ≤ {kb} KB",gw_stage:"“{g}” still wears the recorder's own words — rewrite them in the Script, or approve them there as they are",gw_steps:"guide “{g}” has no steps",gw_watch:"guide “{g}” hasn't survived a full Watch run",gw_pack:"the pack has no guides — record one at the Trace",pr_rt_h:"① The Zappy runtime",pr_rt_p:"One self-contained snippet, pack inlined, Shadow DOM. Paste it once before the closing body tag on every page of your app — publishing is a re-press and a re-paste.",pr_rt_copy:"Copy snippet",pr_rt_dl:"Download snippet",pr_rt_size:"{kb} KB raw code · pack data {pk} KB",pr_th_h:"② The Replay Theater",pr_th_p:"A standalone page where the recorded app replays the tour by itself, step board alongside — the shareable demo of any guide.",pr_th_dl:"Download Theater",pr_th_pick:"Theater guide",pr_th_away:"The Theater is the recorded app replaying itself — and the studio has no copy of “{app}”. The runtime above needs nothing: paste it into your app and the tour is live. For a shareable Theater, stage a copy of the app on the Stage.",pr_pressed:"Pressed. Paste the snippet once — Zappy does the rest.",pr_locked:"The board has red rows — fix the named blockers above.",pr_blocked:"Locked — one thing is missing",in_h:"Or skip the pasting",in_p:"Pick your site's folder and SuperTour writes the snippet into every page itself. You see exactly what will change before anything is written, and re-pressing later replaces this block instead of adding a second one.",in_pick:"Choose my site folder",in_plan:"{n} page(s) will change — {a} new, {r} updated",in_skipped:"{n} file(s) skipped: no closing body tag.",in_undo_git:"This folder is a git repo — your diff is your undo.",in_undo_nogit:"No git here, so there is no undo. Copy the folder first if that worries you.",in_toomany:"That is a lot of pages. Check the list before writing.",in_go:"Write {n} page(s)",in_cancel:"Cancel",in_done:"Installed into {n} page(s) ✓ — publish them the way you normally do.",in_act_added:"new",in_act_replaced:"updated",in_unsupported:"One-click install needs Chrome, Edge or Brave. On other browsers use the copy-and-paste steps above — same result, one more step.",pr_how_h:"Where exactly does this go?",pr_how_note:"the two-minute version, for a site made of HTML files",pr_how_s:["Press Copy snippet above — the whole thing, including the opening and closing script tags.","Open the HTML file of your site in any editor (index.html, or your template/layout file if you have one).","Scroll to the bottom and find the line that says </body>. Paste the snippet on the line just ABOVE it.","Save, then publish the file the way you normally do (upload it, or commit and push).","Open your live site. The guide's avatar appears in the corner; a New User tour greets a first-time visitor by itself, and the ? button lists your How-To tours."],pr_how_plat:"If your site is built on a platform instead of files (WordPress, Webflow, Shopify, Framer…), look for its “custom code”, “footer scripts” or “body end” box and paste it there — that box exists precisely for snippets like this one.",pr_how_check:"Nothing appears? Open the page, press F12 → Console. Zappy is silent by design, but a blocked script says so there. And remember: a New User tour offers itself once per browser — clear the site's storage, or use the ? button, to see it again.",about_overview:"Overview",about_diagram:"Diagram",about_philosophy:"Philosophy",about_identity:"Identity",about_author:"Author",ov_what:"What it is",ov_what_p:"SuperTour 🧭 — the offline in-app-guide factory. “Record once, guide forever — in any app, offline.” A studio that records real flows and presses Zappy, a zero-dependency runtime that walks users through the live app.",ov_flow:"How it flows",ov_flow_s:["The fork — one question, asked before anything else: does your app live on the web, or do you have an HTML file?","Live on the web — one station, Launch: it hands you the bookmarklet, and the whole job then happens inside your own page","In the studio — four stations that lock until the one before them is done: Record · Words · Test · Publish","Test is the gate — one full run with zero skips, taken where the app actually lives","Publish — the Zappy snippet, the one-click Install, and the Replay Theater"],ov_get:"What you get",ov_get_p:"A guided tour living inside your real app with no backend, and a pack you re-press forever. Contracts: supertour-pack: 1 · sig st-YYYYMMDD-supertour-xxxx.",ph_p1:"A guide should live where the user is lost: inside the app, at the moment of confusion, pointing at the real button.",ph_p2:"No backend, by architecture — the studio presses, the snippet carries the tours inside itself, and publishing is a file operation.",ph_p3:"Replay respects reality: sandboxes may replay everything; the live app is forward-only and data-changing steps wait for the user's own click.",ph_p4:"No AI inside (BYOAI) and no model names — the copy-brief round-trip outlives every vendor cycle.",ph_family:"One file. One accent. One standard.",dg_hint:"One map of the whole factory — the fork, both lanes, the recorder, the pack, the gate, and the three things a press can produce. Authored in Mermaid, shipped as its rendered SVG (offline forever).",dg_fs:"Fullscreen",dg_src:"View Mermaid source",dg_hide:"Hide source",dg_copy:"Copy source",dg_copied:"Mermaid source copied ✓",reset:"Reset everything",reset_confirm:"Reset erases everything SuperTour saved on this device — the pack, watch marks, preferences, and Zappy's runtime flags. There is no undo.",reset_yes:"Erase it all",reset_no:"Keep my work",reset_done:"Fresh stage. Everything cleared. 🧭",dl_done:"Downloaded ✓",copied:"Copied ✓",know:"Know the Creator ↗"},id:{room_launch:"Luncur",room_record:"Rekam",room_words:"Kata",room_test:"Uji",room_publish:"Terbit",tagline:"Rekam sekali, pandu selamanya.",fk_h:"App-mu tinggal di mana?",fk_p:"Satu pertanyaan. Semua sesudahnya mengikuti jawabanmu.",fk_web_h:"🛰️ Hidup di web",fk_web_p:"Kerjanya di dalam situsmu sendiri. Studio cukup memberi satu tombol, lalu menyingkir.",fk_here_h:"💻 Aku punya file HTML — atau cuma mau coba",fk_here_p:"Kerjanya di sini. App-mu jalan di dalam halaman ini, begitu juga sisanya.",fk_pick:"Ini punyaku",fk_switch:"Salah jalur? Ganti",fk_switch_q:"Ganti jalur menghapus jalur yang sedang kamu tempuh. Panduanmu tetap.",hw_h:"Cara kerjanya",hw_p:"Dua jalur, tak pernah bersimpangan. Pilih punyamu di atas — ini isi masing-masing, dari awal sampai akhir.",hw_t_web:"🛰️ Hidup di web",hw_t_here:"💻 File HTML atau demo",hw_t_map:"🗺️ Peta utuhnya",hw_web_s:["Seret tombolnya|Sekali seret ke bilah bookmark. Cuma sekali, selamanya.","Klik di situsmu|Buka halaman aslimu, klik bookmark itu. Panelnya muncul di sana.","Rekam|Start, jalani alurmu, Stop. Tiap klik jadi satu langkah.","Tulis kalimatnya|Ganti nama tiap langkah. Sebutkan apa yang harus dilakukan pengunjung.","Gladi|Jalani turmu sendiri satu putaran bersih. Putaran itulah gerbangnya.","Terbit|⚡ Pasang ke halamanmu, atau salin snippet lalu tempel sekali."],hw_end_web:"Muat ulang situsmu: turnya menyapa pengunjung pertamamu sendiri.",hw_here_s:["Pilih app-nya|Demo bawaan, atau taruh file HTML-mu sendiri.","Rekam|Layar penuh. Start, klik alurmu, Stop.","Tulis kalimatnya|Ganti nama tiap langkah, lalu atur kapan tur menawarkan diri.","Uji|Jalankan dan klik tiap sorotan. Nol langkah terlewat membuka gerbangnya.","Terbit|⚡ Pasang, salin snippet, atau unduh Replay Theater."],hw_end_here:"Tempel sekali ke app-mu. Semua yang datang sesudahnya terpandu.",hw_map_p:"Semua ruang, kedua jalur, dan tiga hal yang bisa dihasilkan sekali cetak.",hw_map_zoom:"Buka besar — zoom, pas-kan, geser",hw_lost:"Tersesat nanti? “Ganti jalur” di ruang mana pun mengembalikanmu ke pertanyaan ini, dan panduanmu tetap.",ln_h:"Satu tombol, lalu urusanmu di sini selesai.",ln_p:"Seret sekali. Setelah itu tiap tur yang kamu buat terjadi di dalam situsmu sendiri — rekam, tulis, uji, terbit. Kamu tak perlu kembali ke layar ini.",ln_open_h:"Sudah punya file pack?",ln_open_p:"Buka di sini untuk menulis ulang kalimatnya lalu menerbitkannya. Pengujian tetap di tempat app-nya hidup.",ln_open_btn:"Buka file pack",dk_note:"Tur ini direkam di app hidupmu. Di sini kamu bisa menulis ulang kalimatnya dan menerbitkannya — pengujian terjadi di tempat app-nya hidup.",rc_h:"Rekam alurnya.",rc_p:"Pilih app-nya, lalu tinggal pakai. Tiap klik bermakna jadi satu langkah.",sg_h:"App mana yang mau dipandu?",sg_p:"Naikkan sebuah app ke panggung supaya perekam di ruang berikutnya bisa melihatnya. Kalau app-mu justru sudah hidup di web, tak ada yang perlu dinaikkan di sini — perekamnya yang kamu bawa ke sana.",door_playground:"App demo",door_replica:"HTML punyaku",door_pack:"File pack",sg_pg_note:"Demo bawaan — CMS kecil yang ikut di dalam studio, supaya kamu bisa belajar seluruh alurnya tanpa menyentuh app sendiri.",sg_pg_use:"Naikkan demo ke panggung",sg_pg_staged:"App demo sudah di panggung ✓",sg_sample_h:"Lebih suka membaca contoh daripada merekam?",sg_sample_p:"Muat tur contoh — enam langkah jadi di app demo (“Buat & terbitkan artikel”). Itu contoh, bukan karyamu: datang dalam keadaan belum ditonton, dan bisa kamu hapus di Script kapan saja.",sg_sample_btn:"Muat tur contoh",sg_sample_in:"Tur contoh sudah dimuat ✓",sg_sample_done:"Tur contoh dimuat ✓ — ia tetap harus lolos putaran Watch seperti yang lain.",sg_quick_h:"Baru pertama? Satu menit, dari ujung ke ujung.",sg_quick_p:"Ambil app demo, rekam alur dua klik, lalu cetak runtime sungguhan. Semua yang kamu lakukan di sini tidak menyentuh app-mu sendiri.",sg_quick_btn:"Pakai demo & mulai merekam",sg_where_h:"App-mu tinggal di mana?",sg_where_web:"Di luar sana, di sebuah URL",sg_where_web_p:"Berarti tak ada yang dinaikkan di sini — Scout-lah yang berangkat ke app-mu: rekam, gladi bersih, lalu cetak snippet jadinya langsung di dalam situsmu. Studio tetap opsional, untuk penyuntingan dalam.",sg_where_here:"Di sini saja — demo, HTML-mu sendiri, atau file pack",sg_where_here_p:"Naikkan di bawah dan semua ruangan langsung menggarapnya.",sg_live_btn:"Bawa aku ke perekam app hidup",sg_over_h:"Mulai dari awal",sg_over_note:"hapus panduanmu · atau bersihkan perangkat ini",sg_over_clear_h:"Hapus karyaku, app tetap di panggung",sg_over_clear_p:"Menghapus semua panduan, langkah, tanda tonton, dan tanda cetak — app yang kamu naikkan dan bahasamu tetap. Ekspor pack-nya dulu kalau mungkin masih kamu perlukan.",sg_over_clear:"Hapus panduanku",sg_over_clear_q:"Hapus semua panduan dan mulai merekam dari nol?",sg_over_clear_done:"Terhapus ✓ — panggung siap, belum ada yang direkam.",sg_over_all_h:"Reset semuanya di perangkat ini",sg_over_all_p:"Reset penuh: panduan, app yang dinaikkan, bahasa, tanda tonton, sampai flag runtime Zappy — semua yang pernah SuperTour simpan di browser ini. Tidak ada undo.",sg_over_all:"Reset semuanya",sg_pack_h:"Bawa pulang hasil rekaman",sg_pack_p:"Scout mengunduh satu file pack setelah kamu me-review langkahmu di sana. Jatuhkan filenya di sini dan semua guide mendarat di studio, siap masuk Script.",sg_rep_l:"HTML app-mu",sg_rep_ph:"Tempel (atau jatuhkan) HTML lengkap sebuah app satu-file di sini…",sg_rep_upload:"Unggah file .html",sg_rep_stage:"Naikkan HTML ini",sg_rep_staged:"Replica naik panggung ✓ — jalan ke Trace untuk merekam.",sg_rep_note:"Batas jujur: Replica merender app satu-HTML dengan setia. SPA yang mengambil resource eksternal saat boot tidak akan hidup penuh di frame sandbox — untuk itulah perekam app-hidup ada.",sg_rep_err:"Itu tidak tampak seperti dokumen HTML — Replica butuh markup dengan <body>.",sg_bm_h:"① Sekali klik — seret ini ke bilah bookmark",sg_bm_p:"Seret SATU kali. Setelah itu, buka halaman mana pun di app-mu dan klik: seluruh studio saku muncul — rekam, rapikan kata-katanya, pasang pemicu dan warna brand-mu, gladi bersih, lalu cetak snippet jadinya di sana juga. Tanpa console, tanpa install, tanpa balik ke sini.",sg_bm_drag:"🧭 SuperTour Scout",sg_bm_hint:"Seret ke bilah bookmark — mengekliknya di sini tidak melakukan apa-apa.",sg_bm_note:"Batas jujur: situs dengan Content-Security-Policy ketat bisa menolak bookmarklet, dan browser bisa saja memangkas bookmark sepanjang ini — apa pun sebabnya, panel yang muncul hanya menampilkan perekamnya, dan pintu console di bawah membawa bench yang sama persis.",tr_pocket_h:"Kalau bookmarklet-nya tak bisa masuk — pintu console",tr_pocket_p:"Scout yang sama persis, bench cetak yang sama persis — hanya ditempel ke DevTools. Pakai ini kalau Content-Security-Policy situsmu menolak bookmarklet javascript:, atau kalau browsermu memangkas bookmark-nya (panelnya akan bilang: ia cuma menampilkan perekam). Salin, buka app-mu, F12 → Console, tempel, Enter.",tr_pocket_allow:"Chrome mungkin memintamu mengetik “allow pasting” dulu — itu Chrome menjaga orang yang menempel kode dari orang asing. Blok ini datang dari studiomu sendiri.",sg_sc_copy:"Salin snippet Scout",sg_sc_copied:"Snippet Scout tersalin — tempel ke console app-mu ✓",sg_imp_h:"File pack",sg_imp_l:"Impor pack",sg_imp_ph:"Tempel file supertour-pack: 1 (atau jatuhkan .md-nya di sini)…",sg_imp_up:"Unggah file .pack.md",sg_imp_btn:"Impor pack",sg_imp_ok:"Pack terimpor ✓ — {n} panduan. Tiap panduan butuh putaran Watch baru.",sg_imp_ok_proof:"Pack terimpor ✓ — {n} panduan, sudah digladi di tempat app-nya hidup. Gerbang Watch ikut terbawa.",so_close:"Tutup",sg_exp_btn:"Ekspor pack sekarang",cm_h:"Compass — ditolak, tidak ada yang tersentuh",refuse_line:"Baris {n}: {reason}",preview_h:"Di panggung sekarang",tr_h:"Rekam alurnya.",tr_p:"Perekamnya CUMA SATU, dan ia bekerja di dua tempat — pilih di mana app-mu tinggal. Apa pun pilihannya, tiap klik bermakna menjadi satu langkah dengan rantai selector penyembuh dan chip konteks; ketikan direkam sebagai langkah focus, tidak pernah sebagai isi ketikanmu.",tr_mode_here:"Di sini, di dalam studio",tr_mode_there:"Di sana, di app hidupku",tr_here_p:"Merekam app yang berdiri di Stage, di dalam frame studio. Paling pas untuk demo dan app satu-file yang bisa kamu tempel atau unggah.",tr_there_p:"Merekam di dalam situsmu yang sungguhan dan sedang jalan — dan kini mencetak di sana juga: Scout membawa seluruh perjalanan (rekam → kata → pemicu → gladi → cetak). Untuk rute ini tak ada yang dinaikkan ke panggung studio.",tr_there_back:"Lebih suka menulis kata-katanya di studio?",tr_there_back_p:"Tak pernah wajib — Scout menuntaskan pekerjaannya di sana. Tapi studio memang bench yang lebih enak untuk naskah panjang, banyak panduan sekaligus, atau copy-brief BYOAI. Kalau mau: di app-mu tekan Stop → review → Download pack, lalu jatuhkan filenya di bawah.",tr_there_btn:"Impor pack itu di Stage",tr_guide_l:"Beri nama tur ini",tr_guide_ph:"mis. Buat & terbitkan artikel",tr_guide_default:"Panduan {n}",tr_start:"Mulai merekam",tr_stop:"Berhenti merekam",tr_rec:"REC",tr_pause:"Jeda",tr_resume:"Lanjut",tr_paused_tag:"JEDA",tr_paused:"Jeda — klik di frame diabaikan sampai kamu lanjut.",tr_fs_note:"Rekaman mengambil seluruh layar supaya kamu fokus ke alurnya — Stop membawamu kembali ke rel langkah.",tr_recording:"Merekam — tiap klik bermakna menjadi satu langkah.",tr_empty:"Belum ada rekaman berjalan — beri nama tur di atas (atau biarkan default), tekan Start, lalu app-nya mengambil seluruh layar supaya kamu tinggal memakainya.",tr_noop:"Tidak ada yang bisa direkam di situ — klik tombol, tautan, atau isian.",tr_navout:"Tautan itu meninggalkan halaman, dan frame studio tak bisa mengikutinya. Tab dan rute dalam-halaman tetap jalan; untuk alur yang melewati pemuatan halaman sungguhan, rekam saja di app hidupmu.",tr_steps:"Langkah terekam",tr_reset:"Buang & rekam ulang",tr_reset_q:"Buang langkah-langkah rekaman panduan ini?",tr_yes:"Buang",tr_no:"Simpan",tr_stopped:"Rekaman berhenti — {n} langkah tertangkap. Rapikan di Script.",tr_act_click:"klik",tr_act_focus:"focus",sc_h:"Susun panduannya.",sc_p:"Tulis ulang tiap langkah seperti manusia, atur pemicunya, tandai langkah yang mengubah data. Menulis ulang kata-kata itu gratis — hanya perubahan pada LANGKAHNYA sendiri (urutan, penghapusan, elemen yang dituju) yang membuka ulang gerbang Watch panduan itu.",sc_none:"Belum ada panduan — rekam di Trace, atau bawa pulang pack-nya di sana.",sc_guides:"Panduan",sc_meta:"Pengaturan panduan",sc_name:"Nama panduan",sc_trigger:"Skenario pemicu",trg_new_user:"New User — kunjungan pertama",trg_new_release:"New Release",trg_how_to:"How-To (tampil di widget ?)",trg_return_user:"Return User",sc_version:"Versi rilis",sc_days:"Ambang kembali (hari)",sc_err_name:"Panduan butuh nama.",sc_err_version:"New Release butuh string versi.",sc_err_days:"Ambang harus angka hari yang positif.",sc_chrome:"Label chrome runtime (default EN — bebas kamu tulis ulang)",sc_chrome_note:"Next · Back · Close · Done — empat kata yang diucapkan tombol tur itu sendiri",sc_brief_note:"opsional · AI mana pun menulis ulang kalimat langkahmu, keputusan akhir tetap padamu",sc_hint_add:"+ tambah petunjuk",sc_hint_drop:"hapus petunjuk",sc_adv:"Lainnya untuk langkah ini",sc_adv_note:"petunjuk · penanda pengubah data",ch_next:"Next",ch_back:"Back",ch_close:"Close",ch_done:"Done",sc_steps:"Langkah",sc_lbl:"Instruksi",sc_hint:"Petunjuk (opsional)",sc_mut:"mengubah data — tak pernah di-replay otomatis",sc_del:"Hapus langkah",sc_restore:"Pulihkan langkah",sc_deleted:"Langkah terhapus.",sc_restored:"Langkah dipulihkan ✓",sc_up:"Naikkan",sc_down:"Turunkan",sc_guide_del:"Hapus panduan",sc_guide_del_q:"Hapus seluruh panduan ini?",sc_guide_deleted:"Panduan terhapus ✓",sc_raw_h:"Ini masih kata-kata si perekam",sc_raw_p:"Tiap label di atas diambil dari elemen yang kamu klik, dan itu jarang sama dengan caramu menjelaskannya ke orang asing. Tulis ulang yang perlu — atau, kalau sudah enak dibaca, setujui saja lalu lanjut.",sc_raw_btn:"Kata-katanya sudah bagus — setujui",sc_raw_done:"Disetujui ✓ — pack sudah scripted.",sc_brief_h:"Copy-brief — rapikan kata-katanya (BYOAI)",sc_brief_p:"Salin satu brief mandiri ke chat AI mana pun. Ia hanya meminta KATA-KATANYA kembali — struktur turmu tak pernah keluar dari studio ini, jadi balasan apa pun tak bisa merusaknya. Yang kembali mendarat sebagai draf untuk kamu bandingkan lalu adopsi, atau buang.",sc_brief_copy:"Salin brief",sc_brief_copied:"Brief tersalin — tempel ke AI mana pun ✓",sc_reply_l:"Tempel balasannya",sc_reply_ph:"Tempel seluruh balasannya — SuperTour menemukan blok JSON-nya sendiri, pakai pagar kode atau tidak.",sc_reply_btn:"Periksa balasan",sc_draft_h:"Draft mendarat — pack-mu tak tersentuh",sc_draft_sum:"panduan ±{g} · perubahan struktur {s} · label ditulis ulang {l}",sc_adopt:"Adopsi jadi pack",sc_discard:"Buang draft",sc_adopted:"Diadopsi ✓ — tiap panduan butuh putaran Watch baru.",brief_landed:"Mendarat sebagai draft — pack-mu tak tersentuh.",zp_h:"Zappy — wajah yang memandu",zp_p:"Bagaimana runtime-nya tampil dan menyebut dirinya. Semuanya ikut di dalam pack, jadi tur yang kamu cetak memakai warnamu di app-mu — bukan warna studio.",zp_name:"Panggilan si pemandu",zp_name_note:"dipakai di sapaan dan label pembaca layar",zp_persona:"Set ekspresi",zp_persona_note:"Zappy bereaksi — wajah berbeda saat menyapa, berpindah, menunjuk, menunggumu, kehilangan langkah, dan selesai.",zp_accent:"Warna aksen",zp_accent_note:"cincin sorotan, tombol, titik saat diminimalkan — samakan dengan brand-mu",zp_home:"Sudut rumah",zp_home_br:"kanan bawah",zp_home_bl:"kiri bawah",zp_home_tr:"kanan atas",zp_home_tl:"kiri atas",zp_size:"Ukuran",zp_size_s:"kecil",zp_size_m:"sedang",zp_size_l:"besar",zp_fx:"Tingkat kehidupan",zp_fx_full:"penuh — bereaksi, memantul, merayakan",zp_fx_calm:"kalem — ekspresi berganti, tak ada yang memantul",zp_fx_off:"diam — tanpa gerak sama sekali",zp_fx_note:"Pengunjung yang meminta reduced-motion selalu mendapat “diam”, apa pun pilihanmu di sini.",zp_preview:"Pratinjau hidup",zp_preview_note:"klik satu mood untuk melihatnya — ini avatar asli, pada ukuran aslinya",zp_custom_h:"Tulis wajahmu sendiri",zp_custom_note:"delapan mood · teks atau emoji apa pun",zp_custom_p:"Apa pun yang pendek bisa: kaomoji, emoji, dua huruf. Idle menerima daftar dipisah koma dan Zappy berputar di antaranya.",zp_idle_note:"dipisah koma — diputar saat tak ada yang terjadi",zp_reset:"Kembali ke bawaan",zp_reset_done:"Zappy kembali ke tampilan bawaan ✓",mood_idle:"Diam",mood_greet:"Menyapa",mood_walk:"Berpindah",mood_point:"Menunjuk",mood_wait:"Giliranmu",mood_oops:"Langkah hilang",mood_cheer:"Selesai",mood_sleep:"Diminimalkan",per_spark:"Spark",per_emo:"Emoji",per_robo:"Robo",per_dots:"Minimal",per_custom:"Custom",so_btn:"Mulai dari awal",so_h:"Mulai dari awal — sejauh apa?",tr_imp_h:"Jatuhkan pack-nya di sini",tr_imp_p:"Scout sudah mengunduh satu file. Jatuhkan di sini dan panduanmu mendarat di studio: tak perlu balik ke Stage, tak perlu mencari-cari pintunya.",tr_reh_note:"Apa pun pilihannya, Gladi bersih dulu: kamu menyusuri turmu sendiri sekali di halaman aslinya. Putaran bersih itulah yang membuka tombol cetak di sana — dan, kalau kamu memang membawa pack-nya pulang, yang membuat gerbang Watch di studio ini langsung hijau saat tiba. Lupa? Tidak ada yang hilang: Scout juga menerima file pack yang sudah kamu unduh, lalu menggladinya.",wt_h:"Tonton seperti user.",wt_p:"Runtime asli menjalankan tur di dalam frame — spotlight, klik terpandu, semuanya. Press tetap terkunci sampai tiap panduan lolos satu putaran penuh tanpa langkah terlewati.",wt_pick:"Panduan",wt_run:"Jalankan tur",wt_rerun:"Jalankan lagi",wt_watched:"Sudah ditonton ✓ — siap dicetak",wt_unwatched:"belum ditonton",wt_log:"Log putaran",wt_step:"langkah {n}/{t}",wt_skip:"langkah {n} dilewati — elemen tidak ditemukan",wt_complete:"Putaran penuh selesai ✓ — gerbang panduan ini terbuka.",wt_complete_skips:"Putaran selesai dengan {n} langkah terlewati — perbaiki langkahnya, lalu jalankan lagi. Gerbang tetap tertutup.",wt_closed:"Putaran ditutup lebih awal — gerbang tetap tertutup.",wt_empty:"Belum ada panduan untuk ditonton — rekam dulu di Trace.",watch_gate:"Press terbuka setelah tiap panduan lolos satu putaran penuh di Watch.",wt_stage_l:"Di panggung",wt_away_h:"App milik tur ini tidak ada di studio",wt_away_p:"“{app}” hidup di web sana, tempat kamu merekamnya — studio tidak pernah menyimpan salinan situsmu. Jadi di sini tak ada apa pun untuk dijalankan turnya, dan menjalankannya di app demo cuma membuktikan bahwa app yang berbeda memang berbeda. Dua jalan jujur untuk membuka gerbang ini:",wt_away_a_h:"① Selesaikan di tempat app-nya hidup — dan jangan balik ke sini",wt_away_a_p:"Kamu TIDAK perlu merekam ulang, dan TIDAK perlu kembali ke ruang ini. Ekspor pack-nya di bawah, buka app-mu, klik bookmarklet Scout, pilih “Rehearse a pack I have”, lalu susuri turnya sekali. Panel yang sama kemudian MENCETAK snippet jadinya untukmu — salin, tempel di atas tag penutup body, dan turnya hidup. Ruang ini hanya ada untuk app yang bisa dipegang studio; app-mu bukan salah satunya, dan itu bukan masalah yang perlu dipecahkan.",wt_away_export:"Ekspor pack ini (file yang dibutuhkan Scout)",wt_away_b_h:"② Bawa salinannya ke sini",wt_away_b_p:"Kalau app-mu satu file HTML yang bisa kamu simpan (Ctrl+S) atau tempel, naikkan ke panggung dan Watch berjalan di sini, sama seperti demo.",wt_go_there:"Antar aku ke Scout",wt_go_stage:"Naikkan salinan app-ku",wt_proof_there:"Sudah digladi di app hidupmu ✓ — buktinya ikut di dalam pack",wt_diff_h:"Pack dan panggung ini dua app yang berbeda",wt_diff_p:"Pack ini direkam di “{pack}”, sedangkan yang di panggung “{staged}”. Kalau keduanya sebenarnya app yang sama dengan judul berbeda, jalankan saja — putaran tanpa langkah terlewat adalah satu-satunya bukti, ke arah mana pun.",wt_diff_run:"Ini app yang sama — jalankan saja",tg_h:"Studio ini dibuat untuk browser desktop",tg_p:"Kamu boleh melihat-lihat di sini dan tak ada yang akan rusak — tapi menyusun tur di layar sentuh itu melawan arus. Ini pembagian jujurnya:",tg_yes_s:["Membaca, menjelajah, dan meninjau pack yang sudah kamu buat","Mengimpor pack hasil rekaman Scout di tempat lain","Mencetak runtime dan Replay Theater"],tg_no_s:["Merekam dengan nyaman — app yang dipandu terjepit ke dalam frame selebar ponsel","Bookmarklet Scout sekali-klik, yang butuh bilah bookmark","Penyuntingan langkah yang presisi di dua kolom"],tg_runtime:"Panduan yang kamu cetak beda cerita: runtime Zappy dibuat untuk user sungguhan di perangkat sungguhan, termasuk ponsel. Yang butuh layar lebih besar hanyalah PABRIKNYA.",tg_ok:"Paham — aku mau lihat-lihat dulu",tr_touch:"Perangkat sentuh: merekam tetap jalan, tapi app-mu direkam pada lebar ponsel. Susunlah di desktop kalau memungkinkan.",nx_label:"Berikutnya",nx_here:"Kamu di sini",nx_go:"Ke sana",rt_label:"Rutemu",nx_launch:"Seret tombolnya ke bilah bookmark, lalu klik di situsmu.",nx_words:"Tulis tiap langkah seperti yang perlu didengar orang asing.",nx_test:"Jalankan “{g}” sekali, klik tiap sorotan. Nol terlewat membuka Terbit.",nx_publish:"Salin snippet-nya lalu tempel ke situsmu.",nx_stage:"Pilih app yang mau dipandu — demo bawaan cuma sejauh satu klik.",nx_record:"Rekam alur pertamamu: beri nama, tekan Start, lalu tinggal pakai app-nya.",nx_record_live:"Bawa snippet console ke app-mu dan rekam di sana — Scout bisa gladi bersih dan mencetak di tempat, jadi studio opsional mulai dari sini.",nx_steps:"“{g}” belum punya langkah — rekam di sini, atau hapus panduannya di Script.",nx_script:"Tulis tiap langkah seperti yang perlu didengar orang asing, lalu pasang pemicunya.",nx_watch:"Tonton satu putaran penuh “{g}” — putaran tanpa langkah terlewat itulah yang membuka Press.",nx_rehearse:"“{g}” direkam di app hidupmu, jadi ruang ini tak punya apa pun untuk menjalankannya — dan memang tak perlu: bawa pack-nya kembali dengan Scout, gladi bersih, lalu cetak di sana. Watch menjelaskan caranya.",nx_press:"Semua gerbang hijau — cetak snippet runtime dan Replay Theater-nya.",nx_done:"Sudah dicetak dan siap. Mengedit apa pun nanti akan membuka lagi gerbang Watch — itu memang disengaja.",pr_h:"Cetak panduannya.",pr_p:"Papan gerbang harus hijau semua; lalu dua artefak tercetak — snippet runtime Zappy dan Replay Theater.",gt_pack:"pack valid, minimal satu panduan",gt_stage:"tiap panduan sudah scripted",gt_steps:"tiap panduan punya langkah",gt_watch:"tiap panduan sudah ditonton (putaran penuh, nol lewat)",gt_round:"round-trip identik byte demi byte",gt_budget:"kode mentah runtime ≤ {kb} KB",gw_stage:"“{g}” masih memakai kata-kata si perekam — tulis ulang di Script, atau setujui apa adanya di sana",gw_steps:"panduan “{g}” belum punya langkah",gw_watch:"panduan “{g}” belum lolos putaran penuh di Watch",gw_pack:"pack belum punya panduan — rekam di Trace",pr_rt_h:"① Runtime Zappy",pr_rt_p:"Satu snippet mandiri, pack tertanam, Shadow DOM. Tempel sekali sebelum tag penutup body di tiap halaman app-mu — menerbitkan ulang cukup cetak ulang dan tempel ulang.",pr_rt_copy:"Salin snippet",pr_rt_dl:"Unduh snippet",pr_rt_size:"{kb} KB kode mentah · data pack {pk} KB",pr_th_h:"② Replay Theater",pr_th_p:"Halaman mandiri tempat app rekaman memutar turnya sendiri, papan langkah di sampingnya — demo yang bisa dibagikan dari panduan mana pun.",pr_th_dl:"Unduh Theater",pr_th_pick:"Panduan Theater",pr_th_away:"Theater adalah app rekaman yang memutar dirinya sendiri — dan studio tak punya salinan “{app}”. Runtime di atas tidak butuh apa-apa: tempel ke app-mu dan turnya hidup. Untuk Theater yang bisa dibagikan, naikkan salinan app-nya di Stage.",pr_pressed:"Tercetak. Tempel snippet-nya sekali — Zappy yang mengurus sisanya.",pr_locked:"Papan masih ada baris merah — bereskan penghambat yang disebut di atas.",pr_blocked:"Terkunci — satu hal masih kurang",in_h:"Atau lewati acara tempel-menempelnya",in_p:"Pilih folder situsmu dan SuperTour sendiri yang menuliskan snippet-nya ke tiap halaman. Kamu melihat persis apa yang akan berubah sebelum ada yang ditulis, dan cetak ulang nanti akan MENGGANTI blok ini, bukan menambah blok kedua.",in_pick:"Pilih folder situsku",in_plan:"{n} halaman akan berubah — {a} baru, {r} diperbarui",in_skipped:"{n} file dilewati: tak ada tag penutup body.",in_undo_git:"Folder ini repo git — diff-mu adalah undo-mu.",in_undo_nogit:"Tidak ada git di sini, jadi tak ada undo. Salin dulu foldernya kalau itu mengkhawatirkanmu.",in_toomany:"Itu banyak sekali halaman. Periksa daftarnya sebelum menulis.",in_go:"Tulis {n} halaman",in_cancel:"Batal",in_done:"Terpasang di {n} halaman ✓ — terbitkan seperti biasa.",in_act_added:"baru",in_act_replaced:"diperbarui",in_unsupported:"Pemasangan sekali-klik butuh Chrome, Edge, atau Brave. Di browser lain pakai langkah salin-temp .mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.idcard dt{color:var(--ink-faint)}.idcard dd{margin:0}
.toasts{position:fixed;bottom:var(--s-5);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--elev-2);animation:fadein var(--t-med)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--danger) 6%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px}

/* diagram tab (about-modal/3) + fullscreen viewer — registry-verbatim */
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ SuperTour-specific (custom composites — tokens only, PRD §12) ═══ */
/* Stage doors — tab anatomy shared with the modal's mtabs, outside the modal
   (the promptcraft .ztabs / cvforge face-tabs precedent; noted in NOTE.md) */
/* ═══ the route strip (D15) — every room opens with “where am I, what next” ═══
   One bar: the five-room road (done rooms ticked, the current one marked) and the
   single next move. When you are already standing where the next move is, the bar
   drops the button and says so — guidance, never nagging. */
.guidebar{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;
  background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-lg);
  padding:10px 12px;margin:0 0 var(--s-4)}
.guidebar.here{background:color-mix(in srgb,var(--accent) 6%,#fff);border-color:color-mix(in srgb,var(--accent) 24%,#fff)}
.guidebar .say{margin:0;font-size:12.5px;color:var(--ink);flex:1;min-width:220px}
.guidebar .say b{color:var(--accent);font-weight:700}
.guidebar .btn{flex:0 0 auto}
.routemap{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.routemap span{display:inline-flex;align-items:center;gap:4px}
.routemap i{color:var(--ink-faint);font-style:normal;font-size:11px}
.routemap button{border:1px solid transparent;background:none;font:600 11.5px/1 var(--font);
  color:var(--ink-muted);padding:5px 8px;border-radius:999px;cursor:pointer;white-space:nowrap}
.routemap button:hover{background:#fff;border-color:var(--hairline);color:var(--ink)}
.routemap button.done{color:var(--ok)}
.routemap button.at{background:var(--accent);border-color:var(--accent);color:#fff}
.routemap button.at.done{color:#fff}

/* the desktop-first notice on touch devices (D18) — an honest sheet, never a wall:
   it dismisses, it remembers, and every room stays reachable behind it. */
.touchveil{position:fixed;inset:0;z-index:95;background:rgba(23,23,23,.55);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.touchsheet{background:var(--surface);width:100%;max-width:520px;max-height:92dvh;overflow:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.touchsheet h2{font-size:18px;line-height:1.3;font-weight:700;margin:0 0 8px}
.touchsheet p{margin:0 0 10px;font-size:13.5px;line-height:1.6}
.touchsheet .lbl{font:700 12px/1 var(--font);letter-spacing:.04em;margin:12px 0 4px}
.touchsheet .lbl.ok{color:var(--ok)} .touchsheet .lbl.no{color:var(--danger)}
.touchsheet ul{margin:0 0 4px;padding-left:20px;font-size:13px;line-height:1.55;color:var(--ink-muted)}
.touchsheet ul.yes li::marker{color:var(--ok)} .touchsheet ul.no li::marker{color:var(--danger)}
.touchsheet .hint{margin:12px 0 16px;padding:10px 12px;background:var(--accent-wash);border-radius:var(--r-md);color:var(--ink)}
.touchsheet .btn{width:100%;justify-content:center}
@media (min-width:560px){ .touchveil{align-items:center} .touchsheet{border-radius:var(--r-lg)} }

/* progressive disclosure (D16) — the advanced half of a room, one click down.
   The summary always says what is inside, so closing it never hides a decision. */
.disclose{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);margin-top:var(--s-3)}
.disclose+.disclose{margin-top:var(--s-2)}
.disclose>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;
  padding:11px 13px;font:600 13px/1.35 var(--font);color:var(--ink);border-radius:var(--r-md)}
.disclose>summary::-webkit-details-marker{display:none}
.disclose>summary::before{content:"▸";color:var(--ink-faint);font-size:11px;transform:translateY(-1px)}
.disclose[open]>summary::before{content:"▾"}
.disclose>summary:hover{background:var(--wash)}
.disclose>summary .nt{font-weight:400;font-size:12.5px;color:var(--ink-muted)}
.disclose .dbody{padding:0 13px 13px}
.disclose .dbody>:first-child{margin-top:0}

/* first-run on-ramp + the live-app signpost — two cards that answer the two
   questions a newcomer actually has: “can I just try it?” and “my app isn’t a
   file, it’s a website — where do I go?” */
.quickstart{border-color:color-mix(in srgb,var(--accent) 30%,#fff);background:color-mix(in srgb,var(--accent) 4%,#fff)}
.signpost{border-style:dashed}

.doortabs{display:flex;gap:2px;border-bottom:1px solid var(--hairline);margin-top:var(--s-3)}
.doortabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;box-shadow:inset 0 -2px 0 transparent}
.doortabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

/* the framed app (Stage preview · Trace recorder · Watch runner) */
.stagebox{border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);margin-top:var(--s-4);position:relative}
.stagebox iframe{display:block;width:100%;height:520px;border:0;background:#fff}
.stagebox .onstage{position:absolute;top:10px;right:10px;z-index:2}

/* recording indicator — the red pulse (Trace) · amber when paused */
.rec-ind{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--danger)}
.rec-ind .pulse{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:recpulse 1.1s ease-in-out infinite}
.rec-ind.paused{color:var(--warn)}
.rec-ind.paused .pulse{background:var(--warn);animation:none}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.25}}

/* the fullscreen recording stage (owner call: focus while recording) — portaled to
   body, so no ancestor transform can turn position:fixed into a surprise local box */
.recfs{position:fixed;inset:0;z-index:92;background:var(--canvas);display:flex;flex-direction:column}
.recfs .bar{display:flex;gap:var(--s-3);align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface);flex:none;flex-wrap:wrap}
.recfs .bar b{font-size:13.5px}
.recfs .bar .sp{flex:1}
.recfs .stagefill{flex:1;min-height:0;display:flex}
.recfs .stagefill .stagebox{flex:1;margin-top:0;border:0;border-radius:0;display:flex}
.recfs .stagefill .stagebox iframe{height:auto;flex:1}
@media (max-width:640px){.recfs .bar .hint{display:none}}

/* step cards (Trace rail + Script editor rows) */
.steprail{display:flex;flex-direction:column;gap:var(--s-2);margin-top:var(--s-3)}
.stepcard{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:10px 12px;display:flex;gap:12px;align-items:flex-start}
.stepcard .idx{font:600 11px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border-radius:var(--r-pill);padding:4px 8px;flex:none;margin-top:2px}
.stepcard .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stepcard .lbl{font-size:13.5px}
.stepcard .sel{font:450 11px/1.4 var(--mono);color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stepcard .thumb{flex:none;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--wash)}
.stepcard .rowbtns{display:flex;gap:2px;flex:none}
.steprow{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.steprow .top{display:flex;gap:10px;align-items:center}
.steprow .top .idx{font:600 11px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border-radius:var(--r-pill);padding:4px 8px;flex:none}
.steprow .top .sel{font:450 11px/1.4 var(--mono);color:var(--ink-faint);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the row's three controls belong on ONE line beside the selector — without this
   they stacked into a three-storey column and made every step card tall (D16 eye check) */
.steprow .rowbtns{display:flex;gap:2px;flex:none}

/* guide list (Script) */
.glist{display:flex;flex-direction:column;gap:4px;margin-top:var(--s-3)}
.glist button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;font:500 13.5px/1.3 var(--font);color:var(--ink-muted);text-align:left;padding:9px 11px;border-radius:var(--r-md);cursor:pointer}
.glist button:hover{background:var(--wash);color:var(--ink)}
.glist button[aria-current]{border-color:color-mix(in srgb,var(--accent) 35%,#fff);background:var(--accent-wash);color:var(--accent);font-weight:600}

/* gate board (Press — the promptcraft Caliper-row anatomy, SuperTour's Lantern) */
.gate{border:1px solid var(--hairline);border-radius:var(--r-md);margin-top:var(--s-3);overflow:hidden}
.gate .row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--hairline);font-size:13px}
.gate .row:last-child{border-bottom:0}
.gate .row .st{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.gate .row.pass .st{background:color-mix(in srgb,var(--ok) 12%,#fff);color:var(--ok)}
.gate .row.fail .st{background:color-mix(in srgb,var(--danger) 10%,#fff);color:var(--danger)}
.gate .row .why{color:var(--ink-muted);font-size:12.5px}

/* watch log */
.runlog{font:450 12.5px/1.7 var(--mono);background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-3);max-height:220px;overflow:auto;margin-top:var(--s-3)}
.runlog .skip{color:var(--warn)}
.runlog .done{color:var(--ok)}

/* the one licensed Peak-End confetti (first all-green press) */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:75;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;opacity:.9;animation:cfall 1.7s ease-in forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(560deg);opacity:.65}}

/* responsive §11 — registry-verbatim */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11: below 820px the brand and the room links compete for one row. Without this the
     brand's text overflows its shrunk box and OVERPRINTS nav.rooms (all 14 apps did, 29–73px)
     — invisible to a no-horizontal-scroll gate, because overprinted text doesn't scroll.
     Fix: identity holds its width, navigation yields — nav.rooms already has its own
     overflow-x scroll, so it is the one that should absorb the squeeze. The name still caps
     at 38vw so a long brand can never crowd the nav out entirely. */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
  .stagebox iframe{height:420px}
}

/* ── the Zappy bench (D19) — the runtime's face, previewed at real size ──────
   The preview is a plain circle, not a screenshot: same diameter, same border,
   same glyph-shrink rule as the runtime, so what the author tunes here is what
   the visitor meets. Mood chips drive it; idle cycles on its own. */
.zappy{margin-top:var(--s-4)}
.zprev{display:flex;gap:var(--s-4);align-items:center;flex-wrap:wrap;
  border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--s-3);margin:var(--s-3) 0}
.zstageav{flex:none;width:120px;height:96px;border-radius:var(--r-md);display:grid;place-items:center}
.zav{border:2px solid var(--accent);border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.14);font-weight:700;letter-spacing:1px;line-height:1;white-space:nowrap}
.zmoods{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
/* the panel stacks label/hint pairs; without rhythm a hint collides with the next
   label and the whole bench reads as one grey wall (caught by looking at it) */
.zappy>.fields,.zappy>.field.full{margin-top:var(--s-4)}
.zappy>.field.full>label{font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.zappy .field .hint{font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.zmoods .lbl{font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow .chip{cursor:pointer;font:500 12.5px/1.35 var(--font);color:var(--ink-muted)}
.chiprow .chip:hover{border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--ink)}
.chiprow .chip.on{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 45%,#fff);
  color:var(--accent);font-weight:600}
.colorrow{display:flex;gap:8px;align-items:center}
.colorrow input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--hairline);
  border-radius:var(--r-md);background:var(--surface);cursor:pointer;flex:none}

/* D20 — a lock repeats itself beside the controls it disables, and “paste it before
   the closing body tag” gets an actual shape to look at */
.notice.blocker{margin:var(--s-3) 0 0}
.howto{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.55}
.howto li::marker{color:var(--accent);font-weight:700}
#paste-shape{margin-top:var(--s-3);white-space:pre;overflow-x:auto}

/* start over, from any room (D19) — a quiet door at the end of the route strip */
.guidebar .startover{margin-left:auto;flex:0 0 auto}

/* the Watch arena (D19): an app that is NOT here is a state with its own face */
.stagebox.empty-stage{display:grid;place-items:center;min-height:220px;background:var(--wash)}
.proofrow{display:flex;align-items:center;gap:8px;justify-content:space-between;
  border:1px solid var(--hairline);border-radius:var(--r-md);padding:9px 11px;font-size:13.5px}

@media (max-width:720px){
  .zprev{gap:var(--s-3)}
  .zstageav{width:88px;height:80px}
  .guidebar .startover{margin-left:0}
}

/* ── D23 · THE FORK — the only screen both lanes share ────────────────────────
   Two cards, one question, nothing else. No navbar rooms, no route strip, no gate
   board: none of those can be honest before the author has told us which product
   they are holding. */
.fork{max-width:820px;margin:0 auto;padding:var(--s-6) 0}
.forkhead{text-align:center;margin-bottom:var(--s-5)}
.forkhead h1{font:700 26px/1.25 var(--font);letter-spacing:-.01em;margin:0 0 8px}
.forkhead p{margin:0;color:var(--ink-muted);font-size:14.5px}
.forkcards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.forkcard{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);
  padding:var(--s-5);font:inherit;color:inherit;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast)}
.forkcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,#fff);box-shadow:var(--elev-2);transform:translateY(-2px)}
.forkcard h2{font:700 17px/1.3 var(--font);margin:0}
.forkcard p{margin:0;color:var(--ink-muted);font-size:13.5px;line-height:1.55;flex:1}
.forkcard .pick{color:var(--accent);font:600 13.5px/1 var(--font);margin-top:6px}
.forknote{text-align:center;margin-top:var(--s-4)}
@media (prefers-reduced-motion:reduce){ .forkcard:hover{transform:none} }
@media (max-width:720px){ .forkcards{grid-template-columns:1fr} .forkhead h1{font-size:22px} }

/* the official tutorial under the fork (D25) — quieter than the decision above it:
   a rule separates them, and nothing here competes with the two cards for the eye */
.howto{margin-top:var(--s-6);border-top:1px solid var(--hairline);padding-top:var(--s-5)}
.howtohead h2{font:700 17px/1.3 var(--font);margin:0 0 4px}
.howtohead p{margin:0;color:var(--ink-muted);font-size:13.5px}
.howto .doortabs{margin-top:var(--s-4)}
.hwpane{padding-top:var(--s-4)}
.hwsteps{list-style:none;counter-reset:hw;margin:0;padding:0;display:grid;gap:12px}
.hwsteps li{counter-increment:hw;display:grid;grid-template-columns:26px 1fr;
  grid-template-areas:"num title" "num desc";column-gap:12px;row-gap:2px}
.hwsteps li::before{grid-area:num;content:counter(hw);align-self:start;margin-top:1px;
  width:24px;height:24px;border-radius:var(--r-pill);display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
  font:700 12px/1 var(--font)}
.hwsteps li b{grid-area:title;font:600 14px/1.4 var(--font)}
.hwsteps li span{grid-area:desc;color:var(--ink-muted);font-size:13.5px;line-height:1.55}
.hwend{margin:var(--s-4) 0 0;padding:10px 12px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  font:600 13.5px/1.5 var(--font)}
.hwmap{display:block;width:100%;text-align:left;cursor:zoom-in;overflow:hidden;
  border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);
  padding:var(--s-4);font:inherit;color:inherit}
.hwmap:hover{border-color:color-mix(in srgb,var(--accent) 45%,#fff)}
.hwmap svg{display:block;width:100%;height:auto;max-width:100%!important}
.hwmapfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:var(--s-3)}
.hwmapfoot .hint{margin:0;flex:1;min-width:220px}
.hwlost{margin-top:var(--s-4)}

/* the launcher's one big door */
.btn.big{font-size:15px;padding:14px 22px}

/* a station you have not earned yet is not a door (D23) */
.routemap button:disabled{opacity:.45;cursor:not-allowed}
.routemap button:disabled:hover{background:none}</style>
</head>
<body>
<div id="root"></div>
<script data-goatcounter="https://alamehan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>

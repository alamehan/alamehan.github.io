witch",fk_switch_q:"Switching clears the route you're on. Your guides stay.",hw_h:"How it works",hw_p:"Two lanes, never crossing. Pick yours above — here is each one, end to end.",hw_t_web:"🛰️ Live on the web",hw_t_here:"💻 HTML file or demo",hw_t_map:"🗺️ The whole map",hw_web_s:["Drag the button|One drag onto your bookmarks bar. You do this once, ever.","Click it on your site|Open your real page and click the bookmark. A panel opens there.","Record|Start, walk your flow, Stop. Every click becomes a step; 🎯 Point adds what has no click.","Write the words|Rename each step. Say what the visitor should do.","Rehearse|Walk your own tour once, cleanly. That run is the gate.","Publish|⚡ Install it into your pages, or copy the snippet and paste it once."],hw_end_web:"Reload your site: the tour greets your first visitor by itself.",hw_here_s:["Pick the app|The bundled demo, or drop in your own HTML file.","Record|Fullscreen. Start, click your flow, Stop. 🎯 Point adds an area with nothing to click.","Write the words|Rename each step, and set when the tour offers itself.","Test|Run it and click every spotlight. Zero skips opens the gate.","Publish|⚡ Install, copy the snippet, or download the Replay Theater."],hw_end_here:"Paste it into your app once. Everyone who arrives after that is guided.",hw_map_p:"Every room, both lanes, and the three things a press can produce.",hw_map_zoom:"Open it big — zoom, fit and pan",hw_lost:"Lost later? “Switch lane” in any room brings you back to this question, and your guides stay.",lm_h:"Before you start — what this does, and what it doesn't",lm_yes:"✓ Works with",lm_yes_l:["Any site your browser can open — plain HTML, WordPress, Webflow, and app frameworks alike: React, Vue, Svelte, Next.js, Nuxt, Angular.","Single-page apps especially well: the tour stays alive through in-app routing, so it just follows along.","Anything the page really renders — clicks become steps by themselves, and whatever has no click (a chart, a status, a whole section) is added with 🎯 Point at an area.","Multi-page sites: a step remembers the page it belongs to, so the tour carries the visitor across — and asks first if they start it somewhere else.","Small redesigns. Each step keeps a CHAIN of clues — data-tour-id, then id, then the accessible label, then the visible words, then where it sits — and uses the first that still works, so renaming a button or moving it doesn't break the tour."],lm_no:"✗ Doesn't do",lm_no_l:["⚡ Install only writes .html files. A React/Next/Vue project has none in its source — paste the snippet into your layout instead (one line, one time; see below).","Survive a redesign that removes EVERY clue at once. That step then bows out with a visible note instead of crashing — and a step whose only clue left is its position is flagged ⚑, so you can pin it with a data-tour-id before it matters.","What you TYPE. Typing is recorded as “focus this field”, never as your keystrokes — your data stays yours.","Anything inside a cross-origin iframe (a payment or map widget) — the browser forbids it, and always will.","Recording across a full page load without one bookmark click; and ⚡ Install needs Chrome, Edge or Brave."],lm_fw_h:"Using React, Vue, Next, Nuxt…? Where the snippet goes",lm_fw_p:"Paste it once in the file that wraps every page, and it is live everywhere — the same as installing, without the installer.",lm_fw_l:["Next.js (app router)|app/layout.tsx — inside <body>, at the end","Next.js (pages router)|pages/_document.tsx — inside <body>, at the end","Nuxt|app.vue, or nuxt.config app.head.script","Vite (React/Vue/Svelte)|index.html — before the closing body tag","Angular|src/index.html — before the closing body tag","WordPress · Webflow · Shopify · Framer|their “footer scripts” / “custom code” box"],lm_fw_note:"Server-rendered or static, it makes no difference: the snippet is plain JavaScript with no dependencies and no network calls.",lm_proof_h:"Where all of this was measured",lm_proof:"Everything above is proven in **Chromium** — Chrome, Edge and Brave — on a desktop and at phone size. **Firefox and Safari are not verified.** The pressed guide is plain JavaScript with no exotic APIs, so it should run there too — but “should” is not “measured”, and this factory doesn't print what it hasn't run.",lm_proof_ph:"Phones: the guide your visitors get is built for them and is measured at phone width. The studio itself wants a desk — it works on a phone, it just fights you, and it says so when you open it there.",ln_h:"One button, and you're done here.",ln_p:"Drag it once. From then on, every tour you make happens inside your own site — record, write, test, publish. You never come back to this screen.",ln_open_h:"Already have a pack file?",ln_open_p:"Open it here to rewrite its words and publish it. Testing still happens where the app lives.",ln_open_btn:"Open a pack file",dk_note:"This tour was recorded in your live app. Here you can rewrite its words and publish it — testing happens where the app lives.",rc_h:"Record the flow.",rc_p:"Pick the app, then just use it. Every meaningful click becomes a step — and 🎯 Point adds the things that have no click.",sg_h:"Which app are we guiding?",sg_p:"Put an app on the stage and the recorder in the next room can see it. If your app is live on the web instead, you don't stage anything here — you carry the recorder to it.",door_playground:"Demo app",door_replica:"My own HTML",door_pack:"Pack file",sg_pg_note:"The bundled demo — a small CMS that ships inside the studio, so you can learn the whole flow without touching your own app.",sg_pg_use:"Put the demo on the stage",sg_pg_staged:"The demo app is on the stage ✓",sg_sample_h:"Rather read one than record one?",sg_sample_p:"Load the example tour — six finished steps on the demo app (“Create & publish an article”). It is an example, not your work: it arrives unwatched, and you can delete it in the Script at any time.",sg_sample_btn:"Load the example tour",sg_sample_in:"The example tour is loaded ✓",sg_sample_done:"Example tour loaded ✓ — it still has to survive a Watch run like anything else.",sg_quick_h:"New here? One minute, end to end.",sg_quick_p:"Take the demo app, record a two-click flow, and press a real runtime. Nothing you do here touches your own app.",sg_quick_btn:"Use the demo & start recording",sg_where_h:"Where does your app live?",sg_where_web:"Out on the web, at a URL",sg_where_web_p:"Then nothing is staged here — the Scout travels to your app instead: record, rehearse and press the finished snippet right inside your site. The studio stays optional, for deep editing.",sg_where_here:"Right here — the demo, your own HTML, or a pack file",sg_where_here_p:"Stage it below and every room works on it directly.",sg_live_btn:"Take me to the live-app recorder",sg_over_h:"Start over",sg_over_note:"clear your guides · or wipe this device clean",sg_over_clear_h:"Clear my work, keep this app on the stage",sg_over_clear_p:"Deletes every guide, step, watch mark and press flag — the app you staged and your language stay. Export the pack first if you might want it back.",sg_over_clear:"Clear my guides",sg_over_clear_q:"Delete every guide and start recording fresh?",sg_over_clear_done:"Cleared ✓ — the stage is set, nothing recorded.",sg_over_all_h:"Reset everything on this device",sg_over_all_p:"The full reset: guides, staged app, language, watch marks, and Zappy's own runtime flags — everything SuperTour ever saved in this browser. There is no undo.",sg_over_all:"Reset everything",sg_pack_h:"Bring back a recording",sg_pack_p:"The Scout downloads a pack file after you review your steps out there. Drop it here and the guides land in the studio, ready for the Script.",sg_rep_l:"Your app's HTML",sg_rep_ph:"Paste (or drop) the full HTML of a single-file app here…",sg_rep_upload:"Upload .html file",sg_rep_stage:"Stage this HTML",sg_rep_staged:"Replica staged ✓ — walk to the Trace to record.",sg_rep_note:"Honest limit: the Replica renders single-HTML apps faithfully. An SPA that fetches external resources at boot will not fully boot in the sandboxed frame — that's what the Scout door is for.",sg_rep_err:"That doesn't look like an HTML document — the Replica needs markup with a <body>.",sg_bm_h:"① One click — drag this to your bookmarks bar",sg_bm_p:"Drag it there ONE time. From then on, open any page of your app and click it: the whole pocket studio appears — record, fix the words, set the trigger and your brand colour, rehearse, and press the finished snippet right there. No console, no install, no coming back here.",sg_bm_drag:"🧭 SuperTour Scout",sg_bm_hint:"Drag it to the bookmarks bar — clicking it here does nothing.",sg_bm_note:"Honest limit: a site with a strict Content-Security-Policy can refuse bookmarklets, and a browser could trim a bookmark this long — either way the panel that appears will show the recorder only, and the console door below carries the identical bench.",tr_pocket_h:"If the bookmarklet can't get in — the console door",tr_pocket_p:"Identical Scout, identical press bench — pasted into DevTools instead. Use it when your site's Content-Security-Policy refuses javascript: bookmarklets, or if your browser trimmed the bookmark (the panel will say so: it shows the recorder only). Copy, open your app, F12 → Console, paste, Enter.",tr_pocket_allow:"Chrome may first ask you to type “allow pasting” — that is Chrome guarding people who paste strangers' code. This block comes from your own studio.",sg_sc_copy:"Copy Scout snippet",sg_sc_copied:"Scout snippet copied — paste it into your app's console ✓",sg_imp_h:"The pack file",sg_imp_l:"Import a pack",sg_imp_ph:"Paste a supertour-pack: 1 file (or drop the .md here)…",sg_imp_up:"Upload the .pack.md file",sg_imp_btn:"Import pack",sg_imp_ok:"Pack imported ✓ — {n} guide(s). Every guide needs a fresh Watch run.",sg_imp_ok_proof:"Pack imported ✓ — {n} guide(s), rehearsed where the app lives. The Watch gate came with them.",so_close:"Close",sg_exp_btn:"Export current pack",cm_h:"Compass — refused, nothing was touched",refuse_line:"Line {n}: {reason}",preview_h:"On stage now",tr_h:"Record the flow.",tr_p:"There is ONE recorder, and it works in two places — pick where your app lives. Either way, every meaningful click becomes a step with a healing selector chain and a context chip; typing is recorded as a focus step, never as your keystrokes; and 🎯 Point turns anything with nothing to click — a chart, a status, a whole section — into a step the tour highlights.",tr_mode_here:"Here, in the studio",tr_mode_there:"Out there, in my live app",tr_here_p:"Records the app standing on the Stage, inside the studio's frame. Best for the demo and for single-file apps you can paste or upload.",tr_there_p:"Records inside your real, running site — and now presses there too: the Scout carries the whole trip (record → words → trigger → rehearse → press). Nothing is staged in the studio for this route.",tr_there_back:"Rather write the words in the studio?",tr_there_back_p:"You never have to — the Scout finishes the job out there. But the studio is the better bench for long copy, several guides at once, or the BYOAI copy-brief. If you want it: in your app press Stop → review → Download pack, then drop that file below.",tr_there_btn:"Import that pack on the Stage",tr_guide_l:"Name this tour",tr_guide_ph:"e.g. Create & publish an article",tr_guide_default:"Guide {n}",tr_start:"Start recording",tr_stop:"Stop recording",tr_rec:"REC",tr_pause:"Pause",tr_resume:"Resume",tr_paused_tag:"PAUSED",tr_paused:"Paused — clicks in the frame are ignored until you resume.",tr_fs_note:"Recording takes the whole screen so you can focus on the flow — Stop brings you back to the step rail.",tr_recording:"Recording — every meaningful click becomes a step.",tr_empty:"No recording running yet — name the tour above (or keep the default), press Start, and the app takes the whole screen so you can just use it.",tr_noop:"Nothing to record from that click — it isn't a button, link or field. To include it anyway, use 🎯 Point at an area.",tr_aim:"🎯 Point at an area",tr_aim_stop:"✓ Done pointing",tr_aim_p:"Not a button? Point at it. A chart, a status, a whole section becomes a step the tour highlights — and never clicks.",tr_aim_on:"POINTING — your clicks add steps, they don't reach the app.",tr_navout:"That link leaves the page, and the studio's frame can't follow it. Tabs and in-page routes work; for a flow that spans real page loads, record in your live app instead.",tr_steps:"Captured steps",tr_reset:"Discard & re-record",tr_reset_q:"Discard this guide's recorded steps?",tr_yes:"Discard",tr_no:"Keep",tr_stopped:"Recording stopped — {n} step(s) captured. Polish them at the Script.",tr_act_click:"click",tr_act_focus:"focus",tr_act_look:"point",sc_h:"Script the guide.",sc_p:"Rewrite each step like a human, set the trigger, flag the steps that change data. Rewriting words is free — only a change to the STEPS themselves (order, removal, what a step acts on) re-opens that guide's Watch gate.",sc_none:"No guides yet — record one at the Trace, or bring a pack back there.",sc_guides:"Guides",sc_meta:"Guide settings",sc_name:"Guide name",sc_trigger:"Trigger scenario",trg_new_user:"New User — first visit",trg_new_release:"New Release",trg_how_to:"How-To (listed in the guide menu)",trg_return_user:"Return User",sc_version:"Release version",sc_days:"Return threshold (days)",sc_err_name:"The guide needs a name.",sc_err_version:"New Release needs a version string.",sc_err_days:"Threshold must be a positive number of days.",sc_chrome:"Runtime chrome labels (default EN — yours to rewrite)",sc_chrome_note:"Next · Back · Close · Done — the four words the tour's own buttons say",sc_brief_note:"optional · any AI rewrites your step copy, you keep the last word",sc_hint_add:"+ add a hint",sc_hint_drop:"remove hint",sc_adv:"More for this step",sc_adv_note:"hint · data-changing flag",sc_pos:"Found only by where it sits in the page — a layout change loses it. Give the element a data-tour-id and record it again to pin it for good.",ch_next:"Next",ch_back:"Back",ch_close:"Close",ch_done:"Done",sc_steps:"Steps",sc_lbl:"Instruction",sc_hint:"Hint (optional)",sc_mut:"changes data — never auto-replayed",sc_del:"Delete step",sc_restore:"Restore step",sc_deleted:"Step deleted.",sc_restored:"Step restored ✓",sc_up:"Move up",sc_down:"Move down",sc_guide_del:"Delete guide",sc_guide_del_q:"Delete this whole guide?",sc_guide_deleted:"Guide deleted ✓",sc_raw_h:"These are still the recorder's words",sc_raw_p:"Every label above was taken from the element you clicked, which is rarely how you would say it to a stranger. Rewrite what needs rewriting — or, if they already read well, approve them and move on.",sc_raw_btn:"The words are good — approve them",sc_raw_done:"Approved ✓ — the pack is scripted.",sc_brief_h:"Copy-brief — polish the words (BYOAI)",sc_brief_p:"Copy one self-contained brief into any AI chat. It asks for the WORDS back and nothing else — your tour's structure never leaves this studio, so a reply cannot break it. What comes back lands as a draft you compare and adopt, or throw away.",sc_brief_copy:"Copy the brief",sc_brief_copied:"Brief copied — paste it into any AI ✓",sc_reply_l:"Paste the reply",sc_reply_ph:"Paste the whole reply — SuperTour finds the JSON block by itself, fence or no fence.",sc_reply_btn:"Check the reply",sc_draft_h:"Draft landed — your pack is untouched",sc_draft_sum:"guides ±{g} · structure changes {s} · labels rewritten {l}",sc_adopt:"Adopt as the pack",sc_discard:"Discard draft",sc_adopted:"Adopted ✓ — every guide needs a fresh Watch run.",brief_landed:"Landed as a draft — your pack is untouched.",zp_h:"Zappy — the face that does the guiding",zp_p:"How the runtime looks and what it calls itself. All of it travels inside the pack, so the tour you press wears YOUR colors in YOUR app — not the studio's.",zp_name:"What the guide is called",zp_name_note:"used in the greeting and the screen-reader label",zp_persona:"Expression set",zp_persona_note:"Zappy reacts — a different face for greeting, moving, pointing, waiting on you, losing a step, and finishing.",zp_accent:"Accent color",zp_accent_note:"spotlight ring, buttons, the minimized dot — set it to your brand. Buttons darken it just enough for white text, and keep dark text when even that would not be readable.",zp_home:"Home corner",zp_home_br:"bottom right",zp_home_bl:"bottom left",zp_home_tr:"top right",zp_home_tl:"top left",zp_size:"Size",zp_size_s:"small",zp_size_m:"medium",zp_size_l:"large",zp_fx:"Liveliness",zp_fx_vivid:"vivid — all of “full”, at a quicker pulse",zp_fx_full:"full — reacts, bounces, celebrates",zp_fx_calm:"calm — expressions change, nothing bounces",zp_fx_off:"still — no motion at all",zp_fx_note:"A visitor who asks for reduced motion always gets “still”, whatever you pick here.",zp_preview:"Live preview",zp_preview_note:"click a mood to see it — this is the real avatar, at the real size",zp_custom_h:"Write your own faces",zp_custom_note:"eight moods · any text or emoji you like",zp_custom_p:"Anything short works: kaomoji, emoji, two letters. Idle takes a comma-separated list and Zappy cycles through it.",zp_idle_note:"comma-separated — cycled while nothing is happening",zp_reset:"Back to the defaults",zp_reset_done:"Zappy is back to the default look ✓",mood_idle:"Idle",mood_greet:"Greeting",mood_walk:"On the move",mood_point:"Pointing",mood_wait:"Your turn",mood_oops:"Lost a step",mood_cheer:"Finished",mood_sleep:"Minimized",per_spark:"Spark",per_emo:"Emoji",per_robo:"Robo",per_dots:"Minimal",per_custom:"Custom",so_btn:"Start over",so_h:"Start over — how far back?",tr_imp_h:"Drop the pack here",tr_imp_p:"The Scout downloaded a file. Drop it here and your guides land in the studio: no walking back to the Stage, no hunting for a door.",tr_reh_note:"Either way, Rehearse first: you walk your own tour once in the real page. That clean run is what unlocks the press out there — and, if you do bring a pack back, what makes this studio's Watch gate green on arrival. Forgot to? Nothing is lost: the Scout also takes a pack file you already downloaded and rehearses that.",wt_h:"Watch it like a user.",wt_p:"The real runtime runs the tour inside the frame — spotlight, guided clicks, everything. The Press stays locked until every guide survives one full run with zero skips.",wt_pick:"Guide",wt_run:"Run the tour",wt_rerun:"Run again",wt_watched:"Watched ✓ — press-ready",wt_unwatched:"not watched yet",wt_log:"Run log",wt_step:"step {n}/{t}",wt_skip:"step {n} skipped — element not found",wt_complete:"Full run complete ✓ — the gate is open for this guide.",wt_complete_skips:"Run finished with {n} skipped step(s) — fix the steps, then run again. The gate stays closed.",wt_closed:"Run closed early — the gate stays closed.",wt_empty:"No guides to watch yet — record at the Trace first.",watch_gate:"Press unlocks after one full Watch run of every guide.",wt_stage_l:"On the stage",wt_away_h:"The app this tour belongs to isn't in the studio",wt_away_p:"“{app}” lives out on the web, where you recorded it — the studio never keeps a copy of your site. So there is nothing here to run the tour against, and running it against the demo would only prove that a different app is different. Two honest ways to open this gate:",wt_away_a_h:"① Finish it where the app lives — and don't come back",wt_away_a_p:"You do NOT have to record it again, and you do NOT have to return to this room. Export the pack below, open your app, click the Scout bookmarklet, choose “Rehearse a pack I have”, and walk the tour once. The same panel then PRESSES the finished snippet for you — copy it, paste it above your closing body tag, and the tour is live. This room only exists for apps the studio can hold; yours isn't one, and that is not a problem to solve.",wt_away_export:"Export this pack (the file the Scout needs)",wt_away_b_h:"② Bring a copy here",wt_away_b_p:"If your app is a single HTML file you can save (Ctrl+S) or paste, stage it and the Watch runs right here, like the demo.",wt_go_there:"Take me to the Scout",wt_go_stage:"Stage a copy of my app",wt_proof_there:"Rehearsed in your live app ✓ — the proof travelled in the pack",wt_diff_h:"The pack and the stage are two different apps",wt_diff_p:"This pack was recorded in “{pack}”, but “{staged}” is what's on the stage. If they really are the same app under a different title, run it — a run with zero skips is the only proof either way.",wt_diff_run:"They are the same app — run it anyway",tg_h:"This studio is built for a desktop browser",tg_p:"You can look around here, and nothing will break — but authoring a tour on a touch screen fights you. Here is the honest split:",tg_yes_s:["Reading, browsing, and reviewing a pack you already made","Importing a pack the Scout recorded elsewhere","Pressing the runtime and the Replay Theater"],tg_no_s:["Recording comfortably — the app under authorship is squeezed into a phone-width frame","The one-click Scout bookmarklet, which needs a bookmarks bar","Precise step editing across two columns"],tg_runtime:"The guides you press are a different story: the Zappy runtime is built for real users on real devices, phones included. It is only the FACTORY that wants a bigger screen.",tg_ok:"Got it — let me look around",tr_touch:"Touch device: recording works, but your app is being recorded at phone width. Author on a desktop when you can.",nx_label:"Next",nx_here:"You're here",nx_go:"Go",rt_label:"Your route",nx_launch:"Drag the button to your bookmarks bar, then click it on your site.",nx_words:"Write each step the way a stranger needs to hear it.",nx_test:"Run “{g}” once, clicking each highlight. Zero misses unlocks Publish.",nx_publish:"Copy the snippet and paste it into your site.",nx_stage:"Pick the app you want to guide — the bundled demo is one click away.",nx_record:"Record your first flow: name it, press Start, then simply use the app.",nx_record_live:"Take the console snippet to your app and record there — the Scout can rehearse and press on the spot, so the studio is optional from here.",nx_steps:"“{g}” has no steps yet — record it here, or delete the guide in the Script.",nx_script:"Write each step the way a stranger needs to hear it, then set the trigger.",nx_watch:"Watch one full run of “{g}” — a run with zero skips is what unlocks the Press.",nx_rehearse:"“{g}” was recorded in your live app, so this room has nothing to run it against — and it doesn't need to: take the pack back with the Scout, rehearse, and press it there. The Watch tells you how.",nx_press:"Every gate is green — press the runtime snippet and the Replay Theater.",nx_done:"Pressed and ready. Edit anything later and the Watch gate re-opens on purpose.",pr_h:"Press the guide.",pr_p:"The gate board must be all green; then two artifacts mint — the Zappy runtime snippet and the Replay Theater.",gt_pack:"pack valid, at least one guide",gt_stage:"every guide scripted",gt_steps:"every guide has steps",gt_watch:"every guide watched (full run, zero skips)",gt_round:"round-trip byte-identical",gt_budget:"runtime raw code ≤ {kb} KB",gw_stage:"“{g}” still wears the recorder's own words — rewrite them in the Script, or approve them there as they are",gw_steps:"guide “{g}” has no steps",gw_watch:"guide “{g}” hasn't survived a full Watch run",gw_pack:"the pack has no guides — record one at the Trace",pr_rt_h:"① The Zappy runtime",pr_rt_p:"One self-contained snippet, pack inlined, Shadow DOM. Paste it once before the closing body tag on every page of your app — publishing is a re-press and a re-paste.",pr_rt_copy:"Copy snippet",pr_rt_dl:"Download snippet",pr_rt_size:"{kb} KB raw code · pack data {pk} KB",pr_th_h:"② The Replay Theater",pr_th_p:"A standalone page where the recorded app replays the tour by itself, step board alongside — the shareable demo of any guide.",pr_th_dl:"Download Theater",pr_th_pick:"Theater guide",pr_th_away:"The Theater is the recorded app replaying itself — and the studio has no copy of “{app}”. The runtime above needs nothing: paste it into your app and the tour is live. For a shareable Theater, stage a copy of the app on the Stage.",pr_pressed:"Pressed. Paste the snippet once — Zappy does the rest.",pr_locked:"The board has red rows — fix the named blockers above.",pr_blocked:"Locked — one thing is missing",in_h:"Or skip the pasting",in_p:"Pick your site's folder and SuperTour writes the snippet into every page itself. You see exactly what will change before anything is written, and re-pressing later replaces this block instead of adding a second one.",in_pick:"Choose my site folder",in_plan:"{n} page(s) will change — {a} new, {r} updated",in_skipped:"{n} file(s) skipped: no closing body tag.",in_undo_git:"This folder is a git repo — your diff is your undo.",in_undo_nogit:"No git here, so there is no undo. Copy the folder first if that worries you.",in_toomany:"That is a lot of pages. Check the list before writing.",in_go:"Write {n} page(s)",in_cancel:"Cancel",in_done:"Installed into {n} page(s) ✓ — publish them the way you normally do.",in_act_added:"new",in_act_replaced:"updated",in_unsupported:"One-click install needs Chrome, Edge or Brave. On other browsers use the copy-and-paste steps above — same result, one more step.",in_diff_h:"Show me the diff",in_diff_note:"exactly what lands in each page",in_diff_p:"Only this block is touched — every other line of your page stays byte-for-byte identical. Nothing is written until you press the button below.",in_writing:"Writing pages… {n} / {t}",in_next:"Publish them the way you normally do, then reload your site.",in_partial:"{n} written, {f} refused.",in_denied:"The browser didn't grant write access to that folder. Pick another, or use Copy snippet.",in_ok:"OK",in_remove:"Remove it from my site",in_act_removed:"remove",in_auto:"Installed, the tour needs no bookmark at all — it runs on every page by itself, for you and for every visitor.",in_rplan:"Remove the tour from {n} page(s)?",in_rnone:"No SuperTour block found in that folder — nothing to remove.",in_rgo:"Remove from {n} page(s)",in_rdone:"Removed from {n} page(s) ✓",in_rnext:"Only the SuperTour block went; every other line is byte-for-byte as it was.",pr_how_h:"Where exactly does this go?",pr_how_note:"the two-minute version, for a site made of HTML files",pr_how_s:["Press Copy snippet above — the whole thing, including the opening and closing script tags.","Open the HTML file of your site in any editor (index.html, or your template/layout file if you have one).","Scroll to the bottom and find the line that says </body>. Paste the snippet on the line just ABOVE it.","Save, then publish the file the way you normally do (upload it, or commit and push).","Open your live site. The guide's avatar appears in the corner; a New User tour greets a first-time visitor by itself, and clicking the avatar lists your How-To tours."],pr_how_plat:"If your site is built on a platform instead of files (WordPress, Webflow, Shopify, Framer…), look for its “custom code”, “footer scripts” or “body end” box and paste it there — that box exists precisely for snippets like this one.",pr_how_check:"Nothing appears? Open the page, press F12 → Console. Zappy is silent by design, but a blocked script says so there. And remember: a New User tour offers itself once per browser — clear the site's storage, or click the avatar and pick it, to see it again.",about_overview:"Overview",about_diagram:"Diagram",about_philosophy:"Philosophy",about_identity:"Identity",about_author:"Author",ov_what:"What it is",ov_what_p:"SuperTour 🧭 — the offline in-app-guide factory. “Record once, guide forever — in any app, offline.” A studio that records real flows and presses Zappy, a zero-dependency runtime that walks users through the live app.",ov_flow:"How it flows",ov_flow_s:["The fork — one question, asked before anything else: does your app live on the web, or do you have an HTML file?","Live on the web — one station, Launch: it hands you the bookmarklet, and the whole job then happens inside your own page","In the studio — four stations that lock until the one before them is done: Record · Words · Test · Publish","Test is the gate — one full run with zero skips, taken where the app actually lives","Publish — the Zappy snippet, the one-click Install, and the Replay Theater"],ov_get:"What you get",ov_get_p:"A guided tour living inside your real app with no backend, and a pack you re-press forever. Contracts: supertour-pack: 1 · sig st-YYYYMMDD-supertour-xxxx.",ph_p1:"A guide should live where the user is lost: inside the app, at the moment of confusion, pointing at the real button.",ph_p2:"No backend, by architecture — the studio presses, the snippet carries the tours inside itself, and publishing is a file operation.",ph_p3:"Replay respects reality: sandboxes may replay everything; the live app is forward-only and data-changing steps wait for the user's own click.",ph_p4:"No AI inside (BYOAI) and no model names — the copy-brief round-trip outlives every vendor cycle.",ph_family:"One file. One accent. One standard.",dg_hint:"One map of the whole factory — the fork, both lanes, the recorder, the pack, the gate, and the three things a press can produce. Authored in Mermaid, shipped as its rendered SVG (offline forever).",dg_fs:"Fullscreen",dg_src:"View Mermaid source",dg_hide:"Hide source",dg_copy:"Copy source",dg_copied:"Mermaid source copied ✓",reset:"Reset everything",reset_confirm:"Reset erases everything SuperTour saved on this device — the pack, watch marks, preferences, and Zappy's runtime flags. There is no undo.",reset_yes:"Erase it all",reset_no:"Keep my work",reset_done:"Fresh stage. Everything cleared. 🧭",dl_done:"Downloaded ✓",copied:"Copied ✓",know:"Know the Creator ↗"},id:{room_launch:"Luncur",room_record:"Rekam",room_words:"Kata",room_test:"Uji",room_publish:"Terbit",tagline:"Rekam sekali, pandu selamanya.",fk_h:"App-mu tinggal di mana?",fk_p:"Satu pertanyaan. Semua sesudahnya mengikuti jawabanmu.",fk_web_h:"🛰️ Hidup di web",fk_web_p:"Kerjanya di dalam situsmu sendiri. Studio cukup memberi satu tombol, lalu menyingkir.",fk_here_h:"💻 Aku punya file HTML — atau cuma mau coba",fk_here_p:"Kerjanya di sini. App-mu jalan di dalam halaman ini, begitu juga sisanya.",fk_pick:"Ini punyaku",fk_switch:"Salah jalur? Ganti",fk_switch_q:"Ganti jalur menghapus jalur yang sedang kamu tempuh. Panduanmu tetap.",hw_h:"Cara kerjanya",hw_p:"Dua jalur, tak pernah bersimpangan. Pilih punyamu di atas — ini isi masing-masing, dari awal sampai akhir.",hw_t_web:"🛰️ Hidup di web",hw_t_here:"💻 File HTML atau demo",hw_t_map:"🗺️ Peta utuhnya",hw_web_s:["Seret tombolnya|Sekali seret ke bilah bookmark. Cuma sekali, selamanya.","Klik di situsmu|Buka halaman aslimu, klik bookmark itu. Panelnya muncul di sana.","Rekam|Start, jalani alurmu, Stop. Tiap klik jadi satu langkah; 🎯 Tunjuk menambahkan yang tak bisa diklik.","Tulis kalimatnya|Ganti nama tiap langkah. Sebutkan apa yang harus dilakukan pengunjung.","Gladi|Jalani turmu sendiri satu putaran bersih. Putaran itulah gerbangnya.","Terbit|⚡ Pasang ke halamanmu, atau salin snippet lalu tempel sekali."],hw_end_web:"Muat ulang situsmu: turnya menyapa pengunjung pertamamu sendiri.",hw_here_s:["Pilih app-nya|Demo bawaan, atau taruh file HTML-mu sendiri.","Rekam|Layar penuh. Start, klik alurmu, Stop. 🎯 Tunjuk menambahkan area yang tak bisa diklik.","Tulis kalimatnya|Ganti nama tiap langkah, lalu atur kapan tur menawarkan diri.","Uji|Jalankan dan klik tiap sorotan. Nol langkah terlewat membuka gerbangnya.","Terbit|⚡ Pasang, salin snippet, atau unduh Replay Theater."],hw_end_here:"Tempel sekali ke app-mu. Semua yang datang sesudahnya terpandu.",hw_map_p:"Semua ruang, kedua jalur, dan tiga hal yang bisa dihasilkan sekali cetak.",hw_map_zoom:"Buka besar — zoom, pas-kan, geser",hw_lost:"Tersesat nanti? “Ganti jalur” di ruang mana pun mengembalikanmu ke pertanyaan ini, dan panduanmu tetap.",lm_h:"Sebelum mulai — apa yang bisa, dan apa yang tidak",lm_yes:"✓ Bisa dipakai di",lm_yes_l:["Situs apa pun yang bisa dibuka browsermu — HTML biasa, WordPress, Webflow, maupun framework app: React, Vue, Svelte, Next.js, Nuxt, Angular.","Single-page app justru paling mulus: turnya tetap hidup melewati routing di dalam app, jadi ia tinggal mengikuti.","Apa pun yang benar-benar dirender halamannya — klik jadi langkah dengan sendirinya, dan yang tak bisa diklik (grafik, status, satu bagian utuh) ditambahkan lewat 🎯 Tunjuk satu area.","Situs banyak halaman: tiap langkah mengingat halamannya sendiri, jadi turnya ikut menyeberang bersama pengunjung — dan bertanya dulu kalau mereka memulainya dari halaman lain.","Perubahan desain kecil. Tiap langkah menyimpan SATU RANTAI petunjuk — data-tour-id, lalu id, lalu label aksesibilitasnya, lalu kata yang terlihat, lalu posisinya — dan memakai yang pertama masih cocok, jadi mengganti kata tombol atau memindahkannya tak merusak tur."],lm_no:"✗ Tidak bisa",lm_no_l:["⚡ Pasang hanya menulis file .html. Project React/Next/Vue tak punya itu di source — tempel snippet-nya di layout-mu (satu baris, sekali saja; lihat di bawah).","Bertahan dari perubahan desain yang menghapus SEMUA petunjuk sekaligus. Langkah itu lalu mundur baik-baik dengan catatan yang terlihat, bukan crash — dan langkah yang tinggal punya posisinya saja ditandai ⚑, supaya bisa kamu kunci dengan data-tour-id sebelum jadi masalah.","Apa yang kamu KETIK. Mengetik direkam sebagai “fokus ke kolom ini”, tak pernah sebagai ketikanmu — datamu tetap milikmu.","Apa pun di dalam iframe beda-origin (widget pembayaran atau peta) — browser melarangnya, dan akan selalu begitu.","Merekam menembus muat-ulang halaman penuh tanpa satu klik bookmark; dan ⚡ Pasang butuh Chrome, Edge, atau Brave."],lm_fw_h:"Pakai React, Vue, Next, Nuxt…? Snippet-nya ditaruh di mana",lm_fw_p:"Tempel sekali di file yang membungkus semua halaman, dan ia hidup di mana-mana — sama seperti memasang, tanpa installer.",lm_fw_l:["Next.js (app router)|app/layout.tsx — di dalam <body>, paling bawah","Next.js (pages router)|pages/_document.tsx — di dalam <body>, paling bawah","Nuxt|app.vue, atau nuxt.config app.head.script","Vite (React/Vue/Svelte)|index.html — sebelum tag penutup body","Angular|src/index.html — sebelum tag penutup body","WordPress · Webflow · Shopify · Framer|kotak “footer scripts” / “custom code” mereka"],lm_fw_note:"Server-rendered atau statis sama saja: snippet-nya JavaScript biasa, tanpa dependensi dan tanpa panggilan jaringan.",lm_proof_h:"Semua ini diukur di mana",lm_proof:"Semua di atas terbukti di **Chromium** — Chrome, Edge, dan Brave — di desktop maupun pada ukuran HP. **Firefox dan Safari belum terverifikasi.** Panduan yang tercetak itu JavaScript biasa tanpa API aneh, jadi seharusnya jalan juga di sana — tapi “seharusnya” bukan “terukur”, dan pabrik ini tak mencetak apa yang belum dijalankannya.",lm_proof_ph:"HP: panduan yang diterima pengunjungmu memang dibuat untuk mereka dan diukur pada lebar HP. Studionya sendiri butuh meja — ia jalan di HP, hanya saja melawan arus, dan ia mengatakannya sendiri saat kamu membukanya di sana.",ln_h:"Satu tombol, lalu urusanmu di sini selesai.",ln_p:"Seret sekali. Setelah itu tiap tur yang kamu buat terjadi di dalam situsmu sendiri — rekam, tulis, uji, terbit. Kamu tak perlu kembali ke layar ini.",ln_open_h:"Sudah punya file pack?",ln_open_p:"Buka di sini untuk menulis ulang kalimatnya lalu menerbitkannya. Pengujian tetap di tempat app-nya hidup.",ln_open_btn:"Buka file pack",dk_note:"Tur ini direkam di app hidupmu. Di sini kamu bisa menulis ulang kalimatnya dan menerbitkannya — pengujian terjadi di tempat app-nya hidup.",rc_h:"Rekam alurnya.",rc_p:"Pilih app-nya, lalu tinggal pakai. Tiap klik bermakna jadi satu langkah — dan 🎯 Tunjuk menambahkan hal-hal yang tak bisa diklik.",sg_h:"App mana yang mau dipandu?",sg_p:"Naikkan sebuah app ke panggung supaya perekam di ruang berikutnya bisa melihatnya. Kalau app-mu justru sudah hidup di web, tak ada yang perlu dinaikkan di sini — perekamnya yang kamu bawa ke sana.",door_playground:"App demo",door_replica:"HTML punyaku",door_pack:"File pack",sg_pg_note:"Demo bawaan — CMS kecil yang ikut di dalam studio, supaya kamu bisa belajar seluruh alurnya tanpa menyentuh app sendiri.",sg_pg_use:"Naikkan demo ke panggung",sg_pg_staged:"App demo sudah di panggung ✓",sg_sample_h:"Lebih suka membaca contoh daripada merekam?",sg_sample_p:"Muat tur contoh — enam langkah jadi di app demo (“Buat & terbitkan artikel”). Itu contoh, bukan karyamu: datang dalam keadaan belum ditonton, dan bisa kamu hapus di Script kapan saja.",sg_sample_btn:"Muat tur contoh",sg_sample_in:"Tur contoh sudah dimuat ✓",sg_sample_done:"Tur contoh dimuat ✓ — ia tetap harus lolos putaran Watch seperti yang lain.",sg_quick_h:"Baru pertama? Satu menit, dari ujung ke ujung.",sg_quick_p:"Ambil app demo, rekam alur dua klik, lalu cetak runtime sungguhan. Semua yang kamu lakukan di sini tidak menyentuh app-mu sendiri.",sg_quick_btn:"Pakai demo & mulai merekam",sg_where_h:"App-mu tinggal di mana?",sg_where_web:"Di luar sana, di sebuah URL",sg_where_web_p:"Berarti tak ada yang dinaikkan di sini — Scout-lah yang berangkat ke app-mu: rekam, gladi bersih, lalu cetak snippet jadinya langsung di dalam situsmu. Studio tetap opsional, untuk penyuntingan dalam.",sg_where_here:"Di sini saja — demo, HTML-mu sendiri, atau file pack",sg_where_here_p:"Naikkan di bawah dan semua ruangan langsung menggarapnya.",sg_live_btn:"Bawa aku ke perekam app hidup",sg_over_h:"Mulai dari awal",sg_over_note:"hapus panduanmu · atau bersihkan perangkat ini",sg_over_clear_h:"Hapus karyaku, app tetap di panggung",sg_over_clear_p:"Menghapus semua panduan, langkah, tanda tonton, dan tanda cetak — app yang kamu naikkan dan bahasamu tetap. Ekspor pack-nya dulu kalau mungkin masih kamu perlukan.",sg_over_clear:"Hapus panduanku",sg_over_clear_q:"Hapus semua panduan dan mulai merekam dari nol?",sg_over_clear_done:"Terhapus ✓ — panggung siap, belum ada yang direkam.",sg_over_all_h:"Reset semuanya di perangkat ini",sg_over_all_p:"Reset penuh: panduan, app yang dinaikkan, bahasa, tanda tonton, sampai flag runtime Zappy — semua yang pernah SuperTour simpan di browser ini. Tidak ada undo.",sg_over_all:"Reset semuanya",sg_pack_h:"Bawa pulang hasil rekaman",sg_pack_p:"Scout mengunduh satu file pack setelah kamu me-review langkahmu di sana. Jatuhkan filenya di sini dan semua guide mendarat di studio, siap masuk Script.",sg_rep_l:"HTML app-mu",sg_rep_ph:"Tempel (atau jatuhkan) HTML lengkap sebuah app satu-file di sini…",sg_rep_upload:"Unggah file .html",sg_rep_stage:"Naikkan HTML ini",sg_rep_staged:"Replica naik panggung ✓ — jalan ke Trace untuk merekam.",sg_rep_note:"Batas jujur: Replica merender app satu-HTML dengan setia. SPA yang mengambil resource eksternal saat boot tidak akan hidup penuh di frame sandbox — untuk itulah perekam app-hidup ada.",sg_rep_err:"Itu tidak tampak seperti dokumen HTML — Replica butuh markup dengan <body>.",sg_bm_h:"① Sekali klik — seret ini ke bilah bookmark",sg_bm_p:"Seret SATU kali. Setelah itu, buka halaman mana pun di app-mu dan klik: seluruh studio saku muncul — rekam, rapikan kata-katanya, pasang pemicu dan warna brand-mu, gladi bersih, lalu cetak snippet jadinya di sana juga. Tanpa console, tanpa install, tanpa balik ke sini.",sg_bm_drag:"🧭 SuperTour Scout",sg_bm_hint:"Seret ke bilah bookmark — mengekliknya di sini tidak melakukan apa-apa.",sg_bm_note:"Batas jujur: situs dengan Content-Security-Policy ketat bisa menolak bookmarklet, dan browser bisa saja memangkas bookmark sepanjang ini — apa pun sebabnya, panel yang muncul hanya menampilkan perekamnya, dan pintu console di bawah membawa bench yang sama persis.",tr_pocket_h:"Kalau bookmarklet-nya tak bisa masuk — pintu console",tr_pocket_p:"Scout yang sama persis, bench cetak yang sama persis — hanya ditempel ke DevTools. Pakai ini kalau Content-Security-Policy situsmu menolak bookmarklet javascript:, atau kalau browsermu memangkas bookmark-nya (panelnya akan bilang: ia cuma menampilkan perekam). Salin, buka app-mu, F12 → Console, tempel, Enter.",tr_pocket_allow:"Chrome mungkin memintamu mengetik “allow pasting” dulu — itu Chrome menjaga orang yang menempel kode dari orang asing. Blok ini datang dari studiomu sendiri.",sg_sc_copy:"Salin snippet Scout",sg_sc_copied:"Snippet Scout tersalin — tempel ke console app-mu ✓",sg_imp_h:"File pack",sg_imp_l:"Impor pack",sg_imp_ph:"Tempel file supertour-pack: 1 (atau jatuhkan .md-nya di sini)…",sg_imp_up:"Unggah file .pack.md",sg_imp_btn:"Impor pack",sg_imp_ok:"Pack terimpor ✓ — {n} panduan. Tiap panduan butuh putaran Watch baru.",sg_imp_ok_proof:"Pack terimpor ✓ — {n} panduan, sudah digladi di tempat app-nya hidup. Gerbang Watch ikut terbawa.",so_close:"Tutup",sg_exp_btn:"Ekspor pack sekarang",cm_h:"Compass — ditolak, tidak ada yang tersentuh",refuse_line:"Baris {n}: {reason}",preview_h:"Di panggung sekarang",tr_h:"Rekam alurnya.",tr_p:"Perekamnya CUMA SATU, dan ia bekerja di dua tempat — pilih di mana app-mu tinggal. Apa pun pilihannya, tiap klik bermakna menjadi satu langkah dengan rantai selector penyembuh dan chip konteks; ketikan direkam sebagai langkah focus, tidak pernah sebagai isi ketikanmu; dan 🎯 Tunjuk mengubah apa pun yang tak bisa diklik — grafik, status, satu bagian utuh — menjadi langkah yang disorot tur.",tr_mode_here:"Di sini, di dalam studio",tr_mode_there:"Di sana, di app hidupku",tr_here_p:"Merekam app yang berdiri di Stage, di dalam frame studio. Paling pas untuk demo dan app satu-file yang bisa kamu tempel atau unggah.",tr_there_p:"Merekam di dalam situsmu yang sungguhan dan sedang jalan — dan kini mencetak di sana juga: Scout membawa seluruh perjalanan (rekam → kata → pemicu → gladi → cetak). Untuk rute ini tak ada yang dinaikkan ke panggung studio.",tr_there_back:"Lebih suka menulis kata-katanya di studio?",tr_there_back_p:"Tak pernah wajib — Scout menuntaskan pekerjaannya di sana. Tapi studio memang bench yang lebih enak untuk naskah panjang, banyak panduan sekaligus, atau copy-brief BYOAI. Kalau mau: di app-mu tekan Stop → review → Download pack, lalu jatuhkan filenya di bawah.",tr_there_btn:"Impor pack itu di Stage",tr_guide_l:"Beri nama tur ini",tr_guide_ph:"mis. Buat & terbitkan artikel",tr_guide_default:"Panduan {n}",tr_start:"Mulai merekam",tr_stop:"Berhenti merekam",tr_rec:"REC",tr_pause:"Jeda",tr_resume:"Lanjut",tr_paused_tag:"JEDA",tr_paused:"Jeda — klik di frame diabaikan sampai kamu lanjut.",tr_fs_note:"Rekaman mengambil seluruh layar supaya kamu fokus ke alurnya — Stop membawamu kembali ke rel langkah.",tr_recording:"Merekam — tiap klik bermakna menjadi satu langkah.",tr_empty:"Belum ada rekaman berjalan — beri nama tur di atas (atau biarkan default), tekan Start, lalu app-nya mengambil seluruh layar supaya kamu tinggal memakainya.",tr_noop:"Klik itu tak bisa direkam — bukan tombol, tautan, atau isian. Kalau tetap ingin dimasukkan, pakai 🎯 Tunjuk satu area.",tr_aim:"🎯 Tunjuk satu area",tr_aim_stop:"✓ Selesai menunjuk",tr_aim_p:"Bukan tombol? Tunjuk saja. Grafik, status, satu bagian utuh menjadi langkah yang disorot tur — dan tak pernah diklik.",tr_aim_on:"MENUNJUK — klikmu menambah langkah, bukan menyentuh app.",tr_navout:"Tautan itu meninggalkan halaman, dan frame studio tak bisa mengikutinya. Tab dan rute dalam-halaman tetap jalan; untuk alur yang melewati pemuatan halaman sungguhan, rekam saja di app hidupmu.",tr_steps:"Langkah terekam",tr_reset:"Buang & rekam ulang",tr_reset_q:"Buang langkah-langkah rekaman panduan ini?",tr_yes:"Buang",tr_no:"Simpan",tr_stopped:"Rekaman berhenti — {n} langkah tertangkap. Rapikan di Script.",tr_act_click:"klik",tr_act_focus:"focus",tr_act_look:"tunjuk",sc_h:"Susun panduannya.",sc_p:"Tulis ulang tiap langkah seperti manusia, atur pemicunya, tandai langkah yang mengubah data. Menulis ulang kata-kata itu gratis — hanya perubahan pada LANGKAHNYA sendiri (urutan, penghapusan, elemen yang dituju) yang membuka ulang gerbang Watch panduan itu.",sc_none:"Belum ada panduan — rekam di Trace, atau bawa pulang pack-nya di sana.",sc_guides:"Panduan",sc_meta:"Pengaturan panduan",sc_name:"Nama panduan",sc_trigger:"Skenario pemicu",trg_new_user:"New User — kunjungan pertama",trg_new_release:"New Release",trg_how_to:"How-To (tampil di menu panduan)",trg_return_user:"Return User",sc_version:"Versi rilis",sc_days:"Ambang kembali (hari)",sc_err_name:"Panduan butuh nama.",sc_err_version:"New Release butuh string versi.",sc_err_days:"Ambang harus angka hari yang positif.",sc_chrome:"Label chrome runtime (default EN — bebas kamu tulis ulang)",sc_chrome_note:"Next · Back · Close · Done — empat kata yang diucapkan tombol tur itu sendiri",sc_brief_note:"opsional · AI mana pun menulis ulang kalimat langkahmu, keputusan akhir tetap padamu",sc_hint_add:"+ tambah petunjuk",sc_hint_drop:"hapus petunjuk",sc_pos:"Hanya ditemukan lewat posisinya di halaman — perubahan layout membuatnya hilang. Beri elemen itu data-tour-id lalu rekam ulang supaya terkunci.",sc_adv:"Lainnya untuk langkah ini",sc_adv_note:"petunjuk · penanda pengubah data",ch_next:"Next",ch_back:"Back",ch_close:"Close",ch_done:"Done",sc_steps:"Langkah",sc_lbl:"Instruksi",sc_hint:"Petunjuk (opsional)",sc_mut:"mengubah data — tak pernah di-replay otomatis",sc_del:"Hapus langkah",sc_restore:"Pulihkan langkah",sc_deleted:"Langkah terhapus.",sc_restored:"Langkah dipulihkan ✓",sc_up:"Naikkan",sc_down:"Turunkan",sc_guide_del:"Hapus panduan",sc_guide_del_q:"Hapus seluruh panduan ini?",sc_guide_deleted:"Panduan terhapus ✓",sc_raw_h:"Ini masih kata-kata si perekam",sc_raw_p:"Tiap label di atas diambil dari elemen yang kamu klik, dan itu jarang sama dengan caramu menjelaskannya ke orang asing. Tulis ulang yang perlu — atau, kalau sudah enak dibaca, setujui saja lalu lanjut.",sc_raw_btn:"Kata-katanya sudah bagus — setujui",sc_raw_done:"Disetujui ✓ — pack sudah scripted.",sc_brief_h:"Copy-brief — rapikan kata-katanya (BYOAI)",sc_brief_p:"Salin satu brief mandiri ke chat AI mana pun. Ia hanya meminta KATA-KATANYA kembali — struktur turmu tak pernah keluar dari studio ini, jadi balasan apa pun tak bisa merusaknya. Yang kembali mendarat sebagai draf untuk kamu bandingkan lalu adopsi, atau buang.",sc_brief_copy:"Salin brief",sc_brief_copied:"Brief tersalin — tempel ke AI mana pun ✓",sc_reply_l:"Tempel balasannya",sc_reply_ph:"Tempel seluruh balasannya — SuperTour menemukan blok JSON-nya sendiri, pakai pagar kode atau tidak.",sc_reply_btn:"Periksa balasan",sc_draft_h:"Draft mendarat — pack-mu tak tersentuh",sc_draft_sum:"panduan ±{g} · perubahan struktur {s} · label ditulis ulang {l}",sc_adopt:"Adopsi jadi pack",sc_discard:"Buang draft",sc_adopted:"Diadopsi ✓ — tiap panduan butuh putaran Watch baru.",brief_landed:"Mendarat sebagai draft — pack-mu tak tersentuh.",zp_h:"Zappy — wajah yang memandu",zp_p:"Bagaimana runtime-nya tampil dan menyebut dirinya. Semuanya ikut di dalam pack, jadi tur yang kamu cetak memakai warnamu di app-mu — bukan warna studio.",zp_name:"Panggilan si pemandu",zp_name_note:"dipakai di sapaan dan label pembaca layar",zp_persona:"Set ekspresi",zp_persona_note:"Zappy bereaksi — wajah berbeda saat menyapa, berpindah, menunjuk, menunggumu, kehilangan langkah, dan selesai.",zp_accent:"Warna aksen",zp_accent_note:"cincin sorotan, tombol, titik saat diminimalkan — samakan dengan brand-mu. Tombol menggelapkannya secukupnya agar teks putih terbaca, dan tetap memakai teks gelap kalau itu pun belum cukup.",zp_home:"Sudut rumah",zp_home_br:"kanan bawah",zp_home_bl:"kiri bawah",zp_home_tr:"kanan atas",zp_home_tl:"kiri atas",zp_size:"Ukuran",zp_size_s:"kecil",zp_size_m:"sedang",zp_size_l:"besar",zp_fx:"Tingkat kehidupan",zp_fx_vivid:"hidup — semua yang “penuh” lakukan, dengan denyut lebih cepat",zp_fx_full:"penuh — bereaksi, memantul, merayakan",zp_fx_calm:"kalem — ekspresi berganti, tak ada yang memantul",zp_fx_off:"diam — tanpa gerak sama sekali",zp_fx_note:"Pengunjung yang meminta reduced-motion selalu mendapat “diam”, apa pun pilihanmu di sini.",zp_previe an lagi. Gerbang tetap tertutup.",wt_closed:"Putaran ditutup lebih awal — gerbang tetap tertutup.",wt_empty:"Belum ada panduan untuk ditonton — rekam dulu di Trace.",watch_gate:"Press terbuka setelah tiap panduan lolos satu putaran penuh di Watch.",wt_stage_l:"Di panggung",wt_away_h:"App milik tur ini tidak ada di studio",wt_away_p:"“{app}” hidup di web sana, tempat kamu merekamnya — studio tidak pernah menyimpan salinan situsmu. Jadi di sini tak ada apa pun untuk dijalankan turnya, dan menjalankannya di app demo cuma membuktikan bahwa app yang berbeda memang berbeda. Dua jalan jujur untuk membuka gerbang ini:",wt_away_a_h:"① Selesaikan di tempat app-nya hidup — dan jangan balik ke sini",wt_away_a_p:"Kamu TIDAK perlu merekam ulang, dan TIDAK perlu kembali ke ruang ini. Ekspor pack-nya di bawah, buka app-mu, klik bookmarklet Scout, pilih “Rehearse a pack I have”, lalu susuri turnya sekali. Panel yang sama kemudian MENCETAK snippet jadinya untukmu — salin, tempel di atas tag penutup body, dan turnya hidup. Ruang ini hanya ada untuk app yang bisa dipegang studio; app-mu bukan salah satunya, dan itu bukan masalah yang perlu dipecahkan.",wt_away_export:"Ekspor pack ini (file yang dibutuhkan Scout)",wt_away_b_h:"② Bawa salinannya ke sini",wt_away_b_p:"Kalau app-mu satu file HTML yang bisa kamu simpan (Ctrl+S) atau tempel, naikkan ke panggung dan Watch berjalan di sini, sama seperti demo.",wt_go_there:"Antar aku ke Scout",wt_go_stage:"Naikkan salinan app-ku",wt_proof_there:"Sudah digladi di app hidupmu ✓ — buktinya ikut di dalam pack",wt_diff_h:"Pack dan panggung ini dua app yang berbeda",wt_diff_p:"Pack ini direkam di “{pack}”, sedangkan yang di panggung “{staged}”. Kalau keduanya sebenarnya app yang sama dengan judul berbeda, jalankan saja — putaran tanpa langkah terlewat adalah satu-satunya bukti, ke arah mana pun.",wt_diff_run:"Ini app yang sama — jalankan saja",tg_h:"Studio ini dibuat untuk browser desktop",tg_p:"Kamu boleh melihat-lihat di sini dan tak ada yang akan   <style rel="stylesheet" crossorigin>/* ═══ packages/ui/tokens.css — design-system-standard@2.0.0 §2–§4 as CSS variables ═══
   THE shared design layer. Apps override exactly TWO variables in their theme.css:
     --accent  and  --accent-active   (their registered pair from 06-ledger/project-roster.md)
   Everything else here is identical family-wide. Never fork; never add a second accent. */
:root{
  /* §2 color — neutrals (Tailwind `neutral`, true gray) */
  --canvas:#fafafa; --surface:#ffffff; --hairline:#e5e5e5; --wash:#f5f5f5;
  --ink:#171717; --ink-muted:#737373; --ink-faint:#a3a3a3;
  /* §2 the ONE accent — placeholder pair;each app overrides in theme.css */
  --accent:#0d9488; --accent-active:#0f766e; --on-accent:#ffffff;
  --accent-wash:color-mix(in srgb, var(--accent) 8%, #ffffff);
  /* §2 semantics — state only, never brand */
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  /* §3 type scale (Fustat everywhere) */
  --font:"Fustat",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-display:700 28px/1.2 var(--font); --t-h1:700 22px/1.25 var(--font);
  --t-h2:600 18px/1.3 var(--font);      --t-h3:600 15px/1.4 var(--font);
  --t-body:400 14px/1.55 var(--font);   --t-small:400 12.5px/1.5 var(--font);
  --t-caption:500 11.5px/1.4 var(--font); --t-mono:450 12.5px/1.5 var(--mono);
  /* §4 shape · space · elevation · motion */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --elev-1:0 1px 2px rgba(23,23,23,.06); --elev-2:0 8px 30px rgba(23,23,23,.12);
  --header-h:56px; --maxw:1100px;
  --t-fast:120ms cubic-bezier(.2,.8,.4,1); --t-med:200ms cubic-bezier(.2,.8,.4,1);
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
/* ═══ @alamehan/ui/custom/surfaces.css — the three family surfaces, styled ═══
   COPIED VERBATIM from the living exemplar apps/zapseed/zapseed.html (family law:
   copy, never re-derive). Any change here must first change the exemplar + parity gate.
   Covers: .site-header/.brand/nav.rooms/.hright/.langsw/.icon-btn/.site-footer (§7),
   .overlay/.modal/.mh/.mtabs/.mpane/.authorcard (§8 about-modal/3), .chip, .dgfs viewer. */
/* ═══ shell: navbar §7 · footer ═══ */
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tile{width:28px;height:28px;background:var(--wash);border-radius:var(--r-md);display:grid;place-items:center;font-size:16px;flex:none}
.brand b{font-size:15px;font-weight:700}
.brand .ver{font-size:11.5px;font-weight:500;color:var(--ink-faint)}
nav.rooms{display:flex;gap:2px;margin:0 auto;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
nav.rooms a{font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;position:relative}
nav.rooms a:hover{color:var(--ink);background:var(--wash)}
nav.rooms a[aria-current]{color:var(--accent);font-weight:600}
nav.rooms a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent)}

nav.rooms a .stepdone{color:var(--ok);font-weight:700;margin-left:2px}
.hright{display:flex;align-items:center;gap:var(--s-3);flex:none}
.langsw{display:flex;border:1px solid var(--hairline);border-radius:var(--r-pill);overflow:hidden}
.langsw button{border:0;background:var(--surface);font:600 11.5px/1 var(--font);letter-spacing:.04em;padding:7px 10px;cursor:pointer;color:var(--ink-muted)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.icon-btn{width:32px;height:32px;border:1px solid var(--hairline);background:var(--surface);border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--ink-muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.site-footer{border-top:1px solid var(--hairline);background:var(--surface);margin-top:var(--s-7)}
.site-footer .in{max-width:var(--maxw);margin:0 auto;padding:var(--s-4) var(--s-5);font-size:12.5px;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
/* ── must_fix standardization: icon scale (§1b) · sticky footer (§7) ── */
/* any sprite-backed <svg> (direct child <use>) not sized by a more specific rule
   renders at icon scale, never the 300×150 SVG replaced-element default */
svg:has(>use){width:16px;height:16px;flex:none;vertical-align:-3px}
/* shell fills ≥viewport → footer rests at the bottom on short pages, flows below on long ones */
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#root>main{flex:1 0 auto;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 10px;font-size:12.5px}
.chip .x{cursor:pointer;color:var(--ink-faint);border:0;background:none;font-size:13px;padding:0;line-height:1}
.chip .x:hover{color:var(--danger)}
/* modal §8 + toast */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline)}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block;width:100%;height:100%;max-width:none}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}/* ═══ SuperTour app CSS — SUPERTOUR_PRD.md §12 · design-system-standard@2.0.0 ═══

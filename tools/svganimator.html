## Build protocol (how you, the executing AI, must work)

1. Read the embedded Pack fully — identity, tokens, texture, flavor, personality, registry snapshot.
2. Invent a metaphor that is NEW for this brand — never one in the registry snapshot.
3. Use the assigned prefix on EVERY class, keyframe, custom property, and SVG id.
4. Choose the technique per the Playbook below unless the job pins one.
5. If Checkpoint is on: present the Concept Card and STOP for approval. Otherwise: present the Concept Card and build in the same reply.
6. Verify every Quality Gate before delivering; embed the receipt in the artifact.

The Concept Card (always precedes the code): Title · Metaphor & story · Technique + one-line why · Three acts · Signature detail (researched, real-world) · Idle life · How the Pack's palette maps onto the scene · Prefix.

## Technical contract (the ten commandments of the artifact)

1. ONE single HTML file; the entire component lives inside one <section> block. Any demo wrapper outside it is disposable and clearly commented.
2. Copy-paste portability: zero external assets, fonts, libraries, or network requests. System font stack only.
3. Fluid stage: all internal sizing relative to the component (SVG viewBox, %, or container query units) — never fixed px for layout. Must look right from 280px up.
4. Transparent root by default: no card chrome (panel, border, shadow) unless the Pack explicitly overrides; overflow:hidden; in-scene shadows still required.
5. Prefix scoping: every class, keyframe, custom property, and SVG id carries the build prefix. Multi-instance safe; the init script uses a data-<namespace>-init guard.
6. CSS-only core: the pointer-hover experience must work with JavaScript disabled. JS only enhances (touch toggle, keyboard toggle, Canvas rendering).
7. Open state selector: :is(:hover, :focus-visible, .<prefix>open).
8. Graceful degradation: advanced features (Houdini @property, etc.) fail soft — the scene stays complete without them.
9. Performance: looped animations may only animate transform, opacity, or filter; stateful loops use animation-play-state paused-to-running; JS loops are per-instance requestAnimationFrame, delta-time based, paused off-screen via IntersectionObserver.
10. Accessibility: root tabindex="0", role="img", a descriptive aria-label telling the scene's story; touch via pointerup (non-mouse) toggle; Enter/Space toggle; prefers-reduced-motion: reduce collapses all motion to a static frame that is still a complete, attractive composition.

File naming: <brand-slug>-<NN>-<kebab-title>.html.

## Art direction (the anti-"kindergarten shapes" rules)

1. Volume over flatness — every solid gets 2–3 faces or a lighting gradient with one consistent light direction (default upper-left).
2. Researched signature detail — every scene includes at least one real-world detail a domain expert would notice.
3. Material micro-contrast — rim highlights, darker structural edges, subtle inset shadows.
4. Atmosphere — soft background elements plus a ground shadow so the subject sits in a world, not on a void.
5. Living idle — never frozen: slow bob, drift, pulse, or shimmer (periods 5–17s, amplitudes at most 2.5% of the stage, desynchronized delays).
6. Reactive signature texture — the Pack's texture must respond to the open state (ignite, sweep, wave) from the scene's action origin.
7. In-scene text discipline — precise spacing, never cramped; prefer cycling value slots over static labels.

## Choreography (the grammar)

Timing tokens (CSS custom properties, prefix-scoped): ease cubic-bezier(.22,1,.36,1) for exits/settles · spring cubic-bezier(.34,1.45,.5,1) for entrances/payoffs · sweep cubic-bezier(.25,.6,.4,1) for rings/bands.

Three-act open: Act 1 (0–.15s) the protagonist wakes with one decisive spring move → Act 2 (.15–1s) energy flows and the continuous loop starts → Act 3 (.38–1.2s) the world responds with a mandatory stagger of at least 3 elements and one final payoff detail landing last (~1.1s).

Open loop: while open, exactly one continuous energy loop keeps running (the paused-to-running pattern).

## Technique playbook (choose per concept)

- DOM/CSS — UI metaphors, charts, badges, typography play. Container-query-unit sizing; cheapest, sharpest text, best degradation.
- SVG scene — illustrated dioramas, path-flow energy, draw-on. One viewBox, width:100%; pathLength="100" for dash choreography; transform-box:fill-box for part animation. DEFAULT for scenic work.
- Canvas 2D — particles, crowds, generative texture. Requires JS, so it must ship a meaningful CSS/SVG static fallback; DPR capped at 2; delta-time loop.
- CSS 3D — real depth: boxes, lids, carousels. Container-scaled perspective; prefer light 3D with consistent face lighting.
- Hybrid — when one layer can't do it all. Each layer follows its own contract and degrades independently.

## Quality gates (verify every one before delivering)

1. The <section> block alone renders correctly on a blank page (the copy-paste test).
2. Zero external requests of any kind.
3. Every class, keyframe, custom property, and SVG id carries the prefix; no collisions when pasted twice.
4. Works with JS disabled (core experience intact).
5. prefers-reduced-motion yields a complete static composition.
6. Idle life present; the open state delivers all three acts including stagger and payoff.
7. Only transform, opacity, or filter in loops.
8. aria-label, tabindex, keyboard and touch toggles present.
9. The receipt comment is present and consistent with the job.
10. The file is named per convention.`,al={scene:{name:"Scene",contract:`Format contract — Scene (the illustrated diorama card)

# Brand DNA Pack — Mono

## §1 · Identity & vibe

Mono is the neutral house brand: precise, calm, and quietly confident. It speaks in
ink on paper — no shouting, no gradients-for-drama — and lets the motion carry the
personality. Use it to prototype any concept before a real brand pack exists. (invented — Mono is the console's built-in neutral)

## §2 · Color tokens

| role | value | use |
|---|---|---|
| ink | #171717 | primary strokes, structural edges, text |
| ink-soft | #404040 | secondary strokes, inner detail |
| ink-mist | #a3a3a3 | atmosphere, far background elements |
| paper | #fafafa | stage air, highlight faces |
| accent | #1f6feb | THE one accent slot — energy, LEDs, payoffs (configurable: a job may remap this role) |

Palette rule: ink roles are the UI language (structure, line, text); the accent role is
illustration-only energy — it never floods a surface, it points at the story's payoff.

## §3 · Typography & signature texture

Type: the system stack, set tight and quiet; labels uppercase at small sizes with
generous tracking. Numbers tabular where they cycle.
Signature texture: a fine DOT GRID drifting in the background field. Ignite behavior:
on open, dots nearest the ignition origin brighten and ripple outward once, then settle
back to their idle shimmer. (invented — Mono's texture is defined by the console, not extracted)

## §4 · Art direction flavor

Shape language: geometric, slightly rounded corners, honest silhouettes. Recurring
motifs: orthographic mini-dioramas, thin guide rules, small circular ports. Illustration
style: two or three ink weights over paper, one accent element per scene.

## §5 · Motion personality

Calm and exact: settles dominate (the ease token), payoffs land with one small spring —
never bouncy chains. Loops are slow and metronomic; nothing jitters.

## §6 · Metaphor pool

- a lighthouse keeping ships safe
- a printing press laying ink on a fresh sheet
- a metronome keeping a duet in time
- a drafting table with a rule sliding into place
- a paper crane folding itself
- a signal tower relaying a message across a valley
- a clockmaker's escapement ticking
- a telescope finding one bright star

  <style rel="stylesheet" crossorigin>/* ═══ packages/ui/tokens.css — design-system-standard@2.0.0 §2–§4 as CSS variables ═══
   THE shared design layer. Apps override exactly TWO variables in their theme.css:
     --accent  and  --accent-active   (their registered pair from 06-ledger/project-roster.md)
   Everything else here is identical family-wide. Never fork; never add a second accent. */
:root{
  /* §2 color — neutrals (Tailwind `neutral`, true gray) */
  --canvas:#fafafa; --surface:#ffffff; --hairline:#e5e5e5; --wash:#f5f5f5;
  --ink:#171717; --ink-muted:#737373; --ink-faint:#a3a3a3;
  /* §2 the ONE accent — placeholder pair;each app overrides in theme.css */
  --accent:#0d9488; --accent-active:#0f766e; --on-accent:#ffffff;
  --accent-wash:color-mix(in srgb, var(--accent) 8%, #ffffff);
  /* §2 semantics — state only, never brand */
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  /* §3 type scale (Fustat everywhere) */
  --font:"Fustat",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-display:700 28px/1.2 var(--font); --t-h1:700 22px/1.25 var(--font);
  --t-h2:600 18px/1.3 var(--font);      --t-h3:600 15px/1.4 var(--font);
  --t-body:400 14px/1.55 var(--font);   --t-small:400 12.5px/1.5 var(--font);
  --t-caption:500 11.5px/1.4 var(--font); --t-mono:450 12.5px/1.5 var(--mono);
  /* §4 shape · space · elevation · motion */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --elev-1:0 1px 2px rgba(23,23,23,.06); --elev-2:0 8px 30px rgba(23,23,23,.12);
  --header-h:56px; --maxw:1100px;
  --t-fast:120ms cubic-bezier(.2,.8,.4,1); --t-med:200ms cubic-bezier(.2,.8,.4,1);
}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t-med:0ms}}
/* ═══ @alamehan/ui/custom/surfaces.css — the three family surfaces, styled ═══
   COPIED VERBATIM from the living exemplar apps/zapseed/zapseed.html (family law:
   copy, never re-derive). Any change here must first change the exemplar + parity gate.
   Covers: .site-header/.brand/nav.rooms/.hright/.langsw/.icon-btn/.site-footer (§7),
   .overlay/.modal/.mh/.mtabs/.mpane/.authorcard (§8 about-modal/3), .chip, .dgfs viewer. */
/* ═══ shell: navbar §7 · footer ═══ */
.site-header{position:sticky;top:0;z-index:40;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tile{width:28px;height:28px;background:var(--wash);border-radius:var(--r-md);display:grid;place-items:center;font-size:16px;flex:none}
.brand b{font-size:15px;font-weight:700}
.brand .ver{font-size:11.5px;font-weight:500;color:var(--ink-faint)}
nav.rooms{display:flex;gap:2px;margin:0 auto;overflow-x:auto;overflow-y:visible;scrollbar-width:none}
nav.rooms a{font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);white-space:nowrap;position:relative}
nav.rooms a:hover{color:var(--ink);background:var(--wash)}
nav.rooms a[aria-current]{color:var(--accent);font-weight:600}
nav.rooms a[aria-current]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent)}

nav.rooms a .stepdone{color:var(--ok);font-weight:700;margin-left:2px}
.hright{display:flex;align-items:center;gap:var(--s-3);flex:none}
.langsw{display:flex;border:1px solid var(--hairline);border-radius:var(--r-pill);overflow:hidden}
.langsw button{border:0;background:var(--surface);font:600 11.5px/1 var(--font);letter-spacing:.04em;padding:7px 10px;cursor:pointer;color:var(--ink-muted)}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.icon-btn{width:32px;height:32px;border:1px solid var(--hairline);background:var(--surface);border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--ink-muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.site-footer{border-top:1px solid var(--hairline);background:var(--surface);margin-top:var(--s-7)}
.site-footer .in{max-width:var(--maxw);margin:0 auto;padding:var(--s-4) var(--s-5);font-size:12.5px;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
/* ── must_fix standardization: icon scale (§1b) · sticky footer (§7) ── */
/* any sprite-backed <svg> (direct child <use>) not sized by a more specific rule
   renders at icon scale, never the 300×150 SVG replaced-element default */
svg:has(>use){width:16px;height:16px;flex:none;vertical-align:-3px}
/* shell fills ≥viewport → footer rests at the bottom on short pages, flows below on long ones */
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#root>main{flex:1 0 auto;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:4px 10px;font-size:12.5px}
.chip .x{cursor:pointer;color:var(--ink-faint);border:0;background:none;font-size:13px;padding:0;line-height:1}
.chip .x:hover{color:var(--danger)}
/* modal §8 + toast */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline)}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.dg-src.open{display:block}

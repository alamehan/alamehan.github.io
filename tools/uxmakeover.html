t or grouping.",fix:"Cut, group, or stage choices; pre-select the safe default; reveal the rest on demand.",weight:7},{id:"psy.fitts",name:"Fitts's Law",law:"Time to a target grows with distance and shrinks with size.",violation:"Tiny primary buttons, or the main action stranded far from where the eye lands.",fix:"Make the primary action big and near the point of intent; give destructive targets distance.",weight:6},{id:"psy.jakob",name:"Jakob's Law",law:"Users expect your interface to work like the others they know.",violation:"A reinvented control (custom dropdown, novel gesture) that fights muscle memory.",fix:"Adopt the platform convention unless a measured gain justifies the surprise.",weight:6},{id:"psy.miller",name:"Miller's Law / Chunking",law:"Working memory holds only a handful of items at once.",violation:"A 16-digit string, a 30-field form, or a menu of 24 ungrouped links.",fix:"Chunk into groups of 3–5; format numbers; break long forms into steps.",weight:6},{id:"psy.restorff",name:"Von Restorff Effect",law:"The one thing that differs is the one thing remembered.",violation:"Ten buttons in identical weight — nothing signals the primary path.",fix:"Give exactly one element visual primacy; let contrast do the guiding.",weight:5},{id:"psy.tesler",name:"Tesler's Law (Conservation of Complexity)",law:"Complexity can be moved, never erased — decide who carries it.",violation:"Every edge case pushed onto the user as another field or toggle.",fix:"Absorb complexity into smart defaults and inference; expose only what the user must decide.",weight:7},{id:"psy.peakend",name:"Peak-End Rule",law:"An experience is remembered by its most intense moment and its ending.",violation:"A flow that ends on a dead confirmation page or an abrupt error.",fix:"Design the finish: confirm success warmly, state what happens next, close the loop.",weight:5},{id:"lay.proximity",name:"Proximity",law:"Things that belong together must sit together.",violation:"A label far from its field th no 'you are here'.",fix:"Show the current location; make the path in and out obvious.",weight:6},{id:"nav.breadcrumb",name:"Breadcrumbs & Back",law:"Deep structure needs a visible trail home.",violation:"Four levels deep with only the browser back button to escape.",fix:"Add breadcrumbs or a clear parent link; never trap the user at a leaf.",weight:5},{id:"nav.labels",name:"Mental-Model Labels",law:"Labels must match the user's words, not the org chart.",violation:"Menu items named after internal systems ('Module 4', 'CRM sync').",fix:"Rename to the user's task language; test the label against a stranger.",weight:6},{id:"nav.depth",name:"Depth vs Breadth",law:"Too deep hides; too broad overwhelms — balance the tree.",violation:"A 6-click path to a common task, or a 40-item flat menu.",fix:"Flatten frequent tasks; group rare ones; keep the common path short.",weight:5},{id:"nav.search",name:"Search Fallback",law:"When browsing fails, search must catch the user.",violation:"A large catalog with no search, or search that returns nothing helpful.",fix:"Provide search with forgiving matching and a useful zero-results state.",weight:5},{id:"nav.current",name:"Current-State Clarity",law:"The system's state must be legible at a glance.",violation:"No indication of what is selected, saved, filtered, or in progress.",fix:"Reflect state visibly: active tabs, applied filters, saved badges.",weight:6},{id:"nav.escape",name:"Escape Hatch",law:"Every state needs an obvious way out.",violation:"A modal or flow with no cancel, or a dead-end error with no recovery.",fix:"Always offer cancel, back, or 'start over'; never strand the user.",weight:6},{id:"frm.onething",name:"One Thing Per Step",law:"Ask for one coherent thing at a time.",violation:"A single screen demanding 25 unrelated fields at once.",fix:"Split into focused steps; show progress; let each step own one decision.",weight:6},{id:"frm.defaults",name:"Smart Defaults",law:"The most likely answer should already be filled d-up.",weight:5},{id:"wrt.trigger",name:"Microcopy Triggers (B=MAT)",law:"Behavior needs motivation, ability, and a trigger at once.",violation:"A weak CTA with no reason to act and no sense of ease.",fix:"Pair a motivating why with a low-effort how, right at the moment of action.",weight:5},{id:"wrt.error",name:"Error Message Anatomy",law:"A good error says what happened, why, and how to fix it.",violation:"'Something went wrong.' — no cause, no path forward.",fix:"State the problem, the reason, the recovery, and what stays safe.",weight:7},{id:"wrt.verbs",name:"Button Verbs",law:"A button label should name its exact outcome.",violation:"'OK', 'Submit', 'Yes' — labels that hide the consequence.",fix:"Use verb + object with the real count: 'Send 6 contracts', 'Delete draft'.",weight:6},{id:"wrt.empty",name:"Empty States",law:"An empty screen is a teaching moment, not a void.",violation:"A blank table or 'No data' with no guidance.",fix:"Explain what goes here and offer the first action to fill it.",weight:5},{id:"wrt.scan",name:"Scannability",law:"People scan before they read — structure for the skim.",violation:"Dense paragraphs where a list, headings, or bold would carry the meaning.",fix:"Use headings, short lists, and emphasis to make the gist visible at a glance.",weight:5},{id:"fbk.status",name:"Visibility of Status",law:"The system must always show what it is doing.",violation:"A click with no response; an action whose result is invisible.",fix:"Acknowledge every action immediately; show progress and completion.",weight:7},{id:"fbk.optimistic",name:"Optimistic UI",law:"Reflect the likely success now; reconcile if it fails.",violation:"A spinner blocking the UI for an action that almost always succeeds.",fix:"Update the UI instantly; roll back gracefully on the rare failure.",weight:5},{id:"fbk.skeleton",name:"Skeletons over Spinners",law:"Show the shape of what's coming, not an anxious wheel.",violation:"A blank screen or endless spinner while content loads.",fix:"Render skeleton placeholders that match the incoming layout.",weight:4},{id:"fbk.unhappy",name:"Unhappy-Path Recovery",law:"Design the failure as carefully as the success.",violation:"A crash, a lost form, or a dead end when something goes wrong.",fix:"Preserve the user's input; offer retry and a clear next step.",weight:7},{id:"fbk.undo",name:"Undo over Confirm (non-destructive)",law:"For reversible actions, let people act and undo.",violation:"A confirm dialog on every trivial, reversible action.",fix:"Act immediately and offer a timed undo; save confirmation for the irreversible.",weight:5},{id:"fbk.toast",name:"Toast Discipline",law:"Transient messages must not carry critical decisions.",violation:"An error that needs action delivered as a 2-second toast.",fix:"Use toasts for confirmations only; put decisions in persistent, inline UI.",weight:4},{id:"fbk.loadhonest",name:"Loading Honesty",law:"Don't fake done, and don't hide progress.",violation:"A progress bar that jumps to 90% and hangs, or a false 'complete'.",fix:"Show honest progress; if unknown, say so; never claim success early.",weight:4},{id:"a11y.contrast",name:"Contrast",law:"Text must stand clearly against its background.",violation:"Grey-on-grey labels or accent text below 4.5:1.",fix:"Meet 4.5:1 for body text and 3:1 for large text and UI; test both states.",weight:7,wcag:"1.4.3"},{id:"a11y.focus",name:"Focus Order",law:"Keyboard focus must move in a logical, visible order.",violation:"Tab order that jumps around, or focus with no visible ring.",fix:"Order focus to match reading; keep a clear, non-removed focus indicator.",weight:6,wcag:"2.4.3"},{id:"a11y.labels",name:"Screen-Reader Labels",law:"Every control needs an accessible name and role.",violation:"Icon-only buttons and inputs with no label an AT can read.",fix:"Add aria-labels and roles; associate every input with a label.",weight:7,wcag:"4.1.2"},{id:"a11y.targets",name:"Touch Targets",law:"Tap targets must be big enough to hit reliably.",violation:"Icons and links under 24px crammed together on mobile.",fix:"Give interactive targets at least 24×24px with spacing; 44px for primary.",weight:5,wcag:"2.5.8"},{id:"a11y.motion",name:"Reduced Motion",law:"Honor the user who asked the world to stop moving.",violation:"Parallax, autoplay, and transitions that ignore prefers-reduced-motion.",fix:"Collapse motion to opacity or none when reduced motion is requested.",weight:5,wcag:"2.3.3"},{id:"a11y.color",name:"Color Independence",law:"Meaning must never rest on color alone.",violation:"Red/green status with no icon, text, or shape to tell them apart.",fix:"Pair color with a label, icon, or pattern; test in greyscale.",weight:5,wcag:"1.4.1"},{id:"a11y.keyboard",name:"Keyboard Completeness",law:"Everything the mouse can do, the keyboard must too.",violation:"Drag-only reordering, hover-only menus, mouse-trapped modals.",fix:"Provide keyboard paths for every action; trap and release focus correctly.",weight:6,wcag:"2.1.1"},{id:"eth.friction",name:"Intentional Friction",law:"High-stakes and destructive actions must be hard to do by accident.",violation:"One-click 'Approve all', 'Delete account', or bulk money actions with no guard.",fix:"Add proportional friction: confirmation-with-scope, type-to-confirm, preview, undo window.",weight:9},{id:"eth.nodark",name:"No Dark Patterns",law:"Never trick the user into acting against their interest.",violation:"Confirmshaming, sneak-into-basket, disguised ads, forced continuity.",fix:"Make the honest choice the easy one; declare 'dark_patterns: none' and mean it.",weight:8},{id:"eth.transparency",name:"Transparency of Cost & Consequence",law:"State what an action will cost and do before it's taken.",violation:"Hidden fees, surprise charges, or irreversible effects revealed too late.",fix:"Show the full cost and consequence up front, at the point of decision.",weight:7},{id:"eth.time",name:"Respect for Time",law:"The interface should spend the user's minutes like they're real.",violation:"Needless steps, re-entry of known data, waiting on avoidable work.",fix:"Remove steps, remember inputs, and automate what the human shouldn't do.",weight:6},{id:"eth.privacy",name:"Privacy Defaults",law:"The private, minimal choice should be the default.",violation:"Pre-checked sharing, opt-out tracking, over-broad permission asks.",fix:"Default to private and minimal; ask for data only when it's needed and explained.",weight:6},{id:"eth.reversible",name:"Reversibility",law:"Prefer actions the user can take back.",violation:"Permanent deletions and sends with no undo and no recovery.",fix:"Offer undo, soft-delete, and a recovery window wherever the stakes allow.",weight:6},{id:"eth.calm",name:"Calm Technology",law:"Demand attention only when it's truly earned.",violation:"Badges, red dots, and notifications competing for the user at all times.",fix:"Reserve interruption for what matters; let the rest wait quietly.",weight:5}];function jp(){const c=[];for(const o of rs){c.push(""),c.push("### "+o.id+" · "+o.name);for(const f of Vt.filter(d=>d.id.split(".")[0]===o.id))c.push("- "+f.id+" (w"+f.weight+(f.wcag?", wcag "+f.wcag:"")+"): "+f.law)}return c.join(`

*{box-sizing:border-box} html,body{margin:0} body{font:15px/1.5 var(--u-font);color:var(--u-ink);background:var(--u-bg)}
.u-btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--u-font);border-radius:var(--u-r);padding:10px 16px;border:1px solid transparent;cursor:pointer}
.u-btn.primary{background:var(--u-accent);color:var(--u-accent-ink)} .u-btn.secondary{background:var(--u-surface);border-color:var(--u-line);color:var(--u-ink)}
.u-btn.danger{background:var(--u-surface);border-color:color-mix(in srgb,var(--u-danger) 45%,#fff);color:var(--u-danger)}
.u-input{font:15px var(--u-font);border:1px solid var(--u-line);border-radius:var(--u-r);padding:10px 12px;width:100%}
.u-input:focus{outline:2px solid color-mix(in srgb,var(--u-accent) 30%,transparent);border-color:var(--u-accent)}
.u-card{background:var(--u-surface);border:1px solid var(--u-line);border-radius:var(--u-r);padding:var(--u-s5)}
.u-badge{display:inline-block;font:600 11px/1.4 var(--u-font);border-radius:var(--u-r-pill);padding:3px 9px;border:1px solid var(--u-line);background:var(--u-bg);color:var(--u-muted)}
.u-table{width:100%;border-collapse:collapse;font-size:14px} .u-table th{text-align:left;font:600 12px/1 var(--u-font);color:var(--u-muted);padding:8px;border-bottom:1px solid var(--u-line)}
.u-table td{padding:10px 8px;border-bottom:1px solid var(--u-line)}
.u-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.u-modal{background:var(--u-surface);border-radius:var(--u-r);max-width:440px;width:100%;padding:var(--u-s5)}
.u-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--u-ink);color:#fff;border-radius:var(--u-r);padding:10px 16px;font-size:14px;z-index:60}
.u-skeleton{background:linear-gradient(90deg,var(--u-line) 25%,#eef 37%,var(--u-line) 63%);background-size:400% 100%;animation:u-sk 1.4s ease infinite;border-radius:var(--u-r-sm)}
@keyframes u-sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
`.trim(),Zt=["# ENGINE — uxmakeover-engine: 1 (byte-identical; do not paraphrase or omit)","","You are a SENIOR UX AUDITOR and FRONTEND CRAFTSMAN. Execute this job exactly. Do not ask the","user questions unless the job frontmatter says `checkpoint: on`. Do not add features beyond the","treatment plan. Do not lecture beyond the panel copy. Return ONE complete .html file and nothing","else — no prose before or after it.","","## 1 · The Diagnosis Protocol (think before you build; embed it AS DATA in the artifact)","Before writing any UI, produce a three-step audit and embed it in the artifact's <script> as a","`const DIAGNOSIS = {...}` and `const FIXES = [...]` (declarative data the step engine reads).","","1) TRIAGE. Restate, in one line, the job the user hires this interface for (JTBD). For each","   detected problem ask: can this be AUTOMATED away instead of decorated? A problem that fails","   this UI-vs-automation check is flagged `automate` — it appears in the panel as advice",`   ("automate, don't decorate") but consumes NO fix step and NO stress weight.`,"2) DIAGNOSIS. Map every real UI problem to one or more Codex principle ids, each with a severity","   weight 1–10. Initial stress = min(95, sum of the fix weights). Declare the COGNITIVE BUDGET","   from the `audience` dial: mass → thin UI, generous whitespace, minimal inputs; specialist →","   data-dense allowed, hierarchy mandatory; auto → infer and state which you chose and why.","3) TREATMENT PLAN. An ordered list of fixes (count set by the `depth` dial: quick 6–8 · standard","   10–14 · deep 16–24). Each fix declares: `id` (f1, f2…), target element(s) via a `data-fix-target`","   attribute, the RESHOT move if structural (Refine/Remove · Shrink · Hide · Organize · Time) OR","   a guard from the guard vocabulary (confirmation-with-scope · undo window · preview · rate-limit),","   the Codex principle id(s) it satisfies, an `effort` tier (low <1h · mid ≤2d · high cross-team),","   its stress `delta` (must equal the summed weight of the principles it closes), and panel copy","   (≤60 words, plain language, gloss any jargon in one phrase).","   ORDER the plan by LEVERAGE = weight ÷ effort (low=1, mid=2, high=3), ties broken by weight.","   Badge every low-effort fix `quick_win: true`. Any fix that changes microcopy MUST include an",'   exact label diff `copy: { before, after }` (e.g. "Send all" → "Send 6 contracts").',"","If `checkpoint: on`: present TRIAGE + DIAGNOSIS as text and WAIT for approval before building.","Default (off): proceed immediately to the full artifact.","","## 2 · Ethics clauses (non-negotiable — the linter checks these)",'- NEVER remove intentional friction from destructive or high-stakes actions. If the "before"','  lacks it, ADDING friction is itself a fix (eth.friction). The "after" must keep a',"  confirmation-with-scope, type-to-confirm, or equivalent guard on bulk/money/delete actions.","- NO dark patterns (confirmshaming, forced continuity, sneak-into-basket, disguised ads). The","  receipt MUST declare `dark_patterns: none`.",'- The "before" must be PLAUSIBLY bad — violations real products ship — never a strawman collage.',"  Use realistic, locale-appropriate data (real-looking names, amounts, dates). NEVER lorem ipsum,","  never foo/bar/placeholder.","","## 3 · Zero-CDN Design Kit (embed verbatim in the artifact <style>; add demo styles below it)","External requests are FORBIDDEN. No Tailwind, no Google Fonts, no icon font, no <img src=http>,","no @import, no fetch/XHR to any origin. The artifact must render identically offline, forever.","Use inline SVG for icons and charts. Base every component on these tokens and classes, and replace","the literal token `ACCENT` in `--u-accent` / `--u-accent-wash` with the `accent` value from the","job frontmatter above (that is the ONLY substitution — everything else is used verbatim):","```css",Ep,"```","","## 4 · Motion & accessibility laws","- Highlight choreography per fix: pulse (attention) → success wash → fade, ≤1.2s total.","- `prefers-reduced-motion` collapses ALL motion to opacity swaps and disables the finale flourish.","- ARIA roles on panel, stepper, and modal; focus trap in modals; visible focus rings; keyboard","  map: ← / → step · Enter fix · Esc close · M minimise panel.","- AA contrast (4.5:1 text) in BOTH the before and the after — the before may be ugly, never","  unreadable. a11y fixes cite their WCAG 2.2 criterion in the panel and the receipt.","","## 5 · Stress ledger (bookkeeping, not theatre)","The meter starts at the initial stress (sum of fix weights, capped 95). Each applied fix subtracts","EXACTLY its declared delta. The final value MUST equal initial − sum(deltas), floored at 5.","Monotonic, additive, and lintable — the receipt's `stress: A -> B` must match this math.","","## 6 · Artifact skeleton (one .html file)","- <style>: the Design Kit above + your demo styles.",'- The BEFORE-state UI, rendered with realistic data, every fix target carrying `data-fix-target="fN"`.',"- <script>: `DIAGNOSIS`, `FIXES` (declarative), and a small step engine that applies/reverts a fix","  and re-runs from pristine state on prev/next (no one-way DOM mutation outside the engine).","- The explanation PANEL: a side panel at ≥1200px, a bottom sheet below; a minimise control to a FAB.","  It shows the current fix's principle id(s), the harm, the ≤60-word copy, the label diff if any,","  the Quick Win badge if low-effort, and the WCAG ref for a11y fixes.","- The stepper (fix N of M), the stress meter, a before/after compare at the end, and a completion","  screen with the TIME-SAVED estimate (minutes saved per user per task).","- Responsive: the shell uses 100dvh and reflows to the bottom sheet below the breakpoint; no fixed","  desktop-only widths on the shell.","","## 7 · The receipt (place this HTML comment near the TOP of the file, verbatim shape)","```","\x3C!-- uxmakeover-receipt: 1","sig: <the job's sig>","fixes: <count>","stress: <initial> -> <final>","principles: [<every Codex id used>]","automate_flags: <count>","quick_wins: <count>","wcag_closed: [<criteria the a11y fixes close, e.g. 1.4.3>]",'time_saved_estimate: "<e.g. 4.2 min/user/task>"',"dark_patterns: none","reduced_motion: supported","-->","```","","## 8 · The Principle Codex (compact — cite these ids; the full text ships in the console)",jp()].join(`

.badge.bad{background:color-mix(in srgb,var(--danger) 8%,#fff);border-color:color-mix(in srgb,var(--danger) 30%,#fff);color:var(--danger)}
.badge.warn{background:color-mix(in srgb,var(--warn) 10%,#fff);border-color:color-mix(in srgb,var(--warn) 35%,#fff);color:var(--warn)}
.badge.accent{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,#fff);color:var(--accent)}

/* buttons — registry-verbatim */
.btn{display:inline-flex;align-items:center;gap:8px;font:600 13.5px/1 var(--font);border-radius:var(--r-md);padding:10px 16px;cursor:pointer;border:1px solid transparent;transition:background var(--t-fast),box-shadow var(--t-fast)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-active)}
.btn.primary:disabled{background:var(--hairline);color:var(--ink-faint);cursor:not-allowed}
/* a DISABLED button must LOOK disabled (D20 family sweep) — only `.primary` ever
   had a disabled state, so a locked `.secondary` kept full contrast, kept its hover,
   and swallowed the click in silence. */
.btn:disabled{cursor:not-allowed;opacity:.55;box-shadow:none}
.btn.secondary:disabled:hover{border-color:var(--hairline);box-shadow:none}
.btn.ghost:disabled:hover,.btn.danger:disabled:hover{background:none}
.btn.secondary{background:var(--surface);border-color:var(--hairline);color:var(--ink)}
.btn.secondary:hover{border-color:var(--ink-faint);box-shadow:var(--elev-1)}
.btn.ghost{background:none;color:var(--ink-muted);border:0;padding:8px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--wash)}
.btn.danger{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 40%,#fff);color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 6%,#fff)}
.btn.sm{padding:6px 10px;font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center;margin-top:var(--s-4)}
.btn svg,.icon-btn svg{width:15px;height:15px;flex:none}
/* ── must_fix standardization: icon scale (§1b) · sticky footer (§7) ── */
svg:has(>use){width:16px;height:16px;flex:none;vertical-align:-3px}
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#root>main{flex:1 0 auto;width:100%}

/* code · notices · empty — registry-verbatim */
pre.code{background:var(--wash);border:1px solid var(--hairline);border-radius:var(--r-md);padding:var(--s-4);overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;margin:var(--s-3) 0 0}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:10px 12px;font-size:12.5px;margin-top:var(--s-3)}
.notice.warn{background:color-mix(in srgb,var(--warn) 9%,#fff);border:1px solid color-mix(in srgb,var(--warn) 35%,#fff);color:#8a5a06}
.notice.err{background:color-mix(in srgb,var(--danger) 7%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);color:var(--danger)}
.notice.ok{background:color-mix(in srgb,var(--ok) 8%,#fff);border:1px solid color-mix(in srgb,var(--ok) 30%,#fff);color:var(--ok)}
.empty{padding:var(--s-6);text-align:center;color:var(--ink-muted)}
.empty .big{font-size:26px;display:block;margin-bottom:6px}

/* table — registry-verbatim */
.swatch{width:16px;height:16px;border-radius:5px;display:inline-block;vertical-align:-3px;border:1px solid rgba(0,0,0,.08)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:var(--s-2)}
.tbl th{font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--hairline)}
.tbl td{padding:8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.compact th,.tbl.compact td{padding:6px 8px}

/* modal §8 + toast — registry-verbatim */
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.45);display:none;place-items:center;z-index:60;padding:var(--s-4)}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-2);max-width:640px;width:100%;max-height:min(84vh,720px);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.modal .mh b{font-size:15px}
.modal .mh .icon-btn{margin-left:auto}
.mtabs{display:flex;gap:2px;padding:var(--s-2) var(--s-5) 0;border-bottom:1px solid var(--hairline)}
.mtabs button{border:0;background:none;font:600 13px/1 var(--font);color:var(--ink-muted);padding:10px 12px;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;box-shadow:inset 0 -2px 0 transparent}
.mtabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}

.mpane{padding:var(--s-5);overflow:auto;font-size:13.5px}
.mpane h4{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);margin:var(--s-4) 0 var(--s-2)}
.mpane h4:first-child{margin-top:0}
.authorcard{text-align:center;padding:var(--s-4) 0}
.authorcard .h{font-family:var(--mono);font-size:13px;color:var(--ink-muted)}
.authorcard .t{font-size:20px;font-weight:800;letter-spacing:.06em;margin:2px 0 10px}
.authorcard .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.authorcard blockquote{margin:12px auto;max-width:46ch;color:var(--ink-muted);font-size:13px;border-left:3px solid var(--accent);padding-left:12px;text-align:left}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.idcard dt{color:var(--ink-faint)}.idcard dd{margin:0}
.toasts{position:fixed;bottom:var(--s-5);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-size:13px;border-radius:var(--r-md);padding:10px 16px;box-shadow:var(--elev-2);animation:fadein var(--t-med)}
.confirm-inline{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--danger) 6%,#fff);border:1px solid color-mix(in srgb,var(--danger) 30%,#fff);border-radius:var(--r-md);padding:6px 10px;font-size:12.5px;flex-wrap:wrap}

/* diagram tab (about-modal/3) + fullscreen viewer — registry-verbatim */
.dg-wrap{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);overflow:auto;max-height:46vh}
.dg-wrap svg{width:100%;height:auto;display:block}
.dg-bar{display:flex;gap:8px;align-items:center;margin-top:var(--s-3)}
.dg-src{display:none;margin-top:var(--s-3)}
.dg-src.open{display:block}
.dgfs{position:fixed;inset:0;background:var(--canvas);z-index:90;display:none;flex-direction:column}
.dgfs.open{display:flex}
.dgfs .bar{display:flex;gap:8px;align-items:center;padding:10px var(--s-4);border-bottom:1px solid var(--hairline);background:var(--surface)}
.dgfs .bar b{font-size:13.5px}
.dgfs .bar .sp{flex:1}
.dgfs .stage{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.dgfs .stage.panning{cursor:grabbing}
.dgfs .cnv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.dgfs .cnv svg{display:block}
.dg-zl{font:450 12px/1 var(--mono);color:var(--ink-muted);min-width:44px;text-align:center}
/* self-test panel — registry-verbatim */
.st-panel{position:fixed;top:70px;right:16px;width:330px;max-height:75vh;overflow:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--elev-2);padding:var(--s-4);z-index:80;font-size:12.5px}
.st-panel .t{display:flex;gap:8px;padding:3px 0}
.st-panel .t.ok{color:var(--ink)}.st-panel .t.ok::before{content:"✓";color:var(--ok);font-weight:700}
.st-panel .t.no{color:var(--danger)}.st-panel .t.no::before{content:"✗";font-weight:700}

/* ═══ promoted composites — registry-verbatim (packages/ui/components.md) ═══ */
.dials{display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:flex-end;margin-top:var(--s-4)}
.dials .field{min-width:150px;flex:1}
.togglebox{display:flex;align-items:center;gap:8px;font-size:13px;padding:9px 11px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);cursor:pointer;user-select:none}
.togglebox input{width:auto;accent-color:var(--accent)}
/* .gates — the lint/gate board (promoted registry composite). Review reuses it verbatim:
   a row always carries its reason (a red dot with no sentence is a bug, not a verdict). */
.gates{border:1px solid var(--hairline);border-radius:var(--r-md);margin-top:var(--s-3);overflow:hidden}
.gates .row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--hairline);font-size:13px}
.gates .row:last-child{border-bottom:0}
.gates .row .st{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.gates .row.pass .st{background:color-mix(in srgb,var(--ok) 12%,#fff);color:var(--ok)}
.gates .row.warn .st{background:color-mix(in srgb,var(--warn) 14%,#fff);color:var(--warn)}
.gates .row.fail .st{background:color-mix(in srgb,var(--danger) 10%,#fff);color:var(--danger)}
.gates .row .g{font:600 11.5px/1.4 var(--mono);color:var(--ink);flex:none;min-width:26px}
.gates .row .why{color:var(--ink-muted);font-size:12.5px}
.gate-summary{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:var(--s-3)}

/* ═══ UXMakeover composites — tokens only, namespaced (§9) ═══ */

/* Intake · pre-scan chips — appear in <150ms, accent per §9 */
.prescan{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s-3)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:var(--r-pill);padding:4px 10px;border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);background:var(--accent-wash);color:var(--accent);font-weight:500}
.pchip.warn{border-color:color-mix(in srgb,var(--warn) 40%,#fff);background:color-mix(in srgb,var(--warn) 9%,#fff);color:#8a5a06}
.pchip .n{font:600 11px/1 var(--mono)}
.srccount{font-size:11.5px;color:var(--ink-faint);margin-top:6px}

/* Review · verdict banner + receipt card */
.verdict{display:flex;gap:var(--s-4);align-items:center;border-radius:var(--r-lg);padding:var(--s-4);flex-wrap:wrap;margin-top:var(--s-3)}
.verdict.pass{border:1px solid color-mix(in srgb,var(--ok) 40%,#fff);background:color-mix(in srgb,var(--ok) 7%,#fff)}
.verdict.fail{border:1px solid color-mix(in srgb,var(--danger) 35%,#fff);background:color-mix(in srgb,var(--danger) 6%,#fff)}
.verdict .score{font:800 26px/1 var(--font);font-variant-numeric:tabular-nums}
.verdict.pass .score{color:var(--ok)}.verdict.fail .score{color:var(--danger)}
.verdict .sp{flex:1}
.receipt{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--wash);padding:var(--s-4);margin-top:var(--s-3);font-size:12.5px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0}
.receipt dt{color:var(--ink-faint);font:600 10.5px/1.5 var(--mono);letter-spacing:.03em;text-transform:uppercase}
.receipt dd{margin:0}
.receipt .mono{font:450 12px/1.5 var(--mono)}
.mismatch{color:var(--danger);font-weight:600}

/* Review · the evidence line under a failing gate */
.gates .row .ev{font:450 11px/1.5 var(--mono);color:var(--danger);display:block;margin-top:2px}

/* Gallery · run cards + stress lineage */
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s-4);margin-top:var(--s-4)}
.run{border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--surface);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;box-shadow:var(--elev-1)}
.run h3{margin:0;font-size:14.5px}
.run .sig{font:450 11px/1 var(--mono);color:var(--ink-faint)}
.run .stat{display:flex;flex-wrap:wrap;gap:4px}
.run .row{display:flex;gap:8px;margin-top:auto;align-items:center;flex-wrap:wrap}
.run textarea{min-height:40px;font-size:12px}
.lineage{border-top:1px solid var(--hairline);margin-top:var(--s-5);padding-top:var(--s-4)}
.lineage h3{margin:0 0 var(--s-3)}
.lin-group{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3);margin-bottom:var(--s-2)}
.lin-group .slug{font:600 12px/1 var(--mono);color:var(--accent);margin-bottom:6px}
.spark{display:flex;align-items:flex-end;gap:3px;height:36px}
.spark .bar{flex:1;min-width:6px;max-width:26px;background:var(--accent);border-radius:2px 2px 0 0;position:relative}
.spark .bar[data-lo="1"]{background:color-mix(in srgb,var(--ok) 70%,var(--accent))}
.spark .bar .v{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:600 9px/1 var(--mono);color:var(--ink-muted)}

/* Stress delta pill (before -> after) */
.sdelta{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--mono)}
.sdelta .a{color:var(--danger)}.sdelta .b{color:var(--ok)}.sdelta .arr{color:var(--ink-faint)}

/* Codex slide-over — a right sheet, browse all 56 principles */
.sheet-ov{position:fixed;inset:0;background:rgba(23,23,23,.4);z-index:60;display:none}
.sheet-ov.open{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--hairline);box-shadow:var(--elev-2);z-index:61;display:flex;flex-direction:column;transform:translateX(100%);transition:transform var(--t-med)}
.sheet.open{transform:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--hairline)}
.sheet .sh b{font-size:15px}
.sheet .sh .icon-btn{margin-left:auto}
.sheet .sbody{overflow:auto;padding:var(--s-4) var(--s-5);flex:1}
.cluster{margin-bottom:var(--s-5)}
.cluster h4{font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:0 0 var(--s-2)}
.prin{border:1px solid var(--hairline);border-radius:var(--r-md);padding:9px 11px;margin-bottom:6px}
.prin .pid{font:600 11px/1 var(--mono);color:var(--ink-muted)}
.prin .pn{font-size:13.5px;font-weight:600;margin:0 6px}
.prin .pw{font:600 10.5px/1 var(--mono);color:var(--accent);background:var(--accent-wash);border-radius:var(--r-pill);padding:2px 6px}
.prin .plaw{font-size:12px;color:var(--ink-muted);margin-top:3px}
.prin .pwcag{font:600 10px/1 var(--mono);color:var(--accent)}

/* responsive §11 — registry-verbatim + the UXMakeover grids that must stack */
@media (max-width:820px){
  .site-header{gap:var(--s-2);padding:0 var(--s-3)}
  nav.rooms{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0}
  nav.rooms::-webkit-scrollbar{display:none}
  .brand .ver{display:none}
  /* §11.1: identity holds, navigation yields — without this the brand overprints the rooms */
  .brand{flex:none;overflow:hidden}
  .brand b{max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.rooms{flex:1 1 auto;min-width:0}
  main{padding:var(--s-5) var(--s-3) var(--s-6)}
  .fields,.grid2{grid-template-columns:1fr}
}</style>
</head>
<body>
<div id="root"></div>
<script data-goatcounter="https://alamehan.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script></body>
